# Gateway Worker "todofy" (base/local config). Production config is generated by
# deploy/generate_ci_config.py; runtime tests use wrangler.test*.toml. Local dev runs both
# Workers in one process from the repo root:
#   uv run pywrangler dev -c gateway/wrangler.toml -c wrangler.toml
name = "todofy"
main = "src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false

[assets]
directory = "../uiassets/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "TodofyCore"
script_name = "todofy-core"

# Script "todofy" history: v1 created the Python class; v2 deletes it (its state was only counters).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["TodofyCoordinator"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
TODOFY_PUBLIC_HOST = "todofy.localhost"
TODOFY_HOOKS_HOSTS = "todofy-hooks.localhost"
BUILD_SHA = "dev"
