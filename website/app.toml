# Public metadata and relative host labels. Generated Wrangler configs own production bindings.
version = 1
id = "website"
target = "cloudflare"

[[workers]]
config = "website/relay/wrangler.toml"
personal_secrets = []
manual_secrets = ["GITHUB_DISPATCH_TOKEN"]
optional_secrets = []
hosts = []
entry = "notion-publish"
role = "发布 Worker"
position = 9

[[workers]]
# Assets-only requests are not Worker invocations; status comes from a public probe.
config = "website/wrangler.toml"
personal_secrets = []
manual_secrets = []
optional_secrets = []
hosts = ["www", ""]
entry = "website"
role = "静态网站（仅静态资源）"
position = 10

[[entries]]
id = "website"
name = "个人网站"
description = "{zone}，内容来自 Notion"
group = "sites"
icon = "globe"
accent = "violet"
access = false
app_only_signals = []
order = 1
worker = "ziyixi-website"
# Wrangler's first Custom Domain is www, the canonical certificate boundary.
url_path = "/"
position = 7
[entries.status]
# One small public JSON GET; Home records code/latency without reading its body.
type = "public_http"
expect = [200]
enabled = true
path = "/build-info.json"
[entries.tile_metric]
kind = "latency"

[[entries]]
id = "notion-publish"
name = "网站同步"
description = "每日检查 Notion 内容并同步静态网站"
group = "services"
icon = "upload-cloud"
accent = "slate"
access = false
app_only_signals = []
order = 1
worker = "ziyixi-notion-publish"
position = 8
[entries.status]
# Complete content checks and verified publication receipts, via a private binding.
type = "ops_v1"
binding = "WEBSITE_SYNC"
guard = false
