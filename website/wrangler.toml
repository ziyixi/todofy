# Worker "ziyixi-website": the personal website as a static export (`pnpm build:site` -> out/) on
# Workers Static Assets. There is no Worker script: every request is answered from the assets, which
# are free and do not count as Worker requests or CPU. Headers and redirects come from out/_headers
# and out/_redirects. Production deploys only from GitHub Actions (docs/release.md); locally,
# `pnpm start` serves out/ with this file through `wrangler dev`.
name = "ziyixi-website"
# The one Cloudflare account; not a secret (the Worker names and hosts are public anyway).
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
compatibility_date = "2026-09-25"
# No *.workers.dev copy of the site and no public per-version preview URLs: releases are verified
# with `wrangler dev` before upload and on the live hostname after deploy.
workers_dev = false
preview_urls = false
# Top-level key: keep it above [assets], or TOML reads it as assets.routes. The preview host is a Custom
# Domain; www is a zone route on its existing proxied record (docs/cutover.md step 3): a route changes no
# DNS, and the deploy token may create routes but not replace the www CNAME that a Custom Domain needs.
routes = [
  { pattern = "website-preview.ziyixi.science", custom_domain = true },
  { pattern = "www.ziyixi.science/*", zone_name = "ziyixi.science" },
]

[assets]
directory = "./out"
# /blog serves out/blog.html; /blog/ and /blog.html redirect (307) to /blog.
html_handling = "auto-trailing-slash"
# Unknown paths get out/404.html with status 404.
not_found_handling = "404-page"

# Hostnames (docs/cutover.md): `routes` above is their complete list. Every release applies it with
# `wrangler triggers deploy` and verifies the live site on www once www is listed (otherwise on the first
# hostname). Removing a line detaches that hostname at the next release. The apex ziyixi.science is not
# this Worker: its 308 to www is the Worker ziyixi-apex-redirect (apex-redirect/wrangler.toml).
