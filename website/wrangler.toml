# Worker "ziyixi-website": the personal website as a static export (`pnpm build:site` -> out/) on
# Workers Static Assets. There is no Worker script: every request is answered from the assets, which
# are free and do not count as Worker requests or CPU. Headers and redirects come from out/_headers
# and out/_redirects. Production deploys only from GitHub Actions (docs/release.md); locally,
# `pnpm start` serves out/ with this file through `wrangler dev`.
name = "ziyixi-website"
# The one Cloudflare account; not a secret (the Worker names and hosts are public anyway).
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
compatibility_date = "2026-09-25"
# No *.workers.dev copy of the site and no public per-version preview URLs: releases are verified
# with `wrangler dev` before upload and on the live hostname after deploy.
workers_dev = false
preview_urls = false
# Top-level key: keep it above [assets], or TOML reads it as assets.routes. Both hostnames are Workers
# Custom Domains of this Worker (since 2026-10-01; docs/architecture.md "Hostnames"): www is canonical
# (every page carries <link rel=canonical> to https://www.ziyixi.science) and the apex serves the same
# static site. The two share one dedicated certificate (ziyixi.science, www.ziyixi.science,
# *.www.ziyixi.science) that covers no app host, so browsers never reuse a site connection for
# mail-hero/home/todofy.
routes = [
  { pattern = "www.ziyixi.science", custom_domain = true },
  { pattern = "ziyixi.science", custom_domain = true },
]

[assets]
directory = "./out"
# /blog serves out/blog.html; /blog/ and /blog.html redirect (307) to /blog.
html_handling = "auto-trailing-slash"
# Unknown paths get out/404.html with status 404.
not_found_handling = "404-page"

# Hostnames: `routes` above is the Worker's complete set of Custom Domains and must match the live state
# exactly. Every release applies it with `wrangler triggers deploy`, which PUTs the listed Custom Domains
# with override_scope (a replace): with the list equal to what is attached, that is a no-op. Removing a
# line detaches that hostname at the next release (while at least one Custom Domain stays listed; with
# none listed wrangler sends no change at all), and adding one creates its DNS record and certificate.
# There are no zone routes. The release verifies the whole route contract on www and the build identity
# on every other listed hostname (docs/release.md).
