name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use Node 24
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          check-latest: false
          package-manager-cache: false

      - name: Enable the packageManager-pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Prepare the offline empty snapshot used by type generation
        run: pnpm content:prepare:empty

      - name: Run no-secret checks
        run: pnpm check

  content-builds:
    name: ${{ matrix.mode }} build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode:
          - empty
          - fixture
    steps:
      - name: Check out the pull request
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use Node 24
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          check-latest: false
          package-manager-cache: false

      - name: Enable the packageManager-pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Prepare the explicit ${{ matrix.mode }} snapshot
        env:
          CONTENT_MODE: ${{ matrix.mode }}
        run: |
          unset NOTION_TOKEN NOTION_DATA_SOURCE_ID NOTION_API_VERSION
          case "$CONTENT_MODE" in
            empty) pnpm content:prepare:empty ;;
            fixture) pnpm content:prepare:fixture ;;
            *) printf 'unexpected PR content mode: %s\n' "$CONTENT_MODE" >&2; exit 1 ;;
          esac
          pnpm content:validate --source="$CONTENT_MODE"

      - name: Build the production application
        # The preceding step validates the selected offline source. The normal
        # pnpm build command instead requires the configured production source.
        run: pnpm exec next build

      - name: Install the pinned Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run local browser tests against ${{ matrix.mode }}
        env:
          CONTENT_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          pnpm test:e2e

          server_log="$RUNNER_TEMP/${CONTENT_MODE}-deployment-contract-server.log"
          pnpm start --hostname 127.0.0.1 --port 4173 >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/build-info.json >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$server_log" >&2
            printf 'local production server did not become ready\n' >&2
            exit 1
          fi

          fixture_opt_in=false
          if [[ "$CONTENT_MODE" == fixture ]]; then
            fixture_opt_in=true
          fi
          ALLOW_FIXTURE_DEPLOYMENT_TESTS="$fixture_opt_in" \
          DEPLOYMENT_BASE_URL=http://127.0.0.1:4173 \
          DEPLOYMENT_AUTH_MODE=production \
          EXPECTED_BUILD_INFO_PATH=.next/server/app/build-info.json.body \
            pnpm test:deployment
