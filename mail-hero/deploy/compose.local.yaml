name: mail-hero-local

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: mailhero
      POSTGRES_DB: mailhero
      POSTGRES_PASSWORD_FILE: /run/secrets/local_db_password
    secrets:
      - local_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailhero -d mailhero"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

secrets:
  local_db_password:
    file: ./secrets/local-postgres-password
