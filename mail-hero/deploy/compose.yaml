name: mail-hero

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailhero
      POSTGRES_DB: mailhero
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # PostgreSQL 18 stores PGDATA below this parent directory.
      - postgres_data:/var/lib/postgresql
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailhero -d mailhero"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    user: "${MAIL_HERO_UID:-10001}:${MAIL_HERO_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MAIL_HERO_RECEIVE_ADDRESS: ${MAIL_HERO_RECEIVE_ADDRESS:?set by deploy/bootstrap.sh}
      MAIL_HERO_DATABASE_URL_FILE: /run/secrets/database_url
      MAIL_HERO_SECRET_KEY_FILE: /run/secrets/mail_hero_key
      MAIL_HERO_INGEST_TRANSPORT: cloudflare
      MAIL_HERO_INGEST_TOKEN_FILE: /run/secrets/ingest_token
      MAIL_HERO_HTTP_LISTEN: 0.0.0.0:8080
      MAIL_HERO_ACCESS_ISSUER: ${MAIL_HERO_ACCESS_ISSUER:?set by deploy/bootstrap-cloudflare.sh}
      MAIL_HERO_ACCESS_AUDIENCE: ${MAIL_HERO_ACCESS_AUDIENCE:?set by deploy/bootstrap-cloudflare.sh}
      MAIL_HERO_ACCESS_OWNER: ${MAIL_HERO_ACCESS_OWNER:?set by deploy/bootstrap-cloudflare.sh}
      MAIL_HERO_FORCE_SEND_PAUSED: ${MAIL_HERO_FORCE_SEND_PAUSED:-false}
      MAIL_HERO_ALLOWED_INTERNAL_TARGETS: ${MAIL_HERO_ALLOWED_INTERNAL_TARGETS:-}
    secrets:
      - database_url
      - mail_hero_key
      - ingest_token
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/postgres-password
  database_url:
    file: ./secrets/database-url
  mail_hero_key:
    file: ./secrets/mail-hero-key
  ingest_token:
    file: ./secrets/ingest-token
