# Fully hosted Mail Hero: Workers, D1, R2 and SQLite Durable Objects.
name = "mail-hero"
main = "src/native/index.ts"
compatibility_date = "2026-09-07"
workers_dev = false
preview_urls = false

[assets]
directory = "../uiassets/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
RECEIVE_ADDRESS = "inbox@example.com"
ACCESS_ISSUER = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUDIENCE = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
ACCESS_OWNER = "owner@example.com"
# Optional: up to 8 comma-separated exact login emails; all resolve to ACCESS_OWNER.
ACCESS_OWNER_ALIASES = ""
WEBHOOK_ALLOWED_HOSTS = "todofy.example.com"
# Optional metadata-only alerts. Store ALERT_WEBHOOK_TOKEN with `wrangler secret`.
# ALERT_WEBHOOK_URL = "https://alerts.example.com/mailhero"
# ALERT_WEBHOOK_ALLOWED_HOSTS = "alerts.example.com"
FORCE_SEND_PAUSED = "true"
MAINTENANCE_MODE = "false"
INGEST_DAILY_MESSAGE_LIMIT = "300"
INGEST_DAILY_BYTE_LIMIT = "268435456"

[[d1_databases]]
binding = "DB"
database_name = "mail-hero"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAIL_STORE"
bucket_name = "mail-hero-store"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "MailCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailCoordinator"]

[observability]
enabled = false
