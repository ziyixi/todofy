version = 1
id = "recall"
target = "cloudflare"

[[workers]]
config = "recall/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES", "CSRF_SIGNING_KEY"]
manual_secrets = []
optional_secrets = ["ACCESS_OWNER_ALIASES"]
# Optional SHA-256 digests of the two machine tokens (the extension's ingest token, a feed program's export token) and
# their previous values, put by hand with `wrangler secret put` and kept by every deploy. The owner makes the tokens in
# 设置 → 插件口令 since 2026-10-11 (RecallState keeps their digests), so these normally do not exist; a digest put here
# is accepted as well. Owner-machine secrets are not part of the GitHub map RECALL_WORKER_SECRETS; the drift check
# expects them, optional.
owner_machine_secrets = ["INGEST_TOKEN_SHA256", "INGEST_TOKEN_SHA256_PREVIOUS", "EXPORT_TOKEN_SHA256", "EXPORT_TOKEN_SHA256_PREVIOUS"]
hosts = ["recall"]
entry = "recall"
role = "浏览记录、搜索与归档"
position = 13

[[entries]]
id = "recall"
name = "浏览记录"
description = "浏览时间线、读过内容的全文搜索与 Dropbox 归档"
group = "apps"
icon = "notebook-pen"
accent = "violet"
access = true
app_only_signals = []
order = 10
worker = "recall"
url_path = "/"
position = 15
[entries.status]
# Codes and counts only: no URL, host, title or text leaves the Ops entrypoint. No guard: its daily row budget already
# caps its share, and it refuses setGuard (docs/design.md §9).
type = "ops_v1"
binding = "RECALL"
guard = false

[[access]]
key = "recall"
kind = "owner"
worker = "recall"
name = "recall"
paths = [""]
session = "24h"
