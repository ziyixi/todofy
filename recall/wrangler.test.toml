# Local development only (never deployed; .github/scripts/test_wrangler_configs.py TEST_CONFIGS): the production
# wrangler.toml without the account and without a route. The Durable Object and the R2 bucket are wrangler's local
# ones; the values come from recall/.dev.vars (see .dev.vars.example).
#
#   cd worker && npm run dev        (http://127.0.0.1:8797)
name = "recall"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false

[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "RECALL"
class_name = "RecallState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecallState"]

[[r2_buckets]]
binding = "STORE"
bucket_name = "recall-store"

[vars]
PUBLIC_HOST = "recall.localhost"
ACCESS_ISSUER = "https://synthetic.cloudflareaccess.com"
ACCESS_AUDIENCE = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
