version = 1
id = "brief"
target = "cloudflare"

[[workers]]
config = "brief/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES", "FEEDBACK_SIGNING_KEY", "MAIL_FROM", "MAIL_TO"]
manual_secrets = []
optional_secrets = ["ACCESS_OWNER_ALIASES"]
# The Resend sending key stays owner-machine only; model credentials belong to Model Router.
owner_machine_secrets = ["RESEND_API_KEY"]
hosts = ["brief"]
entry = "brief"
role = "每日简报、深读与归档"
position = 14

[[entries]]
id = "brief"
name = "简报"
description = "每日研究前沿与世界简报、周六深读和归档"
group = "apps"
icon = "newspaper"
accent = "amber"
access = true
app_only_signals = []
order = 11
worker = "brief"
url_path = "/"
position = 16
[entries.status]
# Home reads codes and counts; its guard defers embedding, learning and source probes.
type = "ops_v1"
binding = "BRIEF"
guard = true

# The whole host behind the owner's Access application. The exact path /feedback (the email's vote links) has its own
# Bypass application in infra/access.tf, and the Worker verifies each link's signed token itself (docs/design.md §10).
[[access]]
key = "brief"
kind = "owner"
worker = "brief"
name = "brief"
paths = [""]
session = "24h"
