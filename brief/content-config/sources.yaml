# The brief's source registry (brief/docs/design.md §3). Owner-editable; public: no personal value, no key.
# Every URL was fetched once from a home IP (2026-10-10; the sources marked "second check" later the same day); the
# archive days re-check each from the Worker (design §16), and the disabled Crossref alternates stand in for a
# publisher feed that blocks Workers.
#
# Fields (defaults below; the Worker refuses an unknown field or value):
#   id                 stable, [a-z0-9-]; votes and learned weights are keyed by it, so never reuse one
#   name               the venue as the source line shows it; also what counts as an independent source (§5.2)
#   section            research | world (the gate gives each item one of profile.md's topics)
#   kind               rss | atom | rdf | json | crossref | sitemap | geojson | arxiv_api
#   url                {q} the url-encoded `query`, {start} the page offset, {date} YYYY-MM-DD (date_offset_days
#                      before today, UTC)
#   query              arxiv_api only; the Worker adds `AND submittedDate:[7 days ago TO now]` and reads every page of
#                      that window (newest first, pages of 100, at most 5), so a paper announced days after it was
#                      submitted is still found; IDs deduplicate
#   path_prefixes      sitemap only: the paths whose new URLs are items (the first poll only records what exists)
#   max_bytes          the body is read up to this size, then parsed as far as it got
#   role               candidate: may be written up and cited | signal_only: raises a cluster's importance, never cited,
#                      never runs without a candidate in its cluster
#   text               what the writer may read: feed_full | feed_abstract | feed_summary | page_full | page_abstract |
#                      headline. page_* is fetched only for shortlisted items, wherever the page is publicly reachable
#                      and robots.txt does not close it to ziyixi-brief (a group naming it; AI-agent groups such as
#                      Claude-User do not apply, §3.3); a paywall, a login or a short page falls back to the feed's
#                      text, marked as such
#   review             peer_reviewed | preprint | institution | commentary | news | government | data (the source
#                      line's status; doi_review overrides it by DOI prefix)
#   poll_per_day       1: the 18:30 round | 2: 18:30 and 03:30 | 4: every round (America/Los_Angeles)
#   max_items          items read per poll, newest first (arxiv_api: see query)
#   keywords           optional prefilter: an item runs only if its title or summary contains one as a whole word or
#                      phrase; a trailing * matches the start of a word (fault* matches faults, not default); a
#                      keyword written in capitals matches case-sensitively (AI matches AI, not said), others ignore case
#   requires_abstract  skip items without an abstract (Crossref lists news and editorials as journal articles)
#   enabled            false: kept here, never fetched

version: 1

defaults:
  role: candidate
  poll_per_day: 1
  max_items: 50
  max_bytes: 1048576
  enabled: true

sources:
  # ---------- 研究前沿 · AI/LLM ----------
  - id: arxiv-llm-architecture
    name: arXiv
    section: research
    kind: arxiv_api
    url: "https://export.arxiv.org/api/query?search_query={q}&sortBy=submittedDate&sortOrder=descending&start={start}&max_results=100"
    # ti:transformer and ti:attention alone pull in vision, graph and time-series models: they need an LLM clause.
    query: '(cat:cs.CL OR cat:cs.LG) AND (ti:"mixture of experts" OR ti:"state space" OR ti:"long context" OR ti:tokenizer OR ti:tokenization OR ti:"language model" OR ((ti:transformer OR ti:transformers OR ti:attention) AND (abs:"language model" OR abs:"language models" OR abs:LLM OR abs:LLMs OR ti:LLM OR ti:LLMs)))'
    text: page_full # arxiv.org/html/<id> when it exists, else the abstract
    review: preprint
    max_items: 100 # 188 in the 7-day window on 2026-10-10 (246 before the LLM clause)
  - id: arxiv-training-inference
    name: arXiv
    section: research
    kind: arxiv_api
    url: "https://export.arxiv.org/api/query?search_query={q}&sortBy=submittedDate&sortOrder=descending&start={start}&max_results=100"
    # ti:inference alone is mostly Bayesian and causal inference, ti:kernel kernel methods: each needs a clause.
    query: '(cat:cs.LG OR cat:cs.CL OR cat:cs.DC) AND (ti:"speculative decoding" OR ti:quantization OR ti:"KV cache" OR ti:pretraining OR ti:"scaling law" OR ti:"scaling laws" OR ti:GPU OR ti:GPUs OR ((ti:inference OR ti:serving OR ti:distillation) AND (abs:"language model" OR abs:"language models" OR abs:LLM OR abs:LLMs OR ti:LLM OR ti:LLMs)) OR (ti:kernel AND (abs:GPU OR abs:CUDA OR abs:Triton)))'
    text: page_full
    review: preprint
    max_items: 100 # 122 in the 7-day window on 2026-10-10 (190 before the clauses)
  - id: arxiv-llm-agents
    name: arXiv
    section: research
    kind: arxiv_api
    url: "https://export.arxiv.org/api/query?search_query={q}&sortBy=submittedDate&sortOrder=descending&start={start}&max_results=100"
    query: '(cat:cs.CL OR cat:cs.AI) AND (ti:agent OR ti:agents OR ti:agentic) AND (abs:"language model" OR abs:LLM OR abs:LLMs)'
    text: page_full
    review: preprint
    max_items: 100 # 208 in the 7-day window on 2026-10-10; about twice that without the abs: clause
  - id: arxiv-search-recsys-ads
    name: arXiv
    section: research
    kind: arxiv_api
    url: "https://export.arxiv.org/api/query?search_query={q}&sortBy=submittedDate&sortOrder=descending&start={start}&max_results=100"
    # ti:retrieval and ti:search only within cs.IR: in cs.LG they are mostly architecture search, tree search and RAG.
    query: '(cat:cs.IR AND (ti:recommendation OR ti:recommender OR ti:ranking OR ti:reranking OR ti:"click-through" OR ti:advertising OR ti:retrieval OR ti:search)) OR (cat:cs.LG AND (ti:recommendation OR ti:recommender OR ti:"click-through" OR ti:advertising))'
    text: page_full
    review: preprint
    max_items: 100 # 60 in the 7-day window on 2026-10-10 (120 before)
