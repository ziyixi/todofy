# Worker "brief": the owner's daily research-and-world briefing (brief.ziyixi.science, docs/design.md): the sources of
# content-config/sources.yaml fetched by the Worker itself, a Claude Haiku 5.5 gate, a Claude Opus 5.5 pick and writing,
# a grounding check in code, one Resend send a day, and the owner's archive behind Access. The production configuration
# and its single source of truth: top level = production, never [env.*] or keep_vars. Every static value is committed
# here (the repository is public: nothing personal, no secret).
#
# Deployed only by CI through deploy/deploy-vars.mjs, which appends --var BUILD_SHA (the commit) and --var MODE (the
# GitHub variable BRIEF_MODE: off, archive, shadow or live) and passes ACCESS_OWNER, ACCESS_OWNER_ALIASES,
# CSRF_SIGNING_KEY, FEEDBACK_SIGNING_KEY, MAIL_FROM and MAIL_TO as Worker secrets with --secrets-file. A plain
# `wrangler deploy` of this file DELETES BUILD_SHA and MODE (the Worker then reads MODE as off: no model call, no send).
#
# The Claude API key (ANTHROPIC_API_KEY) and the Resend key (RESEND_API_KEY) are NOT deployed: the owner puts them in the
# Cloudflare dashboard (or with `wrangler secret put`), and they never enter GitHub. A deploy keeps them: `wrangler deploy
# --secrets-file` keeps every secret the file does not name (deploy/test/secrets-kept.test.mjs), and no [secrets]
# required list is declared here. Until the Claude key is put, no issue is made (ops-v1 anthropic_not_configured).
#
# The Access applications (the whole host, and the Bypass of exactly /feedback) are created by infra/ and "Infra
# apply"; the whole host's AUD is committed below as ACCESS_AUDIENCE (deploy/deploy-vars.mjs refuses a real deploy
# without it). No workers.dev, no preview URL.
#
# Run wrangler from worker/ (the pinned wrangler lives in worker/node_modules) with --config ../wrangler.toml. Local
# development uses ../wrangler.test.toml and brief/.dev.vars.
name = "brief"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
# The one hostname, a Custom Domain (wrangler applies the list as the Worker's complete set; tools/cf-guard checks it
# before every deploy). vars.PUBLIC_HOST names the same host.
routes = [{ pattern = "brief.ziyixi.science", custom_domain = true }]

# The owner's content config, bundled as text: the registry (sources.yaml), the profile and the writing policy. The
# Worker reads them at startup; a registry that does not load fails the startup, which is the deploy.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.yaml"]
fallthrough = false

# The Worker's own log lines (an alarm: its job, step and code; a refusal: request ID, status, reason; a send: the
# date, status and outcome) are kept; the invocation logs, which record every request's URL, are off, and so are
# traces. Nothing logs a title, a text, a token or an address.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

# The archive UI (web/, `npm run build`). Every request reaches the Worker first: it checks the caller and adds the
# private headers before handing a path to ASSETS.
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# One SQLite-backed object ("brief-v1"): sources, hosts, items, embeddings, clusters, issues, the model calls, the send
# ledger, votes and weights; it schedules itself with setAlarm (no cron trigger, no D1, no R2, no KV).
[[durable_objects.bindings]]
name = "BRIEF"
class_name = "BriefState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BriefState"]

# Authenticated per-caller inference over the shared private ModelService.
[[services]]
binding = "MODEL_ROUTER"
service = "model-router"
entrypoint = "Inference"
props = { app = "brief" }

[vars]
# The app's host: the only origin a mutation may come from (CSRF), the feedback links' host, and a zone never fetched.
PUBLIC_HOST = "brief.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
# The AUD tag of the Access application "brief" (the whole host; infra/access.tf owner_apps["brief"]), created by
# "Infra apply" on 2026-10-11: config/resources.toml [access_audiences] holds it and tools/cloud-config/generate.py
# writes it here; its application id is in infra/ids.tf. "Infra drift" compares this value with the application's
# every day. The /feedback Bypass application has its own AUD, which nothing checks: the Worker checks its HMAC token.
ACCESS_AUDIENCE = "d9dd5577cada54bc585a0add6f508663c8f27288cdf085cfbae70a24b54b7bfb"
