# Local development only (never deployed; .github/scripts/test_wrangler_configs.py TEST_CONFIGS): the production
# wrangler.toml without the Workers AI binding (wrangler dev would reach the account for it) and without the Custom
# Domain. The Worker then calls the loopback fake that DEV_FAKE_UPSTREAM names for every feed, page, Claude, Resend and
# Workers AI request, with the values of brief/.dev.vars (see .dev.vars.example).
#
#   cd worker && npm run dev        (http://127.0.0.1:8799)
name = "brief"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.yaml"]
fallthrough = false

[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "BRIEF"
class_name = "BriefState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BriefState"]

[vars]
PUBLIC_HOST = "brief.localhost"
ACCESS_ISSUER = "https://synthetic.cloudflareaccess.com"
ACCESS_AUDIENCE = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
