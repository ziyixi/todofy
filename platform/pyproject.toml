[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "todofy-personal-cloud"
version = "0.1.0"
description = "Bounded personal-cloud runtime observer and deployment daemon"
requires-python = ">=3.14"
dependencies = [
  "ziyixi-proto",
  "fastapi",
  "uvicorn",
  "httpx",
  "kubernetes",
  "jeepney",
]

[project.scripts]
personal-cloud = "personal_cloud.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
