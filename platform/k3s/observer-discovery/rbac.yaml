apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: personal-cloud-observer-discovery
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: personal-cloud-observer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: personal-cloud-observer-discovery
subjects:
  - kind: ServiceAccount
    name: platform-observer
    namespace: personal-cloud
