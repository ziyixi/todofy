apiVersion: batch/v1
kind: CronJob
metadata:
  name: newsletter-daily
spec:
  schedule: 0 7 * * *
  timeZone: America/Los_Angeles
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7500
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: newsletter-release
              command: [newsletter-trigger, --send, --timeout, '7200']
              envFrom:
                - secretRef:
                    name: newsletter-trigger
              env:
                - name: NEWSLETTER_SERVICE_URL
                  value: http://newsletter:8080
                - name: NEWSLETTER_ALLOW_INTERNAL_HTTP
                  value: '1'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
