apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-gateway
  template:
    metadata:
      labels:
        app: codex-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codex-gateway
          image: codex-gateway-release
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 18766
              hostIP: 127.0.0.1
          env:
            - name: CODEX_HOME
              value: /var/lib/newsletter-auth
            - name: DATA_DIR
              value: /var/lib/codex-gateway
            - name: CODEX_GATEWAY_RELEASE_REQUEST_ID
              value: pending
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: auth
              mountPath: /var/lib/newsletter-auth
            - name: state
              mountPath: /var/lib/codex-gateway
              subPath: codex-gateway
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: newsletter-auth
        - name: state
          persistentVolumeClaim:
            claimName: platform-state
---
apiVersion: v1
kind: Service
metadata:
  name: codex-gateway
spec:
  selector:
    app: codex-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-gateway-release
data:
  request_id: pending
  source_sha: pending
  image: pending
  phase: applying
