apiVersion: batch/v1
kind: CronJob
metadata:
  name: mailsort-runner
spec:
  schedule: '0 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app: mailsort-runner
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: mailsort-runner
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mailsort-runner
              image: mailsort-runner-release
              command: [python, -m, mailsort_runner]
              envFrom:
                - secretRef:
                    name: mailsort-runner
                - configMapRef:
                    name: mailsort-runner-config
              env:
                - name: CODEX_HOME
                  value: /data/codex-auth
              volumeMounts:
                - name: codex-auth
                  mountPath: /data/codex-auth
                - name: temporary
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: '1'
                  memory: 512Mi
          volumes:
            - name: codex-auth
              persistentVolumeClaim:
                claimName: mailsort-runner-auth
            - name: temporary
              emptyDir:
                sizeLimit: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailsort-runner-release
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailsort-runner-config
data:
  MAILSORT_URL: https://sort.ziyixi.science
