apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter-config-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: newsletter-config-sync
  template:
    metadata:
      labels:
        app: newsletter-config-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-config
          image: newsletter-release
          command: [python, -m, newsletter.config_sync, initialize]
          env:
            - name: NEWSLETTER_CONFIG_REPOSITORY
              value: ziyixi/todofy
            - name: NEWSLETTER_CONTENT_CONFIG_DIR
              value: /var/lib/newsletter-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /var/lib/newsletter-config
      containers:
        - name: config-sync
          image: newsletter-release
          command: [python, -m, newsletter.config_sync, run]
          env:
            - name: NEWSLETTER_CONFIG_REPOSITORY
              value: ziyixi/todofy
            - name: NEWSLETTER_CONTENT_CONFIG_DIR
              value: /var/lib/newsletter-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /var/lib/newsletter-config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: newsletter-config
