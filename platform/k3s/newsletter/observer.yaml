apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-observer
spec:
  schedule: '*/5 * * * *'
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: platform-observer
        spec:
          serviceAccountName: platform-observer
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: observer
              image: ghcr.io/ziyixi/todofy-platform:bootstrap-required
              args: [observer]
              env:
                - name: FLEET_REPORT_URL
                  valueFrom:
                    secretKeyRef:
                      name: fleet-observer-settings
                      key: FLEET_REPORT_URL
                - name: FLEET_HOST_KEY
                  value: vps
                - name: FLEET_HOST_EPOCH
                  value: '1'
                - name: FLEET_KUBE_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: FLEET_EXPECT_PLATFORM_TUNNEL
                  value: 'true'
                - name: FLEET_STATE_DIR
                  value: /var/lib/observer
                - name: FLEET_REPORT_HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fleet-observer-settings
                      key: FLEET_REPORT_HMAC_KEY
                - name: NEWSLETTER_MONITOR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: newsletter-settings
                      key: NEWSLETTER_MONITOR_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: state
                  mountPath: /var/lib/observer
                - name: system-bus
                  mountPath: /host-system-bus/socket
                  readOnly: true
                - name: meminfo
                  mountPath: /host-meminfo
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: observer-state
            - name: system-bus
              hostPath:
                path: /run/dbus/system_bus_socket
                type: Socket
            - name: meminfo
              hostPath:
                path: /proc/meminfo
                type: File
