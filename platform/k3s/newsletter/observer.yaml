apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-observer
spec:
  schedule: '*/5 * * * *'
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: platform-observer
        spec:
          serviceAccountName: platform-observer
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: systemd-snapshot
              image: ghcr.io/ziyixi/todofy-platform:bootstrap-required
              args: [observer-systemd]
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                appArmorProfile:
                  type: Localhost
                  localhostProfile: personal-cloud-systemd-observer-v1
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
              volumeMounts:
                - name: system-bus
                  mountPath: /host-system-bus/socket
                  readOnly: true
                - name: systemd-snapshot
                  mountPath: /run/observer-systemd
          containers:
            - name: observer
              image: ghcr.io/ziyixi/todofy-platform:bootstrap-required
              args: [observer]
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              env:
                - name: FLEET_REPORT_URL
                  valueFrom:
                    secretKeyRef:
                      name: fleet-observer-settings
                      key: FLEET_REPORT_URL
                - name: FLEET_HOST_KEY
                  value: vps
                - name: FLEET_HOST_EPOCH
                  value: '1'
                - name: FLEET_KUBE_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: FLEET_EXPECT_PLATFORM_TUNNEL
                  value: 'true'
                - name: FLEET_STATE_DIR
                  value: /var/lib/observer
                - name: FLEET_REPORT_HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fleet-observer-settings
                      key: FLEET_REPORT_HMAC_KEY
                - name: NEWSLETTER_MONITOR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: newsletter-settings
                      key: NEWSLETTER_MONITOR_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: state
                  mountPath: /var/lib/observer
                - name: systemd-snapshot
                  mountPath: /run/observer-systemd
                  readOnly: true
                - name: kubernetes-api
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
                - name: meminfo
                  mountPath: /host-meminfo
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: observer-state
            - name: system-bus
              hostPath:
                path: /run/dbus/system_bus_socket
                type: Socket
            - name: meminfo
              hostPath:
                path: /proc/meminfo
                type: File
            - name: systemd-snapshot
              emptyDir:
                medium: Memory
                sizeLimit: 64Ki
            - name: kubernetes-api
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
