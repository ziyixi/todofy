apiVersion: v1
kind: PersistentVolume
metadata:
  name: personal-cloud-observer-state
spec:
  capacity:
    storage: 64Mi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    name: observer-state
    namespace: personal-cloud
  hostPath:
    path: /srv/todofy/observer
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observer-state
  namespace: personal-cloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  volumeName: personal-cloud-observer-state
  resources:
    requests:
      storage: 64Mi
---
