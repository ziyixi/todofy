apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-controller
  namespace: personal-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-controller
  namespace: personal-cloud
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, create, patch, update]
  - apiGroups: ['']
    resources: [services, configmaps]
    verbs: [get, list, create, patch, update]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-controller
  namespace: personal-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-controller
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: personal-cloud
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-observer
  namespace: personal-cloud
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-observer
  namespace: personal-cloud
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-observer
  namespace: personal-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-observer
subjects:
  - kind: ServiceAccount
    name: platform-observer
    namespace: personal-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: personal-cloud-observer-nodes
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: personal-cloud-observer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: personal-cloud-observer-nodes
subjects:
  - kind: ServiceAccount
    name: platform-observer
    namespace: personal-cloud
