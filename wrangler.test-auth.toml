# Runtime-test config for pytest Access tests: real JWT checks against the
# loopback fake issuer (ACCESS_ISSUER is set with --var). The harness overrides upstream
# base URLs and the webhook digest with --var; never deploy this file.
name = "todofy-test-auth"
main = "worker/todofy/runtime/entry.py"
base_dir = "worker"
compatibility_date = "2026-09-08"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[assets]
directory = "uiassets/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "todofy"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "TodofyCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
TODOFY_PUBLIC_HOST = "todofy.localhost"
TODOFY_HOOKS_HOSTS = "todofy-hooks.localhost"
BUILD_SHA = "test"
ACCESS_AUDIENCE = "test-audience"
ACCESS_OWNER = "owner@example.com"
DEV_ACCESS_LOOPBACK_ISSUER = "true"
GEMINI_API_BASE = "http://127.0.0.1:9"
GEMINI_TIMEOUT_MS = "1500"
TODOIST_API_BASE = "http://127.0.0.1:9"
