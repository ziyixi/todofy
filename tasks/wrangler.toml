# Public deployment values are generated from config/cloud.toml and config/resources.toml.
name = "tasks"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
routes = [{ pattern = "tasks.ziyixi.science", custom_domain = true }]

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = false
[observability.traces]
enabled = false

[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tasks"
database_id = "79a1f345-1183-46c3-bc6a-651be106f90c"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "JOBS"
class_name = "TaskJobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskJobs"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "tasks-backups"

[[services]]
binding = "MAIL"
service = "todofy"
entrypoint = "Mail"
props = { access = "read-write" }

[vars]
PUBLIC_HOST = "tasks.ziyixi.science"
TIME_ZONE = "US/Pacific"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
ACCESS_AUDIENCE = "8c191368e27dd57284cb03fafb1aee15abca24864ee2f5df5335655dfb08ef4b"
