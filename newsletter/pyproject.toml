[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-newsletter"
version = "0.1.0"
description = "One private service for research intake, editorial work, and reviewed newsletters"
requires-python = ">=3.14"
dependencies = [
  "fastapi", "uvicorn", "httpx",
  "protobuf", "jinja2", "pillow", "pyyaml",
  # The console listener's Access check (console_access.py): RS256 needs
  # cryptography, which PyJWT's crypto extra would add.
  "PyJWT", "cryptography",
  "ziyixi-protos",
  "ziyixi-proto", "ziyixi-model-router-client",
]

[dependency-groups]
dev = [
  "pytest", "pytest-asyncio", "ruff",
  "mypy", "types-protobuf", "types-pyyaml",
]

[project.scripts]
newsletter = "newsletter.cli:main"
newsletter-trigger = "newsletter.trigger:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsletter = ["templates/*", "policy/*", "instructions/*.md", "instructions/discovery/*.md", "instructions/discovery/_sources/*.md", "workflows/*.yaml", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
cache_dir = ".artifacts/cache/pytest"

[tool.ruff]
# Keep parenthesised exception tuples; the interpreter is Python 3.14.
target-version = "py313"
line-length = 80
cache-dir = ".artifacts/cache/ruff"
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "E501", "F", "I", "N", "D", "B", "C4", "UP",
  "PIE", "RET", "SIM", "C90", "BLE001", "PLC0415", "TID252", "SLF001",
  "RUF021", "RUF043", "RUF100", "PT011", "PT012", "PT014",
]
ignore = ["D105", "D107", "SIM105", "SIM108", "SIM905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]
force-sort-within-sections = true
order-by-type = false
known-first-party = ["newsletter", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["D1", "C901", "SLF001"]
"tests/conftest.py" = ["D1"]

[tool.mypy]
python_version = "3.14"
cache_dir = ".artifacts/cache/mypy"
files = ["src/newsletter", "scripts", "tests/support"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# The proto package's generated modules are annotated, but its wheel carries no
# py.typed marker; read their annotations anyway.
module = ["ziyixi_proto", "ziyixi_proto.*"]
follow_untyped_imports = true
