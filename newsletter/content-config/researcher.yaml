  # ---------- World and economy ----------
  # Headline feeds put the day's front pages in front of 03-world, so a story several outlets lead
  # with (an election result, a change of government) arrives as one lead that names every outlet
  # instead of hanging on a few searches. Open, unpaywalled publishers: each answered 200 without a
  # redirect when added, which says nothing about whether the hosted model can open their article
  # pages. Two days keep them to the current news cycle; NPR, Al Jazeera, France 24 and PBS hold
  # only the last 5-13 hours.
  - id: bbc-world
    name: BBC
    direction: 03-world
    kind: feed
    url: "https://feeds.bbci.co.uk/news/world/rss.xml" # one-sentence descriptions
    max_seeds: 4
    max_age_days: 2
    role: headline
  - id: npr-news
    name: NPR
    direction: 03-world
    kind: feed
    url: "https://feeds.npr.org/1001/rss.xml" # top news incl. US politics; Brief read 1004 (world)
    max_seeds: 4
    max_age_days: 2
    role: headline
  - id: guardian-world
    name: The Guardian
    direction: 03-world
    kind: feed
    url: "https://www.theguardian.com/world/rss"
    max_seeds: 4
    max_age_days: 2
    role: headline
