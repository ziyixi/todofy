# Researcher registry: public feeds the `feeds` (api_feed) node reads once per run.
# Every item becomes a metadata-only lead (仅线索) for its discovery direction; the discovery
# model decides what to open. Code owns request parameters (arXiv window, Crossref filter,
# Hugging Face date), pacing, size caps and network checks; this file only names sources.
#
# Ported from the retired Brief app's registry at b55b29b1; its open headline feeds came back on
# 2026-11-04. Entries still left out (paywalled and signal-only feeds, CNA, the Anthropic sitemap,
# PyTorch, USGS, disabled entries and the Crossref alternates) stay recoverable:
#   git show b55b29b1:brief/content-config/sources.yaml
#
# Fields (the engine refuses unknown fields, anchors and tags):
#   id                 [a-z0-9-], unique; diagnostics name it
#   name               venue shown in 来源选择依据 and 刊会／发布方; distinct names count as
#                      independent sources when the same work arrives twice
#   direction          an existing discovery/<id>.md direction
#   kind               feed (RSS, RDF or Atom; read from the content) | arxiv (API; needs query)
#                      | crossref (journal works) | hf_daily (Hugging Face daily papers)
#   url                https, no port; only a feed URL may carry a query
#   query              arxiv only; code adds the submittedDate window
#   keywords           optional prefilter on title or summary: whole words or phrases; a trailing *
#                      matches the start of a word; a keyword written with capitals matches
#                      case-sensitively
#   requires_abstract  skip items whose summary or abstract is under 80 characters
#   max_seeds          leads per run from this source, 1-20 (default 5); each direction gets 20;
#                      for headline feeds, their sum caps the direction's event groups
#   max_bytes          read cap, 65536-4194304 (default 1048576); a feed is parsed as far as it got
#   max_age_days       freshness window, 1-30 (default 4 for arxiv, 7 otherwise); undated items drop
#   enabled            false keeps an entry without fetching it
#   role               headline (feeds only): a front-page feed. A direction's headline feeds are
#                      read as one front page: entries from the last 48 hours (they need a time
#                      with a zone) are grouped by event, and groups that more outlets (distinct
#                      names) carry rank first, with up to 3 other outlets' URLs as alternates

version: 1

sources:
  # ---------- AI / LLM ----------
  - id: arxiv-llm-architecture
    name: arXiv
    direction: 08-llm-architectures
    kind: arxiv
    url: "https://export.arxiv.org/api/query"
    # ti:transformer and ti:attention alone pull in vision, graph and time-series models.
    query: '(cat:cs.CL OR cat:cs.LG) AND (ti:"mixture of experts" OR ti:"state space" OR ti:"long context" OR ti:tokenizer OR ti:tokenization OR ti:"language model" OR ((ti:transformer OR ti:transformers OR ti:attention) AND (abs:"language model" OR abs:"language models" OR abs:LLM OR abs:LLMs OR ti:LLM OR ti:LLMs)))'
  - id: arxiv-training-inference
    name: arXiv
    direction: 08-llm-architectures
    kind: arxiv
    url: "https://export.arxiv.org/api/query"
    # ti:inference alone is mostly Bayesian and causal inference, ti:kernel kernel methods.
    query: '(cat:cs.LG OR cat:cs.CL OR cat:cs.DC) AND (ti:"speculative decoding" OR ti:quantization OR ti:"KV cache" OR ti:pretraining OR ti:"scaling law" OR ti:"scaling laws" OR ti:GPU OR ti:GPUs OR ((ti:inference OR ti:serving OR ti:distillation) AND (abs:"language model" OR abs:"language models" OR abs:LLM OR abs:LLMs OR ti:LLM OR ti:LLMs)) OR (ti:kernel AND (abs:GPU OR abs:CUDA OR abs:Triton)))'
  - id: arxiv-llm-agents
    name: arXiv
    direction: 01-ai-ml
    kind: arxiv
    url: "https://export.arxiv.org/api/query"
    query: '(cat:cs.CL OR cat:cs.AI) AND (ti:agent OR ti:agents OR ti:agentic) AND (abs:"language model" OR abs:LLM OR abs:LLMs)'
  - id: arxiv-search-recsys-ads
    name: arXiv
    direction: 07-search-ads-recs
    kind: arxiv
    url: "https://export.arxiv.org/api/query"
    # ti:retrieval and ti:search only within cs.IR: in cs.LG they are mostly architecture and tree search.
    query: '(cat:cs.IR AND (ti:recommendation OR ti:recommender OR ti:ranking OR ti:reranking OR ti:"click-through" OR ti:advertising OR ti:retrieval OR ti:search)) OR (cat:cs.LG AND (ti:recommendation OR ti:recommender OR ti:"click-through" OR ti:advertising))'
  # After the arXiv queries on purpose: a paper both list keeps its arXiv direction, and the upvote
  # only raises its rank there.
  - id: hf-daily-papers
    name: Hugging Face Daily Papers
    direction: 01-ai-ml
    kind: hf_daily
    url: "https://huggingface.co/api/daily_papers"
    max_bytes: 4194304
  - id: openai-news
    name: OpenAI
    direction: 01-ai-ml
    kind: feed
    url: "https://openai.com/news/rss.xml" # a long feed back to 2015, newest first
  - id: google-deepmind-blog
    name: Google DeepMind
    direction: 01-ai-ml
    kind: feed
    url: "https://deepmind.google/blog/rss.xml"
  - id: google-research-blog
    name: Google Research
    direction: 01-ai-ml
    kind: feed
    url: "https://research.google/blog/rss/"
  - id: microsoft-research-blog
