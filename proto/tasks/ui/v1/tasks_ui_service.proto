// (-- api-linter: core::0142::time-field-type=disabled
//     aip.dev/not-precedent: date fields are calendar-day text in the shared wire profile. --)
// (-- api-linter: core::0155::request-id-format=disabled
//     aip.dev/not-precedent: existing planning commands use UUIDv5; runtime accepts UUIDv4 and UUIDv5,
//     preserving frozen retry identities instead of replacing them with random IDs. --)
// Native Tasks owner API. Access is verified before reading a body; mutations also require same-origin
// Origin and the signed tasks_csrf token. The separate TasksEntrypoint service binding uses the same
// protobuf messages without exposing a machine-auth route. Bodies are bounded to 64 KiB.
// Every mutation requires a UUIDv4 or UUIDv5 request_id. Exact replays return the original response; reusing it for
// different input is rejected. Updates require the current etag and an explicit update_mask.
syntax = "proto3";

package tasks.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
