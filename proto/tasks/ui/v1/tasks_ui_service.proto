message CommandFocusTimerResponse {
  // The timer now.
  FocusTimer timer = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The saved record, when the command ended a session of at least a minute.
  FocusEntry entry = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}
