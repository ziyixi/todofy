// (-- api-linter: core::0142::time-field-type=disabled
//     aip.dev/not-precedent: date fields are calendar-day text in the shared wire profile. --)
// (-- api-linter: core::0155::request-id-format=disabled
//     aip.dev/not-precedent: existing planning commands use UUIDv5; runtime accepts UUIDv4 and UUIDv5,
//     preserving frozen retry identities instead of replacing them with random IDs. --)
// Native Tasks owner API. Tasks owns task content, planning facts and dependencies (task.proto), Plan (plan.proto)
// and Focus: each day's queue of steps, the one timer and the time records (focus.proto). Access is verified before reading a body; mutations also require same-origin
// Origin and the signed tasks_csrf token. The TasksApi service binding uses the same protobuf messages
// without exposing a machine-auth route: a `read` binding may only read, and a `read-write`
// binding (Todofy) may also write and call the machine-only exportBackup method that Todofy's weekly backup
// pages every table through. Bodies are bounded to 64 KiB.
// Every mutation but UpdateWeeklyBet requires a UUIDv4 or UUIDv5 request_id. Exact replays return the original
// response; reusing it for different input is rejected. Updates require the current etag and an explicit update_mask.
// UpdateWeeklyBet is a value write: sending the saved text again answers it as saved.
syntax = "proto3";

package tasks.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "tasks/ui/v1/focus.proto";
import "tasks/ui/v1/plan.proto";
import "tasks/ui/v1/task.proto";

option java_multiple_files = true;
option java_outer_classname = "TasksUiServiceProto";
option java_package = "science.ziyixi.tasks.ui.v1";

// The owner's tasks and task organization.
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: the four small catalog resource kinds are read together by GetCatalog. --)
// (-- api-linter: core::0121::resource-must-support-list=disabled
//     aip.dev/not-precedent: GetCatalog is one bounded read of the personal catalog, rather than four lists. --)
service TasksUiService {
  option (google.api.default_host) = "tasks.ziyixi.science";
  // Catalog metadata, bounded to 500 entries per kind; larger stores fail explicitly.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetCatalog(GetCatalogRequest) returns (Catalog) {
    option (google.api.http) = {get: "/api/tasks/v1/{name=catalog}"};
    option (google.api.method_signature) = "name";
  }
  // A keyset-paginated task view, at most 100 rows per page.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {get: "/api/tasks/v1/tasks"};
  }
  // A single task, including direct child counts.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetTask(GetTaskRequest) returns (Task) {
    option (google.api.http) = {get: "/api/tasks/v1/{name=tasks/*}"};
    option (google.api.method_signature) = "name";
  }
  // Create a task.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateTask(CreateTaskRequest) returns (Task) {
    option (google.api.http) = {
      post: "/api/tasks/v1/tasks"
      body: "task"
    };
    option (google.api.method_signature) = "task,task_id";
  }
  // Update a task.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateTask(UpdateTaskRequest) returns (Task) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{task.name=tasks/*}"
      body: "task"
    };
    option (google.api.method_signature) = "task,update_mask";
  }
  // Delete a task.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=tasks/*}"};
    option (google.api.method_signature) = "name";
  }
  // Create a project.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateProject(CreateProjectRequest) returns (Project) {
    option (google.api.http) = {
      post: "/api/tasks/v1/projects"
      body: "project"
    };
    option (google.api.method_signature) = "project,project_id";
  }
  // Update a project.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateProject(UpdateProjectRequest) returns (Project) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{project.name=projects/*}"
      body: "project"
    };
    option (google.api.method_signature) = "project,update_mask";
  }
  // Delete a project.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=projects/*}"};
    option (google.api.method_signature) = "name";
  }
  // Create a section.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateSection(CreateSectionRequest) returns (Section) {
    option (google.api.http) = {
      post: "/api/tasks/v1/sections"
      body: "section"
    };
    option (google.api.method_signature) = "section,section_id";
  }
  // Update a section.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateSection(UpdateSectionRequest) returns (Section) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{section.name=sections/*}"
      body: "section"
    };
    option (google.api.method_signature) = "section,update_mask";
  }
  // Delete a section.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteSection(DeleteSectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=sections/*}"};
    option (google.api.method_signature) = "name";
  }
  // Create a label.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateLabel(CreateLabelRequest) returns (Label) {
    option (google.api.http) = {
      post: "/api/tasks/v1/labels"
      body: "label"
    };
    option (google.api.method_signature) = "label,label_id";
  }
  // Update a label.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateLabel(UpdateLabelRequest) returns (Label) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{label.name=labels/*}"
      body: "label"
    };
    option (google.api.method_signature) = "label,update_mask";
  }
  // Delete a label.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=labels/*}"};
    option (google.api.method_signature) = "name";
  }
  // Create a savedfilter.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateSavedFilter(CreateSavedFilterRequest) returns (SavedFilter) {
    option (google.api.http) = {
      post: "/api/tasks/v1/filters"
      body: "saved_filter"
    };
    option (google.api.method_signature) = "saved_filter,saved_filter_id";
  }
  // Update a savedfilter.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateSavedFilter(UpdateSavedFilterRequest) returns (SavedFilter) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{saved_filter.name=filters/*}"
      body: "saved_filter"
    };
    option (google.api.method_signature) = "saved_filter,update_mask";
  }
  // Delete a savedfilter.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteSavedFilter(DeleteSavedFilterRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=filters/*}"};
    option (google.api.method_signature) = "name";
  }
  // Completes a task and its descendants. A recurring task records one occurrence, advances its dates and
  // reopens its descendants for the next cycle. In the same batch, a running or paused timer on the task or a
  // descendant saves its session as a record and goes idle, and the subtree's steps queued on that session's day,
  // else on focus_day, are marked done.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CompleteTask(CompleteTaskRequest) returns (Task) {
    option (google.api.http) = {
      post: "/api/tasks/v1/{name=tasks/*}:complete"
      body: "*"
    };
  }
  // Reopens the task and its completed ancestors; historical completion records remain available. Their Focus queue
  // rows marked done by that completion are open again.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ReopenTask(ReopenTaskRequest) returns (Task) {
    option (google.api.http) = {
      post: "/api/tasks/v1/{name=tasks/*}:reopen"
      body: "*"
    };
  }
  // Copies the task and its active descendants below the original; at most 100 tasks and 32 levels.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DuplicateTask(DuplicateTaskRequest) returns (Task) {
    option (google.api.http) = {
      post: "/api/tasks/v1/{name=tasks/*}:duplicate"
      body: "*"
    };
  }
  // Atomically changes only the listed tasks' positions, at most 100, and with lane_order one Review lane's order,
  // under one request receipt. Answers the repositioned tasks with their new etags.
  rpc ReorderTasks(ReorderTasksRequest) returns (ReorderTasksResponse) {
    option (google.api.http) = {
      post: "/api/tasks/v1/tasks:reorder"
      body: "*"
    };
  }
  // A bounded incremental feed. Catalog changes tell readers to refresh GetCatalog.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option (google.api.http) = {get: "/api/tasks/v1/changes"};
  }
  // Completion occurrences, independent of a recurring task's current state.
  rpc ListCompletions(ListCompletionsRequest) returns (ListCompletionsResponse) {
    option (google.api.http) = {get: "/api/tasks/v1/completions"};
  }
  // Parses a date or recurrence without writing anything.
  rpc PreviewDate(PreviewDateRequest) returns (PreviewDateResponse) {
    option (google.api.http) = {
      post: "/api/tasks/v1/dates:previewDate"
      body: "*"
    };
  }
  // Every day of a range of 1 to 7 days, even an empty one, with the records counted on them, every task either
  // names and Tasks' today. A day holds at most 20 queued steps and 30 records, so the answer is bounded. No range
  // reads the week of Tasks' today.
  rpc ListFocusDays(ListFocusDaysRequest) returns (ListFocusDaysResponse) {
    option (google.api.http) = {get: "/api/tasks/v1/focusDays"};
  }
  // Adds a step to a day's queue, removes it, reorders it within the day or moves it to another day, in one write.
  // (-- api-linter: core::0136::http-uri-suffix=disabled
  //     aip.dev/not-precedent: the verb acts on one step of the focusDays collection, so `focusDays:moveStep`
  //     names both without repeating the collection. --)
  rpc MoveFocusStep(MoveFocusStepRequest) returns (MoveFocusStepResponse) {
    option (google.api.http) = {
      post: "/api/tasks/v1/focusDays:moveStep"
      body: "*"
    };
  }
  // The one Focus timer.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetFocusTimer(GetFocusTimerRequest) returns (FocusTimer) {
    option (google.api.http) = {get: "/api/tasks/v1/{name=focusTimer}"};
    option (google.api.method_signature) = "name";
  }
  // Starts, pauses, resumes, stops or finishes the timer's session. Stop and Finish save a session of at least a
  // minute as one record, in whole minutes.
  rpc CommandFocusTimer(CommandFocusTimerRequest) returns (CommandFocusTimerResponse) {
    option (google.api.http) = {
      post: "/api/tasks/v1/{name=focusTimer}:command"
      body: "*"
    };
  }
  // Adds time by hand.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateFocusEntry(CreateFocusEntryRequest) returns (FocusEntry) {
    option (google.api.http) = {
      post: "/api/tasks/v1/focusEntries"
      body: "focus_entry"
    };
    option (google.api.method_signature) = "focus_entry";
  }
  // Changes a record's minutes.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateFocusEntry(UpdateFocusEntryRequest) returns (FocusEntry) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{focus_entry.name=focusEntries/*}"
      body: "focus_entry"
    };
    option (google.api.method_signature) = "focus_entry,update_mask";
  }
  // Deletes a record.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteFocusEntry(DeleteFocusEntryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tasks/v1/{name=focusEntries/*}"};
    option (google.api.method_signature) = "name";
  }
  // The planning week: its Bets, the arranged Review lanes and next week's choices, in one batch.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetPlan(GetPlanRequest) returns (Plan) {
    option (google.api.http) = {get: "/api/tasks/v1/{name=plan}"};
    option (google.api.method_signature) = "name";
  }
  // Saves a Bet's text over the etag shown, creating it when the week and area have none. Only this week's and
  // the next week's Bets take a write.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateWeeklyBet(UpdateWeeklyBetRequest) returns (WeeklyBet) {
    option (google.api.http) = {
      patch: "/api/tasks/v1/{weekly_bet.name=weeklyBets/*}"
      body: "weekly_bet"
    };
    option (google.api.method_signature) = "weekly_bet,update_mask";
  }
}

// Catalog request.
// (-- api-linter: core::0131::request-unknown-fields=disabled
//     aip.dev/not-precedent: this bounded aggregate lets metadata readers omit expensive sidebar counts while retaining the legacy default. --)
message GetCatalogRequest {
  // Always catalog.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "tasks.ziyixi.science/Catalog"
  ];
  // Include sidebar task counts. Omission preserves true; metadata-only readers may explicitly request false.
  optional bool include_task_counts = 2 [(google.api.field_behavior) = OPTIONAL];
}
// All project organization, with a hard bound rather than a silently truncated result.
// (-- api-linter: core::0122::embedded-resource=disabled
//     aip.dev/not-precedent: this owner-only bounded catalog is the single read surface for its four small resource lists. --)
message Catalog {
  option (google.api.resource) = {
    type: "tasks.ziyixi.science/Catalog"
    pattern: "catalog"
    singular: "catalog"
    plural: "catalogs"
  };
  // Always catalog.
  string name = 6 [(google.api.field_behavior) = IDENTIFIER];
  // Projects, including archived projects.
  repeated Project projects = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sections.
  repeated Section sections = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Labels.
  repeated Label labels = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Saved filters.
  repeated SavedFilter filters = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The account's calendar zone.
  string time_zone = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Open-task counts matching each category's default view, without task content.
  repeated TaskCount task_counts = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// An exact count for a built-in view or catalog category.
message TaskCount {
  // inbox, today, upcoming, project, label or filter.
  string view = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Catalog ID for a project, label or filter; empty for a built-in view.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Number of matching open tasks. Inbox and project views count root tasks.
  int32 count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// (-- api-linter: core::0132::request-unknown-fields=disabled
//     aip.dev/not-precedent: these indexed personal task views use explicit typed selectors, not an unbounded query language. --)
// List a view. Inbox/project default to root tasks; parent_id selects direct children.
message ListTasksRequest {
  // inbox, today, upcoming, project, label, filter, search, all or completed.
  // all includes active tasks across projects; archived tasks remain readable in project and completed views.
  string view = 1 [(google.api.field_behavior) = OPTIONAL];
  // Project ID for project view.
  string project_id = 2 [(google.api.field_behavior) = OPTIONAL];
  // Direct children of this task, taking precedence over view.
  string parent_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Search text or an explicit filter expression.
  string query = 4 [(google.api.field_behavior) = OPTIONAL];
  // Label ID for label view.
  string label_id = 5 [(google.api.field_behavior) = OPTIONAL];
  // Saved filter ID for filter view.
  string filter_id = 6 [(google.api.field_behavior) = OPTIONAL];
  // Default 50, maximum 100.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // Previous page token with identical query parameters.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // Local reference date YYYY-MM-DD; absent uses the account zone's current day.
  string date = 9 [(google.api.field_behavior) = OPTIONAL];
  // sort_order (default), title, priority or due_date, optionally followed by desc.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
  // Include completed tasks in ordinary views; child queries already include them.
  bool include_completed = 11 [(google.api.field_behavior) = OPTIONAL];
  // Include full descriptions; caps page size at 20. Default lists return description_preview only.
  bool include_description = 12 [(google.api.field_behavior) = OPTIONAL];
  // At most 100 exact task IDs, for bounded internal consumers.
  repeated string task_ids = 13 [(google.api.field_behavior) = OPTIONAL];
}
// One task page, in sort_order then ID order.
message ListTasksResponse {
  // Tasks in this page.
  repeated Task tasks = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Empty at the end.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// Get a task.
message GetTaskRequest {
  // tasks/{id}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "tasks.ziyixi.science/Task"
  ];
}

// Input to CreateTask.
message CreateTaskRequest {
  // Resource values.
  Task task = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional imported ID; absent generates a UUID.
  string task_id = 2 [(google.api.field_behavior) = OPTIONAL];
  // One UUIDv4 or UUIDv5 for this user action.
  string request_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Input to UpdateTask.
message UpdateTaskRequest {
  // Resource values.
  Task task = 1 [(google.api.field_behavior) = REQUIRED];
  // Explicit fields to change, including fields to clear.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // One UUIDv4 or UUIDv5 for this user action.
  string request_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Current resource etag, separate from the fields being updated.
  // (-- api-linter: core::0134::request-unknown-fields=disabled
  //     aip.dev/not-precedent: this concurrency token stays outside the masked resource body. --)
  // (-- api-linter: core::0154::no-duplicate-etag=disabled
  //     aip.dev/not-precedent: the shared HTTP client masks resource bodies; this token must survive an update_mask. --)
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Input to DeleteTask.
