// One timer command, against the timer's current etag.
message CommandFocusTimerRequest {
  // What to do.
  enum Action {
    // Not used.
    ACTION_UNSPECIFIED = 0;
    // Start a session on task_id, counted on Tasks' today: idle to running.
    ACTION_START = 1;
    // Running to paused.
    ACTION_PAUSE = 2;
    // Paused to running.
    ACTION_RESUME = 3;
    // End the session and save its time.
    ACTION_STOP = 4;
    // End a pomodoro that reached its target and save its time, at most the target.
    ACTION_FINISH = 5;
  }
  // Always focusTimer.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "tasks.ziyixi.science/FocusTimer"
  ];
  // UUIDv4 or UUIDv5 reused for an exact retry.
  string request_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The timer's current etag.
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
  // What to do.
  Action action = 4 [(google.api.field_behavior) = REQUIRED];
  // START: the open task to time. Other actions: when set, it must be the session's task.
  string task_id = 5 [(google.api.field_behavior) = OPTIONAL];
  // START only: a pomodoro's length, 60..14400 seconds; unset counts up, at most 4 hours.
  optional int32 target_seconds = 6 [(google.api.field_behavior) = OPTIONAL];
  // START only: "", "work" or "personal", kept on the session's record.
  string area = 7 [(google.api.field_behavior) = OPTIONAL];
}
