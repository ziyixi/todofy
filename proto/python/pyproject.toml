# The Python package of the proto/ IDL (proto/README.md). An app depends on it as a local path:
#   [project] dependencies "ziyixi-proto"   (a Worker that imports it; pywrangler vendors it), or
#   [dependency-groups] "ziyixi-proto"      (an app whose tests alone use it)
#   [tool.uv.sources] ziyixi-proto = { path = "../proto/python" }   (not editable: pywrangler needs files)
# Its build backend (build_backend.py) runs proto/tools/ensure.mjs, which generates the modules under
# src/ziyixi_proto/ (never committed); the metadata below is static, so resolving needs no build.
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "ziyixi-proto"
version = "0.0.0"
description = "Generated wire JSON types of the proto/ IDL and their stdlib-only codec"
requires-python = ">=3.12"
# Stdlib only: it runs on Pyodide inside Python Workers. Keep this list empty.
dependencies = []

[tool.uv]
# uv rebuilds the package (and so regenerates) when any of these change: the generator's inputs as
# proto/tools/ensure.mjs hashes them, and its stamp. The stamp is gitignored like the generated code: a
# clean (`git clean -fdX`) deletes both, and uv must then rebuild instead of reinstalling a cached wheel and
# leaving the source tree, which pywrangler vendors from, without generated code. A generation rewrites
# the stamp, so the run after it rebuilds once more; ensure.mjs skips the work then (its stamp matches).
cache-keys = [
  { file = "../.generated.json" },
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "src/ziyixi_proto/*.py" },
  { file = "../**/*.proto" },
  { file = "../buf.yaml" },
  { file = "../buf.lock" },
  { file = "../buf.gen.yaml" },
  { file = "../package-lock.json" },
  { file = "../tools/ensure.mjs" },
  { file = "../tools/gen_py.py" },
]
