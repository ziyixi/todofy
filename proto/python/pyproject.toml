# The Python package of the proto/ IDL (proto/README.md). An app depends on it as a local path:
#   [project] dependencies "ziyixi-proto"   (a Worker that imports it; pywrangler vendors it), or
#   [dependency-groups] "ziyixi-proto"      (an app whose tests alone use it)
#   [tool.uv.sources] ziyixi-proto = { path = "../proto/python" }   (not editable: pywrangler needs files)
# Its build backend (build_backend.py) runs proto/tools/ensure.mjs, which materializes Bazel's modules under
# src/ziyixi_proto/ (never committed); the metadata below is static, so resolving needs no build.
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "ziyixi-proto"
version = "0.0.0"
description = "Generated wire JSON types of the proto/ IDL and their stdlib-only codec"
requires-python = ">=3.14"
# Stdlib only: it runs on Pyodide inside Python Workers. Keep this list empty.
dependencies = []

[tool.uv]
# uv rebuilds after changes to the IDL, Bazel graph, locked toolchains or materialization manifest.
# The ignored manifest also makes a clean checkout rebuild the source tree used by pywrangler.
cache-keys = [
  { file = "../.generated.json" },
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "src/ziyixi_proto/*.py" },
  { file = "src/ziyixi_proto/py.typed" },
  { file = "../ts/*.ts" },
  { file = "../**/*.proto" },
  { file = "../buf.yaml" },
  { file = "../buf.lock" },
  { file = "../buf.gen.yaml" },
  { file = "../../pnpm-lock.yaml" },
  { file = "../../pnpm-workspace.yaml" },
  { file = "../../package.json" },
  { file = "../../.python-version" },
  { file = "../../.bazelversion" },
  { file = "../../.bazelrc" },
  { file = "../../MODULE.bazel" },
  { file = "../../MODULE.bazel.lock" },
  { file = "../../uv.lock" },
  { file = "../../tools/bazel/*.bzl" },
  { file = "../../tools/bazel/BUILD.bazel" },
  { file = "../**/BUILD.bazel" },
  { file = "../bazel/*.bzl" },
  { file = "../package.json" },
  { file = "../ts/package.json" },
  { file = "../tools/ensure.mjs" },
  { file = "../tools/*.py" },
]
