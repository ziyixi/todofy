syntax = "proto3";

package storage.ui.v1;

import "common/wire/v1/wire.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "ClientProto";
option java_package = "science.ziyixi.storage.ui.v1";
option (common.wire.v1.formats) = {
  name: "Namespace"
  pattern: "[a-z][a-z0-9_-]{0,63}"
  max_length: 64
  description: "A fixed server-owned namespace identifier."
};
option (common.wire.v1.formats) = {
  name: "Label"
  pattern: "[\\s\\S]+"
  max_length: 80
  description: "A display label; the owner handler rejects blank and control-character labels."
};

// One independently revocable namespace credential.
message Client {
  option (google.api.resource) = {
    type: "storage.ziyixi.science/Client"
    pattern: "clients/{client}"
    singular: "client"
    plural: "clients"
  };

  // The operations allowed to this credential.
  enum Access {
    // Not accepted when creating a credential.
    ACCESS_UNSPECIFIED = 0;
    // Metadata, listings and content reads.
    ACCESS_READ_ONLY = 1;
    // Reads and conditional writes; no file deletion.
    ACCESS_READ_WRITE = 2;
  }

  // clients/{uuid}; generated by the server from the create request ID.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // A display label, 1-80 printable characters.
  string label = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Label"
  ];
  // Lower-case letters, digits, hyphens and underscores; starts with a letter.
  string namespace = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Namespace"
  ];
  // The independently selected read-only or read/write permission.
  Access access = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Creation time.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Returned once on creation. Lists and repeated creates never return this value.
  string api_key = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The newest request this credential authenticated, written with the counters about every 30 seconds;
  // absent before its first use.
  google.protobuf.Timestamp last_use_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The owner's connection status; never includes Dropbox tokens or account content.
message Settings {
  option (google.api.resource) = {
    type: "storage.ziyixi.science/Settings"
    pattern: "settings"
    singular: "settings"
    plural: "settings"
  };

  // Always settings.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Whether an offline Dropbox connection is installed.
  bool connected = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Public Dropbox App key of this service's separate App-folder app.
  string app_key = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Storage reason of the newest error Dropbox answered on this connection, such as
  // INSUFFICIENT_SPACE; empty when none was recorded. Never provider content.
  string last_provider_error = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When Dropbox last answered that error; a repeat within a minute is written with the counters.
  google.protobuf.Timestamp last_provider_error_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When this connection was installed; absent for a connection installed before this field existed.
  google.protobuf.Timestamp connect_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The newest application request Dropbox answered on this connection, an absent object or a create
  // conflict included; written with the counters about every 30 seconds. An error newer than this
  // is still occurring.
  google.protobuf.Timestamp last_success_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The newest successful PUT or batch on this connection, written with the counters. A full Dropbox
  // still answers reads, so INSUFFICIENT_SPACE has recovered only once a write succeeds after it.
  google.protobuf.Timestamp last_write_success_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}
