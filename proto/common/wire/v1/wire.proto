// The wire JSON profile's own annotations (proto/README.md, Wire JSON profile and Value rules).
//
// A contract states its value rules here, next to its fields, once: which strings are codes, timestamps or
// URLs, which values an enum-like string may take, number bounds, list and map sizes, and which fields a
// message has for each value of its discriminator (a union such as ops.v1.CanaryDelivery), which REQUIRED
// fields are never null, which enums are closed (their consumers branch on every value), and the two relations
// between fields a contract may state besides a union's (Field.present_when, Message.any_match). Both codecs
// (proto/ts/wire-json.ts and proto/python/src/ziyixi_proto/wire_json.py) check them on every read and every
// write, so neither a producer bug nor a consumer's input reaches the other side unchecked, and
// proto/tools/gen_schema.py turns them into the contract's JSON Schema. Two annotations are wire choices
// rather than rules: a map that keeps its entries' order (Field.keep_order), a list or map written even when
// empty (Field.write_empty) and a method whose request is passed as positional arguments (Method.positional).
//
// A rule is a check, never a conversion: a value that breaks one is refused (WireJsonError), on a lenient
// read as well, except where Field.open says a consumer accepts more than a producer writes. Rules never
// echo values in their errors (a path and the rule's name only).

syntax = "proto3";

package common.wire.v1;

import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_outer_classname = "WireProto";
option java_package = "science.ziyixi.common.wire.v1";

// The named string formats a file's fields refer to (Field.format, Field.key_format), in that file.
extend google.protobuf.FileOptions {
  // One entry per format; names are unique within the file.
  repeated Format formats = 51001;
}

// Rules of a message as a whole.
extend google.protobuf.MessageOptions {
  // The message's discriminator, if it is a union.
  Message message = 51001;
}

// A field's value rules, and how the profile writes a map field.
extend google.protobuf.FieldOptions {
  // Every rule is optional; an unset one checks nothing.
  Field field = 51001;
}

// Whether a consumer may meet values of an enum it does not know.
extend google.protobuf.EnumOptions {
  // The consumers branch on every value of this enum (ops-v1's states, severities, health and levels), so the
  // values are fixed for the contract's major version: a read refuses an unknown wire name, a lenient one too
  // (it does not read as the zero value), and proto/tools/profile_breaking.py refuses a new value
  // (PROFILE_ENUM_CLOSED: it is a new major version). Unset (the default), adding a value is compatible and a
  // lenient read takes an unknown name as the zero value, listed in `unrecognized` (proto/README.md, rule 5).
  // Not protobuf's own "closed enum" (proto2): this is about wire names, never about numbers.
  bool closed = 51001;
}

// How a Workers service binding (not gRPC, not HTTP) carries a method's request.
extend google.protobuf.MethodOptions {
  // Unset: the request message is the one argument, as wire JSON.
  Method method = 51001;
}

// A named string format: a regular expression that the whole value matches, and a length bound.
// (-- api-linter: core::0123::resource-annotation=disabled
//     aip.dev/not-precedent: `name` is the format's label inside a file option, not a resource name. --)
message Format {
  // The name fields refer to; the JSON Schema generator uses it as the $defs name (Code, Timestamp).
  string name = 1;
  // The whole value matches this (no ^ or $: the match is always anchored). Only what ECMAScript (with or
  // without the u flag) and Python's re read alike: literal characters up to U+FFFF, character classes of
  // literals and ranges, groups, alternation and the quantifiers ? * + {m,n}; no shorthand class (\d, \w, \s)
  // but the class [\s\S] (any character), no `.`.
  string pattern = 2;
  // At most this many characters (Unicode code points, as JSON Schema counts them); 0 means no bound.
  int32 max_length = 3;
  // One line for the generated JSON Schema.
  string description = 4;
  // A JSON Schema `format` the generator writes next to the pattern, for a value the pattern alone cannot pin
  // (only "date-time": a validator that asserts formats then also refuses an impossible date such as month 13).
  // An annotation for the schema's readers: the codecs check the pattern and max_length only, so every value a
  // producer writes must already keep it (a timestamp formatted from a real time does).
  string json_schema_format = 5;
}

// The rules of a message as a whole. A union is discriminated by one of its enum fields: its fields' cases name
// that field's values (Field.cases). A reader that does not know the discriminator's value (a lenient read of a
// newer producer) checks no case.
message Message {
  // The name of the message's enum field whose value selects the case.
  string discriminator = 1;
  // Groups of fields of which at least one has a value that matches the group's format (mail.received.v1: a
  // subject or a text that is not blank). Checked after the message's fields, on every read and write.
  repeated AnyMatch any_match = 2;
}

// At least one of some string fields of a message has a value that matches a format (Message.any_match).
message AnyMatch {
  // The fields: singular string fields of the message that are REQUIRED or declared `optional`, so that "has a
  // value" means the same on the wire and in the message.
  repeated string fields = 1;
  // The name of a Format of the message's file.
  string format = 2;
}

// The value rules of a field (of each item of a repeated field). A rule applies only where it fits the
// field's type; anything else stops generation (proto/tools/wire_rules.py).
message Field {
  // A string's format: the name of a Format of this file. On a map, see key_format.
  string format = 1;
  // The only values a string or an enum may take (an enum by its wire name).
  repeated string allowed = 2;
  // A lenient read (a consumer) accepts a value outside `allowed` that keeps the other rules: the list is
  // what this build's producers write, and may grow within the contract's major version. Writes and strict
  // reads keep to it.
  bool open = 3;
  // The smallest value of a number (int32 or double), inclusive.
  optional double minimum = 4;
  // The largest value of a number (int32 or double), inclusive.
  optional double maximum = 5;
  // A repeated field or a map holds at most this many items or entries; 0 means no bound.
  int32 max_items = 6;
  // A repeated field's items are distinct.
  bool unique = 7;
  // A map's keys' format: the name of a Format of this file.
  string key_format = 8;
  // A map has these keys.
  repeated string required_keys = 9;
  // A map's entries are written in the order they were set (a read keeps the wire's order), not in the
  // profile's canonical order. As in JavaScript, array-index keys ("10") still come first.
  bool keep_order = 10;
  // The field's presence and extra rules by the value of its message's discriminator (Message).
  repeated Case cases = 11;
  // The presence where no case names the discriminator's value.
  Presence otherwise = 12;
  // A REQUIRED enum or message field always has a value: null (an enum at its zero value, an unset message)
  // is refused on every read and write, a lenient read included. Without it the profile writes such a field
  // as null when it has none (task-intent-v1's error_code). A field that may be null is declared `optional`
  // or left without non_null; the JSON Schema generator reads the same rule (proto/tools/gen_schema.py).
  bool non_null = 13;
  // A repeated field or map that is not REQUIRED is written even when empty ([] or {}), as a REQUIRED one always
  // is; a read still takes its absence (as empty). For a list every producer of this build writes but frozen
  // payloads of older producers lack (mail.received.v1's warnings). A wire choice like keep_order: it changes no
  // rule, only the bytes a producer writes.
  bool write_empty = 14;
  // The name of a bool field of the same message: when that field is true, this one has a value (mail.received.v1's
  // original_text_bytes whenever text_truncated). For a field that can lack a value and is not REQUIRED (declared
  // `optional`, an enum or a message).
  string present_when = 15;
}

// The rules of a field for some values of its message's discriminator.
message Case {
  // The discriminator's values (wire names) this case covers.
  repeated string when = 1;
  // Whether the field has a value in this case.
  Presence presence = 2;
  // Rules that apply in this case, in addition to the field's own.
  CaseRules rules = 3;
}

// The rules a case adds to a field's own: the only ones that may differ by the discriminator's value.
message CaseRules {
  // The only values the field may take in this case (a string or an enum; an enum by its wire name).
  repeated string allowed = 1;
  // The smallest value of a number in this case, inclusive.
  optional double minimum = 2;
  // The largest value of a number in this case, inclusive.
  optional double maximum = 3;
  // A repeated field or a map has no items or entries in this case (a recommendation without tasks when its
  // window was empty). A flag, not a size: Field.max_items of 0 means "no bound", so a case's bound of 0 would
  // read as the opposite of the field's.
  bool empty = 4;
}

// How a service binding passes a method's request.
message Method {
  // The binding passes the request message's fields as arguments, in field-number order, each as its wire
  // JSON value (`status()` for an empty message, `canaryDelivery(eventId)` for one string field), instead of
  // the request message as one argument.
  bool positional = 1;
}

// Whether a field has a value: set, for an `optional` scalar or a message; a value other than the zero
// value, for an enum. A REQUIRED field without a value is written as null (the profile's REQUIRED), unless
// it is non_null (Field.non_null), in every case.
enum Presence {
  // No presence rule.
  PRESENCE_UNSPECIFIED = 0;
  // The field has a value.
  PRESENCE_REQUIRED = 1;
  // The field has no value.
  PRESENCE_ABSENT = 2;
  // Either; states that a case allows the field where `otherwise` would not.
  PRESENCE_OPTIONAL = 3;
}
