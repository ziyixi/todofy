// The singletons of recall's owner API: the owner's settings and the service status (recall/docs/design.md §3.7, §5.3,
// §8.7). Codes, counts, labels and times only: no URL, title or text.

syntax = "proto3";

package recall.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "recall/ingest/v1/diagnostic.proto";

option java_multiple_files = true;
option java_outer_classname = "StatusProto";
option java_package = "science.ziyixi.recall.ui.v1";

// The owner's settings. A singleton.
message Settings {
  option (google.api.resource) = {
    type: "recall.ziyixi.science/Settings"
    pattern: "settings"
    singular: "settings"
    plural: "settings"
  };

  // Always `settings`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The owner's no-text patterns: pages that match one are recorded as visits (scrubbed URL and title) and never
  // have their text captured. A pattern is a host (`example.com`, which also covers its subdomains) or a host and a
  // path prefix (`example.com/account`), in lower case, at most 200 characters, without a scheme, query or fragment;
  // this list and site_only_patterns hold at most 200 patterns together. The extension receives both lists with every
  // upload's answer, and recall applies them to every item itself, so a new pattern holds at once.
  repeated string denylist_patterns = 2 [(google.api.field_behavior) = OPTIONAL];
  // The built-in patterns whose pages are recorded without their text (the owner's other apps, login and
  // authorization paths), in the same form. Pages with a password field are never captured either.
  repeated string builtin_denylist_patterns = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-154: changes with every change. UpdateSettings that carries an etag is refused with ETAG_MISMATCH when the
  // settings changed since.
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
  // The built-in patterns whose pages are recorded by their site alone, the URL reduced to the site's root and the
  // title left empty, never with text: mail, messaging and AI chats, banks and payments, password managers, cloud
  // consoles, identity and account pages. recall's own host is never recorded at all.
  repeated string builtin_site_only_patterns = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The owner's site-only patterns, in the same form: pages that match one are recorded by their site alone, as the
  // built-in site-only patterns are (the owner's own banks and other sensitive sites). The stricter list wins when a
  // page matches patterns of both.
  repeated string site_only_patterns = 6 [(google.api.field_behavior) = OPTIONAL];
  // Days snapshot files stay in R2 after capture, 7-3650 (7 by default); unset: every file stays.
  // Past the window, the alarm removes the files from R2 while keeping the search index, only once the
  // Dropbox backup is connected and has confirmed holding it (its blob and the day file that names it); the page, its
  // visits and the document's record stay, and the archive keeps the text (recall/docs/design.md §2.3). An update that
  // names it without a value keeps every text; a value outside the range is INVALID_RETENTION.
  optional int32 text_retention_days = 7 [(google.api.field_behavior) = OPTIONAL];
}

// The state of recording, archiving and storage. A singleton.
message ServiceStatus {
  option (google.api.resource) = {
    type: "recall.ziyixi.science/ServiceStatus"
    pattern: "serviceStatus"
    singular: "serviceStatus"
    plural: "serviceStatuses"
  };

  // Always `serviceStatus`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Every device that ever uploaded, most recently heard from first.
  repeated DeviceStatus devices = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Every archive consumer that pulled the change feed, most recently seen first (at most 8).
  repeated ArchiveConsumer archive_consumers = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The newest change's seq; 0 before the first.
  int32 head_seq = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The start of the first visit; unset before it (the timeline's earliest day).
  google.protobuf.Timestamp first_visit_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Pages kept.
  int32 page_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Visits kept.
  int32 visit_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Captured texts kept: in Cloudflare, or past the retention window only in the Dropbox archive
  // (archived_text_count).
  int32 document_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Durable Object's SQLite database, in MiB.
  int32 storage_used_mib = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its budget, in MiB (900). The oldest pages' texts leave the search index (oldest_indexed_text_time) while it holds
  // over 500 MiB of text (each page's first 32 KiB) or the database passes 850 MiB, where the status warns.
  int32 storage_budget_mib = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The captured texts in R2, in MiB (gzip, as stored): those retention has not moved to the archive alone.
  int32 blob_stored_mib = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rows the Durable Object wrote today (UTC).
  int32 rows_written_today_count = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its daily budget: past it, uploads are answered 429 until the next UTC day.
  int32 daily_row_budget = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The oldest capture whose text the storage budget left in the search index; unset while it left every one. Older
  // pages are found by title and URL only (their texts are still kept and archived). Texts past the retention window
  // leave the index as well (text_retention_days, archived_text_count).
  google.protobuf.Timestamp oldest_indexed_text_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last few error codes, newest first, at most 8 (e.g. `r2_unavailable`, `upload_over_budget`).
  repeated string recent_error_codes = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The deployed commit.
  string build = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Items of uploads that recall refused over the last 7 days, by reason; empty when none.
  repeated RejectedItems rejected_items = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rows the Durable Object read today (UTC).
  int32 rows_read_today_count = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its daily budget: past it, SearchPages is SEARCH_OVER_BUDGET until the next UTC day; the change feed stops
  // earlier (at two thirds of it), so that an archive catching up leaves room for the owner's searches.
  int32 daily_read_budget = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The archive's backup to the owner's Dropbox.
  // (-- api-linter: core::0122::embedded-resource=disabled
  //     aip.dev/not-precedent: the status is the one read of 设置 and the header line; the backup is a singleton
  //     without a Get of its own, read here with the rest. --)
  DropboxBackup dropbox_backup = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The legacy ingest and export tokens, then up to 16 named upload tokens, never with their `token`.
  // (-- api-linter: core::0122::embedded-resource=disabled
  //     aip.dev/not-precedent: a bounded set without a Get or List of their own, read here with the rest of 设置. --)
  repeated MachineToken machine_tokens = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Settings.text_retention_days, read here with the rest (the search's coverage line, 设置 → 存储); 0 while every
  // text stays in Cloudflare.
  int32 text_retention_days = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Captured texts only in the Dropbox archive: past the retention window, recall removed them from Cloudflare after
  // the archive confirmed holding them. document_count minus this many are in Cloudflare.
  int32 archived_text_count = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why no text leaves Cloudflare now although the window is set: `dropbox_not_connected` (the backup is not
  // connected) or `dropbox_failing` (its last attempt failed; it retries by itself); empty while retention runs or is
  // off.
  string text_retention_paused_reason = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The most recently received one-shot capture diagnostic, without browsing content.
  CaptureDiagnosticReport capture_diagnostic = 25 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The latest one-shot diagnostic and the existing device identity that sent it.
message CaptureDiagnosticReport {
  // The extension's device UUID.
  string device_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the Worker received this diagnostic.
  google.protobuf.Timestamp receive_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The closed, content-free observations.
  // (-- api-linter: core::0215::foreign-type-reference=disabled
  //     aip.dev/not-precedent: owner status exposes the same closed diagnostic received by ingest, without a second contract. --)
  recall.ingest.v1.CaptureDiagnostic diagnostic = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The backup of the archive (contracts/recall-archive-v1) to the owner's Dropbox: recall writes the archive's files
// into the app folder of the owner's own Dropbox app, about hourly while there are changes, and never deletes there
// (a deletion is a tombstone line). Connected with OAuth 2 and PKCE: the owner gives the app's key, and recall keeps
// only a refresh token, which no answer carries. A singleton, read as ServiceStatus.dropbox_backup.
message DropboxBackup {
  option (google.api.resource) = {
    type: "recall.ziyixi.science/DropboxBackup"
    pattern: "dropboxBackup"
    singular: "dropboxBackup"
    plural: "dropboxBackups"
  };

  // Always `dropboxBackup`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The App key of the owner's Dropbox app (public, not a secret); empty before the first ConnectDropboxBackup.
  string app_key = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // recall holds a refresh token and uploads. False before the first connection, after DisconnectDropboxBackup, and
  // once Dropbox refused the refresh token (error_code `dropbox_refused`): the owner connects again.
  bool connected = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Dropbox account's display name, as Dropbox gave it at the connection; empty when it did not.
  string account_display_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the owner connected it.
  google.protobuf.Timestamp connect_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last file recall wrote to Dropbox.
  google.protobuf.Timestamp last_upload_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Every change of the feed up to this seq is in Dropbox (the archive's state.json says the same).
  int32 synced_seq = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Changes above synced_seq, not in Dropbox yet, counted up to 500.
  int32 pending_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When recall committed the oldest change not in Dropbox yet; unset when there is none.
  google.protobuf.Timestamp oldest_pending_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why the last attempt failed, when it failed after the last complete upload: `dropbox_refused` (the authorization
  // was revoked or the app deleted: connect again), `dropbox_permission` (the app lacks files.content.write or
  // files.content.read: tick it, then connect again),
  // `dropbox_full` (no space left), `dropbox_other_feed` (the app folder holds another recall's archive),
  // `dropbox_conflict` (a file of another content holds a blob's path, left as it is), `dropbox_rate_limited`,
  // `dropbox_unavailable`, `dropbox_revoke_failed` (DisconnectDropboxBackup could not revoke at Dropbox); empty when
  // none. recall retries by itself, with backoff, but after `dropbox_refused`.
  string error_code = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When that failure happened.
  google.protobuf.Timestamp error_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A machine token: the bearer token of the machine routes under /api/machine/v1 (recall/docs/design.md §2.2).
// `machineTokens/ingest` is the extension's (write-only: uploads), `machineTokens/export` a feed consumer's (read-only:
// the change feed and its blobs; optional, the Dropbox backup needs none). Named machineTokens/{uuid} are independent
// upload credentials, not device registrations. recall keeps only each token's SHA-256.
message MachineToken {
  option (google.api.resource) = {
    type: "recall.ziyixi.science/MachineToken"
    pattern: "machineTokens/{machine_token}"
    singular: "machineToken"
    plural: "machineTokens"
  };

  // machineTokens/ingest, machineTokens/export, or machineTokens/{uuid} for a named upload credential.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The token itself, `recall_ingest_` or `recall_export_` and 43 URL-safe characters. Set only in the response of
  // CreateMachineToken or RegenerateMachineToken, the one time it is shown: recall stores its SHA-256 alone.
  string token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the current token was made; unset while there is none (the route answers 503 unless a Worker secret holds
  // a digest).
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Until when the token it replaced is still accepted (24 hours after a regeneration, so the extension uploads until
  // it has the new one); unset when only the current token is.
  google.protobuf.Timestamp previous_expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A digest put as a Worker secret by hand (INGEST_TOKEN_SHA256 or EXPORT_TOKEN_SHA256 and their _PREVIOUS) is
  // accepted as well; only deleting that secret stops it.
  bool worker_secret = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The display label, 1-80 characters after trimming. Empty for route tokens that have not been named.
  string label = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Items of uploads that recall refused, for one reason, over 7 days. recall refuses an item only when it breaks the
// upload's rules (a bug in the extension) or only a newer Worker can read it, never for its age or length.
message RejectedItems {
  // `invalid_item` (the item breaks the upload's rules) or `id_conflict` (a document ID already holds other content):
  // the extension drops the item, so it is lost. `unsupported_item` (the extension is newer than the Worker): the item
  // waits in the extension's outbox until a Worker that reads it is deployed.
  string reason = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Items refused for it over the last 7 days.
  int32 count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The latest one.
  google.protobuf.Timestamp last_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A browser profile running the extension, as its uploads describe it.
message DeviceStatus {
  // The device's ID: a lower-case UUID the extension made when it was installed.
  string device_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The owner's name for it, set in the extension's options.
  string label = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The extension's version.
  string extension_version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When recall first heard from it.
  google.protobuf.Timestamp first_seen_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its latest upload (an empty one is its heartbeat, every 30 minutes while Chrome runs).
  google.protobuf.Timestamp last_heartbeat_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Items waiting in its outbox at that upload.
  int32 queued_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The extension's last error code at that upload (e.g. `capture_failed`); empty when none.
  string last_error_code = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // No upload for more than 24 hours. Always false for mobile devices, which upload only while used.
  bool stale = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its clock minus recall's at its latest upload, in seconds, when they differ by more than 2 minutes (its visits'
  // times are as its clock gave them); 0 otherwise.
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: a duration in whole seconds, not a time; the wire profile has no
  //     google.protobuf.Duration. --)
  int32 clock_skew_seconds = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A mobile browser, as reported by its uploads; inactivity alone is not a health failure.
  bool mobile = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True if this installation has stored visits or snapshots, including historical activity.
  // Absence means an older server has not checked; it must not be treated as an empty connection.
  optional bool has_records = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An archive consumer of the change feed (contracts/recall-archive-v1), as its requests describe it.
message ArchiveConsumer {
  // The consumer's name (the feed's `consumer` parameter, e.g. `nas`).
  string consumer = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The `after` of its latest request: every change up to this seq is durable in its archive.
  int32 synced_seq = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its latest request.
  google.protobuf.Timestamp last_pull_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Changes above synced_seq (not archived yet), counted up to 500; 0 for a stale consumer, which is not counted (its
  // oldest_unsynced_time says how far behind it is).
  int32 behind_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When recall committed the oldest change it has not archived; unset when it is caught up.
  google.protobuf.Timestamp oldest_unsynced_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // No request for more than 24 hours.
  bool stale = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
