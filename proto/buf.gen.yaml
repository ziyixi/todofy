# Code generation (README.md). Bazel package actions preserve these options and supply pinned executable/output
# paths. tools/ensure.mjs materializes their outputs for raw workspace consumers; never commit generated code.
version: v2
plugins:
  # TypeScript, protobuf-es v2 (the @bufbuild/protobuf runtime pinned in package.json). Imports end in .ts
  # like the rest of the repository (allowImportingTsExtensions); enums are `as const` objects because
  # the Workers compile with erasableSyntaxOnly. The plugin's JavaScript entry point runs on node, not the
  # node_modules/.bin shim, which Windows cannot start.
  - local: [node, node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: ts
    include_imports: true
    opt:
      - target=ts
      - import_extension=ts
      - erasable_syntax=true
