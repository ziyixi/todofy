// The owner's settings (flowday/docs/design.md §3): the day's capacity and the Tasks sync's state.

syntax = "proto3";

package flowday.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "SettingsProto";
option java_package = "science.ziyixi.flowday.ui.v1";

// The settings, one per owner (AIP-156).
message Settings {
  option (google.api.resource) = {
    type: "flowday.ziyixi.science/Settings"
    pattern: "settings"
    singular: "settings"
    plural: "settings"
  };

  // Always `settings`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Retired: FlowDay reads Tasks only and stores no Todoist key. An update that names this field is refused
  // (BAD_REQUEST); it is never answered.
  string todoist_api_key = 2 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = OPTIONAL
  ];
  // Retired: always false.
  bool todoist_api_key_set = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The minutes of planned work a day holds, 0 to 1,440 (360 until set).
  int32 day_capacity_minutes = 4 [(google.api.field_behavior) = OPTIONAL];
  // When the last sync with Tasks read and applied a page; unset before the first one.
  google.protobuf.Timestamp last_sync_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The read-only task source: always `tasks` (Tasks through its service binding). Replies of releases before
  // Tasks may omit it.
  string task_source = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
