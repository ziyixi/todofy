  // The new values: the fields `update_mask` names, or without one the whole entry: its REQUIRED fields
  // (`task_id`, `flow_date`, `start_time`) must be there, and `start_time` and `end_time` are replaced. The end must
  // not be before the start; `duration_seconds` becomes the time between them (a value given is ignored). The
  // IMMUTABLE fields (`task_id`, `flow_date`, `source`) never change (AIP-203): one the mask names must equal the
  // stored value, and without a mask each one that is set (not empty, not SOURCE_UNSPECIFIED) must; a different
  // value is INVALID_ARGUMENT. Output-only fields are ignored.
