// Input of QueryAnalytics: a range of days, or neither day (every time entry, for the work-pattern statistics).
message QueryAnalyticsRequest {
  // The first day, `YYYY-MM-DD`; given exactly when `end_date` is.
  string start_date = 1 [(google.api.field_behavior) = OPTIONAL];
  // The last day, `YYYY-MM-DD`, not before `start_date`.
  string end_date = 2 [(google.api.field_behavior) = OPTIONAL];
  // At most this many rows (AIP-158): planned tasks, done tasks and time entries together. 0 means 200, a larger
  // value is read as 200, and a negative one is INVALID_ARGUMENT. A page also carries the tasks its rows name (at
  // most one per row), and is written within Workers Free's 10 ms of CPU, even an isolate's first, however long the
  // range (flowday/worker/test/runtime/cpu.test.ts).
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token`, with the same `start_date` and `end_date`.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Output of QueryAnalytics: a page of the range's rows, with what the browser needs to read them. The rows come in
// one order across the pages: the planned tasks, then the done tasks, then the time entries; a page may hold rows of
// several kinds. Concatenating every page's `planned_tasks`, `completed_tasks` and `time_entries` gives every row of
// the range exactly once; `tasks` may repeat a task on several pages.
message QueryAnalyticsResponse {
  // A task on a day's flow: one row of the range's planned or done tasks.
  message FlowTask {
    // The day, `YYYY-MM-DD`.
    string flow_date = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The task (any task ID, the UI's pseudo-tasks included).
    string task_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The page's planned tasks: the range's flows as rows, by day and position in the day; none without a range.
  repeated FlowTask planned_tasks = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The page's done tasks, by day and the order they were marked; none without a range.
  repeated FlowTask completed_tasks = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The page's time entries, by day, start time and ID: the range's, or every entry without a range.
  repeated TimeEntry time_entries = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Every stored task the page's rows name, deleted and hidden ones included (the UI's pseudo-tasks are not tasks).
  repeated Task tasks = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The day's capacity setting (Settings.day_capacity_minutes).
  int32 day_capacity_minutes = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
