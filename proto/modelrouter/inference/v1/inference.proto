// Internal model invocation API. All callers are released from this monorepo.
syntax = "proto3";

package modelrouter.inference.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_outer_classname = "InferenceProto";
option java_package = "science.ziyixi.modelrouter.inference.v1";

// Final-result inference; provider protocols stay inside the Router.
service ModelService {
  option (google.api.default_host) = "models.ziyixi.science";

  // Returns the small configured catalog.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/api/model/v1/models"};
    option (google.api.method_signature) = "";
  }
  // Waits for the completed text or JSON result.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: This inference operation returns its small typed result or cleanup acknowledgement. --)
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: Generate and Embed are the existing inference verbs. --)
  rpc Generate(GenerateRequest) returns (Generation) {
    option (google.api.http) = {
      post: "/api/model/v1/generations:generate"
      body: "*"
    };
    option (google.api.method_signature) = "model,input";
  }
  // Returns vectors in input order.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: This inference operation returns its small typed result or cleanup acknowledgement. --)
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: Generate and Embed are the existing inference verbs. --)
  rpc Embed(EmbedRequest) returns (Embedding) {
    option (google.api.http) = {
      post: "/api/model/v1/embeddings:embed"
      body: "*"
    };
    option (google.api.method_signature) = "model,inputs";
  }
  // Opens the bounded Codex context used by Newsletter.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // (-- api-linter: core::0133::response-message-name=disabled
  //     aip.dev/not-precedent: The caller already knows the context name; creation returns an acknowledgement. --)
  rpc CreateConversation(CreateConversationRequest) returns (google.protobuf.Empty) {
    // (-- api-linter: core::0133::http-body=disabled
    //     aip.dev/not-precedent: The context open operation sends flat settings. --)
    option (google.api.http) = {
      post: "/api/model/v1/conversations"
      body: "*"
    };
    option (google.api.method_signature) = "name,model";
  }
  // Acknowledges only after the execution context has been cleaned up.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: This inference operation returns its small typed result or cleanup acknowledgement. --)
  rpc CloseConversation(CloseConversationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/model/v1/{name=conversations/*}:close"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// One actual provider model, never an application policy or fallback-chain alias.
message Model {
  // Native provider model ID.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Display name.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // openai, anthropic, google or cloudflare.
  string provider = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // text or embedding.
  string kind = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether its shared connection is configured.
  bool configured = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Supported thinking effort values.
  repeated string efforts = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Estimated Workers AI quota units per input token.
  double reservation_quota_units_per_token = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Stable prompt block, with an optional provider cache hint.
message Instruction {
  // Trusted instruction text.
  string text = 1 [(google.api.field_behavior) = REQUIRED];
  // Hint that this block is stable between calls.
  bool cache = 2 [(google.api.field_behavior) = OPTIONAL];
}

// One invocation. A conversation turn supplies conversation instead of model/options.
message GenerateRequest {
  // Native provider model ID; omitted for an existing context.
  string model = 1 [(google.api.field_behavior) = OPTIONAL];
  // Untrusted input text or caller-serialized JSON.
  string input = 2 [(google.api.field_behavior) = REQUIRED];
  // Ordered trusted prompt blocks.
  repeated Instruction instructions = 3 [(google.api.field_behavior) = OPTIONAL];
  // Thinking effort; empty uses the model default.
  string effort = 4 [(google.api.field_behavior) = OPTIONAL];
  // Output cap; zero uses the adapter default.
  int32 max_output_tokens = 5 [(google.api.field_behavior) = OPTIONAL];
  // JSON Schema as JSON text; empty requests ordinary text.
  string output_schema_json = 6 [(google.api.field_behavior) = OPTIONAL];
  // Enables the adapter's existing native provider fallback.
  bool allow_fallback = 7 [(google.api.field_behavior) = OPTIONAL];
  // Existing conversations/{UUID}; used only by Newsletter.
  string conversation = 8 [(google.api.field_behavior) = OPTIONAL];
  // Bounded operation deadline in milliseconds; zero uses 110000, maximum 840000.
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: This numeric field is a bounded relative duration with an explicit unit. --)
  int32 timeout_ms = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Counts include cache reads/writes in input and any thinking in output.
message Usage {
  // False means consumption is unknown.
  bool available = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Total input tokens.
  int32 input_tokens = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Total output tokens.
  int32 output_tokens = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Cache-read subset of input.
  int32 cached_input_tokens = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Cache-write subset of input.
  int32 cache_write_tokens = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // API estimate or subscription API-equivalent value, in millionths of USD.
  optional int32 estimated_cost_microusd = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // api, subscription or platform_quota; subscription estimates are never bills.
  string billing_kind = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Estimated Workers AI quota units, independent of reported tokens.
  optional double estimated_quota_units = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Web actions observed by the executor, not assertions in model text.
message Observations {
  // At least one search completed.
  bool searched = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Exact URL inputs of completed open actions.
  repeated string opened_urls = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Final inference result. Trace metadata is available only in the owner console.
// (-- api-linter: core::0123::resource-annotation=disabled
//     aip.dev/not-precedent: Final inference results are values; only the owner history has a persisted trace. --)
message Generation {
  // Server-generated requests/{UUID} trace.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Actual selected provider model ID, using the reported model when available.
  string model = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Completed text or schema-valid JSON; empty on failure.
  string output = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Consumption including any native provider fallback.
  Usage usage = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Actual web actions, when requested by a context.
  Observations observations = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Safe execution failure; request/auth failures use HTTP google.rpc.Status.
  ModelError error = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Observed text writers when native fallback uses more than one model.
  repeated string contributing_models = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Fixed-lifetime Codex context; its name is saved by Newsletter before creation.
// (-- api-linter: core::0133::request-id-field=disabled
//     aip.dev/not-precedent: Newsletter persists a complete context name before opening it; no second identifier is needed. --)
// (-- api-linter: core::0133::request-parent-required=disabled
//     aip.dev/not-precedent: Temporary inference contexts have no parent resource. --)
// (-- api-linter: core::0133::request-resource-field=disabled
//     aip.dev/not-precedent: This internal open operation takes flat context settings and returns an acknowledgement. --)
message CreateConversationRequest {
  // conversations/{UUID} supplied by the caller.
  // (-- api-linter: core::0133::request-required-fields=disabled
  //     aip.dev/not-precedent: The caller supplies the context name and actual model. --)
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Native provider model ID.
  // (-- api-linter: core::0133::request-required-fields=disabled
  //     aip.dev/not-precedent: The caller supplies the context name and actual model. --)
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  string model = 2 [(google.api.field_behavior) = REQUIRED];
  // Trusted instructions shared by its turns.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  repeated Instruction instructions = 3 [(google.api.field_behavior) = OPTIONAL];
  // Thinking effort; empty uses the default.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  string effort = 4 [(google.api.field_behavior) = OPTIONAL];
  // JSON Schema shared by its turns.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  string output_schema_json = 5 [(google.api.field_behavior) = OPTIONAL];
  // Enable actual web research and observations.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  bool web_research = 6 [(google.api.field_behavior) = OPTIONAL];
  // Total lifetime in milliseconds, at most 840000; zero selects 840000.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: These are the flat settings actually used by Newsletter. --)
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: This numeric field is a bounded relative duration with an explicit unit. --)
  int32 timeout_ms = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Safe repeated close of a context; no separate operation identity is needed.
message CloseConversationRequest {
  // conversations/{UUID} to close.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Complete bounded catalog read.
// (-- api-linter: core::0158::request-page-size-field=disabled
//     aip.dev/not-precedent: The six-entry deployment catalog is returned completely. --)
// (-- api-linter: core::0158::request-page-token-field=disabled
//     aip.dev/not-precedent: The six-entry deployment catalog is returned completely. --)
message ListModelsRequest {}
// Models configured by this deployment.
// (-- api-linter: core::0158::response-next-page-token-field=disabled
//     aip.dev/not-precedent: The six-entry deployment catalog is returned completely. --)
message ListModelsResponse {
  // Native models and their providers.
  repeated Model models = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Text embedding inputs, at most fifty.
message EmbedRequest {
  // Native embedding model ID.
  string model = 1 [(google.api.field_behavior) = REQUIRED];
  // Texts in input order.
  repeated string inputs = 2 [(google.api.field_behavior) = REQUIRED];
}
// One embedding vector.
message Vector {
  // Finite vector components.
  repeated double values = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// Final ordered vectors or a model failure.
// (-- api-linter: core::0123::resource-annotation=disabled
//     aip.dev/not-precedent: Final inference results are values; only the owner history has a persisted trace. --)
message Embedding {
  // Server-generated requests/{UUID} trace.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Native model ID.
  string model = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Vectors in input order.
  repeated Vector vectors = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Consumption, when available.
  Usage usage = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Safe execution failure.
  ModelError error = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Provider-neutral failure used by current application retry and budget logic.
message ModelError {
  // Canonical google.rpc.Code value.
  int32 code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Safe explanation without request content or credentials.
  string message = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Actionable failure reason. Refusals before execution carry the same names
  // in their google.rpc.Status ErrorInfo. Callers branch on the reason, and
  // treat an unlisted one by its code: 3 content, 4 timeout, 7, 9 and 16
  // configuration, anything else infrastructure.
  //
  // Configuration; hold the work without spending per-item attempts:
  // MODEL_AUTH (16 or 7, a Gemini key rejected with 400 included),
  // MODEL_NOT_CONFIGURED (9: provider 404, a Gemini 400 FAILED_PRECONDITION,
  // missing key or route), MODEL_NOT_ALLOWED (7: this caller may not use
  // that model or operation), MODEL_SPEND_LIMIT (8: provider spend cap or
  // credit).
  //
  // Content-dependent; count per-item attempts with a small cap:
  // MODEL_INVALID_REQUEST (3: provider 400, 413 or 422, or an option the
  // model rejects), MODEL_INVALID_ANSWER (13), MODEL_REFUSED (9),
  // MODEL_OUTPUT_LIMIT (13), MODEL_UNSUPPORTED_TOOL (13).
  //
  // MODEL_TIMEOUT (4): the request exceeded its deadline, including the
  // Router's own. MODEL_CANCELLED (1): only a real caller cancellation, such
  // as closing the context during its turn.
  //
  // Infrastructure or capacity; defer the whole pass, honoring
  // retry_after_seconds, without spending attempts: MODEL_QUOTA (8),
  // MODEL_RATE_LIMIT (8), MODEL_UNAVAILABLE (14), MODEL_BUSY (14),
  // MODEL_MAINTENANCE (14), MODEL_STORAGE_UNAVAILABLE (14),
  // MODEL_EXECUTOR_UNAVAILABLE, MODEL_EXECUTOR_INTERRUPTED and
  // MODEL_EXECUTOR_INVALID_RESPONSE (14), MODEL_CLEANUP_PENDING (14, close
  // only) and MODEL_INTERNAL (13, Router-internal).
  //
  // Request validation answers INVALID_ARGUMENT before execution with
  // MODEL_NOT_FOUND, MODEL_CAPABILITY_UNSUPPORTED or a field-specific reason,
  // and the executor answers an unknown method with MODEL_METHOD_UNSUPPORTED
  // (12); the call itself must change.
  string reason = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Provider retry delay in seconds, when supplied.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: These telemetry and Retry-After names match the existing owner interface. --)
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: This numeric field is a bounded relative duration with an explicit unit. --)
  int32 retry_after_seconds = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
