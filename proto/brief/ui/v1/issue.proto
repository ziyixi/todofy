// An issue of the brief and its items (brief/docs/design.md §6-§9, §11): what was emailed (or only archived), what
// each item rests on, which quote stands behind each `[n]` and what the entailment log said of it, and what the issue
// cost. Item text is model-written from fetched sources; every quote passed the grounding check (§8) and is shown as
// the source's own characters, whatever the model typed.

syntax = "proto3";

package brief.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "IssueProto";
option java_package = "science.ziyixi.brief.ui.v1";

// One day's issue: a weekday brief or the Saturday deep read, or that day's two-line note when there was nothing to
// send (`quiet_reason`). At most one per day; kept 2 years.
message Issue {
  option (google.api.resource) = {
    type: "brief.ziyixi.science/Issue"
    pattern: "issues/{issue}"
    singular: "issue"
    plural: "issues"
  };

  // What kind of issue it is.
  enum Kind {
    // Never written.
    KIND_UNSPECIFIED = 0;
    // A weekday brief: 研究前沿 and 世界与经济, 5 to 8 items.
    KIND_WEEKDAY = 1;
    // The Saturday deep read: one item, one topic explained thoroughly.
    KIND_DEEP_READ = 2;
  }

  // Where the issue is (AIP-216).
  enum State {
    // Never written.
    STATE_UNSPECIFIED = 0;
    // Being made: picking, reading, writing, checking or rendering.
    STATE_BUILDING = 1;
    // Rendered and checked (or the quiet day's note), waiting for its send time.
    STATE_READY = 2;
    // Resend accepted the email. Not proof that it reached the inbox.
    STATE_SENT = 3;
    // The send's outcome is unknown (no answer, a timeout, 408, 409, 429, a 5xx, a crash during the request). It is
    // never sent again: check the inbox; the archive has the issue.
    STATE_SEND_UNKNOWN = 4;
    // Resend refused the email (a 4xx other than 408, 409 and 429): it was not sent.
    STATE_SEND_REJECTED = 5;
    // Archived without an email: the deployment's mode is `archive`, sending was paused, the mail secrets are missing,
    // or it was ready only after the day's send cutoff (12:00 America/Los_Angeles).
    STATE_ARCHIVED = 6;
    // A step failed for good (`error_code` says which) and not even the note could be made.
    STATE_FAILED = 7;
  }

  // Why a day sent its note instead of items (brief/docs/design.md §11).
  enum QuietReason {
    // Not a quiet day: the issue has items.
    QUIET_REASON_UNSPECIFIED = 0;
    // 没有新的候选: nothing passed the gate since the previous issue.
    QUIET_REASON_NO_CANDIDATES = 1;
    // 候选未能打分: candidates arrived but none could be scored.
    QUIET_REASON_NOT_SCORED = 2;
    // 入选条目都未通过核对: every written item failed the grounding check.
    QUIET_REASON_NONE_GROUNDED = 3;
    // 没有可读全文的线索: Saturday found no thread with two readable full texts.
    QUIET_REASON_NO_READABLE_THREAD = 4;
    // 预算已用完: the month's budget left no room for the issue's calls.
    QUIET_REASON_BUDGET_SPENT = 5;
    // 调用被拒: the Claude API refused the requests (a key, billing or permission state; ServiceStatus.key_state).
    QUIET_REASON_CALLS_REJECTED = 6;
    // 写作未能完成: the writing ran out of attempts (deadlines, truncated or invalid answers).
    QUIET_REASON_WRITE_FAILED = 7;
  }

  // issues/{issue}, where {issue} is the issue's date in America/Los_Angeles, `2026-10-12`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // What kind of issue it is.
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Where the issue is.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The email's subject, without the shadow tag (`简报 · 10月12日（周一）`).
  string title = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // It was made while the deployment's mode was `shadow`: emailed with the `[影子版]` subject tag.
  bool shadow = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The items that passed the grounding check and were rendered.
  int32 item_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Items the writer wrote that were dropped: after the repair, they still failed the check at more than a third of
  // their text, their primary document's claims or a whole paragraph.
  int32 dropped_item_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The cards the pick compared (research and world).
  int32 candidate_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What the issue cost, in US dollars: the sum of `step_costs`.
  double cost_usd = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The cost of each step, from the API's reported usage at each serving model's prices.
  repeated StepCost step_costs = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The models that wrote the items (`claude-opus-5-5`, or a server-side fallback model after a refusal).
  repeated string writer_models = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why the issue failed, fell back or why its send did not succeed: a short code (`write_attempts`,
  // `pick_fallback`, `resend_429`); empty otherwise.
  string error_code = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the issue was started.
  google.protobuf.Timestamp create_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the send request was made (whatever its outcome).
  google.protobuf.Timestamp send_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why the day sent its note instead of items; unset when it has items.
  QuietReason quiet_reason = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 还有: titles of the owner's own field that the pick did not take, by code (no text was written, nothing checked).
  repeated MoreItem more_items = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The pick failed or was refused, so the items are the gate's order (brief/docs/design.md §5.3).
  bool pick_fallback = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// What one step cost: every model call of the step, summed.
message StepCost {
  // The step: `gate`, `pick`, `write`, `repair`, `entail`, `deep_pick` or `deep_read`.
  string step = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The model that answered (`claude-haiku-5-5`, `claude-opus-5-5`, or a fallback model).
  string model = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Calls made, a refused or interrupted one included.
  int32 call_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Uncached input tokens.
  int32 input_token_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Input tokens written to the prompt cache.
  int32 cache_write_token_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Input tokens read from the prompt cache.
  int32 cache_read_token_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output tokens, thinking included.
  int32 output_token_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // US dollars at the serving models' prices; an interrupted call counts its reserved maximum.
  double cost_usd = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One item of an issue: a research result, a world story, or the deep read.
message Item {
  option (google.api.resource) = {
    type: "brief.ziyixi.science/Item"
    pattern: "issues/{issue}/items/{item}"
    singular: "item"
    plural: "items"
  };

  // How the owner rated the item (brief/docs/design.md §10).
  enum Vote {
    // No vote yet; refused on input.
    VOTE_UNSPECIFIED = 0;
    // 👍: good pick.
    VOTE_UP = 1;
    // 👎: not for me.
    VOTE_DOWN = 2;
    // 多来点: more like this.
    VOTE_MORE = 3;
  }

  // How densely the item is written (brief/docs/design.md §6, from its topic's 写法 in content-config/profile.md).
  enum Format {
    // Never written.
    FORMAT_UNSPECIFIED = 0;
    // 专业: the owner's own field; its terms, no definitions; only what was done, found and how it differs.
    FORMAT_PROFESSIONAL = 1;
    // 熟悉: a neighbouring field; only sub-field terms explained.
    FORMAT_FAMILIAR = 2;
    // 通俗: every term defined on first use.
    FORMAT_PLAIN = 3;
    // 世界·短: a world story of which only summaries or a lead were read: the fact and why it matters.
    FORMAT_WORLD_SHORT = 4;
  }

  // issues/{issue}/items/{item}, where {item} is `r1`, `r2`, ... (研究前沿), `w1`, ... (世界与经济) or `deep`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The section it ran in.
  Section section = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Chinese title.
  string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The text, in order. A `[n]` in a paragraph is the citation numbered n.
  repeated Paragraph paragraphs = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // One sentence on why it matters to this reader; empty for the deep read.
  string why = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The profile's topic the gate gave it (`geo.seismology`, `llm.systems`, ...; content-config/profile.md).
  string topic = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its gate order at the cutoff (brief/docs/design.md §5.2): the score, the learned weights and its corroboration.
  double score = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The documents it rests on, in the order the source line shows them.
  repeated Reference references = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The checked quotes behind the paragraphs' `[n]` markers.
  repeated Citation citations = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The owner's vote; unset before one.
  Vote vote = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the owner last voted.
  google.protobuf.Timestamp vote_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The pick's reason for taking it (at most 60 characters); empty when the issue fell back to the gate order.
  string reason = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How densely it is written.
  Format format = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A paragraph of an item.
message Paragraph {
  // A short heading shown before the paragraph (the deep read has two or three); usually empty.
  string heading = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The text, with `[n]` citation markers.
  string text = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A fetched document an item rests on.
message Reference {
  // The registry source it came from (content-config/sources.yaml).
  string source = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "brief.ziyixi.science/Source"
  ];
  // The venue as the source line shows it (`Nature Geoscience`, `arXiv`).
  string venue = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The document's own title, as published.
  string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The document's link (an arXiv abstract page, a DOI link, an article).
  string uri = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its review status, from the registry.
  Review review = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How much of it the writer read.
  TextScope text_scope = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When it was published, as its feed says.
  google.protobuf.Timestamp publish_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A quote the grounding check found in a fetched document.
message Citation {
  // What the entailment log said of the sentences that cite the quote (brief/docs/design.md §8). It only logs.
  enum Verdict {
    // Not checked: the log was skipped, refused or failed.
    VERDICT_UNSPECIFIED = 0;
    // The sentences say what the quote says.
    VERDICT_SUPPORTED = 1;
    // The sentences say more than the quote does.
    VERDICT_OVERSTATED = 2;
    // The quote does not support the sentences.
    VERDICT_UNSUPPORTED = 3;
  }

  // The marker's number: `[n]` in the paragraphs.
  int32 number = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The quoted document: an index into the item's `references`, from 0.
  int32 reference_index = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The quote as it appears in the document: the source's own characters (20 to 300 of them; 8 or more for Chinese).
  string quote = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The entailment log's verdict.
  Verdict verdict = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A title of 还有: an item of the owner's own field that ran without text, by code.
message MoreItem {
  // The registry source it came from.
  string source = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "brief.ziyixi.science/Source"
  ];
  // The original title, as published.
  string title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The venue (`Seismica`).
  string venue = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its review status.
  Review review = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its link.
  string uri = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The section an item ran in, or a source feeds.
enum Section {
  // Never written.
  SECTION_UNSPECIFIED = 0;
  // 研究前沿.
  SECTION_RESEARCH = 1;
  // 世界与经济.
  SECTION_WORLD = 2;
  // The Saturday deep read (items only).
  SECTION_DEEP_READ = 3;
}

// What a document's venue says about review, from the registry's `review` (and `doi_review`).
enum Review {
  // Never written.
  REVIEW_UNSPECIFIED = 0;
  // A peer-reviewed journal (同行评议).
  REVIEW_PEER_REVIEWED = 1;
  // A preprint, not peer reviewed (预印本).
  REVIEW_PREPRINT = 2;
  // A lab's or company's own blog or technical report (机构发布).
  REVIEW_INSTITUTION = 3;
  // Analysis or a newsletter by a person (评论).
  REVIEW_COMMENTARY = 4;
  // A news report (新闻报道).
  REVIEW_NEWS = 5;
  // A government or central bank's own release (官方发布).
  REVIEW_GOVERNMENT = 6;
  // A data product (数据), such as an earthquake catalogue.
  REVIEW_DATA = 7;
}

// How much of a document the writer read.
enum TextScope {
  // Never written.
  TEXT_SCOPE_UNSPECIFIED = 0;
  // The full text (the page, an arXiv HTML version, or a feed that carries it).
  TEXT_SCOPE_FULL_TEXT = 1;
  // The abstract only (仅摘要): the page has none to read, or could not be read.
  TEXT_SCOPE_ABSTRACT = 2;
  // The feed's summary or lead only (仅摘要): the page could not be read (a paywall, a login, an error).
  TEXT_SCOPE_FEED_SUMMARY = 3;
}
