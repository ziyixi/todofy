// The brief's owner API: the HTTP/JSON interface between its archive UI (brief/web) and the Worker "brief"
// (brief/worker), whose Durable Object BriefState holds every issue, item, vote, source state and cost
// (brief/docs/design.md). Designed 2026-10-10; served by the Worker since its first build (not deployed yet).
//
// Callers. Only the brief's archive UI calls it (same origin, brief.ziyixi.science). The dashboard gets counts
// through ops-v1, never this API. The email's feedback links are not part of it: they go to the machine route
// `/feedback` (a signed token, behind an exact-path Access Bypass; design §10).
//
// Transport. google.api.http bindings under /api/v1, served by the shared transcoder
// (proto/ts/http-transcoder.ts) and called through the shared client (proto/ts/http-client.ts). Bodies, query
// parameters and responses are JSON in the wire JSON profile (proto/README.md): proto field names (snake_case),
// enum values in lower case without their prefix (`Item.Vote.VOTE_MORE` is "more"), timestamps in RFC 3339 UTC.
// Inputs are read strictly, outputs leniently. Request bodies are at most 4 KiB. Errors: errors.proto (this app's
// reasons) and common/errors/v1/errors.proto (the reasons every API shares).
//
// Authentication, in front of the transcoder (packages/edge-auth): the whole host is behind Cloudflare Access,
// and every route needs the owner's Access JWT; every method other than GET also needs the same-origin Origin
// header and the signed double-submit CSRF token (header X-CSRF-Token, cookie brief_csrf), issued by
// GET /api/csrf, which is transport, not part of this service. A mutation takes a `request_id` (AIP-155, a UUID4
// the browser makes once per user action): repeating it within 24 hours answers the first response and changes
// nothing; reused for another rpc or resource it is INVALID_ARGUMENT (BAD_REQUEST).
//
// Nothing here calls a model, fetches a source or sends an email: every method reads or writes the object's own
// SQLite. The transcoder runs inside BriefState (30 s of CPU per invocation), after the Worker checked the caller.
//
// buf lint. The methods that answer a resource carry two `buf:lint:ignore` lines: RPC_RESPONSE_STANDARD_NAME and
// RPC_REQUEST_RESPONSE_UNIQUE, which the AIPs contradict (a standard or state method answers the resource itself,
// so one message answers several methods; api-linter checks those names instead). They are excused here, next to
// each method, not in buf.yaml: buf.yaml is a path every proto user's deploy depends on
// (.github/scripts/ci_changes.py), and this package must not redeploy the other apps.

syntax = "proto3";

package brief.ui.v1;

import "brief/ui/v1/issue.proto";
import "brief/ui/v1/source.proto";
import "brief/ui/v1/status.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_outer_classname = "BriefUiServiceProto";
option java_package = "science.ziyixi.brief.ui.v1";

// The owner's brief: past issues and their items, votes on items, the sources' health, the learned profile, the
// settings and the status.
service BriefUiService {
  option (google.api.default_host) = "brief.ziyixi.science";

  // An issue (AIP-131).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetIssue(GetIssueRequest) returns (Issue) {
    option (google.api.http) = {get: "/api/v1/{name=issues/*}"};
    option (google.api.method_signature) = "name";
  }

  // The issues, newest first (AIP-132, AIP-158).
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse) {
    option (google.api.http) = {get: "/api/v1/issues"};
    option (google.api.method_signature) = "";
  }

  // An item (AIP-131).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetItem(GetItemRequest) returns (Item) {
    option (google.api.http) = {get: "/api/v1/{name=issues/*/items/*}"};
    option (google.api.method_signature) = "name";
  }

  // An issue's items, in the order they ran (AIP-132, AIP-158).
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=issues/*}/items"};
    option (google.api.method_signature) = "parent";
  }

  // Records the owner's vote on an item, replacing an earlier one (AIP-136). The same as the email's feedback
  // links. Votes count from the next weekly update of the learned weights, and the Saturday pick sees the week's
  // votes on its cards.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc VoteItem(VoteItemRequest) returns (Item) {
    option (google.api.http) = {
      post: "/api/v1/{name=issues/*/items/*}:vote"
      body: "*"
    };
    option (google.api.method_signature) = "name,vote";
  }

  // A source (AIP-131).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetSource(GetSourceRequest) returns (Source) {
    option (google.api.http) = {get: "/api/v1/{name=sources/*}"};
    option (google.api.method_signature) = "name";
  }

  // The sources, in the registry's order (AIP-132, AIP-158).
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse) {
    option (google.api.http) = {get: "/api/v1/sources"};
    option (google.api.method_signature) = "";
  }

  // The learned topic weights.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetProfile(GetProfileRequest) returns (Profile) {
    option (google.api.http) = {get: "/api/v1/{name=profile}"};
    option (google.api.method_signature) = "name";
  }

  // Forgets what feedback taught: every topic's and every source's weight goes back to 1, and votes before now no
  // longer count. The votes stay on their items.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ResetProfile(ResetProfileRequest) returns (Profile) {
    option (google.api.http) = {
      post: "/api/v1/{name=profile}:reset"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // The settings.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetSettings(GetSettingsRequest) returns (Settings) {
    option (google.api.http) = {get: "/api/v1/{name=settings}"};
    option (google.api.method_signature) = "name";
  }

  // Replaces the fields `update_mask` names (AIP-134).
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings) {
    option (google.api.http) = {
      patch: "/api/v1/{settings.name=settings}"
      body: "settings"
    };
    option (google.api.method_signature) = "settings,update_mask";
  }

  // The service status.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetServiceStatus(GetServiceStatusRequest) returns (ServiceStatus) {
    option (google.api.http) = {get: "/api/v1/{name=serviceStatus}"};
    option (google.api.method_signature) = "name";
  }

  // 设置 → 恢复调用: lets model calls start again after the Claude API refused a request with a state that repeats
  // (ServiceStatus.KeyState.KEY_STATE_REJECTED), once the owner fixed what it named (credits, a key's workspace, a
  // model's access). Answers the status; a no-op when the calls were not stopped. The next alarm comes at once.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ResumeModelCalls(ResumeModelCallsRequest) returns (ServiceStatus) {
    option (google.api.http) = {
      post: "/api/v1/{name=serviceStatus}:resumeModelCalls"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// Input of GetIssue.
message GetIssueRequest {
  // issues/{issue}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Issue"
  ];
}

// Input of ListIssues.
message ListIssuesRequest {
  // At most this many issues (AIP-158): 0 means 30, and a larger value is read as 60.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token`.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Output of ListIssues.
message ListIssuesResponse {
  // The page.
  repeated Issue issues = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of GetItem.
message GetItemRequest {
  // issues/{issue}/items/{item}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Item"
  ];
}

// Input of ListItems.
message ListItemsRequest {
  // issues/{issue}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "brief.ziyixi.science/Item"
  ];
  // At most this many items (AIP-158): 0 and anything larger mean 20 (an issue has at most 11).
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token`.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Output of ListItems.
message ListItemsResponse {
  // The page.
  repeated Item items = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of VoteItem.
message VoteItemRequest {
  // issues/{issue}/items/{item}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Item"
  ];
  // The vote; unspecified is INVALID_ARGUMENT.
  Item.Vote vote = 2 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155); see BriefUiService.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of GetSource.
message GetSourceRequest {
  // sources/{source}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Source"
  ];
}

// Input of ListSources.
message ListSourcesRequest {
  // At most this many sources (AIP-158): 0 means 100, and a larger value is read as 100.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token`.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Output of ListSources.
message ListSourcesResponse {
  // The page.
  repeated Source sources = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of GetProfile.
message GetProfileRequest {
  // Always `profile`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Profile"
  ];
}

// Input of ResetProfile.
message ResetProfileRequest {
  // Always `profile`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Profile"
  ];
  // The idempotency key (AIP-155); see BriefUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of GetSettings.
message GetSettingsRequest {
  // Always `settings`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/Settings"
  ];
}

// Input of UpdateSettings.
message UpdateSettingsRequest {
  // The new values of the fields `update_mask` names. Its `etag`, when set, must be the current one (AIP-154).
  Settings settings = 1 [(google.api.field_behavior) = REQUIRED];
  // AIP-134: the Settings fields to replace (a query parameter). Required by the Worker: absent, empty or `*` is
  // INVALID_ARGUMENT, so a client that leaves a field out never unpauses the brief or changes its budget by
  // accident.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // The idempotency key (AIP-155), a query parameter; see BriefUiService.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of GetServiceStatus.
message GetServiceStatusRequest {
  // Always `serviceStatus`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/ServiceStatus"
  ];
}

// Input of ResumeModelCalls.
message ResumeModelCallsRequest {
  // Always `serviceStatus`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "brief.ziyixi.science/ServiceStatus"
  ];
  // The idempotency key (AIP-155); see BriefUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
