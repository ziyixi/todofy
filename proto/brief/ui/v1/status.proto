// The singletons of the brief's owner API: the learned profile, the settings and the service status
// (brief/docs/design.md §10, §12, §13, §15). Codes, counts, weights and costs only.

syntax = "proto3";

package brief.ui.v1;

import "brief/ui/v1/issue.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "StatusProto";
option java_package = "science.ziyixi.brief.ui.v1";

// What feedback taught: one weight per topic of content-config/profile.md (the per-source weights are on each
// Source). Updated once a week from the votes of the last 8 weeks; never rewrites the profile's text. A singleton.
message Profile {
  option (google.api.resource) = {
    type: "brief.ziyixi.science/Profile"
    pattern: "profile"
    singular: "profile"
    plural: "profiles"
  };

  // Always `profile`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Every topic of the profile, in the profile's order.
  repeated TopicWeight topics = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last weekly update.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last ResetProfile: votes before it no longer count.
  google.protobuf.Timestamp reset_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One topic's learned weight.
message TopicWeight {
  // The topic's ID in content-config/profile.md (`geo.seismology`).
  string topic = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The weight its items' scores are multiplied by, 0.6 to 1.4 (1 before any feedback).
  double weight = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its items that ran in the last 8 weeks.
  int32 shown_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, the 👍 votes.
  int32 up_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, the 👎 votes.
  int32 down_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, the 多来点 votes.
  int32 more_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How densely its items are written (the profile's 写法).
  Item.Format format = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The owner's settings. A singleton.
message Settings {
  option (google.api.resource) = {
    type: "brief.ziyixi.science/Settings"
    pattern: "settings"
    singular: "settings"
    plural: "settings"
  };

  // Always `settings`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Pauses every model call and every send; fetching and the archive go on. An issue due while paused is not made.
  bool paused = 2 [(google.api.field_behavior) = OPTIONAL];
  // The most the brief may spend on the Claude API in a calendar month (America/Los_Angeles), in US dollars,
  // 5 to 100 (default 40). Metered from the API's reported usage, each call reserved at its maximum before it starts;
  // past it, no model call starts until the next month or a higher budget. The Console workspace's spend limit is the
  // outer wall.
  double monthly_budget_usd = 3 [(google.api.field_behavior) = OPTIONAL];
  // AIP-154: changes with every change.
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The pipeline's state: codes, counts, costs and times only. A singleton.
message ServiceStatus {
  option (google.api.resource) = {
    type: "brief.ziyixi.science/ServiceStatus"
    pattern: "serviceStatus"
    singular: "serviceStatus"
    plural: "serviceStatuses"
  };

  // The Claude API key, as the Worker last saw it.
  enum KeyState {
    // Never written.
    KEY_STATE_UNSPECIFIED = 0;
    // No key is set (the owner's setup step).
    KEY_STATE_NOT_CONFIGURED = 1;
    // No refusal since the key was set, the last build deployed or the owner resumed the calls.
    KEY_STATE_OK = 2;
    // The API refused a request before its stream with a state that repeats (400, 401, 402, 403, 404 or 413:
    // `rejected_status`, `rejected_error_type`): no model call starts until the key changes, a new build deploys or
    // the owner calls ResumeModelCalls.
    KEY_STATE_REJECTED = 3;
  }

  // Always `serviceStatus`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The deployment's mode (the GitHub variable BRIEF_MODE).
  Mode mode = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Settings.paused.
  bool paused = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Claude API key.
  KeyState key_state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Resend key and both mail addresses are set.
  bool mail_configured = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next alarm; unset when none is armed (the next API call arms one).
  google.protobuf.Timestamp next_alarm_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The issue being made; empty between issues.
  string current_issue = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "brief.ziyixi.science/Issue"
  ];
  // Its step (`pick`, `read`, `write`, `check`, `repair`, `render`, `entail`, `send`; `thread` and `deep_read` on
  // Saturday).
  string current_step = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Spent on the Claude API today (America/Los_Angeles), in US dollars.
  double today_cost_usd = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Spent this calendar month, in US dollars, the reservations of interrupted calls included.
  double month_cost_usd = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Settings.monthly_budget_usd.
  double monthly_budget_usd = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sources whose last poll worked and that are not stale.
  int32 ok_source_count = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sources failing or paused.
  int32 failing_source_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // New items fetched today, after deduplication.
  int32 today_item_count = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Workers AI neurons used today (embeddings), estimated from the input's length.
  double today_neurons = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last few error codes (newest first, at most 8).
  repeated string recent_error_codes = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The deployed commit.
  string build = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The HTTP status of the refusal that stopped the calls (KEY_STATE_REJECTED); 0 otherwise.
  int32 rejected_status = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its error type (`billing_error`, `authentication_error`); never the message's text.
  string rejected_error_type = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sources silent for 3 times their usual gap (Source.State.STATE_STALE).
  int32 stale_source_count = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Candidates the gate screened today.
  int32 today_candidate_count = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Reserved for calls in flight this month, in US dollars (each reserved at its maximum until it answers).
  double reserved_usd = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// What the deployment lets the brief do (the GitHub variable BRIEF_MODE; the deploy wrapper refuses anything else).
enum Mode {
  // Never written.
  MODE_UNSPECIFIED = 0;
  // Sources are fetched; no model call, no issue, no email.
  MODE_OFF = 1;
  // Issues are made and archived; no email.
  MODE_ARCHIVE = 2;
  // Issues are emailed with the `[影子版]` subject tag (the shadow week).
  MODE_SHADOW = 3;
  // Issues are emailed.
  MODE_LIVE = 4;
}
