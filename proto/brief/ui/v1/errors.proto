// The errors of BriefUiService (AIP-193).
//
// Every error is a google.rpc.Status in Google's HTTP JSON form, written by the shared transcoder
// (proto/ts/http-transcoder.ts), with an ErrorInfo whose domain is "brief.ziyixi.science", a zh-CN
// LocalizedMessage, a RequestInfo and, for ETAG_MISMATCH, the current resource as a typed detail.
//
// The UI branches on ErrorInfo.reason only: a value name without its prefix, of ErrorReason below (the brief's
// own reasons) or of common.errors.v1.CommonReason (the reasons every API shares). A reason the UI does not
// know is shown with the LocalizedMessage, never read as success.

syntax = "proto3";

package brief.ui.v1;

option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "science.ziyixi.brief.ui.v1";

// The brief's own reasons: ErrorInfo.reason is the value's name without `ERROR_REASON_`. The HTTP status follows
// the google.rpc.Code listed for each value (the AIP-193 mapping).
enum ErrorReason {
  // Never sent.
  ERROR_REASON_UNSPECIFIED = 0;
  // ABORTED (409): the request's etag is stale (AIP-154). The error carries the current resource.
  ERROR_REASON_ETAG_MISMATCH = 1;
  // INVALID_ARGUMENT (400): a setting is outside its range.
  ERROR_REASON_INVALID_SETTINGS = 2;
}
