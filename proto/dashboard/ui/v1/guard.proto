// The quota guard (dashboard/docs/design.md §7.4): what the dashboard wants every guarded app to do, the owner's
// override, and each app's effective guard as last seen through ops-v1. Output messages only; the wire rules of
// attention.proto apply.
//
// (-- api-linter: core::0142::time-field-type=disabled
//     aip.dev/not-precedent: timestamps are strings, as in the ops-v1 GuardState this view embeds. --)
// (-- api-linter: core::0142::time-field-names=disabled
//     aip.dev/not-precedent: the view JSON's names (set_at, as ops-v1's GuardState). --)
// (-- api-linter: core::0140::prepositions=disabled
//     aip.dev/not-precedent: the view JSON's names (last_call_at). --)
// (-- api-linter: core::0215::foreign-type-reference=disabled
//     aip.dev/not-precedent: the view embeds ops-v1's answers (GuardState, OpsStatus, OpsReportItem) as the
//     dashboard read them from the apps; proto/ops/v1 is their one description. --)
// (-- api-linter: core::0216::state-field-output-only=disabled
//     aip.dev/not-precedent: output messages, where REQUIRED means "always written"; OUTPUT_ONLY would let the
//     wire profile omit a null. --)

syntax = "proto3";

package dashboard.ui.v1;

import "common/wire/v1/wire.proto";
import "google/api/field_behavior.proto";
import "ops/v1/ops.proto";

option java_multiple_files = true;
option java_outer_classname = "GuardProto";
option java_package = "science.ziyixi.dashboard.ui.v1";
option (common.wire.v1.formats) = {
  name: "Timestamp"
  pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,3})?Z"
  description: "RFC 3339 UTC with Z, optional milliseconds."
};

// The guard as the dashboard runs it.
message GuardView {
  // What the dashboard wants every guarded app to have now.
  GuardDesired desired = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // The owner's override, while one holds.
  GuardOverride override = 2 [(google.api.field_behavior) = REQUIRED];
  // The rule's thresholds, in percent of a Free allowance.
  GuardThresholds thresholds = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Each guarded app by its registry entry (the entries whose status is ops-v1 with a guard), in registry order.
  map<string, GuardAppView> apps = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).keep_order = true
  ];
}

// The guard the dashboard wants.
message GuardDesired {
  // normal or shed.
  ops.v1.GuardLevel level = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Why (quota_normal, quota_high, owner_shed, ...).
  optional string reason = 2 [(google.api.field_behavior) = REQUIRED];
  // When a shed ends.
  optional string until = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // Who decided it.
  GuardSource source = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
}

// The owner's override (OverrideGuard).
message GuardOverride {
  // shed: a forced shed; normal: the automatic shed is suppressed.
  ops.v1.GuardLevel level = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // When it ends.
  string until = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // When the owner set it.
  string set_at = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
}

// The guard rule's thresholds (actual usage).
message GuardThresholds {
  // A quota at or above this percent sheds.
  int32 shed_percent = 1 [(google.api.field_behavior) = REQUIRED];
  // Every quota below this percent clears the shed.
  int32 clear_percent = 2 [(google.api.field_behavior) = REQUIRED];
}

// One guarded app.
message GuardAppView {
  // This app's independently resolved desired state; absent from legacy views.
  GuardDesired desired = 4;
  // This app's owner override; absent when automatic or expired.
  GuardOverride override = 5;
  // The app's effective guard as last seen (its setGuard answer, or its status's guard if newer).
  ops.v1.GuardState state = 1 [(google.api.field_behavior) = REQUIRED];
  // The last setGuard call.
  optional string last_call_at = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // The error of the last failed setGuard call; null after a success. An ops-v1 rejection (invalid_input,
  // busy, unavailable) or what the dashboard observed (timeout, invalid_output, not_configured).
  optional string last_error = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "invalid_input",
        "busy",
        "unavailable",
        "timeout",
        "invalid_output",
        "not_configured"
      ]
    }
  ];
}

// Who decided the desired guard.
enum GuardSource {
  // Never sent.
  GUARD_SOURCE_UNSPECIFIED = 0;
  // The quota rule.
  GUARD_SOURCE_AUTO = 1;
  // The owner's override.
  GUARD_SOURCE_OWNER = 2;
  // Nothing yet (before the first tick).
  GUARD_SOURCE_NONE = 3;
}
