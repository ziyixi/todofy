// The daily end-to-end canary (dashboard/docs/design.md §5.3): a synthetic mail.received.v1 event Mail Hero
// delivers to Todofy, followed by the dashboard's ticks. Output messages only; the wire rules of attention.proto
// apply. The canary is a resource (`canaries/{canary}`, today only `canaries/mail-todofy`), declared in
// dashboard_ui_service.proto, where RunCanary starts a manual run.
//
// (-- api-linter: core::0142::time-field-type=disabled
//     aip.dev/not-precedent: timestamps are strings, as in the ops-v1 answers these views embed. --)
// (-- api-linter: core::0142::time-field-names=disabled
//     aip.dev/not-precedent: the view JSON's names (created_at, deadline_at). --)
// (-- api-linter: core::0140::prepositions=disabled
//     aip.dev/not-precedent: the view JSON's names (last_ok_at). --)
// (-- api-linter: core::0216::state-field-output-only=disabled
//     aip.dev/not-precedent: output messages, where REQUIRED means "always written"; OUTPUT_ONLY would let the
//     wire profile omit a null. --)

syntax = "proto3";

package dashboard.ui.v1;

import "common/wire/v1/wire.proto";
import "google/api/field_behavior.proto";
import "ops/v1/ops.proto";

option java_multiple_files = true;
option java_outer_classname = "CanaryProto";
option java_package = "science.ziyixi.dashboard.ui.v1";
option (common.wire.v1.formats) = {
  name: "Timestamp"
  pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,3})?Z"
  description: "RFC 3339 UTC with Z, optional milliseconds."
};
option (common.wire.v1.formats) = {
  name: "Day"
  pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}"
  description: "A UTC calendar day, YYYY-MM-DD."
};

// The canary as the ops view shows it.
message CanaryView {
  // CANARY_ENABLED (the GitHub variable DASHBOARD_CANARY_ENABLED). False: no run starts; a run in progress is
  // still followed to its end.
  bool enabled = 1 [(google.api.field_behavior) = REQUIRED];
  // The UTC hour of the scheduled run.
  int32 hour_utc = 2 [(google.api.field_behavior) = REQUIRED];
  // The next scheduled start; null while the canary is disabled.
  optional string next_scheduled_at = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // The most recent run of the current UTC day (scheduled or manual).
  CanaryRun today = 4 [(google.api.field_behavior) = REQUIRED];
  // The run in progress (at most one at a time).
  CanaryRun active = 5 [(google.api.field_behavior) = REQUIRED];
  // At most 14 runs, newest first.
  repeated CanaryRun recent = 6 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).max_items = 14
  ];
  // Manual runs started today (UTC).
  int32 manual_today = 7 [(google.api.field_behavior) = REQUIRED];
  // Manual runs allowed a day.
  int32 manual_limit = 8 [(google.api.field_behavior) = REQUIRED];
  // The canary's ID (`mail-todofy`; its resource name is `canaries/mail-todofy`).
  string id = 9 [(google.api.field_behavior) = REQUIRED];
}

// The canary bound to a flow, as the flows view shows it: CanaryView and the last run that verified the flow.
message FlowCanaryView {
  // As CanaryView.enabled.
  bool enabled = 1 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.hour_utc.
  int32 hour_utc = 2 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.next_scheduled_at.
  optional string next_scheduled_at = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // As CanaryView.today.
  CanaryRun today = 4 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.active.
  CanaryRun active = 5 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.recent.
  repeated CanaryRun recent = 6 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).max_items = 14
  ];
  // As CanaryView.manual_today.
  int32 manual_today = 7 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.manual_limit.
  int32 manual_limit = 8 [(google.api.field_behavior) = REQUIRED];
  // As CanaryView.id.
  string id = 9 [(google.api.field_behavior) = REQUIRED];
  // When the last finished ok run ended.
  optional string last_ok_at = 10 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
}

// One canary run.
message CanaryRun {
  // `canary-YYYY-MM-DD` (scheduled) or `canary-manual-YYYYMMDDTHHMMSSZ`.
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
  // How it started.
  CanaryKind kind = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // The UTC day the run belongs to.
  string day = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Day"
  ];
  // Where it is.
  CanaryPhase phase = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // How it ended; null while the phase is not `done`.
  CanaryOutcome outcome = 5 [(google.api.field_behavior) = REQUIRED];
  // Where a failed or skipped run stopped.
  CanaryStage stage = 6 [(google.api.field_behavior) = REQUIRED];
  // The failure or skip code: an app's (http_503, llm_quota, send_paused) or the dashboard's (timeout, not_seen).
  optional string code = 7 [(google.api.field_behavior) = REQUIRED];
  // The canary event's mail.received.v1 event_id, once Mail Hero queued it.
  optional string event_id = 8 [(google.api.field_behavior) = REQUIRED];
  // When the run was created.
  string created_at = 9 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // When Mail Hero queued the event.
  optional string queued_at = 10 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // When Todofy took the event over.
  optional string delivered_at = 11 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // When Todofy finished it.
  optional string completed_at = 12 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // When the run ended.
  optional string finished_at = 13 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // The start phase's deadline (created_at + 2 h), then queued_at + 2 h.
  string deadline_at = 14 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Timestamp"
  ];
  // Mail Hero's delivery of the event.
  CanaryRunDelivery delivery = 15 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Todofy's handling of the event.
  CanaryRunConsumer consumer = 16 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Ticks (and the manual start) that called an app for this run.
  int32 polls = 17 [(google.api.field_behavior) = REQUIRED];
  // While starting: why Mail Hero has not queued it yet (send_paused, no_endpoint, a call error,
  // status_unavailable); null once queued.
  optional string start_code = 18 [(google.api.field_behavior) = REQUIRED];
  // The error of the last delivery or result call that failed (the next tick retries); null after an answer.
  optional string last_call_error = 19 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "invalid_input",
        "busy",
        "unavailable",
        "timeout",
        "invalid_output",
        "not_configured"
      ]
    }
  ];
}

// A run's delivery at Mail Hero (ops-v1 CanaryDelivery, as last read).
message CanaryRunDelivery {
  // The delivery's state; null before the first answer.
  ops.v1.CanaryDelivery.State state = 1 [(google.api.field_behavior) = REQUIRED];
  // HTTP attempts so far.
  int32 attempts = 2 [(google.api.field_behavior) = REQUIRED];
  // The latest attempt's HTTP status.
  optional int32 last_http_status = 3 [(google.api.field_behavior) = REQUIRED];
  // Mail Hero's last delivery error.
  optional string error_code = 4 [(google.api.field_behavior) = REQUIRED];
}

// A run's handling at Todofy (ops-v1 CanaryResult, as last read).
message CanaryRunConsumer {
  // The consumer's state; null before the first answer.
  ops.v1.CanaryResult.State state = 1 [(google.api.field_behavior) = REQUIRED];
  // What holds a processing canary.
  optional string waiting_code = 2 [(google.api.field_behavior) = REQUIRED];
  // Why it failed.
  optional string error_code = 3 [(google.api.field_behavior) = REQUIRED];
}

// How a run started.
enum CanaryKind {
  // Never sent.
  CANARY_KIND_UNSPECIFIED = 0;
  // The daily run.
  CANARY_KIND_SCHEDULED = 1;
  // The owner's run (RunCanary).
  CANARY_KIND_MANUAL = 2;
}

// Where a run is.
enum CanaryPhase {
  // Never sent.
  CANARY_PHASE_UNSPECIFIED = 0;
  // Waiting for Mail Hero to queue the event.
  CANARY_PHASE_STARTING = 1;
  // Waiting for the delivery.
  CANARY_PHASE_DELIVERING = 2;
  // Waiting for Todofy's result.
  CANARY_PHASE_CONSUMING = 3;
  // Finished.
  CANARY_PHASE_DONE = 4;
}

// How a run ended.
enum CanaryOutcome {
  // Never sent (null while running).
  CANARY_OUTCOME_UNSPECIFIED = 0;
  // Delivered and consumed.
  CANARY_OUTCOME_OK = 1;
  // A stage failed (`code` says how).
  CANARY_OUTCOME_FAILED = 2;
  // Held by a switch (send_paused, processing_paused): proves nothing either way.
  CANARY_OUTCOME_SKIPPED = 3;
}

// Where a run stopped.
enum CanaryStage {
  // Never sent (null for an ok run).
  CANARY_STAGE_UNSPECIFIED = 0;
  // Mail Hero did not queue the event.
  CANARY_STAGE_START = 1;
  // Mail Hero's delivery.
  CANARY_STAGE_DELIVERY = 2;
  // Todofy's handling.
  CANARY_STAGE_CONSUMER = 3;
}
