// The errors of WatchUiService (AIP-193).
//
// Every error is a google.rpc.Status in Google's HTTP JSON form, written by the shared transcoder
// (proto/ts/http-transcoder.ts):
//
//   {"error": {"code": <HTTP status>, "message": <English, for developers>, "status": <google.rpc.Code name>,
//              "details": [
//                {"@type": "type.googleapis.com/google.rpc.ErrorInfo", "reason": "ETAG_MISMATCH",
//                 "domain": "watch.ziyixi.science"},
//                {"@type": "type.googleapis.com/google.rpc.LocalizedMessage", "locale": "zh-CN", "message": ...},
//                {"@type": "type.googleapis.com/google.rpc.RequestInfo", "request_id": <16 hex>},
//                {"@type": "type.googleapis.com/watch.ui.v1.Watch", ...}]}}
//
// The UI branches on ErrorInfo.reason only: a value name without its prefix, of ErrorReason below (the watch
// app's own reasons) or of common.errors.v1.CommonReason (the reasons every API shares). A reason the UI does
// not know is shown with the LocalizedMessage, never read as success.

syntax = "proto3";

package watch.ui.v1;

option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "science.ziyixi.watch.ui.v1";

// The watch app's own reasons: ErrorInfo.reason is the value's name without `ERROR_REASON_`. The HTTP status
// follows the google.rpc.Code listed for each value (the AIP-193 mapping).
enum ErrorReason {
  // Never sent.
  ERROR_REASON_UNSPECIFIED = 0;
  // ALREADY_EXISTS (409): CreateWatch with a `watch_id` that a watch holds.
  ERROR_REASON_WATCH_EXISTS = 1;
  // ABORTED (409): the request's etag is stale (AIP-154). The error carries the current watch.ui.v1.Watch.
  ERROR_REASON_ETAG_MISMATCH = 2;
  // INVALID_ARGUMENT (400): `watch_id` is not 1-40 characters of `a-z`, `0-9` and `-` starting with a letter.
  ERROR_REASON_INVALID_WATCH_ID = 3;
  // INVALID_ARGUMENT (400): the URI is not one a watch may fetch (Watch.uri).
  ERROR_REASON_INVALID_URI = 4;
  // INVALID_ARGUMENT (400): a selector HTMLRewriter does not support, or more or longer selectors than allowed.
  ERROR_REASON_INVALID_SELECTOR = 5;
  // INVALID_ARGUMENT (400): more than one source kind, or a JSONPath outside the subset.
  ERROR_REASON_INVALID_SOURCE = 6;
  // INVALID_ARGUMENT (400): more than one trigger kind, or a trigger's values break its rules (a number
  // trigger without a condition, an availability trigger without JSON-LD, ...).
  ERROR_REASON_INVALID_TRIGGER = 7;
  // INVALID_ARGUMENT (400): `check_interval_minutes` outside its range for the fetcher.
  ERROR_REASON_INVALID_INTERVAL = 8;
  // FAILED_PRECONDITION (400): the store holds the most watches it may (50).
  ERROR_REASON_WATCHES_FULL = 9;
  // FAILED_PRECONDITION (400): `ai.enabled`; the AI judge is not part of v1.
  ERROR_REASON_AI_NOT_AVAILABLE = 10;
  // FAILED_PRECONDITION (400): FETCHER_BROWSER, and the deployment has no browser binding.
  ERROR_REASON_BROWSER_NOT_AVAILABLE = 11;
}
