// The errors of LabUiService (AIP-193).
//
// Every error is a google.rpc.Status in Google's HTTP JSON form, written by the shared transcoder
// (proto/ts/http-transcoder.ts):
//
//   {"error": {"code": <HTTP status>, "message": <English, for developers>, "status": <google.rpc.Code name>,
//              "details": [
//                {"@type": "type.googleapis.com/google.rpc.ErrorInfo", "reason": "DECK_CHANGED",
//                 "domain": "lab.ziyixi.science"},
//                {"@type": "type.googleapis.com/google.rpc.LocalizedMessage", "locale": "zh-CN", "message": ...},
//                {"@type": "type.googleapis.com/google.rpc.RequestInfo", "request_id": <16 hex>},
//                {"@type": "type.googleapis.com/lab.ui.v1.DeckState", ...}]}}
//
// The UI branches on ErrorInfo.reason only: a value name without its prefix, of ErrorReason below (Lab's
// own reasons) or of common.errors.v1.CommonReason (the reasons every API shares: BAD_REQUEST, NOT_FOUND,
// METHOD_NOT_ALLOWED, INTERNAL, UNAVAILABLE, UNAUTHORIZED, CSRF_FAILED, ACCESS_NOT_CONFIGURED,
// NOT_CONFIGURED). Before lab.ui.v1, the same reasons were the lower-case `error.code` strings of Lab's own
// envelope (`deck_changed`); the names did not change, only their case. A reason the UI does not know is
// shown with the LocalizedMessage, never read as success.

syntax = "proto3";

package lab.ui.v1;

option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "science.ziyixi.lab.ui.v1";

// Lab's own reasons: ErrorInfo.reason is the value's name without `ERROR_REASON_`. The HTTP status follows
// the google.rpc.Code listed for each value (the AIP-193 mapping).
enum ErrorReason {
  // Never sent.
  ERROR_REASON_UNSPECIFIED = 0;
  // NOT_FOUND (404): no ready deck for that day.
  ERROR_REASON_DECK_NOT_FOUND = 1;
  // ABORTED (409): the request's `etag` is stale (another tab or device moved the deck). The error carries
  // the current lab.ui.v1.DeckState as a detail, which the UI adopts.
  ERROR_REASON_DECK_CHANGED = 2;
  // ALREADY_EXISTS (409): the card was decided already.
  ERROR_REASON_ALREADY_DECIDED = 3;
  // FAILED_PRECONDITION (400): nothing to undo.
  ERROR_REASON_NOTHING_TO_UNDO = 4;
  // FAILED_PRECONDITION (400): the deck's decision log is full (DECK_EVENTS_MAX, 400 events).
  ERROR_REASON_DECK_LOG_FULL = 5;
  // NOT_FOUND (404): the paper is not a card of this deck.
  ERROR_REASON_NOT_IN_DECK = 6;
  // FAILED_PRECONDITION (400): no liked, unexcluded, unsent paper to send.
  ERROR_REASON_NOTHING_TO_SEND = 7;
  // ABORTED (409): the paper is in the send in flight (it cannot be excluded now), or the send is busy.
  ERROR_REASON_SEND_IN_PROGRESS = 8;
  // FAILED_PRECONDITION (400): SEEDS_MAX (50) seeds already.
  ERROR_REASON_SEEDS_FULL = 9;
  // ALREADY_EXISTS (409): CreateLikedPaper for a paper that is liked already.
  ERROR_REASON_ALREADY_LIKED = 10;
}
