// The owner's library: liked papers and seed papers (lab/docs/design.md §3, lab/docs/ux.md §6-§7).

syntax = "proto3";

package lab.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "lab/ui/v1/paper.proto";

option java_multiple_files = true;
option java_outer_classname = "LibraryProto";
option java_package = "science.ziyixi.lab.ui.v1";

// A paper the owner likes (in a deck or the library). Deleting it (取消喜欢) removes the like; creating it
// (恢复喜欢) likes the paper again.
message LikedPaper {
  option (google.api.resource) = {
    type: "lab.ziyixi.science/LikedPaper"
    pattern: "likedPapers/{liked_paper}"
    singular: "likedPaper"
    plural: "likedPapers"
  };

  // likedPapers/{liked_paper}, where {liked_paper} is the bare arXiv ID, e.g. `2609.35773`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The paper.
  Paper paper = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The paper's latest 简介; unset when it never had one.
  optional string brief = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the owner liked it.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The deck it was liked in; unset when liked from the library.
  string deck = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
}

// A seed: a paper the owner names so that ranking starts from it (at most SEEDS_MAX, 50).
message Seed {
  option (google.api.resource) = {
    type: "lab.ziyixi.science/Seed"
    pattern: "seeds/{seed}"
    singular: "seed"
    plural: "seeds"
  };

  // Whether Lab could fetch the seed's metadata and vector.
  enum State {
    // Not set: never written.
    STATE_UNSPECIFIED = 0;
    // Waiting for the next pipeline slice.
    STATE_PENDING = 1;
    // Fetched and used in ranking.
    STATE_RESOLVED = 2;
    // arXiv does not know the ID.
    STATE_NOT_FOUND = 3;
  }

  // seeds/{seed}, where {seed} is the bare arXiv ID, e.g. `2601.00042`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The paper (`arxiv:<id>`).
  string paper_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its title, once resolved.
  optional string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The state.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the owner added it.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
