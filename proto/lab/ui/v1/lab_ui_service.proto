// Lab's owner API: the HTTP/JSON interface between Lab's UI (lab/web) and the Worker "lab" (lab/worker).
//
// Callers. Only Lab's own UI calls it (same origin, lab.ziyixi.science). The dashboard links to Lab's
// page and reads Lab only through the ops-v1 service binding; no other app calls these routes.
//
// Transport. google.api.http bindings under the prefix /api/v1, served by the shared transcoder
// (proto/ts/http-transcoder.ts) and called through the shared client (proto/ts/http-client.ts). Bodies,
// query parameters and responses are JSON in the wire JSON profile (proto/README.md): proto field names
// (snake_case), enum values in lower case without their prefix (`DECISION_LIKE` is "like"), timestamps in
// RFC 3339 UTC. Inputs are read strictly (an unknown field or enum name is INVALID_ARGUMENT), outputs
// leniently. Request bodies are at most 16 KiB. Errors: errors.proto.
//
// Authentication, in front of the transcoder (packages/edge-auth, Lab's parameters in its SPEC §5.4):
// every route needs the Cloudflare Access JWT of the owner (header Cf-Access-Jwt-Assertion or cookie
// CF_Authorization); every method other than GET also needs the same-origin Origin header and the signed
// double-submit CSRF token (header X-CSRF-Token, cookie lab_csrf), issued by GET /api/csrf, which is
// transport, not part of this service. Every mutation takes a `request_id` (AIP-155, a UUID4 the browser
// makes once per user action): repeating a request with the same ID applies it once (deck mutations answer
// the stored first response, the others the current view). Without one the Worker makes one up, so nothing
// is deduplicated.
//
// Value rules the IDL cannot express (lengths, ranges, counts) are in each field's comment and enforced by
// the Worker; the shared constants are in lab/worker/src/limits.ts.
//
// Before lab.ui.v1 (until 2026-10-01) the same operations were hand-written routes under /api; each rpc
// below names the route it replaces. Those paths now answer 410 with Lab's old error envelope and the code
// `reload_required` (lab/worker/src/http.ts), so a tab still running the old UI tells the owner to reload.

syntax = "proto3";

package lab.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "lab/ui/v1/deck.proto";
import "lab/ui/v1/home.proto";
import "lab/ui/v1/library.proto";
import "lab/ui/v1/paper.proto";

option java_multiple_files = true;
option java_outer_classname = "LabUiServiceProto";
option java_package = "science.ziyixi.lab.ui.v1";

// The owner's Paper Radar: today's deck and its decisions, the send to Todofy, the library and settings.
// (-- api-linter: core::0121::resource-must-support-list=disabled
//     aip.dev/not-precedent: decks are reached through Today (the newest one and the unfinished ones of
//     the last 7 days); a list of every deck would have no caller. --)
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: seeds and liked papers are only ever shown as their lists (ListSeeds,
//     ListLikedPapers); a Get of one would have no caller. --)
service LabUiService {
  option (google.api.default_host) = "lab.ziyixi.science";

  // Today's view. Replaces GET /api/today.
  rpc GetToday(GetTodayRequest) returns (Today) {
    option (google.api.http) = {get: "/api/v1/{name=today}"};
    option (google.api.method_signature) = "name";
  }

  // The pipeline's counters. Replaces GET /api/status.
  rpc GetPipelineStatus(GetPipelineStatusRequest) returns (PipelineStatus) {
    option (google.api.http) = {get: "/api/v1/{name=pipelineStatus}"};
    option (google.api.method_signature) = "name";
  }

  // A ready deck. Replaces GET /api/decks/{day}.
  rpc GetDeck(GetDeckRequest) returns (Deck) {
    option (google.api.http) = {get: "/api/v1/{name=decks/*}"};
    option (google.api.method_signature) = "name";
  }

  // Records a swipe (like or dislike) on one card. Replaces POST /api/decks/{day}/decide.
  rpc DecideDeck(DecideDeckRequest) returns (DecideDeckResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*}:decide"
      body: "*"
    };
  }

  // Takes back the latest decide or 重来, any number of times. Replaces POST /api/decks/{day}/undo.
  rpc UndoDeck(UndoDeckRequest) returns (UndoDeckResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*}:undo"
      body: "*"
    };
  }

  // 重来: clears every decision in one undoable step (nothing to clear is a no-op that keeps the version).
  // Replaces POST /api/decks/{day}/restart.
  rpc RestartDeck(RestartDeckRequest) returns (RestartDeckResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*}:restart"
      body: "*"
    };
  }

  // 暂不发送: notes that the owner left the summary without sending. Replaces POST /api/decks/{day}/later.
  rpc SnoozeDeck(SnoozeDeckRequest) returns (SnoozeDeckResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*}:snooze"
      body: "*"
    };
  }

  // Removes a liked paper from the summary's next send, or puts it back (the like stays). Refused with
  // SEND_IN_PROGRESS while the paper is in the send in flight. Replaces POST /api/decks/{day}/exclude.
  rpc ExcludePaper(ExcludePaperRequest) returns (DeckSummary) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*/summary}:excludePaper"
      body: "*"
    };
  }

  // Sends the sendable papers to Todofy as one task-intent-v1 intent, or resends the frozen generation
  // unchanged. Replaces POST /api/decks/{day}/send.
  rpc SendDeck(SendDeckRequest) returns (SendDeckResponse) {
    option (google.api.http) = {
      post: "/api/v1/{name=decks/*}:send"
      body: "*"
    };
  }

  // The deck's 总结 page. Replaces GET /api/decks/{day}/summary.
  rpc GetDeckSummary(GetDeckSummaryRequest) returns (DeckSummary) {
    option (google.api.http) = {get: "/api/v1/{name=decks/*/summary}"};
    option (google.api.method_signature) = "name";
  }

  // The deck's latest send. When its `next_poll_time` has passed, the Worker first asks Todofy for the
  // intent's state (taskIntentStatus) and stores the answer, so polling this is how a send progresses.
  // NOT_FOUND before the first send. Replaces GET /api/decks/{day}/send.
  rpc GetSend(GetSendRequest) returns (Send) {
    option (google.api.http) = {get: "/api/v1/{name=decks/*/send}"};
    option (google.api.method_signature) = "name";
  }

  // The liked papers, newest first. Replaces GET /api/liked?cursor=&q=.
  rpc ListLikedPapers(ListLikedPapersRequest) returns (ListLikedPapersResponse) {
    option (google.api.http) = {get: "/api/v1/likedPapers"};
    option (google.api.method_signature) = "";
  }

  // 取消喜欢: removes the like (ranking stops using it from the next run). Replaces POST /api/feedback with
  // `"label": null`.
  rpc DeleteLikedPaper(DeleteLikedPaperRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=likedPapers/*}"};
    option (google.api.method_signature) = "name";
  }

  // 恢复喜欢: likes a stored paper (from the library); ALREADY_LIKED when it is liked already. Replaces
  // POST /api/feedback with `"label": "like"`.
  rpc CreateLikedPaper(CreateLikedPaperRequest) returns (LikedPaper) {
    option (google.api.http) = {
      post: "/api/v1/likedPapers"
      body: "liked_paper"
    };
    option (google.api.method_signature) = "liked_paper,liked_paper_id";
  }

  // The seeds, newest first. Replaces GET /api/seeds.
  rpc ListSeeds(ListSeedsRequest) returns (ListSeedsResponse) {
    option (google.api.http) = {get: "/api/v1/seeds"};
    option (google.api.method_signature) = "";
  }

  // Adds seeds from what the owner pasted: bare arXiv IDs or arxiv.org abs/pdf URLs. Inputs that are
  // neither are skipped; none valid is BAD_REQUEST. Replaces POST /api/seeds.
  rpc ImportSeeds(ImportSeedsRequest) returns (ImportSeedsResponse) {
    option (google.api.http) = {
      post: "/api/v1/seeds:import"
      body: "*"
    };
  }

  // Removes a seed; likes and dislikes stay. Replaces DELETE /api/seeds (which took a JSON body).
  rpc DeleteSeed(DeleteSeedRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=seeds/*}"};
    option (google.api.method_signature) = "name";
  }

  // The settings. Replaces GET /api/settings.
  rpc GetSettings(GetSettingsRequest) returns (Settings) {
    option (google.api.http) = {get: "/api/v1/{name=settings}"};
    option (google.api.method_signature) = "name";
  }

  // Replaces the editable settings as a whole (a cap above the ceiling is BAD_REQUEST); answers the
  // stored settings. Replaces PUT /api/settings.
  // (-- api-linter: core::0134::method-signature=disabled
  //     aip.dev/not-precedent: no update_mask (UpdateSettingsRequest), so the signature is the resource
  //     alone. --)
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings) {
    option (google.api.http) = {
      patch: "/api/v1/{settings.name=settings}"
      body: "settings"
    };
    option (google.api.method_signature) = "settings";
  }
}

// Input of GetToday.
message GetTodayRequest {
  // Always `today`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Today"
  ];
}

// Input of GetPipelineStatus.
message GetPipelineStatusRequest {
  // Always `pipelineStatus`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/PipelineStatus"
  ];
}

// Input of GetDeck.
message GetDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
}

// Input of DecideDeck.
message DecideDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // The deck's `version` this decision was made on (0-1000000).
  int32 base_version = 2 [(google.api.field_behavior) = REQUIRED];
  // The card's paper (`arxiv:<id>`).
  string paper_id = 3 [(google.api.field_behavior) = REQUIRED];
  // Like or dislike.
  Decision decision = 4 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 5 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of DecideDeck.
message DecideDeckResponse {
  // The deck's decisions after the swipe.
  DeckState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of UndoDeck.
message UndoDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // The deck's `version` the undo was asked on.
  int32 base_version = 2 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of UndoDeck.
message UndoDeckResponse {
  // The deck's decisions after the undo.
  DeckState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What was taken back.
  UndoTarget undone = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of RestartDeck.
message RestartDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // The deck's `version` the 重来 was asked on.
  int32 base_version = 2 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of RestartDeck.
message RestartDeckResponse {
  // The deck's decisions after the 重来.
  DeckState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How many decisions were cleared (0: nothing changed).
  int32 cleared_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of SnoozeDeck.
message SnoozeDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // The idempotency key (AIP-155).
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of SnoozeDeck.
message SnoozeDeckResponse {
  // When the deck was snoozed (the first time, for a repeated request_id).
  google.protobuf.Timestamp snooze_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of ExcludePaper.
message ExcludePaperRequest {
  // decks/{deck}/summary.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/DeckSummary"
  ];
  // The liked paper (`arxiv:<id>`).
  string paper_id = 2 [(google.api.field_behavior) = REQUIRED];
  // True removes it from the next send; false puts it back.
  bool excluded = 3 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of SendDeck.
message SendDeckRequest {
  // decks/{deck}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // The mode of a new generation; ignored when the open generation is frozen (a retry resends it).
  SendMode mode = 2 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of SendDeck.
message SendDeckResponse {
  // The deck's send after the call (poll it with GetSend while it is not settled).
  Send send = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of GetDeckSummary.
message GetDeckSummaryRequest {
  // decks/{deck}/summary.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/DeckSummary"
  ];
}

// Input of GetSend.
message GetSendRequest {
  // decks/{deck}/send.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Send"
  ];
}

// Input of ListLikedPapers.
message ListLikedPapersRequest {
  // At most this many papers (default and maximum LIKED_PAGE, 50).
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token`.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // An AIP-160 filter of one bare literal, matched against the title (at most 200 characters; the
  // match uses its first 50 bytes, D1's LIKE limit). Empty lists everything.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Output of ListLikedPapers.
message ListLikedPapersResponse {
  // The page, newest like first.
  repeated LikedPaper liked_papers = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of DeleteLikedPaper.
message DeleteLikedPaperRequest {
  // likedPapers/{liked_paper}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/LikedPaper"
  ];
  // The idempotency key (AIP-155), a query parameter; see LabUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of CreateLikedPaper.
message CreateLikedPaperRequest {
  // The like to create: every field is output only, so the body is `{}`.
  LikedPaper liked_paper = 1 [(google.api.field_behavior) = REQUIRED];
  // The bare arXiv ID of a paper Lab stored (a query parameter), e.g. `2609.35773`.
  string liked_paper_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155), a query parameter; see LabUiService.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of ListSeeds.
message ListSeedsRequest {
  // At most this many seeds. Lab answers every seed (at most SEEDS_MAX, 50) on one page.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // The previous page's `next_page_token` (always empty today).
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Output of ListSeeds.
message ListSeedsResponse {
  // The seeds, newest first.
  repeated Seed seeds = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next page's token; empty on the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of ImportSeeds.
message ImportSeedsRequest {
  // 1 to SEEDS_MAX (50) inputs of at most 200 characters each: bare arXiv IDs or arxiv.org URLs.
  repeated string inputs = 1 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155).
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Output of ImportSeeds.
message ImportSeedsResponse {
  // Every seed after the import, newest first.
  repeated Seed seeds = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Input of DeleteSeed.
message DeleteSeedRequest {
  // seeds/{seed}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Seed"
  ];
  // The idempotency key (AIP-155), a query parameter; see LabUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Input of GetSettings.
message GetSettingsRequest {
  // Always `settings`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lab.ziyixi.science/Settings"
  ];
}

// Input of UpdateSettings.
// (-- api-linter: core::0134::request-mask-required=disabled
//     aip.dev/not-precedent: the settings are one small form saved as a whole, every editable field
//     REQUIRED; a field mask would add a partial-update path the UI never uses. --)
message UpdateSettingsRequest {
  // The whole editable set; the output-only fields are ignored.
  Settings settings = 1 [(google.api.field_behavior) = REQUIRED];
  // The idempotency key (AIP-155), a query parameter; see LabUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
