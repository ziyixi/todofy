// Papers and the owner's decisions on them (lab/docs/design.md §2-§3).

syntax = "proto3";

package lab.ui.v1;

import "google/api/field_behavior.proto";

option java_multiple_files = true;
option java_outer_classname = "PaperProto";
option java_package = "science.ziyixi.lab.ui.v1";

// An arXiv paper as Lab stored it from the feed. Not a resource of this API: decks and the library embed
// it, and refer to it by `id`.
message Paper {
  // `arxiv:<id>` without version, e.g. `arxiv:2609.35773`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The latest version number seen, e.g. 1.
  int32 version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The title (one line, untrusted text from arXiv: shown as text, never as HTML).
  string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The author list as one line.
  string authors = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The arXiv categories, primary first.
  repeated string categories = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The primary category, e.g. `cs.IR`.
  string primary_category = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The abstract (plain text, at most 4000 characters).
  string abstract_text = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How the paper was announced.
  AnnounceType announce_type = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // https://arxiv.org/abs/<id>, built from the ID only.
  string abstract_uri = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // https://arxiv.org/pdf/<id>, built from the ID only.
  string pdf_uri = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A newer version was announced after the owner liked it.
  bool new_version = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The owner's decision on a paper: a swipe in a deck, or 取消喜欢/恢复喜欢 in the library.
enum Decision {
  // No decision: never written.
  DECISION_UNSPECIFIED = 0;
  // 喜欢: ranks similar papers higher; sendable to Todofy.
  DECISION_LIKE = 1;
  // 不喜欢: ranks similar papers lower.
  DECISION_DISLIKE = 2;
}

// How the paper appeared in the day's feed.
enum AnnounceType {
  // Not set: never written.
  ANNOUNCE_TYPE_UNSPECIFIED = 0;
  // A new submission in one of the owner's categories.
  ANNOUNCE_TYPE_NEW = 1;
  // A cross-list from another category.
  ANNOUNCE_TYPE_CROSS = 2;
}
