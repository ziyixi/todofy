// The singletons of the owner's UI: today's view, the pipeline's status and the settings
// (lab/docs/design.md §4-§6, lab/docs/ux.md §2, §6).

syntax = "proto3";

package lab.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "lab/ui/v1/deck.proto";

option java_multiple_files = true;
option java_outer_classname = "HomeProto";
option java_package = "science.ziyixi.lab.ui.v1";

// 今日: the newest ready deck, or what the pipeline is doing. A singleton. Reading it also arms LabState's
// alarm when none is set (the pipeline starts after a deploy).
message Today {
  option (google.api.resource) = {
    type: "lab.ziyixi.science/Today"
    pattern: "today"
    singular: "today"
    plural: "todays"
  };

  // Always `today`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The newest ready deck; unset before the first one exists.
  DeckPointer deck = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set while the next deck is being prepared (or the pipeline is held); unset when idle.
  BuildStatus building = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The next scheduled feed fetch; unset before the first schedule.
  google.protobuf.Timestamp next_fetch_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // No seeds and no likes yet: the deck is an explore deck, and the UI invites seeds.
  bool cold_start = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unfinished decks other than `deck`, at most DECK_OFFER_DAYS (7) old, newest first.
  repeated DeckPointer older_unfinished_decks = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Today's banner; unset when all is well.
  Notice notice = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A deck as Today lists it.
message DeckPointer {
  // The deck.
  string deck = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "lab.ziyixi.science/Deck"
  ];
  // How it was made.
  DeckKind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Cards in it.
  int32 card_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Cards decided.
  int32 decided_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Every card is decided.
  bool finished = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The next deck's preparation.
message BuildStatus {
  // The announce day being prepared (`YYYY-MM-DD`); unset before the fetch.
  optional string day = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The phase.
  BuildPhase phase = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The pipeline's counters for the owner: codes, counts and times only. A singleton. No UI page reads it
// today; it is the owner's diagnostic view (the dashboard reads the same counters through ops-v1).
message PipelineStatus {
  option (google.api.resource) = {
    type: "lab.ziyixi.science/PipelineStatus"
    pattern: "pipelineStatus"
    singular: "pipelineStatus"
    plural: "pipelineStatuses"
  };

  // Always `pipelineStatus`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Papers stored in the last 24 hours.
  int32 ingested_last_day_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Papers ranked in the last 24 hours.
  int32 ranked_last_day_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Likes in the last 7 days.
  int32 liked_last_week_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Decisions in the last 7 days.
  int32 decided_last_week_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Workers AI neurons used today (UTC); fractional, as the ledger prices each call.
  double neurons_today = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Today's neuron cap.
  int32 neuron_cap = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last successful feed fetch; unset before the first.
  google.protobuf.Timestamp last_fetch_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last fetch failure's code; unset after a success.
  optional string last_fetch_error = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The quota guard's level.
  GuardLevel guard_level = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the guard ends by itself; unset when there is none.
  google.protobuf.Timestamp guard_end_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The deployed commit.
  string build = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The owner's settings. A singleton: UpdateSettings replaces the fields its update_mask names (all editable
// fields without one).
message Settings {
  option (google.api.resource) = {
    type: "lab.ziyixi.science/Settings"
    pattern: "settings"
    singular: "settings"
    plural: "settings"
  };

  // Always `settings`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // arXiv categories, 1 to CATEGORIES_MAX (6) distinct, e.g. `cs.IR`.
  repeated string categories = 2 [(google.api.field_behavior) = REQUIRED];
  // λ: the weight of the disliked papers' centroid in ranking, 0-1.
  double dislike_weight = 3 [(google.api.field_behavior) = REQUIRED];
  // The daily Workers AI neuron cap, 0 to `neuron_ceiling`.
  int32 neuron_cap = 4 [(google.api.field_behavior) = REQUIRED];
  // The 简介 model: one of `summary_models`.
  string summary_model = 5 [(google.api.field_behavior) = REQUIRED];
  // The daily feed fetch is paused.
  bool ingest_paused = 6 [(google.api.field_behavior) = REQUIRED];
  // The default send mode.
  SendMode send_mode = 7 [(google.api.field_behavior) = REQUIRED];
  // LAB_DAILY_NEURONS: the deployment's ceiling for `neuron_cap`.
  int32 neuron_ceiling = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The models `summary_model` may name.
  repeated string summary_models = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The phase of the next deck's preparation.
enum BuildPhase {
  // Not set: never written.
  BUILD_PHASE_UNSPECIFIED = 0;
  // No deck yet; the first fetch is scheduled.
  BUILD_PHASE_WAITING = 1;
  // The feed fetch is due.
  BUILD_PHASE_FETCHING = 2;
  // Computing vectors.
  BUILD_PHASE_EMBEDDING = 3;
  // Ranking.
  BUILD_PHASE_RANKING = 4;
  // Writing the 简介.
  BUILD_PHASE_SUMMARIZING = 5;
  // Held: ingest paused or the quota guard is on.
  BUILD_PHASE_PAUSED = 6;
  // Held: the daily neuron cap was hit.
  BUILD_PHASE_CAP_HIT = 7;
  // The last feed fetch failed; it is retried.
  BUILD_PHASE_FAILED = 8;
}

// Today's banner.
enum Notice {
  // No banner: never written.
  NOTICE_UNSPECIFIED = 0;
  // The daily neuron cap was hit.
  NOTICE_CAP_HIT = 1;
  // The feed has not been fetched for over a day.
  NOTICE_FEED_STALE = 2;
  // Ingest is paused (by the owner or the quota guard).
  NOTICE_PAUSED = 3;
}

// The level of the dashboard's quota guard (ops-v1).
enum GuardLevel {
  // Not set: never written.
  GUARD_LEVEL_UNSPECIFIED = 0;
  // Normal operation.
  GUARD_LEVEL_NORMAL = 1;
  // Deferrable work is shed.
  GUARD_LEVEL_SHED = 2;
}
