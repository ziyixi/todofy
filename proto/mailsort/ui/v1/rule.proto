// A rule: stage 1 of the pipeline (mailsort/docs/design.md §4). A deterministic match on a sender, a mailing list or
// the address the mail was delivered to, optionally narrowed by words of the subject, decides a label without the
// model. Rules come from the owner (one by one, or imported), or from a proposal: the same sender or list corrected
// to the same label at least twice.

syntax = "proto3";

package mailsort.ui.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "RuleProto";
option java_package = "science.ziyixi.mailsort.ui.v1";

// A deterministic rule. Its value (an address, a domain, a list ID) is the owner's data: it lives only in the
// Durable Object, behind Access, and never reaches a log.
message Rule {
  option (google.api.resource) = {
    type: "sort.ziyixi.science/Rule"
    pattern: "rules/{rule}"
    singular: "rule"
    plural: "rules"
  };

  // What a rule matches.
  enum Kind {
    // Never written; refused on input.
    KIND_UNSPECIFIED = 0;
    // The From address, exactly (ASCII letters case-insensitively). Needs DMARC aligned with its domain.
    KIND_SENDER_ADDRESS = 1;
    // The From address's domain or a subdomain of it. Needs DMARC aligned with the From domain.
    KIND_SENDER_DOMAIN = 2;
    // The List-Id header's identifier (between the angle brackets). When the identifier's namespace is a domain,
    // the mail also needs a DKIM signature that passed for that domain or a parent of it.
    KIND_LIST_ID = 3;
    // The Delivered-To address Gmail wrote (never the sender's To): which of the owner's addresses the mail came
    // in through.
    KIND_DELIVERED_TO = 4;
  }

  // The rule's lifecycle (AIP-216).
  enum State {
    // Never written.
    STATE_UNSPECIFIED = 0;
    // Proposed from corrections: it decides nothing until the owner approves it.
    STATE_PROPOSED = 1;
    // Decides every matching mail.
    STATE_ACTIVE = 2;
    // Kept, decides nothing.
    STATE_DISABLED = 3;
  }

  // rules/{rule}: an ID the Worker makes.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // What the rule matches.
  Kind kind = 2 [(google.api.field_behavior) = REQUIRED];
  // The address, domain or list ID, 3 to 200 printable ASCII characters; stored in lower case.
  string value = 3 [(google.api.field_behavior) = REQUIRED];
  // The label a match decides.
  string label = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "sort.ziyixi.science/Label"
  ];
  // The rule's lifecycle.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A match also needs DMARC to pass aligned with the From domain (Gmail's Authentication-Results): always for a
  // sender rule and a label that implies trust, and for any rule with `require_dmarc`. A mail that fails it is
  // not decided by the rule (the model or the inbox has it).
  bool dmarc_required = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The corrections a proposal came from (0 for the owner's own rules).
  int32 correction_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The mails the rule decided.
  int32 match_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When it was created.
  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When its state last changed.
  google.protobuf.Timestamp update_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The rule matches only when the subject contains at least one of these (case-insensitively, after Unicode
  // NFKC folding); empty: any subject. At most 8, each 1 to 40 characters. A rule with subject conditions is tried
  // before the plain rules of the same sender (a carve-out: one sender's login notices to another label).
  repeated string subject_includes = 11 [(google.api.field_behavior) = OPTIONAL];
  // The rule does not match when the subject contains any of these (as `subject_includes`). At most 8.
  repeated string subject_excludes = 12 [(google.api.field_behavior) = OPTIONAL];
  // A match keeps the mail in the inbox (the label added, INBOX not removed), whatever the label's own setting.
  // False follows the label.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: "keep in inbox" is the owner's own name for the switch, and the rule file's. --)
  bool keep_in_inbox = 13 [(google.api.field_behavior) = OPTIONAL];
  // A list or delivered-to rule also needs DMARC aligned with the From domain. A sender rule always does.
  bool require_dmarc = 14 [(google.api.field_behavior) = OPTIONAL];
  // Why the rule is right, in the owner's words (at most 300 characters).
  string evidence = 15 [(google.api.field_behavior) = OPTIONAL];
  // The owner's notes (at most 300 characters).
  string notes = 16 [(google.api.field_behavior) = OPTIONAL];
  // The `id` of the import entry the rule came from (ImportRules), which a later import of the same entry
  // updates; empty for the others.
  string import_id = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}
