  string xml = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The rules it holds.
  int32 rule_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Active rules left out because they need DMARC.
  int32 skipped_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A label of an import: created when no label has its path, else updated where it differs.
message LabelImport {
  // The Gmail name, "分拣/" and the label's path (Label.display_name), `分拣/开发/CI通知`.
  string path = 1 [(google.api.field_behavior) = REQUIRED];
  // Label.description.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];
  // Label.trust_implying.
  bool trust = 3 [(google.api.field_behavior) = OPTIONAL];
  // Label.keep_in_inbox.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: "keep in inbox" is the owner's own name for the switch, and the rule file's. --)
  bool keep_in_inbox = 4 [(google.api.field_behavior) = OPTIONAL];
  // Label.sensitive.
  bool sensitive = 5 [(google.api.field_behavior) = OPTIONAL];
  // Label.threshold (0 for the default).
  double threshold = 6 [(google.api.field_behavior) = OPTIONAL];
  // Label.enabled, as an export writes it. Absent (the owner's rule file, the template): a new label is enabled and an
  // existing one keeps its switch; present: a new label gets it and an existing one is set to it.
  optional bool enabled = 7 [(google.api.field_behavior) = OPTIONAL];
}

// What a rule of an import matches: exactly one of the four.
message RuleMatch {
  // A sender rule on the From address (Rule.Kind.KIND_SENDER_ADDRESS).
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: the owner's rule file names it so; the request reads that file as it is. --)
  string from_address = 1 [(google.api.field_behavior) = OPTIONAL];
  // A sender rule on the From domain and its subdomains (Rule.Kind.KIND_SENDER_DOMAIN).
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: the owner's rule file names it so; the request reads that file as it is. --)
  string from_domain = 2 [(google.api.field_behavior) = OPTIONAL];
  // A List-Id rule (Rule.Kind.KIND_LIST_ID).
  string list_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // A Delivered-To rule (Rule.Kind.KIND_DELIVERED_TO).
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: the owner's rule file names it so; the request reads that file as it is. --)
  string to_address = 4 [(google.api.field_behavior) = OPTIONAL];
}

// A rule of an import, in the owner's rule file format.
message RuleImport {
  // The entry's own ID (1 to 64 characters of letters, digits, `.`, `_` and `-`): a later import of the same ID
  // updates the rule it made (Rule.import_id).
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // What it matches.
  RuleMatch match = 2 [(google.api.field_behavior) = REQUIRED];
  // The label's Gmail name, "分拣/" and its path (LabelImport.path).
  string label = 3 [(google.api.field_behavior) = REQUIRED];
  // Rule.keep_in_inbox.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: "keep in inbox" is the owner's own name for the switch, and the rule file's. --)
  bool keep_in_inbox = 4 [(google.api.field_behavior) = OPTIONAL];
  // The label implies trust: a label the import creates for this rule is created so; for an existing label
  // that does not, the preview warns.
  bool trust = 5 [(google.api.field_behavior) = OPTIONAL];
  // Rule.require_dmarc (a sender rule needs DMARC whatever this says).
  bool require_dmarc = 6 [(google.api.field_behavior) = OPTIONAL];
  // Rule.evidence.
  string evidence = 7 [(google.api.field_behavior) = OPTIONAL];
  // Rule.notes.
  string notes = 8 [(google.api.field_behavior) = OPTIONAL];
  // Rule.subject_includes.
  repeated string subject_includes = 9 [(google.api.field_behavior) = OPTIONAL];
  // Rule.subject_excludes.
  repeated string subject_excludes = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Input of ImportRules.
message ImportRulesRequest {
  // The labels to create or update (at most 24).
  repeated LabelImport labels = 1 [(google.api.field_behavior) = OPTIONAL];
  // The rules to create or update (at most 500).
  repeated RuleImport rules = 2 [(google.api.field_behavior) = OPTIONAL];
  // Import the built-in template of recommended labels instead (`labels` and `rules` must then be empty).
  bool use_template = 3 [(google.api.field_behavior) = OPTIONAL];
  // AIP-163: only check and answer what the import would do (the preview); nothing changes.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  // The idempotency key (AIP-155); see MailsortUiService.
  string request_id = 5 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// What an import does with one entry.
message ImportChange {
  // The kind of entry.
  enum Kind {
    // Never written.
    KIND_UNSPECIFIED = 0;
    // A label (of `labels`, of the template, or one a rule names).
    KIND_LABEL = 1;
    // A rule.
    KIND_RULE = 2;
  }

  // What happens to it.
  enum Action {
    // Never written.
    ACTION_UNSPECIFIED = 0;
    // A new label or rule.
    ACTION_CREATE = 1;
    // An existing one whose `changed_fields` differ.
    ACTION_UPDATE = 2;
    // An existing one, unchanged.
    ACTION_SKIP = 3;
    // Refused (`problem`): the import changes nothing while one entry is invalid.
    ACTION_INVALID = 4;
  }

  // The kind of entry.
  Kind kind = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Its position in the request's `labels` or `rules` (or the template's labels); -1 for a label only a rule
  // names.
  int32 index = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What happens to it.
  Action action = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The label's path, or the rule's import ID.
  string key = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The label or rule it creates or updates, once known (`labels/dev-ci`, `rules/r1`).
  string resource = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The fields an update changes (`description`, `subject_includes`, ...).
  repeated string changed_fields = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why an entry is invalid, a code: `label_path`, `label_prefix`, `label_tree`, `description`, `threshold`,
  // `match`, `value`, `rule_id`, `subject`, `text`, `duplicate`, `labels_full`, `rules_full`.
  string problem = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Something the owner should know that does not stop the import, a code: `trust_mismatch` (the rule says
  // trust, its label does not imply it), `rule_disabled` (the existing rule stays disabled), `same_match` (another
  // rule of the import has the same match and conditions: the earlier one is tried first), `examples_deleted` (the
  // update turns the label sensitive: its examples are deleted).
  string warning = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Output of ImportRules.
message ImportRulesResponse {
  // Every entry, labels first, then rules, in the request's order.
  repeated ImportChange changes = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The import was applied (false for `validate_only`).
  bool applied = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Labels created (or that would be).
  int32 created_label_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Labels updated (or that would be).
  int32 updated_label_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rules created (or that would be).
  int32 created_rule_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rules updated (or that would be).
  int32 updated_rule_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Entries left as they are.
  int32 skipped_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Invalid entries (then nothing is applied).
  int32 invalid_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The labels of the import as they are (or would be), so the preview can show the template's.
  repeated LabelImport labels = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

