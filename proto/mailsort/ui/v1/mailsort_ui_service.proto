  Rule rule = 1 [(google.api.field_behavior) = REQUIRED];
  // The ID of the new rule (a query parameter): 1 to 40 characters of `a-z`, `0-9` and `-`, starting with a
  // letter; empty: the Worker makes one.
  string rule_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // The idempotency key (AIP-155), a query parameter; see MailsortUiService.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

