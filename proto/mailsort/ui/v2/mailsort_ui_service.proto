  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "sort.ziyixi.science/Settings"
  ];
}

// Input of UpdateSettings.
message UpdateSettingsRequest {
  // The new values of the fields `update_mask` names. Its `etag`, when set, must be the current one (AIP-154).
  Settings settings = 1 [(google.api.field_behavior) = REQUIRED];
  // AIP-134: the Settings fields to replace (a query parameter). Required by the Worker: absent, empty or `*` is
  // INVALID_ARGUMENT, so a client that leaves a field out never switches the mode by accident.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // The idempotency key (AIP-155), a query parameter; see MailsortUiService.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
