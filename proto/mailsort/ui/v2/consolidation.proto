// A frozen, owner-approved consolidation of the application's Gmail labels.
syntax = "proto3";

package mailsort.ui.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "ConsolidationProto";
option java_package = "science.ziyixi.mailsort.ui.v2";

// The latest label consolidation. Gmail writes are journaled and resumed by the alarm.
// Names and descriptions are private owner data; progress never exposes message content.
message LabelConsolidation {
  option (google.api.resource) = {
    type: "sort.ziyixi.science/LabelConsolidation"
    pattern: "labelConsolidation"
    singular: "labelConsolidation"
    plural: "labelConsolidations"
  };

  // The consolidation's lifecycle.
  enum State {
    // Never written.
    STATE_UNSPECIFIED = 0;
    // The alarm is progressing through the frozen plan.
    STATE_RUNNING = 1;
    // A dependency or precondition needs attention; Resume retries the same phase.
    STATE_BLOCKED = 2;
    // Every group was verified and its empty source labels hidden.
    STATE_SUCCEEDED = 3;
  }

  // The current durable checkpoint.
  enum Phase {
    // Never written.
    PHASE_UNSPECIFIED = 0;
    // Check ownership, names and pending writes before changing Gmail.
    PHASE_PREFLIGHT = 1;
    // Rename the existing target label.
    PHASE_RENAME = 2;
    // Move source memberships to the target, preserving unrelated labels and inbox state.
    PHASE_MOVE = 3;
    // Re-read source memberships and verify that none remain.
    PHASE_VERIFY = 4;
    // Hide verified empty source labels; Gmail labels are never deleted.
    PHASE_HIDE = 5;
    // All groups finished.
    PHASE_COMPLETE = 6;
  }

  // The progress of one frozen group.
  message Group {
    // The group's lifecycle.
    enum State {
      // Never written.
      STATE_UNSPECIFIED = 0;
      // No work started for this group.
      STATE_PENDING = 1;
      // This group is being processed.
      STATE_RUNNING = 2;
      // This group's source labels were verified and hidden.
      STATE_SUCCEEDED = 3;
    }

    // The first source, kept as the target.
    string target_label = 1 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // The frozen source resources, including the target first.
    repeated string source_labels = 2 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // The target's single-level English name.
    string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The group's progress.
    State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Message memberships processed; not a count of unique messages across all groups.
    int32 processed_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Always `labelConsolidation`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Opaque identity of this frozen plan; a new plan receives a new ID.
  string job_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The current lifecycle.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The durable phase to continue.
  Phase phase = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Safe machine reason when blocked; empty otherwise.
  string error_code = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Suggested owner action: `wait`, `resume` or `none`.
  string next_action = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the frozen plan was accepted.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When progress last changed.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Message memberships processed across the groups.
  int32 processed_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The frozen groups and their progress, at most 24.
  repeated Group groups = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-154: Resume requires this exact current etag.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A group submitted privately by the owner. Every source must still have the supplied etag.
message LabelConsolidationGroup {
  // One current, owned source label.
  message Source {
    // labels/{label}.
    string label = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // The label's current etag, required even for an unchanged target.
    string etag = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // At least one source, target first. A source occurs in exactly one submitted group.
  repeated Source sources = 1 [(google.api.field_behavior) = REQUIRED];
  // Must equal sources[0].label. A new Gmail label is never created for a consolidation.
  string target_label = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "sort.ziyixi.science/Label"
  ];
  // Single-level English target name, following Label.display_name's rule.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  // The target's classification criteria in the owner's language, at most 300 characters. Omitted preserves
  // the target's current description; an explicit empty string clears it.
  optional string description = 4 [(google.api.field_behavior) = OPTIONAL];
}
