// A label: one category mailsort may put a mail into (mailsort/docs/design.md §3). It is a Gmail label whose name is
// display_name (a path such as `开发/CI通知`, a nested label), plus the owner's description that the decision model
// reads as the category's criteria.

syntax = "proto3";

package mailsort.ui.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "LabelProto";
option java_package = "science.ziyixi.mailsort.ui.v2";

// A category. Its names, description and trusted domains are the owner's: they live only in the Worker's Durable
// Object and in Gmail, behind Access, and never reach a log or the dashboard.
message Label {
  option (google.api.resource) = {
    type: "sort.ziyixi.science/Label"
    pattern: "labels/{label}"
    singular: "label"
    plural: "labels"
  };

  // Whether the label exists in Gmail.
  enum GmailState {
    // Never written.
    GMAIL_STATE_UNSPECIFIED = 0;
    // Not created in Gmail yet: it is created before the first live write that needs it.
    GMAIL_STATE_PENDING = 1;
    // Linked to the Gmail label of the same name, which mailsort created.
    GMAIL_STATE_LINKED = 2;
    // Linked before, but Gmail no longer has it (deleted outside mailsort). Nothing is written with it until a
    // Gmail label of its name is linked again (SyncLabels).
    GMAIL_STATE_MISSING = 3;
    // Linked to a user label Gmail already had under exactly this name (the owner's, not created by mailsort),
    // adopted by the owner's SyncLabels; never one with labels nested under it. From then on mailsort adds it to
    // mail that does not carry it yet and renames it like one it created.
    GMAIL_STATE_ADOPTED = 4;
    // Not created in Gmail: Gmail already has a label of exactly this name that is not mailsort's (the owner's).
    // Nothing is created or written with it until the label is renamed or SyncLabels adopts that Gmail label.
    GMAIL_STATE_NAME_TAKEN = 5;
  }

  // labels/{label}: 1 to 40 characters of `a-z`, `0-9` and `-`, starting with a letter (AIP-122); it never
  // changes. Without a `label_id` CreateLabel derives one from the path (`开发/CI通知` is `dev-ci-notices`).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The Gmail name: a path of 1 to 3 segments joined by "/" (a Gmail nested label, `开发/CI通知`), each segment 1
  // to 40 characters without control characters or surrounding spaces, at most 100 characters in all, and never
  // starting with the segment `分拣` (the legacy prefix: `分拣/x` is read as `x`). Only leaves are labels: no
  // label's path is the parent of another's. The parents exist in Gmail as plain grouping labels, created as
  // needed, and never get a mail.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  // What belongs in this label, in the owner's words: the model's criteria for the option, read as
  // `display_name: description`. At most 300 characters. A label without one is never offered to the model, so
  // it never gets a mail.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];
  // Mail may be decided into this label. In live mode a confident decision of an enabled label is written to
  // Gmail; in shadow mode it is only recorded.
  bool enabled = 4 [(google.api.field_behavior) = OPTIONAL];
  // The label implies trust (a bank, a brokerage, accounts, security, government): a confident decision needs,
  // besides the model's agreement, a sender that passed DMARC aligned with its From domain, a From domain trusted
  // by `trusted_domains`, and a lower suspicion.
  bool trust_implying = 5 [(google.api.field_behavior) = OPTIONAL];
  // The Gmail label's ID once linked; empty before.
  string gmail_label_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether the label exists in Gmail.
  GmailState gmail_state = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Grows with every change of `description` (and so of what the model reads). Every decision records it.
  int32 description_version = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The examples of this label in the example store.
  int32 example_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When it was created.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the owner or the Worker last changed it.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-154: changes with every change. UpdateLabel, DeleteLabel and RemoveTrustedDomain that carry an etag are
  // refused with ETAG_MISMATCH when the label changed since.
  string etag = 12 [(google.api.field_behavior) = OPTIONAL];
  // When the label is applied, the mail stays in the inbox: the label is added and INBOX is not removed (for
  // account security or government mail). False (the default): the mail is archived with its label, unless the
  // model found that it asks the owner to act soon.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: "keep in inbox" is the owner's own name for the switch. --)
  bool keep_in_inbox = 13 [(google.api.field_behavior) = OPTIONAL];
  // The label's mail is sensitive (medical, for one): no example (masked summary) of it is kept, so nothing of it
  // outlives the 14 days of decided mail's content.
  bool sensitive = 14 [(google.api.field_behavior) = OPTIONAL];
  // The sender domains a trust label may be decided for (`trust_implying`), sorted: a mail's From domain matches
  // one that is listed exactly, or a subdomain of one seeded from a former sender domain rule. Learned, never
  // typed: a review choice of this label adds the mail's ReviewItem.teachable_domain; the store's former sender
  // rules seeded the first ones. A public mailbox provider's domain is never one. At most 50; RemoveTrustedDomain
  // takes one off.
  repeated string trusted_domains = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}
