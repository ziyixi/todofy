// The replay evaluation (mailsort/docs/design.md §5.1): before Gmail labelling goes live, the mails the owner answered
// in the review queue are decided again by today's pipeline, without writing anything, and compared with the
// owner's answers. Counts, label names and each mail's decision numbers only: no subject, sender, address or
// message ID.

syntax = "proto3";

package mailsort.ui.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "ReplayProto";
option java_package = "science.ziyixi.mailsort.ui.v2";

// The latest replay evaluation and its summary. A singleton: StartReplayEvaluation replaces it. Its rows are
// pruned 7 days after it started.
message ReplayEvaluation {
  option (google.api.resource) = {
    type: "sort.ziyixi.science/ReplayEvaluation"
    pattern: "replayEvaluation"
    singular: "replayEvaluation"
    plural: "replayEvaluations"
  };

  // The evaluation's lifecycle.
  enum State {
    // Never written.
    STATE_UNSPECIFIED = 0;
    // Mails are still waiting: the alarm decides a few per run, with what the live pipeline leaves of the run's
    // requests, while the day's model use is below half the neuron budget and the guard does not shed.
    STATE_RUNNING = 1;
    // Every mail was decided again (or could not be read).
    STATE_SUCCEEDED = 2;
  }

  // What the replay decided for one mail.
  enum Outcome {
    // Never written.
    OUTCOME_UNSPECIFIED = 0;
    // A confident label (what live mode would write).
    OUTCOME_LABEL = 1;
    // Confident that no label fits.
    OUTCOME_NONE = 2;
    // Uncertain.
    OUTCOME_UNSURE = 3;
  }

  // One evaluated mail's decision numbers (mailsort/docs/design.md §4.4), to calibrate the thresholds against the
  // owner's answer. View 1 chose among every offered label and none; view 2 only among view 1's three most likely
  // labels and none. Probabilities are 0 to 1.
  message Case {
    // The owner's answer: a label, or empty for "none of them".
    string owner_label = 1 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // What the replay decided.
    Outcome outcome = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
    // View 1's most likely option: a label, or empty for "none of them" (also when view 1 did not answer:
    // `top_probability` is unset then).
    string top_label = 3 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // View 1's probability of that option; unset when view 1 did not answer (`model_unavailable`, `no_labels`).
    optional double top_probability = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
    // View 1's probability of its second most likely option; unset when view 1 did not answer.
    optional double runner_up_probability = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    // View 2's probability of the top label, as it answered (before the combined probability puts it on view 1's
    // scale); unset when view 2 did not run (view 1's top was none, or a label below 0.4).
    optional double second_view_probability = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The combined probability the decision compares with its threshold (0.7): the mean of both views' on view 1's
    // scale, view 1's alone when view 2 did not run; for a top of none, view 1's p(none). Unset when view 1 did not
    // answer.
    optional double combined_probability = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The higher p(suspicious) of the two views; unset when view 1 did not answer.
    optional double suspicious_probability = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The higher p(needs_action) of the two views; unset when view 1 did not answer.
    optional double needs_action_probability = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The sender passed DMARC aligned with its From domain.
    bool authenticated = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The top label is a trust label (`Label.trust_implying`): it also needs an authenticated sender of a trusted
    // domain.
    bool trust_implying = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Why it was uncertain (the codes of `ReviewItem.reason`, and `no_labels`); empty for a confident decision.
    string reason = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // A pair of labels the replay and the owner disagreed on, and how often.
  message Mismatch {
    // What the replay decided: a label, or empty for "no label fits" (a confident none).
    string decided_label = 1 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // The owner's answer: a label, or empty for "none of them".
    string owner_label = 2 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "sort.ziyixi.science/Label"
    ];
    // The mails.
    int32 mail_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Always `replayEvaluation`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The evaluation's lifecycle.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When it started.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When its last mail was done; unset while running.
  google.protobuf.Timestamp complete_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The mails it covers: every review item the owner resolved in the 14 days before the start, with a label or
  // "none of them", at most 200, newest first.
  int32 total_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Mails decided again so far.
  int32 evaluated_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Mails Gmail no longer gives (deleted, or unreadable): not evaluated.
  int32 skipped_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of the evaluated mails, a confident label (what live mode would write).
  int32 auto_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, the label the owner chose.
  int32 auto_match_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of the evaluated mails, confident that no label fits.
  int32 no_label_count = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, answered "none of them" by the owner.
  int32 no_label_match_count = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of the evaluated mails, uncertain.
  int32 unsure_count = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Of those, the ones the review queue's daily quota would have shown (per UTC day of the original decision).
  int32 shown_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The confident decisions that differ from the owner's answer, per pair of labels, the most frequent first.
  repeated Mismatch mismatches = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The evaluated mails' decision numbers, in the order of their original decisions, at most 200 (every evaluated
  // mail: an evaluation covers at most 200). A mail evaluated before the numbers were recorded (2026-10-10) is
  // counted above but has no case.
  repeated Case cases = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The uncertain mails per reason (the codes of `Case.reason`).
  map<string, int32> reason_counts = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}
