// Tasks' Mail API and the weekly review's two Todofy facts. Tasks checks owner Access, Origin and CSRF, then calls
// it on Todofy's private Planning channel, which serves only these methods; no public host routes it.
syntax = "proto3";
package todofy.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "PlusServiceProto";
option java_package = "science.ziyixi.todofy.ui.v1";

// Mail in Tasks: the mail summaries and categories Todofy keeps, and the weekly review's two Todofy facts. Plan and
// Focus are Tasks' own API (tasks.ui.v1); the planning methods were retired (retired.json). The name is kept from
// the retired Todoist Plus extension: renaming a published service is a breaking change.
service PlusService {
  option (google.api.default_host) = "todofy.ziyixi.science";
  // The Mail inbox: summarised mail still awaiting a decision, newest first, independent of any task. The full
  // summary is read on demand (ReadMailSummary).
  rpc ListMailItems(ListMailItemsRequest) returns (ListMailItemsResponse) {
    option (google.api.http) = {get: "/api/plus/v1/mailItems"};
  }
  // Converts a pending mail entry to an Inbox task in Tasks on explicit owner action; a category adds its tag
  // and priority.
  rpc ConvertMailItem(ConvertMailItemRequest) returns (ConvertMailItemResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/mailItems:convertMailItem"
      body: "*"
    };
  }
  // Permanently deletes pending mail summaries, preserving event deduplication and every linked task.
  // (-- api-linter: core::0135=disabled
  //     aip.dev/not-precedent: a bounded batch action on summaries, not the Delete of one resource. --)
  rpc DeleteMailSummaries(DeleteMailSummariesRequest) returns (DeleteMailSummariesResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/mailItems:deleteSummaries"
      body: "*"
    };
  }
  // Replaces the mail categories, at most four tag and priority shortcuts, by etag. Sending the saved categories
  // again answers them as saved, whatever the etag.
  // (-- api-linter: core::0134=disabled
  //     aip.dev/not-precedent: replaces a complete bounded set by etag, without a resource update mask. --)
  rpc UpdateMailCategories(UpdateMailCategoriesRequest) returns (UpdateMailCategoriesResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/mailSettings:updateCategories"
      body: "*"
    };
  }
  // One mail's full Todofy summary, as plain text Tasks shows and never interprets.
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: reads one field of a mail Todofy keeps, not a resource of this service. --)
  rpc ReadMailSummary(ReadMailSummaryRequest) returns (ReadMailSummaryResponse) {
    option (google.api.http) = {get: "/api/plus/v1/mailItems:readMailSummary"};
  }
  // The mail categories and their etag.
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: a bounded settings read, not a stored resource. --)
  rpc ReadMailSettings(ReadMailSettingsRequest) returns (ReadMailSettingsResponse) {
    option (google.api.http) = {get: "/api/plus/v1/mailSettings:read"};
  }
  // The weekly review's two Todofy facts: the newest review task it created for this or the previous ISO week,
  // and the Mail entries still pending. No Tasks call.
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: reads two values Todofy keeps for Plan's weekly review, not a resource. --)
  rpc ReadWeeklyReview(ReadWeeklyReviewRequest) returns (ReadWeeklyReviewResponse) {
    option (google.api.http) = {get: "/api/plus/v1/weeklyReview:read"};
  }
}

// A task in Tasks as ConvertMailItem answers it: only id, title and project_id are set. The other fields were the
// retired planning methods'; they stay for the wire. No description.
message PlanningTask {
  // The Tasks task ID; never a title match or temporary browser ID.
  string id = 1;
  // Unmodified task title.
  string title = 2;
  // Empty for a root task.
  string parent_id = 3;
  // The Tasks project ID; the Inbox's ID for a task in the Inbox.
  string project_id = 4;
  // The task's ordinary labels, by name; planning facts are never labels.
  repeated string labels = 5;
  // none, quarterly, monthly, weekly or committed. Explicit stages beat date fallback.
  string stage = 6;
  // work, personal or unassigned (including ambiguous office+home).
  string area = 7;
  // Deprecated: the weekly Bets are WeeklyBet text now. Always false.
  bool bet = 8 [deprecated = true];
  // True deadline calendar date; empty when absent.
  string deadline = 9;
  // Scheduled date or date-time; independent of deadline.
  string due = 10;
  // Start-ahead days before the deadline, 0 to 365; zero when absent.
  int32 lead_days = 11;
  // Absent means unknown, not zero minutes.
  optional int32 estimated_minutes = 12;
  // Fingerprint checked before task mutations.
  string etag = 13;
  // The deadline has passed, or is within lead_days while the task is not waiting; never for an active or
  // parked task.
  bool must_start = 14;
  // A true deadline has no lead and is neither active nor parked.
  bool missing_lead = 15;
  // API priority, 1 to 4: 4 is P1, that is 5 minus the Tasks priority (MailCategory.priority is the domain
  // order).
  int32 priority = 16;
  // The task's last change in Tasks, in whole seconds; absent when unknown.
  // Any edit resets it, so it means untouched since, not waiting since.
  google.protobuf.Timestamp update_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether the task repeats: completing it advances the date and keeps the task and its ID.
  bool recurring = 18;
  // Tasks' count of completed occurrences, every completed recurrence included.
  optional int32 completed_count = 19;
  // sort_order when it is a whole number in int32 range; absent when it is fractional. Not part of etag.
  optional int32 child_order = 20;
  // Never set by Tasks: it was Todoist's fractional order key. Not part of etag.
  optional string order_key = 21;
  // The Tasks position among the tasks with the same project, section and parent, fractional midpoints
  // included.
  optional double sort_order = 22;
  // The stage saved in the planning store, before the scheduled-date fallback.
  optional string explicit_stage = 23;
  // Planning flags: quick, waiting, parked, active, onhold, routine or task.
  // These are planning facts, not task labels.
  repeated string planning_flags = 24;
  // The Tasks kind: task or step.
  string kind = 25;
  // The Tasks effort: deep, shallow or empty.
  string effort = 26;
}

// A reference into Tasks, by its own ID.
message ExternalRef {
  // Always tasks; a request that names another store is refused.
  string provider = 1 [(google.api.field_behavior) = REQUIRED];
  // The store's ID of the task, label or project.
  string external_id = 2 [(google.api.field_behavior) = REQUIRED];
}
// One summarised mail still awaiting a decision.
message MailItem {
  // The Mail Hero event ID, Todofy's own ID of the mail.
  string id = 1;
  // A task linked to the mail before the native cutover. Native mail has none: converting it creates the
  // task, and the mail then leaves this list.
  ExternalRef task = 2;
  // One plain sentence about the mail, at most 60 characters; empty when it has none.
  string brief = 3;
  // When Todofy received the mail.
  google.protobuf.Timestamp receive_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether ReadMailSummary has its full summary.
  bool has_summary = 5;
  // Mail subject, available before any task exists.
  string title = 6;
  // Version of the mailbox entry, checked when converting it to a task.
  string etag = 7;
}
// Reads a bounded page of the native Mail inbox.
message ListMailItemsRequest {
  // Default 25, maximum 50.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // Opaque cursor from the preceding page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}
// Pending mail and the optional label/priority shortcuts for creating a task.
// (-- api-linter: core::0132::response-unknown-fields=disabled
//     aip.dev/not-precedent: this bounded inbox view includes the same shortcuts and revision each row uses,
//     without another settings request. --)
message ListMailItemsResponse {
  // Mail entries in received order, newest first.
  repeated MailItem mail_items = 1;
  // Empty when the complete inbox has been read.
  string next_page_token = 2;
  // Optional shortcuts; no category is needed to create an Inbox task.
  repeated MailCategory categories = 3;
  // Version used when an optional shortcut is chosen.
  string categories_etag = 4;
}
// One of the owner's mail categories: an existing label and a priority. Its name is generated
// from them ("quick · P4"), so none is stored to rename.
message MailCategory {
  // Todofy's ID. Ignored by UpdateMailCategories, where a category with the label and priority of
  // a saved one keeps that one's ID.
  string id = 1 [(google.api.field_behavior) = OPTIONAL];
  // The label, by ID.
  ExternalRef label = 2 [(google.api.field_behavior) = REQUIRED];
  // P1 to P4.
  Priority priority = 3 [(google.api.field_behavior) = REQUIRED];
}
// Deprecated: never sent. It named the Inbox for the retired extension's builds before planning protocol 6.
message MailProject {
  // The project's ID.
  string id = 1;
  // Its current name.
  string display_name = 2;
  // Whether it is the account's Inbox.
  bool inbox = 3;
}
// Reads one mail's summary.
message ReadMailSummaryRequest {
  // The mail's ID (MailItem.id).
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}
// The summary as Todofy keeps it.
message ReadMailSummaryResponse {
  // Plain text, at most 64 KiB; empty when it is no longer available.
  string summary = 1;
}
// Converts one native MailItem to a generic task, without a preexisting task reference.
message ConvertMailItemRequest {
  // MailItem.id of the pending summary.
  string event_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The MailItem.etag shown to the owner.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // UUID reused when repeating this action.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Optional MailCategory.id to apply to the task.
  string category_id = 4 [(google.api.field_behavior) = OPTIONAL];
  // Categories version, required by the handler only when a shortcut is chosen.
  string categories_etag = 5 [(google.api.field_behavior) = OPTIONAL];
}
// The converted task; the full source summary remains available through ReadMailSummary.
message ConvertMailItemResponse {
  // The confirmed generic Inbox task: its ID, title and project.
  PlanningTask task = 1;
}
// Deletes a bounded set of pending native summaries only.
// (-- api-linter: core::0135=disabled
//     aip.dev/not-precedent: a batch action on summaries, not the Delete of one resource. --)
message DeleteMailSummariesRequest {
  // UUID reused when repeating this action.
  string request_id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // 1 to 200 MailItem IDs; linked tasks are retained.
  repeated string event_ids = 2 [(google.api.field_behavior) = REQUIRED];
}
// The outcome for each requested summary.
message DeleteMailSummariesResponse {
  // Deleted or already absent summaries.
  repeated string deleted_event_ids = 1;
  // Entries retained because they are no longer pending.
  repeated string kept_event_ids = 2;
}
// Replaces the optional native label/priority shortcuts.
// (-- api-linter: core::0134=disabled
//     aip.dev/not-precedent: replaces a complete bounded set by etag, without a resource update mask. --)
message UpdateMailCategoriesRequest {
  // At most four existing label/priority combinations; an empty list clears the shortcuts.
  repeated MailCategory categories = 1 [(google.api.field_behavior) = OPTIONAL];
  // Version of the displayed categories.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
}
// The native shortcuts after the replacement.
message UpdateMailCategoriesResponse {
  // Saved shortcuts in display order.
  repeated MailCategory categories = 1;
  // Version for the next replacement or conversion.
  string etag = 2;
}
// Reads the mail settings.
message ReadMailSettingsRequest {}
// The mail settings.
message ReadMailSettingsResponse {
  // The owner's mail categories, in their order.
  repeated MailCategory categories = 1;
  // Sent back by UpdateMailCategories.
  string etag = 2;
  // Deprecated: never sent. The retired extension's builds before planning protocol 6 read the Inbox here.
  ExternalRef destination = 3;
  // Deprecated: never sent, for the same builds.
  repeated MailProject projects = 4;
}
// Reads the weekly review's facts for one account week.
message ReadWeeklyReviewRequest {
  // The Monday of the account week, YYYY-MM-DD, as Tasks' Plan gives it.
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: an account-local calendar day, the same key as Plan.week_start. --)
  string week_start = 1 [(google.api.field_behavior) = REQUIRED];
}
// The weekly review's Todofy facts.
message ReadWeeklyReviewResponse {
  // The newest weekly review task Todofy created for that or the previous ISO week; empty when there is none. It
  // may already be completed: only the open task list says it is open.
  string review_task_id = 1;
  // Mail entries still awaiting a decision.
  int32 mailbox_pending_count = 2;
}

// A priority in the domain's order, P1 the most urgent, as in Tasks.
enum Priority {
  // Never written.
  PRIORITY_UNSPECIFIED = 0;
  // P1.
  PRIORITY_P1 = 1;
  // P2.
  PRIORITY_P2 = 2;
  // P3.
  PRIORITY_P3 = 3;
  // P4, the default.
  PRIORITY_P4 = 4;
}

// How much of the plan an answer carried (AIP-157). Unused since ReadPlan was retired; it stays because retired.json
// has no kind for a top-level enum.
enum PlanView {
  // FULL, the answer before views existed.
  PLAN_VIEW_UNSPECIFIED = 0;
  // The settings and dates only: inbox_project_id, review_task_id, next_week_task_ids,
  // dependencies and lane_orders are left out, which saves the weekly review's D1 read.
  PLAN_VIEW_BASIC = 1;
  // Every field.
  PLAN_VIEW_FULL = 2;
}
