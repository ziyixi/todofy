// Todoist Plus planning API. Owner setup uses Access, same-origin and CSRF. The
// extension calls only this API on the hooks host with its own revocable token.
syntax = "proto3";
package todofy.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "PlusServiceProto";
option java_package = "science.ziyixi.todofy.ui.v1";

// Personal planning, backed by Todoist tasks and the owner's existing labels.
service PlusService {
  option (google.api.default_host) = "todofy.ziyixi.science";
  // Account week and the discovered label/filter mapping, without task content.
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: returns a live external-account projection, not a resource in this service. --)
  rpc ReadPlan(ReadPlanRequest) returns (ReadPlanResponse) {
    option (google.api.http) = {get: "/api/plus/v1/plan:read"};
  }
  // A bounded page of active Todoist tasks. Read all pages before showing counts.
  rpc ListPlanningTasks(ListPlanningTasksRequest) returns (ListPlanningTasksResponse) {
    option (google.api.http) = {get: "/api/plus/v1/tasks"};
  }
  // Replaces the selected planning fields only; unrelated labels are retained.
  // (-- api-linter: core::0134::synonyms=disabled
  //     aip.dev/not-precedent: this action changes external Todoist labels, not a stored Plan resource. --)
  rpc SetTaskPlan(SetTaskPlanRequest) returns (SetTaskPlanResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:setTaskPlan"
      body: "*"
    };
  }
  // Appends up to 20 child tasks using stable Todoist Sync command UUIDs.
  rpc AppendTaskSteps(AppendTaskStepsRequest) returns (AppendTaskStepsResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:appendTaskSteps"
      body: "*"
    };
  }
  // Updates the true deadline and lead window, leaving scheduled date unchanged.
  // (-- api-linter: core::0134::synonyms=disabled
  //     aip.dev/not-precedent: this action updates a Todoist deadline and labels together. --)
  rpc SetTaskLead(SetTaskLeadRequest) returns (SetTaskLeadResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:setTaskLead"
      body: "*"
    };
  }
  // Todoist item_close: complete an ordinary task or advance one recurrence.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:completeTask"
      body: "*"
    };
  }
  // Replaces the three planning-column bindings and optional Quarter binding.
  // Configuration only: existing task labels and dates are not rewritten.
  // (-- api-linter: core::0134=disabled
  //     aip.dev/not-precedent: an atomic configuration action with etag and request identity,
  //     rather than a field-mask update to a PlanLabels resource. --)
  rpc UpdatePlanLabels(UpdatePlanLabelsRequest) returns (UpdatePlanLabelsResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/plan:updatePlanLabels"
      body: "*"
    };
  }
  // Owner-only: accept the current mapping and enable the weekly reset.
  rpc ConfirmPlanMapping(ConfirmPlanMappingRequest) returns (ConfirmPlanMappingResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/plan:confirmPlanMapping"
      body: "*"
    };
  }
  // Owner-only: a token is returned once; only its digest is stored.
  rpc IssueExtensionConnection(IssueExtensionConnectionRequest) returns (IssueExtensionConnectionResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/connections:issueExtensionConnection"
      body: "*"
    };
  }
  // Owner-only: connection names and IDs, never token values or digests.
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: bounded credential settings, no paginated collection or individual Get. --)
  rpc ReadExtensionConnections(ReadExtensionConnectionsRequest) returns (ReadExtensionConnectionsResponse) {
    option (google.api.http) = {get: "/api/plus/v1/connections:read"};
  }
  // Owner-only: disables one token without changing task or planning history.
  rpc RevokeExtensionConnection(RevokeExtensionConnectionRequest) returns (RevokeExtensionConnectionResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/connections:revokeExtensionConnection"
      body: "*"
    };
  }
  // Adds or removes one dependency between two tasks. Kept only in Todofy's planning store: Todoist is never
  // written, so no title, description, comment, label or update time changes. A value write without a
  // receipt: adding a dependency that exists keeps it as it is.
  // (-- api-linter: core::0134::synonyms=disabled
  //     aip.dev/not-precedent: adds or removes one link between two external tasks, not a stored resource. --)
  rpc SetTaskDependency(SetTaskDependencyRequest) returns (SetTaskDependencyResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:setTaskDependency"
      body: "*"
    };
  }
  // Settles the dependencies of tasks that a complete task read no longer lists, after Todoist confirms they
  // are not active: a task that waited has its dependencies removed; a prerequisite is recorded as completed,
  // or, when it was deleted, the dependencies on it are removed. Todofy's store only; Todoist is only read.
  rpc ResolveDependencies(ResolveDependenciesRequest) returns (ResolveDependenciesResponse) {
    option (google.api.http) = {
      post: "/api/plus/v1/tasks:resolveDependencies"
      body: "*"
    };
  }
  // Owner-only: counts that check the planning store after a restore or a migration, never its content.
  rpc VerifyPlanStore(VerifyPlanStoreRequest) returns (VerifyPlanStoreResponse) {
    option (google.api.http) = {get: "/api/plus/v1/plan:verifyPlanStore"};
  }
}

// One known planning label, discovered from the owner's Todoist account.
message LabelMapping {
  // Logical role: office, home, bets, quarter, committed, focus, candiate or lead_*.
  string role = 1;
  // Exact Todoist label ID.
  string id = 2;
  // Current Todoist label name.
  string label = 3;
}
// One current Todoist label available for an explicit column binding.
message AvailableLabel {
  // Exact Todoist label ID.
  string id = 1;
  // Exact current name; identity selection uses id.
  string label = 2;
}
// Account-local planning settings.
message Plan {
  // IANA timezone supplied by Todoist.
  // (-- api-linter: core::0143::standardized-codes=disabled
  //     aip.dev/not-precedent: matches Todoist's timezone property and existing app naming. --)
  string timezone = 1;
  // Monday's account-local calendar date, YYYY-MM-DD.
  string week_start = 2;
  // Whether the owner confirmed this mapping and enabled planning writes/reset.
  bool enabled = 3;
  // Discovered known labels. Missing roles are listed separately.
  repeated LabelMapping labels = 4;
  // Exact filter IDs whose UI is replaced; unrelated favorites remain visible.
  repeated string hidden_filter_ids = 5;
  // Label roles that must be created in Todoist before confirmation.
  repeated string missing_labels = 6;
  // Fingerprint of the discovered label IDs/names and timezone.
  string etag = 7;
  // Account-local YYYY-MM-DD for deadline calculations.
  string today = 8;
  // Configured owner FlowDay URL for local tasks that have no native Todoist page.
  string flowday_url = 9;
  // At most 500 current labels. No credential or other account metadata.
  repeated AvailableLabel available_labels = 10;
  // Todoist project that receives Todofy's mail tasks, for the weekly review's inbox line.
  // Empty when none is configured.
  string inbox_project_id = 11;
  // Newest weekly review task Todofy created, for this or the previous ISO week; empty when
  // there is none. It may already be completed: only the active task list says it is open.
  string review_task_id = 12;
  // At most 100 tasks recorded for the next week: a commitment or Bet chosen on this
  // week's last day, which the coming Monday reset leaves in place.
  repeated string next_week_task_ids = 13;
  // Every dependency, at most 300, IDs only. Left out of the BASIC view.
  repeated TaskDependency dependencies = 14;
}
// One task waits for another: task_id should not start before prerequisite_id is done. IDs are in the ID space
// of the service that answers (PlusService: Todoist task IDs); Todofy stores the link by its own task IDs.
message TaskDependency {
  // The task that waits.
  string task_id = 1;
  // The task it waits for.
  string prerequisite_id = 2;
  // The prerequisite's completed_count when the dependency was added: a recurring prerequisite, which stays
  // active, satisfies it with its next completion (a count above this one).
  int32 baseline_completed_count = 3;
  // Todofy confirmed that the prerequisite was completed, not deleted. The active task list comes first: a
  // prerequisite listed there is not done, whatever this says.
  bool done = 4;
}
// An active Todoist task with derived planning fields. No description is fetched for display.
message PlanningTask {
  // Todoist task ID; never a title match or temporary browser ID.
  string id = 1;
  // Unmodified task title. Display-only marker cleanup belongs in the extension.
  string title = 2;
  // Empty for a root task.
  string parent_id = 3;
  // Todoist project ID.
  string project_id = 4;
  // Existing labels, including labels the extension does not manage.
  repeated string labels = 5;
  // none, quarterly, monthly, weekly or committed. Explicit stages beat date fallback.
  string stage = 6;
  // work, personal or unassigned (including ambiguous office+home).
  string area = 7;
  // Whether the task carries the current Bets label.
  bool bet = 8;
  // True deadline calendar date; empty when absent.
  string deadline = 9;
  // Scheduled date or date-time; independent of deadline.
  string due = 10;
  // 0, 1, 3, 7, 14 or 30 days; zero when absent.
  int32 lead_days = 11;
  // Absent means unknown, not zero minutes.
  optional int32 estimated_minutes = 12;
  // Fingerprint checked before task mutations.
  string etag = 13;
  // The existing Must Start filter's deadline/lead and exclusion semantics.
  bool must_start = 14;
  // A true deadline has no lead and is neither active nor parked.
  bool missing_lead = 15;
  // Todoist priority, 1 to 4.
  int32 priority = 16;
  // Todoist's last change to the task, in whole seconds; absent when Todoist does not say.
  // Any edit resets it, so it means untouched since, not waiting since.
  google.protobuf.Timestamp update_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether the scheduled date repeats (Todoist's due.is_recurring): completing it advances the date and keeps
  // the task and its ID.
  bool recurring = 18;
  // Todoist's completion counter, which counts every completed recurrence and goes down when one is undone;
  // absent when Todoist does not say.
  optional int32 completed_count = 19;
}
// Reads the singleton plan.
message ReadPlanRequest {
  // FULL by default (UNSPECIFIED), or BASIC.
  PlanView view = 1 [(google.api.field_behavior) = OPTIONAL];
}
// Account metadata without task content.
message ReadPlanResponse {
  // Current account planning metadata.
  Plan plan = 1;
}
// A page of active tasks; maximum page_size is 200.
message ListPlanningTasksRequest {
  // Default 100, maximum 200.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // Opaque cursor from the preceding response.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}
// A page is never a complete task count when next_page_token is present.
message ListPlanningTasksResponse {
  // Tasks from this page.
  repeated PlanningTask planning_tasks = 1;
  // Empty only when all active tasks have been returned.
  string next_page_token = 2;
}
// A deliberate planning change. Omitted optional fields remain unchanged.
message SetTaskPlanRequest {
  // Todoist task ID.
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Fingerprint of the task shown to the user.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // UUID reused when repeating this action.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // none, quarterly, monthly, weekly or committed.
  optional string stage = 4;
  // work, personal or unassigned.
  optional string area = 5;
  // Adds/removes Bets without changing stage unless stage is also provided.
  optional bool bet = 6;
  // Adds or removes the literal `active` label (in progress). It is never created: adding
  // it fails while the account has no label of that exact name.
  optional bool active = 7;
}
// The task after a successful planning change.
message SetTaskPlanResponse {
  // Current task values.
  PlanningTask task = 1;
}
// A child title and optional estimate.
message TaskStep {
  // Nonempty title, at most 500 characters.
  string title = 1 [(google.api.field_behavior) = REQUIRED];
  // Absent is unknown. Two hours and above are a UI warning, not rejected.
  optional int32 estimated_minutes = 2;
}
// Creates only explicitly submitted child tasks, with at most 20 per action.
message AppendTaskStepsRequest {
  // Existing Todoist parent task.
  string parent_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID.
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // In entered order.
  repeated TaskStep steps = 3 [(google.api.field_behavior) = REQUIRED];
}
// IDs returned by Todoist for this action, in entered order.
message AppendTaskStepsResponse {
  // Created child IDs in entered order.
  repeated string task_ids = 1;
}
// Sets lead and deadline together; an empty deadline explicitly clears it.
message SetTaskLeadRequest {
  // Existing Todoist task.
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Fingerprint of the task shown to the user.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // True calendar deadline YYYY-MM-DD, or empty to clear.
  string deadline = 4 [(google.api.field_behavior) = OPTIONAL];
  // 0 clears; allowed windows are 1, 3, 7, 14 and 30 days.
  int32 lead_days = 5 [(google.api.field_behavior) = OPTIONAL];
}
// Updated deadline and label values.
message SetTaskLeadResponse {
  // Current task values.
  PlanningTask task = 1;
}
// Completes one task, using Todoist's recurring-task semantics.
message CompleteTaskRequest {
  // Task ID, never a parent automatically chosen by the server.
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID protects a recurring task from advancing twice.
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Focus day to settle after Todoist confirms completion; empty outside Focus.
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: account-local calendar day, not an instant; same field as FlowDay. --)
  string flow_date = 3 [(google.api.field_behavior) = OPTIONAL];
}
// Acknowledges the actual Todoist command, not a local optimistic completion.
message CompleteTaskResponse {
  // The task whose close command succeeded.
  string task_id = 1;
}
// Adds or removes one dependency between two active tasks.
message SetTaskDependencyRequest {
  // The task that waits.
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The task it waits for: another active task, not one that already waits for task_id, directly or through
  // others. A recurring prerequisite needs Todoist's completed_count.
  string prerequisite_id = 2 [(google.api.field_behavior) = REQUIRED];
  // True adds the dependency, false (the default) removes it. A task waits for at most 5 tasks, and there
  // are at most 300 dependencies in all.
  bool waits = 3 [(google.api.field_behavior) = OPTIONAL];
  // Stable action UUID, for the transport; a dependency write is idempotent by value.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}
// The dependencies of task_id after the write.
message SetTaskDependencyResponse {
  // What the task waits for now.
  repeated TaskDependency dependencies = 1;
}
// Tasks a complete read of the active tasks did not list, which appear in dependencies.
message ResolveDependenciesRequest {
  // Stable action UUID, for the transport; settling is idempotent by value.
  string request_id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // At most 20 Todoist task IDs.
  repeated string task_ids = 2 [(google.api.field_behavior) = REQUIRED];
}
// Every dependency after settling, and the tasks that no longer wait because what they waited for was deleted.
message ResolveDependenciesResponse {
  // Every dependency, as in Plan.dependencies.
  repeated TaskDependency dependencies = 1;
  // Tasks whose dependency on a deleted task was removed in this call, for a one-time notice.
  repeated string dropped_task_ids = 2;
}
// Replaces this bounded role set. Quarter may be omitted to leave it unbound.
// (-- api-linter: core::0134=disabled
//     aip.dev/not-precedent: the complete bounded binding set is replaced atomically,
//     with no partial resource fields or update mask. --)
message UpdatePlanLabelsRequest {
  // Exactly candiate, focus and committed, plus optional quarter; at most four.
  // Each ID and name must match a current label and cannot reuse another role's ID.
  repeated PlanningLabelBinding labels = 1 [(google.api.field_behavior) = REQUIRED];
  // Fingerprint returned by ReadPlan, checked before configuration writes.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID; a repeated request returns the stored configuration receipt.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}
// An input binding for one planning column; every identity component is required.
message PlanningLabelBinding {
  // quarter, candiate, focus or committed.
  string role = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact current Todoist label ID.
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  // Exact current Todoist label name, checked together with id.
  string label = 3 [(google.api.field_behavior) = REQUIRED];
}
// The verified mapping after a configuration-only update.
message UpdatePlanLabelsResponse {
  // Current account planning metadata.
  Plan plan = 1;
}
// Owner confirmation binds the exact discovered labels/timezone.
message ConfirmPlanMappingRequest {
  // Fingerprint returned by ReadPlan.
  string etag = 1 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID.
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}
// The mapping after explicit confirmation.
message ConfirmPlanMappingResponse {
  // Current account planning metadata.
  Plan plan = 1;
}
// Owner creates a named, independently revocable extension credential.
message IssueExtensionConnectionRequest {
  // Human readable device name, 1 to 60 characters.
  string display_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID; a repeated create never returns the token again.
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}
// Metadata for one extension connection.
message ExtensionConnection {
  // Opaque ID.
  string id = 1;
  // Owner supplied device name.
  string display_name = 2;
  // Whether the credential has been revoked.
  bool revoked = 3;
}
// The credential is present on the first successful create only.
message IssueExtensionConnectionResponse {
  // Connection metadata.
  ExtensionConnection connection = 1;
  // One-time plaintext credential; never logged or saved by the server.
  string token = 2;
}
// Lists at most 30 connection records; revoked records are included.
message ReadExtensionConnectionsRequest {}
// Named connections without credentials.
message ReadExtensionConnectionsResponse {
  // Up to 30 named connections.
  repeated ExtensionConnection connections = 1;
}
// Revokes precisely one connection.
message RevokeExtensionConnectionRequest {
  // ID returned at creation or in the list.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Stable action UUID.
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}
// Revocation is idempotent.
message RevokeExtensionConnectionResponse {}
// Reads the planning store's counts.
message VerifyPlanStoreRequest {}
// Rows per planning table, to compare with a backup manifest, and the rows that break one of the store's rules.
// Every rule count is zero in a healthy store; an absent count is zero.
message VerifyPlanStoreResponse {
  // Rows of plan_settings.
  int32 settings_row_count = 1;
  // Rows of plan_tasks, Todofy's task identities.
  int32 task_row_count = 2;
  // Rows of plan_marks.
  int32 mark_row_count = 3;
  // Rows of plan_edges.
  int32 edge_row_count = 4;
  // Rows of plan_notes.
  int32 note_row_count = 5;
  // Rows of plan_categories.
  int32 category_row_count = 6;
  // Marks whose task identity is missing.
  int32 orphan_mark_count = 7;
  // Edges either of whose task identities is missing.
  int32 orphan_edge_count = 8;
  // Rows whose setting key, provider, kind or scheme this build does not know, and settings that are not a JSON
  // object.
  int32 unknown_value_count = 9;
  // Tasks over the dependency limit, a dependency total over its limit, and schemes over the active category limit.
  int32 limit_violation_count = 10;
}

// How much of the plan an answer carries (AIP-157).
enum PlanView {
  // FULL, the answer before views existed (extension builds that send no view).
  PLAN_VIEW_UNSPECIFIED = 0;
  // The mapping and dates only, for a native Todoist page: inbox_project_id, review_task_id,
  // next_week_task_ids and dependencies are left out, which saves the weekly review's D1 read.
  PLAN_VIEW_BASIC = 1;
  // Every field.
  PLAN_VIEW_FULL = 2;
}
