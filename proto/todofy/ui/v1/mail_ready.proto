// Private, bounded readiness polling for Mail. The MCP stores its cursor and polls only while subscribed.
syntax = "proto3";

package todofy.ui.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "MailReadyProto";
option java_package = "science.ziyixi.todofy.ui.v1";

// Only the private MailApi service binding serves this method. Public hosts do not route it.
service MailReadinessService {
  option (google.api.default_host) = "todofy.ziyixi.science";

  // Reads at most 50 existing ledger transitions, then returns the mail summaries still awaiting a decision.
  // (-- api-linter: core::0136::http-uri-suffix=disabled
  //     aip.dev/not-precedent: the private readiness action uses pollReady beside the existing Mail actions. --)
  rpc PollMailReady(PollMailReadyRequest) returns (PollMailReadyResponse) {
    option (google.api.http) = {get: "/api/plus/v1/mailItems:pollReady"};
  }
}

// Starts at the current ledger head, or continues after the last scanned transition.
message PollMailReadyRequest {
  // True only when starting a subscription: return the current cursor with no historical events. Cursor must be empty.
  bool baseline = 1 [(google.api.field_behavior) = OPTIONAL];
  // The previous response's cursor, required unless baseline is true. Opaque to the caller.
  string cursor = 2 [(google.api.field_behavior) = OPTIONAL];
}

// A summary is ready. Its content is read separately with ReadMailSummary.
message MailReadyItem {
  // The stable Mail event ID; retrying a poll does not change its identity.
  string event_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When Todofy committed the completed summary.
  google.protobuf.Timestamp ready_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The last scanned transition and the ready mail found within that bounded scan.
message PollMailReadyResponse {
  // Advances past scanned non-mail and canary transitions too. Keep it even when mail_items is empty.
  string cursor = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // At most 50 native pending summaries; no subject, brief, body or other personal content.
  repeated MailReadyItem mail_items = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Reasons specific to the private Mail readiness API.
enum MailReadinessErrorReason {
  // Never sent.
  MAIL_READINESS_ERROR_REASON_UNSPECIFIED = 0;
  // FAILED_PRECONDITION: the database head is behind the saved cursor; explicitly reset the reader baseline.
  MAIL_READINESS_ERROR_REASON_CURSOR_RESET_REQUIRED = 1;
}
