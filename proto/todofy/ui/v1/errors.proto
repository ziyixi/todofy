// The errors of TodofyUiService (AIP-193).
//
// Every error is a google.rpc.Status in Google's HTTP JSON form, written by the shared transcoder
// (proto/ts/http-transcoder.ts) in the gateway Worker "todofy":
//
//   {"error": {"code": <HTTP status>, "message": <English, for developers>, "status": <google.rpc.Code name>,
//              "details": [
//                {"@type": "type.googleapis.com/google.rpc.ErrorInfo", "reason": "ETAG_MISMATCH",
//                 "domain": "todofy.ziyixi.science"},
//                {"@type": "type.googleapis.com/google.rpc.LocalizedMessage", "locale": "zh-CN", "message": ...},
//                {"@type": "type.googleapis.com/google.rpc.RequestInfo", "request_id": <16 hex>},
//                {"@type": "type.googleapis.com/todofy.ui.v1.MailEvent", ...}]}}
//
// The UI branches on ErrorInfo.reason only: a value name without its prefix, of ErrorReason below (Todofy's own
// reasons) or of common.errors.v1.CommonReason (the reasons every API shares). A reason the UI does not know is
// shown with the LocalizedMessage, never read as success. A Retry-After header comes with RATE_LIMITED and
// MAINTENANCE.

syntax = "proto3";

package todofy.ui.v1;

option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "science.ziyixi.todofy.ui.v1";

// Todofy's own reasons: ErrorInfo.reason is the value's name without `ERROR_REASON_`. The HTTP status follows
// the google.rpc.Code listed for each value (the AIP-193 mapping).
enum ErrorReason {
  // Never sent.
  ERROR_REASON_UNSPECIFIED = 0;
  // ABORTED (409): the request's etag is stale (AIP-154): the event changed since the owner saw it. The error
  // carries the current todofy.ui.v1.MailEvent as a detail.
  ERROR_REASON_ETAG_MISMATCH = 1;
  // FAILED_PRECONDITION (400): the action is not among the event's `allowed_actions` now. The error carries the
  // current todofy.ui.v1.MailEvent as a detail.
  ERROR_REASON_ACTION_NOT_ALLOWED = 2;
  // INVALID_ARGUMENT (400): the request_id was used for another request (another action, event, etag or task
  // ID, or another report). Nothing changed.
  ERROR_REASON_REQUEST_ID_REUSED = 3;
  // RESOURCE_EXHAUSTED (429): the hour's report computations (30, shared with the newsletter's on-demand
  // reports) are used up; Retry-After gives the seconds to the next UTC hour.
  ERROR_REASON_RATE_LIMITED = 4;
  // UNAVAILABLE (503): MAINTENANCE_MODE is on, so the owner's writes wait; Retry-After 300.
  ERROR_REASON_MAINTENANCE = 5;
}
