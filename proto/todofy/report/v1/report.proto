// recommendation-v1 and summary-v1 as a protobuf IDL (proto/README.md): the daily reports Todofy serves the
// newsletter at GET /api/recommendation and GET /api/summary (Basic auth; todofy/docs/gateway-contract.md), and
// lists to its owner (the owner API's ReportsLatest).
//
// This file is the one description of both reports: their fields, enums and value rules (common.wire.v1). The
// wire stays the JSON Todofy has always sent, byte for byte: field names, field-number order (each message's
// fields are numbered in the order todofy-core writes them, which is not the order the hand-written schemas
// listed them in), enums as their lower-case names. todofy/api/recommendation-v1.schema.json and
// summary-v1.schema.json are generated from it (proto/tools/gen_schema.py, self-contained: the owner API's
// OpenAPI document refers to them and openapi-typescript would hoist $defs into its components), todofy-core
// builds every report as a generated message written by the codec, which checks the rules before a byte is
// stored or sent, and Todofy's UI takes the reports' types from the generated wire types.
//
// The rules are the newsletter's acceptance rules (newsletter src/newsletter/todofy.py _decode and
// _decode_recommendation), so a report that keeps them is one the newsletter accepts: no control characters
// but tab, line feed and carriage return, text that is not blank (Python's str.strip(), the newsletter's test,
// so the whitespace below is Python's, not ECMAScript's \s), bounded lengths and counts, no tasks when the model
// saw no mail, a summary of the window whenever it saw some. What a rule cannot say stays with todofy-core:
// ranks are unique and at most top_n (core/report_schema.py parse_recommendations).
//
// One verdict changed on purpose. The hand-written schemas wrote "not blank" as \S, which Python's re reads as the
// newsletter does but ECMAScript (the regular expressions JSON Schema specifies, and ajv's) reads differently on two
// characters: it took U+0085 (next line, whitespace to str.strip()) for a visible character and U+FEFF (zero width
// no-break space, which str.strip() keeps) for whitespace. The patterns below follow the newsletter, so for an
// ECMAScript validator a text made only of U+0085 is now refused and one made only of U+FEFF is now valid; no other
// text's verdict changed in either dialect (todofy/web/src/api/report-schema-dialect.test.ts and
// todofy/tests/unit/test_report_schema_legacy.py), and no byte Todofy sends changed. The whitespace is written as
// \u escapes so that a reviewer sees each character.
//
// `stale` is kept for compatibility and is never written: no production Todofy ever sent it (the Go service had
// no status; the Worker dropped it before its cutover on 2026-09-29). It stood for an older report served late,
// so its rules are those of a report: a summary that is not blank, and a recommendation with at least one mail
// in its window.
//
// Google's api-linter runs on this file (scripts/api-lint.sh). The rules it cannot meet without changing the
// reports' frozen wire are disabled where they apply, each with its reason. File-wide (api-linter reads them
// from this header):
//
// (-- api-linter: core::0142::time-field-type=disabled
//     aip.dev/not-precedent: the reports' timestamps are strings of whole seconds (`Time`); the profile's
//     google.protobuf.Timestamp would also accept fractions the newsletter's contract never had. --)
// (-- api-linter: core::0142::time-field-names=disabled
//     aip.dev/not-precedent: the reports' wire names (computed_at, window_start, window_end). --)
// (-- api-linter: core::0140::prepositions=disabled
//     aip.dev/not-precedent: the reports' wire names (computed_at). --)

syntax = "proto3";

package todofy.report.v1;

import "common/wire/v1/wire.proto";
import "google/api/field_behavior.proto";

option java_multiple_files = true;
option java_outer_classname = "ReportProto";
option java_package = "science.ziyixi.todofy.report.v1";
option (common.wire.v1.formats) = {
  name: "Time"
  pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z"
  description: "UTC RFC 3339 with whole seconds and Z, like every timestamp of the reports."
  json_schema_format: "date-time"
};
option (common.wire.v1.formats) = {
  name: "Title"
  pattern: "[\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]*[^\x00-\x08\x0b\x0c\x0e-\x1f\x7f\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\x00-\x08\x0b\x0c\x0e-\x1f\x7f]*"
  max_length: 200
  description: "A task's title: not blank (Python's whitespace), no control characters but tab, line feed and carriage return."
};
option (common.wire.v1.formats) = {
  name: "Reason"
  pattern: "[\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]*[^\x00-\x08\x0b\x0c\x0e-\x1f\x7f\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\x00-\x08\x0b\x0c\x0e-\x1f\x7f]*"
  max_length: 4000
  description: "Why a task matters: the same rules as a title, longer."
};
option (common.wire.v1.formats) = {
  name: "SummaryText"
  pattern: "[\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]*[^\x00-\x08\x0b\x0c\x0e-\x1f\x7f\t\n\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\x00-\x08\x0b\x0c\x0e-\x1f\x7f]*"
  max_length: 12000
  description: "The daily summary: the same rules as a title, longer."
};

// Todofy GET /api/summary response: the daily summary the newsletter reads. summary, task_count and
// time_window_hours are the Go service's fields (handle_summary.go @ 6c46ed4) and keep their meaning; the rest
// were added by the Worker. Fields may be added, never removed or retyped, so consumers must ignore unknown fields.
// The limits are the newsletter's acceptance rules (newsletter src/newsletter/todofy.py _decode), so any response
// that validates is one the newsletter accepts.
message SummaryReport {
  option (common.wire.v1.message).discriminator = "status";

  // Plain text from the daily-summary prompt, or the legacy English sentence when the window is empty. Not blank;
  // no control characters other than tab, line feed and carriage return.
  string summary = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      format: "SummaryText"
      cases: {
        when: "empty_window"
        rules: {allowed: "As there is no new task in the last 24 hours, there will have no summary. Please check your service as it's highly not possible that there is no new task in the last 24 hours.\n"}
      }
    }
  ];
  // Summaries in the window: at least one when ok, none when the window was empty.
  int32 task_count = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 1000000
      cases: {
        when: "ok"
        rules: {minimum: 1}
      }
      cases: {
        when: "empty_window"
        rules: {maximum: 0}
      }
    }
  ];
  // The window's length: always 24.
  int32 time_window_hours = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 24
      maximum: 24
    }
  ];
  // The Worker sends only ok and empty_window.
  ReportStatus status = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      non_null: true
      allowed: [
        "ok",
        "empty_window",
        "stale"
      ]
    }
  ];
  // Gemini model name; empty when no model was called.
  string model = 5 [(google.api.field_behavior) = REQUIRED];
  // When the report was computed.
  string computed_at = 6 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
  // The window's start (exclusive): 24 hours before its end.
  string window_start = 7 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
  // The window's end (inclusive): computed_at.
  string window_end = 8 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
}

// Todofy GET /api/recommendation response: the ranked tasks the newsletter reads (it asks for ?top=10). tasks,
// model and task_count are the Go service's fields (handle_recommendation.go @ 6c46ed4); model is now a model name
// rather than a proto enum name, and unparsable model output is reported as status model_output_invalid with no
// tasks instead of being passed through as a fake task. Fields may be added, never removed or retyped, so
// consumers must ignore unknown fields. The limits are the newsletter's acceptance rules (newsletter
// src/newsletter/todofy.py _decode_recommendation), so any response that validates is one the newsletter accepts.
// Ranks are unique and at most top_n, which JSON Schema cannot express.
message RecommendationReport {
  option (common.wire.v1.message).discriminator = "status";

  // Exactly what the Worker accepted from Gemini (JSON output constrained by the responseSchema from
  // core/report_schema.py), ordered by rank. At most top_n items with ranks 1..top_n; fewer, even none, is valid and
  // never padded. None when the window was empty or the model's output could not be used.
  repeated RecommendedTask tasks = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      max_items: 10
      cases: {
        when: [
          "empty_window",
          "model_output_invalid"
        ]
        rules: {empty: true}
      }
    }
  ];
  // Gemini model name; empty when no model was called.
  string model = 2 [(google.api.field_behavior) = REQUIRED];
  // Summaries the model saw: new_count + carryover_count (a rule cannot express the sum). At least one when ok, none
  // when the window was empty.
  int32 task_count = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 1000000
      cases: {
        when: [
          "ok",
          "stale"
        ]
        rules: {minimum: 1}
      }
      cases: {
        when: "empty_window"
        rules: {maximum: 0}
      }
    }
  ];
  // The newsletter endpoint sends only ok and empty_window; model_output_invalid appears only in stored copies the
  // owner API lists.
  ReportStatus status = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // How many tasks were asked for (the `top` query parameter, 1-10).
  int32 top_n = 5 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 1
      maximum: 10
    }
  ];
  // When the report was computed.
  string computed_at = 6 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
  // The window's start (exclusive): 24 hours before its end.
  string window_start = 7 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
  // The window's end (inclusive): computed_at.
  string window_end = 8 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Time"
  ];
  // Summaries of mail that arrived in the 24 h window (window_start, window_end]. Added 2026-09-30; absent from
  // reports stored before.
  optional int32 new_count = 9 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 1000000
  }];
  // Older mail tasks (up to 14 days, at most 30) that the day's Todoist snapshot still lists as open, shown to the
  // model as "[N 天前] summary"; 0 when no usable snapshot existed, and then the report is exactly the 24 h one.
  // Added 2026-09-30; absent from reports stored before.
  optional int32 carryover_count = 10 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 1000000
  }];
}

// One recommended task.
message RecommendedTask {
  // Its rank, 1 first.
  int32 rank = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 1
      maximum: 10
    }
  ];
  // Not blank; no control characters other than tab, line feed and carriage return.
  string title = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Title"
  ];
  // Why it matters. Same rules as title.
  string reason = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Reason"
  ];
}

// What a report is. Both reports share it; the summary has no model output to refuse, so it never has
// `model_output_invalid`. Closed: Todofy's UI labels every value, and the JSON Schemas list them, so a new status is
// a new major version.
// (-- api-linter: core::0216::synonyms=disabled
//     aip.dev/not-precedent: an outcome of one computation, not a lifecycle state; the field's wire name is
//     `status`. --)
enum ReportStatus {
  option (common.wire.v1.closed) = true;

  // Never written.
  REPORT_STATUS_UNSPECIFIED = 0;
  // A report of the window's mail. The newsletter endpoints send it.
  REPORT_STATUS_OK = 1;
  // No mail arrived in the window (and, for a recommendation, none was carried over). The newsletter endpoints
  // send it.
  REPORT_STATUS_EMPTY_WINDOW = 2;
  // The model's recommendation could not be used: no tasks. Only in stored copies the owner API lists; the
  // newsletter endpoint answers 503 instead.
  REPORT_STATUS_MODEL_OUTPUT_INVALID = 3;
  // Kept for compatibility and no longer sent: without a report computed since the latest precompute time, the
  // endpoints answer 503.
  REPORT_STATUS_STALE = 4;
}
