// Content-free host telemetry. Signed raw JSON bytes are authenticated before decoding.
syntax = "proto3";
package fleet.telemetry.v1;

import "common/wire/v1/wire.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "platform/runtime/v1/runtime.proto";

option java_multiple_files = true;
option java_outer_classname = "HostReportProto";
option java_package = "science.ziyixi.fleet.telemetry.v1";
option (common.wire.v1.formats) = {
  name: "Code"
  pattern: "[a-z][a-z0-9_-]{0,31}"
  description: "Public configured alias. Never a hostname, path or free text."
};
option (common.wire.v1.formats) = {
  name: "Sha"
  pattern: "[0-9a-f]{40}"
  description: "Git commit identity."
};
option (common.wire.v1.formats) = {
  name: "Digest"
  pattern: "sha256:[0-9a-f]{64}"
  description: "Immutable container image identity."
};
option (common.wire.v1.formats) = {
  name: "Receipt"
  pattern: "[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"
  description: "UUID4 receipt identity."
};
option (common.wire.v1.formats) = {
  name: "DaemonAlias"
  pattern: "(k3s|cloudflared|ssh|cloudflared_platform)"
  description: "Explicit host daemon allowlist."
};
option (common.wire.v1.formats) = {
  name: "BootId"
  pattern: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
  description: "Random kernel boot identity; a new value means every cumulative counter restarted."
};
// One bounded, content-free observation, not proof of business success.
message HostReport {
  // Always fleet-report-v1.
  string version = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).allowed = "fleet-report-v1"
  ];
  // Fixed configured alias, not the machine hostname.
  string host_key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Code"
  ];
  // Explicit deployment generation; changing it requires a newly configured credential.
  int32 epoch = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).minimum = 1
  ];
  // Persisted and monotonically increasing within an epoch.
  int32 sequence = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).minimum = 1
  ];
  // Frozen across retry of identical bytes.
  string receipt_id = 5 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Receipt"
  ];
  // Host observation time; server validates age and uses its own receipt time for freshness.
  google.protobuf.Timestamp observation_time = 6 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Legacy system daemon map; unconfigured aliases remain unknown.
  map<string, Daemon> daemons = 7 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      key_format: "DaemonAlias"
      max_items: 4
      required_keys: [
        "k3s",
        "cloudflared",
        "ssh"
      ]
    }
  ];
  // k3s readiness and only the configured Newsletter workload.
  Cluster cluster = 8 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Newsletter process/deployment metadata only.
  Newsletter newsletter = 9 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Root filesystem percentage, null if unknown.
  optional double disk_used_percent = 10 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 100
  }];
  // Host memory percentage, null if unknown.
  optional double memory_used_percent = 11 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 100
  }];
  // Generic, independently verified runtime snapshot; null when the local daemon cannot be read.
  // (-- api-linter: core::0215::foreign-type-reference=disabled
  //     aip.dev/not-precedent: directly embeds the shared versioned runtime contract instead of a duplicate DTO. --)
  optional platform.runtime.v1.NodeStatus runtime = 14 [(google.api.field_behavior) = REQUIRED];
  // Source identity baked into the observer container image; null if unverified.
  optional string observer_source_sha = 15 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Sha"
  ];
  // Only configured system daemons; absent for legacy producers.
  map<string, Daemon> configured_daemons = 16 [(common.wire.v1.field) = {
    key_format: "DaemonAlias"
    max_items: 4
  }];
  // Node resource counters and gauges; absent from older observers and when the kernel files are unreadable.
  NodeMetrics metrics = 17;
  reserved 12, 13;
  reserved "desired_sha", "deployment_ready";
}
// Raw node readings. Cumulative counters are doubles because the wire profile has no 64-bit integers;
// every integral value below 2^53 is exact. Fleet derives rates from two consecutive reports of one boot.
message NodeMetrics {
  // /proc/sys/kernel/random/boot_id; counters of another boot are never subtracted.
  string boot_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "BootId"
  ];
  // Seconds since boot, with the kernel's centisecond resolution; the interval between two reports.
  // (-- api-linter: core::0142::time-field-type=disabled
  //     aip.dev/not-precedent: the wire profile has no Duration; a double keeps /proc/uptime's resolution. --)
  double uptime_seconds = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // Cumulative CPU time of every CPU, null when /proc/stat is unreadable.
  CpuTimes cpu = 3;
  // Run-queue load averages, null when unreadable.
  LoadAverage load = 4;
  // Host memory and swap, null when unreadable.
  MemoryUsage memory = 5;
  // Filesystem usage by fixed role (`root`, `k3s`, `state`); a role whose mount is unreadable is absent.
  map<string, FilesystemUsage> filesystems = 6 [(common.wire.v1.field) = {
    key_format: "Code"
    max_items: 4
  }];
  // Physical interface byte counters in the host network namespace, null when unreadable.
  NetworkCounters network = 7;
  // Per-workload usage from the Kubernetes metrics API, sorted by key; empty when unavailable.
  repeated WorkloadUsage workloads = 8 [(common.wire.v1.field).max_items = 16];
}
// Cumulative CPU time since boot summed over every CPU, from /proc/stat.
message CpuTimes {
  // Logical CPUs counted in /proc/stat.
  int32 cpu_count = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 1
      maximum: 4096
    }
  ];
  // Every state's time: user, nice, system, idle, iowait, irq, softirq and steal.
  double total_milliseconds = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // Idle time, without iowait.
  double idle_milliseconds = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // Idle time with storage I/O outstanding.
  double iowait_milliseconds = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
}
// Exponentially damped run-queue lengths from /proc/loadavg.
message LoadAverage {
  // One-minute average.
  double one_minute = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 1000000
    }
  ];
  // Five-minute average.
  double five_minutes = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 1000000
    }
  ];
  // Fifteen-minute average.
  double fifteen_minutes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 1000000
    }
  ];
}
// Host memory from /proc/meminfo and, on ZFS, the ARC kstat.
message MemoryUsage {
  // MemTotal.
  double total_bytes = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 1
      maximum: 9007199254740991
    }
  ];
  // What new work can use without swapping: MemAvailable plus the ZFS ARC above its floor c_min when the host
  // reports it, at most total_bytes; used is total minus available.
  double available_bytes = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // SwapTotal; 0 without swap.
  double swap_total_bytes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // SwapFree.
  double swap_free_bytes = 4 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
}
// statvfs of one read-only mount. On a pooled filesystem (ZFS) it describes that dataset.
message FilesystemUsage {
  // Size in bytes (f_blocks).
  double size_bytes = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 1
      maximum: 9007199254740991
    }
  ];
  // Used bytes (f_blocks - f_bfree).
  double used_bytes = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // Bytes available to unprivileged writers (f_bavail).
  double available_bytes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
}
// Summed byte counters of the physical interfaces (`en*`, `eth*`, `wl*`, `ww*`); names are never sent.
message NetworkCounters {
  // Interfaces summed; a change restarts the rates like a reboot.
  int32 interface_count = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 64
    }
  ];
  // Cumulative received bytes.
  double receive_bytes = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
  // Cumulative transmitted bytes.
  double transmit_bytes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
}
// One workload's current usage, summed over its running Pods and containers.
message WorkloadUsage {
  // The Pod's `app` label, or its CronJob's name; never a Pod name or hostname.
  string workload_key = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).format = "Code"
  ];
  // CPU in cores, averaged by metrics-server over its last window.
  double cpu_cores = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 4096
    }
  ];
  // Working-set memory.
  double memory_bytes = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      minimum: 0
      maximum: 9007199254740991
    }
  ];
}
// A daemon's observed state. Logs and unit file contents are excluded.
message Daemon {
  // active, inactive, failed, activating, deactivating, unknown or missing.
  string state = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "active",
        "inactive",
        "failed",
        "activating",
        "deactivating",
        "unknown",
        "missing"
      ]
    }
  ];
}
// A bounded, per-pod system-bus observation shared with the receipt writer.
message SystemDaemonSnapshot {
  // Time the non-root system-bus observation began.
  google.protobuf.Timestamp observation_time = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field).non_null = true
  ];
  // Fixed host daemon aliases; contains no logs, credentials or unit contents.
  map<string, Daemon> daemons = 2 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      key_format: "DaemonAlias"
      max_items: 4
      required_keys: [
        "k3s",
        "cloudflared",
        "ssh"
      ]
    }
  ];
  // Only configured system daemons; absent for legacy snapshots.
  map<string, Daemon> configured_daemons = 3 [(common.wire.v1.field) = {
    key_format: "DaemonAlias"
    max_items: 4
  }];
}
// Cluster status, not business status.
message Cluster {
  // ready, degraded, unavailable or unknown.
  string state = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "ready",
        "degraded",
        "unavailable",
        "unknown"
      ]
    }
  ];
  // Newsletter ready replicas, null if Kubernetes could not be read.
  optional int32 ready_count = 2 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 100
  }];
  // Newsletter desired replicas; must be one in the personal deployment.
  optional int32 desired_count = 3 [(common.wire.v1.field) = {
    minimum: 0
    maximum: 100
  }];
  // Total observed container restarts; does not imply a current failure.
  optional int32 restart_count = 5 [(common.wire.v1.field).minimum = 0];
}
// Application observation with no mail, prompts, model output or provider bodies.
message Newsletter {
  // healthy, unavailable, unknown or missing.
  string state = 1 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "healthy",
        "unavailable",
        "unknown",
        "missing"
      ]
    }
  ];
  // The worker Task is alive; this is not proof that a provider operation completed.
  optional bool worker_healthy = 2;
  // active, draining, frozen, resumed or unknown.
  string drain_state = 3 [
    (google.api.field_behavior) = REQUIRED,
    (common.wire.v1.field) = {
      allowed: [
        "active",
        "draining",
        "frozen",
        "resumed",
        "unknown"
      ]
    }
  ];
  // Queued ledger entries, null if unknown.
  optional int32 queued_count = 4 [(common.wire.v1.field).minimum = 0];
  // In-flight activities, null if unknown.
  optional int32 inflight_count = 5 [(common.wire.v1.field).minimum = 0];
  // Provider outcomes needing reconciliation, null if unknown.
  optional int32 unknown_count = 6 [(common.wire.v1.field).minimum = 0];
  // Monotonic observation revision; only newly observed unknown identities advance it.
  optional int32 unknown_revision = 7 [(common.wire.v1.field).minimum = 0];
  // Counts by fixed operation category, absent for legacy observers.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: by_kind matches the versioned upstream category aggregation. --)
  map<string, int32> unknown_by_kind = 8 [(common.wire.v1.field) = {
    max_items: 6
    minimum: 0
  }];
  // Latest provider response, not proof of inbox delivery; absent for legacy observers.
  optional string latest_delivery_state = 9 [(common.wire.v1.field) = {
    allowed: [
      "provider_accepted",
      "rejected",
      "unknown"
    ]
  }];
  // Update time of the latest delivery record, rather than proof of inbox arrival.
  optional google.protobuf.Timestamp latest_delivery_time = 10;
}
