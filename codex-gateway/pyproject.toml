[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-codex-gateway"
version = "0.1.0"
description = "Private synchronous structured inference through the pinned Codex SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "openai-codex==0.163.0",
  "ziyixi-proto",
]

[dependency-groups]
dev = ["httpx==0.28.1", "ruff==0.16.6"]

[tool.uv]
required-version = "==0.12.10"

[tool.uv.sources]
ziyixi-proto = { path = "../proto/python" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
