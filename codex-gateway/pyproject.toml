[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-codex-gateway"
version = "0.1.0"
description = "Private synchronous structured inference through the pinned Codex SDK"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "openai-codex",
  "ziyixi-proto",
  "jsonschema",
]

[dependency-groups]
dev = ["httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Keep parenthesised exception tuples; the interpreter is Python 3.14.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
