# Runtime-test config of todofy-core for pytest (tests/runtime), started together with either of
# the gateway's test configs; the harness adds per-test core vars. Never deploy this file.
name = "todofy-core"
main = "worker/todofy/runtime/entry.py"
base_dir = "worker"
compatibility_date = "2026-09-08"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "todofy"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "TodofyCoordinator", to = "TodofyCore" }]

# Operating metrics (Workers Analytics Engine; write-only from the Worker, read with the SQL API).
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "todofy_metrics"

# The real Tasks Worker (tasks/worker), which the harness starts in the same process on its own local D1: the
# weekly backup's Tasks export is the only call.
[[services]]
binding = "TASKS"
service = "todofy-tasks-test"
entrypoint = "TasksApi"
props = { access = "read-write" }

[vars]
TODOFY_PUBLIC_HOST = "todofy.localhost"
BUILD_SHA = "test"
GEMINI_API_BASE = "http://127.0.0.1:9"
# Short timings so retries and the watchdog happen within a test.
GEMINI_TIMEOUT_MS = "1500"
BACKOFF_BASE_MS = "200"
WATCHDOG_MS = "2000"
GEMINI_MODELS = "model-a,model-b"
# No daily report precompute, whatever the time of day the suite runs (scenarios opt in with "00:00").
REPORT_PRECOMPUTE_UTC = "off"
