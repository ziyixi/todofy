[project]
name = "todofy"
version = "0.1.0"
description = "Turns Mail Hero webhook events into Todoist tasks on Cloudflare Workers."
requires-python = ">=3.14"
# The Worker runs stdlib-only on Pyodide. Its one dependency is the generated wire JSON types of the proto/
# IDL (proto/README.md), itself stdlib only; pywrangler vendors it into python_modules/. Add nothing else.
dependencies = ["ziyixi-proto", "ziyixi-model-router-client"]

[dependency-groups]
dev = [
    "workers-py",
    "pytest",
    "pytest-xdist",
    "httpx",
    "cryptography",
    "jsonschema",
    "pyyaml",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
# The code runs on 3.14; a 3.13 target keeps `except (A, B):` parenthesised.
target-version = "py313"
src = ["worker", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Chinese UI strings use full-width punctuation on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["worker", "."]
testpaths = ["tests", "tools", "deploy"]
# With pytest-xdist (-n N), each process takes whole files, in the order pytest collected them
# (the rootdir conftest.py refuses every other mode). Without -n these two options do nothing.
addopts = "-ra --import-mode=importlib --dist loadfile --no-loadscope-reorder"
