[project]
name = "todofy"
version = "0.1.0"
description = "Turns Mail Hero webhook events into Todoist tasks on Cloudflare Workers."
requires-python = ">=3.14"
# The Worker runs stdlib-only on Pyodide; keep this list empty.
dependencies = []

[dependency-groups]
dev = [
    "workers-py==1.17.4",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "httpx==0.28.1",
    "cryptography==50.0.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    # The proto/ IDL's generated wire JSON types (proto/README.md); tests only until the Worker imports it.
    "ziyixi-proto",
]

[tool.uv]
package = false

[tool.uv.sources]
# Built by proto/python/build_backend.py, which generates the modules first (never committed). Not editable:
# pywrangler vendors [project] dependencies from this same source, and a Worker needs the files, not a .pth.
ziyixi-proto = { path = "../proto/python" }

[tool.ruff]
line-length = 120
# The code runs on 3.14; a 3.13 target keeps `except (A, B):` parenthesised.
target-version = "py313"
src = ["worker", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Chinese UI strings use full-width punctuation on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["worker", "."]
testpaths = ["tests", "tools", "deploy"]
# With pytest-xdist (-n N), each process takes whole files, in the order pytest collected them
# (the rootdir conftest.py refuses every other mode). Without -n these two options do nothing.
addopts = "-ra --import-mode=importlib --dist loadfile --no-loadscope-reorder"
