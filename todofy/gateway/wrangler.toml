# Worker "todofy": the TypeScript gateway (custom domains, owner UI assets, cron, the COORDINATOR binding to
# todofy-core). This is the production configuration and its single source of truth: top level =
# production, never [env.*] or keep_vars. Every static value is committed here (the repository is public:
# nothing personal, no secret).
#
# Deployed only by CI ("Todofy deploy" in .github/workflows/ci.yml), from todofy/ with
# --config gateway/wrangler.toml, through deploy/deploy_vars.py, which appends BUILD_SHA (the commit) and
# MAINTENANCE_MODE (a GitHub environment variable) with --var, and passes the owner's Access emails
# (ACCESS_OWNER, ACCESS_OWNER_ALIASES; GitHub environment secrets) as Worker secrets with --secrets-file.
# A plain `wrangler deploy` of this file DELETES BUILD_SHA and MAINTENANCE_MODE (and the wrapper refuses a
# deploy without the secrets file). Other Worker secrets
# (MAIL_WEBHOOK_TOKEN_SHA256[_PREVIOUS], REPORT_BASIC_AUTH_SHA256, CSRF_SIGNING_KEY) survive every deploy.
#
# Runtime tests use wrangler.test.toml and wrangler.test-auth.toml (next to this file). Local dev runs both
# Workers in one process from todofy/ with local values (docs/dev-notes.md §1, .dev.vars.example):
#   uv run pywrangler dev -c gateway/wrangler.toml -c wrangler.toml --local-upstream todofy.localhost:8787 ...
# (never without --local-upstream: wrangler dev would make the first route below every local request's URL).
name = "todofy"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
# The owner UI host first, then every hooks host, in the order of TODOFY_HOOKS_HOSTS (at most 4).
routes = [
  { pattern = "todofy.ziyixi.science", custom_domain = true },
  { pattern = "todofy-hooks.ziyixi.science", custom_domain = true },
  { pattern = "daily.ziyixi.science", custom_domain = true },
]

[observability]
enabled = true

[assets]
directory = "../uiassets/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "TodofyCore"
script_name = "todofy-core"

# Script "todofy" history: v1 created the Python class; v2 deleted it once the gateway replaced it
# (docs/gateway-contract.md §6.5-6.6).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["TodofyCoordinator"]

# Operating metrics (Workers Analytics Engine; write-only from the Worker, read with the SQL API).
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "todofy_metrics"

[triggers]
crons = ["*/10 * * * *"]

[vars]
TODOFY_PUBLIC_HOST = "todofy.ziyixi.science"
TODOFY_HOOKS_HOSTS = "todofy-hooks.ziyixi.science,daily.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
ACCESS_AUDIENCE = "16e87af7af751dc7205a6995cfe43eee133736ea2a254efdbeb9e4334790eddd"
