# Runtime-test gateway config for pytest (tests/runtime), started together with the core's
# test config; the harness sets secrets and per-test vars with --var. Never deploy this file.
name = "todofy-test"
main = "src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false

[assets]
directory = "../uiassets/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "TodofyCore"
script_name = "todofy-core"

# Script "todofy" history: v1 created the Python class; v2 deleted it once the gateway replaced it.
# Its deletion (v2 deleted_classes) ships in a gateway-only release of its own after this one is
# live, so a refusal (error 10061) never blocks another change (docs/gateway-contract.md §6.5).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[[migrations]]
tag = "v2"
deleted_classes = ["TodofyCoordinator"]

# Operating metrics (Workers Analytics Engine; write-only from the Worker, read with the SQL API).
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "todofy_metrics"

[triggers]
crons = ["*/10 * * * *"]

[vars]
TODOFY_PUBLIC_HOST = "todofy.localhost"
TODOFY_HOOKS_HOSTS = "todofy-hooks.localhost"
BUILD_SHA = "test"
ACCESS_OWNER = "owner@example.com"
DEV_AUTH_BYPASS = "true"
