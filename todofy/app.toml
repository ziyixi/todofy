# Public metadata and relative host labels. Generated Wrangler configs own production bindings.
version = 1
id = "todofy"
target = "cloudflare"

[[workers]]
config = "todofy/gateway/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES"]
manual_secrets = ["MAIL_WEBHOOK_TOKEN_SHA256", "MAIL_WEBHOOK_TOKEN_SHA256_PREVIOUS", "REPORT_BASIC_AUTH_SHA256", "CSRF_SIGNING_KEY"]
optional_secrets = ["ACCESS_OWNER_ALIASES", "MAIL_WEBHOOK_TOKEN_SHA256_PREVIOUS"]
hosts = ["todofy", "todofy-hooks", "daily"]
entry = "todofy"
role = "网关与 UI"
position = 2

[[workers]]
config = "todofy/wrangler.toml"
personal_secrets = ["TODOIST_DEFAULT_PROJECT_ID", "TODOIST_OPS_PROJECT_ID", "TODOIST_REVIEW_PROJECT_ID"]
# TODOIST_API_KEY is retired (nothing reads it) and stays optional only until the live secret is deleted.
manual_secrets = ["GEMINI_API_KEY", "TODOIST_API_KEY"]
optional_secrets = ["TODOIST_OPS_PROJECT_ID", "TODOIST_REVIEW_PROJECT_ID", "TODOIST_API_KEY"]
hosts = []
entry = "todofy"
role = "处理核心（TodofyCore）"
position = 3

[[entries]]
id = "todofy"
name = "Todofy"
description = "邮件摘要、规划与每日提醒"
group = "apps"
icon = "list-checks"
accent = "green"
access = true
app_only_signals = ["backup_stale", "backup_failed", "backup_disabled", "backup_active"]
order = 2
worker = "todofy"
url_path = "/"
position = 2
[entries.status]
type = "ops_v1"
binding = "TODOFY"
guard = true
[entries.tile_metric]
kind = "counter"
name = "received_24h"

[[access]]
key = "todofy"
kind = "owner"
worker = "todofy"
name = "Todofy"
paths = [""]
session = "24h"
