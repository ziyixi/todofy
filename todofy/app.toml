# Public metadata and relative host labels. Generated Wrangler configs own production bindings.
version = 1
id = "todofy"
target = "cloudflare"

[[workers]]
config = "todofy/gateway/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES"]
manual_secrets = ["MAIL_WEBHOOK_TOKEN_SHA256", "MAIL_WEBHOOK_TOKEN_SHA256_PREVIOUS", "REPORT_BASIC_AUTH_SHA256"]
optional_secrets = ["ACCESS_OWNER_ALIASES", "MAIL_WEBHOOK_TOKEN_SHA256_PREVIOUS"]
hosts = ["todofy", "todofy-hooks", "daily"]
entry = "todofy"
role = "网关与 UI"
position = 2

[[workers]]
config = "todofy/wrangler.toml"
# Retired, nothing reads them: TODOIST_API_KEY, and the three Tasks projects of the reminder, the weekly review and
# the mail tasks (2026-10-21). They stay optional only until the owner deletes the live secrets.
manual_secrets = ["TODOIST_API_KEY", "TODOIST_DEFAULT_PROJECT_ID", "TODOIST_OPS_PROJECT_ID", "TODOIST_REVIEW_PROJECT_ID"]
optional_secrets = ["TODOIST_API_KEY", "TODOIST_DEFAULT_PROJECT_ID", "TODOIST_OPS_PROJECT_ID", "TODOIST_REVIEW_PROJECT_ID"]
hosts = []
entry = "todofy"
role = "处理核心（TodofyCore）"
position = 3

[[entries]]
id = "todofy"
name = "Todofy"
description = "邮件摘要与每日报告"
group = "apps"
icon = "list-checks"
accent = "green"
access = true
app_only_signals = ["backup_stale", "backup_failed", "backup_disabled", "backup_active"]
order = 2
worker = "todofy"
url_path = "/"
position = 2
[entries.status]
type = "ops_v1"
binding = "TODOFY"
guard = true
[entries.tile_metric]
kind = "counter"
name = "received_24h"

[[access]]
key = "todofy"
kind = "owner"
worker = "todofy"
name = "Todofy"
paths = [""]
session = "24h"
