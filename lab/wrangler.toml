# Worker "lab": the owner's Paper Radar (docs/design.md). The production configuration and its single source
# of truth: top level = production, never [env.*] or keep_vars. Every static value is committed here (the
# repository is public: nothing personal, no secret).
#
# Deployed only by CI ("Lab deploy" in .github/workflows/ci.yml) through deploy/deploy-vars.mjs, which appends
# --var BUILD_SHA (the commit) and passes ACCESS_OWNER, ACCESS_OWNER_ALIASES and CSRF_SIGNING_KEY (GitHub
# environment secrets DASHBOARD_ACCESS_OWNER and DASHBOARD_ACCESS_OWNER_ALIASES, the same owner as the dashboard,
# and Lab's own LAB_CSRF_SIGNING_KEY; lab/README.md "Deploy secrets") as Worker secrets with --secrets-file.
# A plain `wrangler deploy` of this file DELETES BUILD_SHA.
#
# The D1 database "lab" and the Access app "Lab" (lab.ziyixi.science) exist since 2026-09-30; their id and AUD
# are committed below. deploy/deploy-vars.mjs still refuses an all-zeros id or AUD (a guard against a revert).
#
# Run wrangler from worker/ (the pinned wrangler lives in worker/node_modules) with --config ../wrangler.toml.
# Local dev: local bindings only (D1 commands always --local, never --remote), local values in lab/.dev.vars
# (see .dev.vars.example). No cron trigger: LabState schedules itself with setAlarm() (the account's Free
# plan allows 5 crons and 3 are used).
name = "lab"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
# The Access-protected custom domain (Cloudflare Access app "Lab"); vars.PUBLIC_HOST names the same host.
routes = [{ pattern = "lab.ziyixi.science", custom_domain = true }]

[observability]
enabled = true

# The UI (web/, `npm run build`). Every request reaches the Worker first: it checks Access and adds the
# private headers before handing a path to ASSETS.
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# One SQLite-backed object ("lab-v1"): alarm scheduling, job cursors, vectors, neuron ledger, guard.
[[durable_objects.bindings]]
name = "LAB"
class_name = "LabState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LabState"]

# Records the UI reads: papers, daily picks, feedback, seeds, settings (migrations/).
[[d1_databases]]
binding = "DB"
database_name = "lab"
database_id = "f20238dc-93a4-4d1a-91c4-c013f01cbdc9"
migrations_dir = "migrations"

# contracts/task-intent-v1: "send today's liked papers" goes to Todofy's named entrypoint "Ops" (same account
# only; no public route). Todofy is the only Todoist writer. The Worker "todofy" must be deployed first.
[[services]]
binding = "TODOFY"
service = "todofy"
entrypoint = "Ops"

# Workers AI: embeddings and the TL;DR model, under the Lab's own daily neuron ceiling (docs/design.md §5).
[ai]
binding = "AI"

[vars]
PUBLIC_HOST = "lab.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
# AUD tag of the Access app "Lab".
ACCESS_AUDIENCE = "3a8b5e31d3fb12e678198ea5e1c4231bc3f80665a9f9a5f18ecff8f6c19f4c8c"
# Hard ceiling on Workers AI neurons per UTC day for this Worker (the account has 10,000 in total). The
# settings page can only lower it. A typical day uses about 340 (docs/design.md §1).
LAB_DAILY_NEURONS = "5000"
# The daily feed fetch runs at this UTC hour, minute 30 (the arXiv feed updates at midnight US Eastern).
LAB_FETCH_UTC_HOUR = "6"
