# Worker "watch": the owner's web watches (watch.ziyixi.science, docs/design.md): pages, feeds and JSON APIs checked
# on a schedule by one SQLite Durable Object, with a deterministic noise pipeline and a change inbox. The production
# configuration and its single source of truth: top level = production, never [env.*] or keep_vars. Every static
# value is committed here (the repository is public: nothing personal, no secret).
#
# Deployed only by CI ("Watch deploy" in .github/workflows/ci.yml) through deploy/deploy-vars.mjs, which appends
# --var BUILD_SHA (the commit) and passes ACCESS_OWNER, ACCESS_OWNER_ALIASES and CSRF_SIGNING_KEY as Worker secrets
# with --secrets-file (the dashboard's DASHBOARD_ACCESS_OWNER(_ALIASES), the same owner, and the watch app's own
# WATCH_CSRF_SIGNING_KEY; README.md "Deploy"). A plain `wrangler deploy` of this file DELETES BUILD_SHA.
#
# W2 (docs/design.md §11): the Access application "watch" (the whole host) was created by infra/ and "Infra apply"
# (infra/README.md "Adding an app"); its AUD is committed below, and deploy/deploy-vars.mjs still refuses the
# all-zeros AUD (a guard against a revert). The Worker's only hostname is the Custom Domain watch.ziyixi.science
# (PUBLIC_HOST, the CSRF origin), entirely behind Access. No workers.dev and no preview URL. Rollback (README.md
# "Deploy"): detach the Custom Domain by hand (a deploy without routes leaves it attached), then revert.
#
# Run wrangler from worker/ (the pinned wrangler lives in worker/node_modules) with --config ../wrangler.toml.
# Local dev: local bindings only, local values in watch/.dev.vars (see .dev.vars.example). No cron trigger, no D1, no
# R2, no KV: WatchState schedules itself with setAlarm() and keeps everything in its own SQLite. Its one outbound
# binding is TODOFY (the notification sink), which local development leaves unbound.
name = "watch"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
# The one hostname, a Custom Domain (wrangler applies the list as the Worker's complete set; tools/cf-guard checks
# it before every deploy). vars.PUBLIC_HOST names the same host.
routes = [{ pattern = "watch.ziyixi.science", custom_domain = true }]

# The Worker's own log lines (a refusal: request ID, status, reason; an alarm: counts) are kept; the invocation logs,
# which record every request's URL, are off, and so are traces. The Worker never logs a watched URL, page text or a
# diff.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

# The UI (web/, `npm run build`). Every request reaches the Worker first: it checks Access and adds the private
# headers before handing a path to ASSETS. The single-page fallback serves the page for /new (the add-from-phone link
# /new#u=<url>, whose fragment never reaches the server) and the UI's other paths.
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# One SQLite-backed object ("watch-v1"): every watch, snapshot and change, the etiquette state, the browser ledger and
# the notification outbox; it schedules itself with setAlarm.
[[durable_objects.bindings]]
name = "WATCH"
class_name = "WatchState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchState"]

# Todofy's named entrypoint "Intents" (contracts/task-intent-v1): the notification sink. WatchState proposes the daily
# digest and urgent changes as task intents of source SOURCE_WATCH (worker/src/todofy.ts, W3). Least privilege: that
# entrypoint has only proposeTasks and taskIntentStatus, and refuses any source but the one in `props`, so this app
# (which parses untrusted pages) can neither propose as another source nor reach Todofy's ops-v1 methods. Never "Ops".
[[services]]
binding = "TODOFY"
service = "todofy"
entrypoint = "Intents"
props = { source = "watch" }

[vars]
# The watch host: the only origin a mutation may come from (CSRF).
PUBLIC_HOST = "watch.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
# AUD tag of the Access application "watch" (the whole host; infra/access.tf owner_apps["watch"]), created by "Infra
# apply" and read as in infra/README.md "Adding an app" step 4; its application id is in infra/ids.tf. "Infra drift"
# compares this value with the application's every day.
ACCESS_AUDIENCE = "faa4baa704bba09670265053427cb88ba1047384cbc849b15dc7d3a732e3b576"
