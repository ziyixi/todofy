# Public metadata and relative host labels. Generated Wrangler configs own production bindings.
version = 1
id = "links"
target = "cloudflare"

[[workers]]
config = "links/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES", "CSRF_SIGNING_KEY"]
manual_secrets = []
optional_secrets = ["ACCESS_OWNER_ALIASES"]
hosts = ["s"]
entry = "links"
role = "短链接跳转与启动器"
position = 7

[[entries]]
id = "links"
name = "短链接"
description = "s.{zone} 短链接与启动器"
group = "apps"
icon = "link"
# Rose is also the danger color; slate keeps a healthy tile unambiguous.
accent = "slate"
access = true
app_only_signals = []
order = 6
worker = "links"
url_path = "/_/"
position = 5
[entries.status]
# Constant public text before any D1 read; unused links do not imply idle failure.
type = "public_http"
expect = [200]
content_type = "text/plain"
outside_access = true
error_rate = true
enabled = true
path = "/robots.txt"
[entries.tile_metric]
kind = "latency"

[[access]]
key = "links"
kind = "owner"
worker = "links"
name = "links"
paths = ["/_/*", "/_"]
session = "168h"
