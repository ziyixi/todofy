# Worker "links": the owner's short links (s.ziyixi.science/<key>) and, under /_/, their launcher and owner API on D1
# (docs/design.md). The production configuration and its single source of truth: top level = production, never
# [env.*] or keep_vars. Every static value is committed here (the repository is public: nothing personal, no secret).
#
# Deployed only by CI ("Links deploy" in .github/workflows/ci.yml) through deploy/deploy-vars.mjs, which appends
# --var BUILD_SHA (the commit) and passes ACCESS_OWNER, ACCESS_OWNER_ALIASES and CSRF_SIGNING_KEY as Worker secrets
# with --secrets-file (the dashboard's DASHBOARD_ACCESS_OWNER(_ALIASES), the same owner, and the links app's own
# LINKS_CSRF_SIGNING_KEY; README.md "Deploy"). A plain `wrangler deploy` of this file DELETES BUILD_SHA.
#
# L2 (docs/design.md §11): the D1 database "links" and the path-scoped Access application "links" (destinations
# s.ziyixi.science/_/* and the exact s.ziyixi.science/_) exist; their id and AUD are committed below, and
# deploy/deploy-vars.mjs still refuses an all-zeros id or AUD (a guard against a revert). The Worker's only hostname
# is the Custom Domain s.ziyixi.science (PUBLIC_HOST, the CSRF origin). The rest of the host stays outside Access, so
# a short link reaches the Worker anonymously. No workers.dev and no preview URL. Rollback (README.md "Deploy"):
# detach the Custom Domain by hand (a deploy without routes leaves it attached), then revert.
#
# Run wrangler from worker/ (the pinned wrangler lives in worker/node_modules) with --config ../wrangler.toml.
# Local dev: local bindings only (D1 commands always --local, never --remote), local values in links/.dev.vars (see
# .dev.vars.example). No cron trigger, no Durable Object, no KV: a redirect is one D1 read.
name = "links"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = false
# The one hostname, a Custom Domain (wrangler applies the list as the Worker's complete set; tools/cf-guard checks
# it before every deploy). vars.PUBLIC_HOST names the same host.
routes = [{ pattern = "s.ziyixi.science", custom_domain = true }]

# The Worker's own log lines (an owner API refusal: request ID, status, reason) are kept; the invocation logs, which
# record every request's URL and so every key and path, are off, and so are traces. The Worker never logs a key, a
# path or a target itself.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

# The launcher (web/, `npm run build`: web/dist/_/index.html and web/dist/_/assets/*). Every request reaches the
# Worker first, except the launcher's hashed files under /_/assets/, which Access still guards at the edge (they carry
# no data). No not_found_handling: the default "none" answers a missing file with 404. The single-page-application
# fallback must never be set: with it a key path that is not an asset would be answered by the asset layer with
# index.html instead of reaching the Worker (deploy/test/wrangler-config.test.mjs).
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = ["/*", "!/_/assets/*"]

# links, link_revisions and request_log (migrations/), applied by CI with `wrangler d1 migrations apply DB --remote`
# before each deploy.
[[d1_databases]]
binding = "DB"
database_name = "links"
database_id = "2f8c5331-06ce-4347-8c0a-90fe51c82260"
migrations_dir = "migrations"

[vars]
# The links host: the only origin a mutation may come from (CSRF), and the one host no target may name.
PUBLIC_HOST = "s.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
# AUD tag of the path-scoped Access application "links" (s.ziyixi.science/_/* and the exact s.ziyixi.science/_).
ACCESS_AUDIENCE = "cc7072526c75d5250e9e0ba274d795c632dee4554a707c41ce8fae26ebf5b0d1"
