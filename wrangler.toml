# todofy-core: the Python Worker that hosts the TodofyCore Durable Object. It has no public
# routes; the TypeScript gateway (gateway/wrangler.toml, script "todofy") binds the object by
# script_name. It stays at the repo root: pywrangler reads the Python version from this file only.
name = "todofy-core"
main = "worker/todofy/runtime/entry.py"
base_dir = "worker"
compatibility_date = "2026-09-08"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "todofy"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TodofyCoordinator"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "TodofyCoordinator", to = "TodofyCore" }]

[vars]
# The daily reminder links to the owner UI on this host.
TODOFY_PUBLIC_HOST = "todofy.localhost"
BUILD_SHA = "dev"
GEMINI_API_BASE = "https://generativelanguage.googleapis.com"
GEMINI_TIMEOUT_MS = "60000"
TODOIST_API_BASE = "https://api.todoist.com"
