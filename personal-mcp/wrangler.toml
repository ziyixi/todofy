# Production config. Each business service retains its own data and private API.
name = "personal-mcp"
account_id = "f57937bd1d93bf59e737b6d8445fb7a3"
main = "worker/src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "mcp.ziyixi.science", custom_domain = true }]

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = false
[observability.traces]
enabled = false

[[durable_objects.bindings]]
name = "SUBSCRIPTIONS"
class_name = "SubscriptionStore"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SubscriptionStore"]

[vars]
PUBLIC_HOST = "mcp.ziyixi.science"
ACCESS_ISSUER = "https://ziyixi.cloudflareaccess.com"
ACCESS_AUDIENCE = "da5cfc7953a2ffcd617de2af3189cad24dbacd9b5518a5ec7298e5a708a38120"
CALLBACK_HOSTS = "connectors.api.openai.com"

[[services]]
binding = "TASKS"
service = "tasks"
entrypoint = "TasksApi"
props = { access = "read-write" }

[[services]]
binding = "TODOFY_MAIL"
service = "todofy"
entrypoint = "Mail"
props = { access = "read" }

[[services]]
binding = "RECALL"
service = "recall"
entrypoint = "RecallApi"

[[services]]
binding = "HOME"
service = "home"
entrypoint = "HomeApi"

[[services]]
binding = "WATCH"
service = "watch"
entrypoint = "WatchApi"
props = { access = "read-write" }
