version: "2"

run:
  timeout: 5m
  tests: true

linters:
  exclusions:
    rules:
      # Retain legacy wire values in the compatibility map and persisted-data tests.
      # Other deprecated APIs, and new legacy-model use in production, still fail lint.
      - linters:
          - staticcheck
        path: '(^llm/consts\.go$|_test\.go$)'
        text: 'SA1019: .*\.Model_MODEL_GEMINI_(2_5_(PRO|FLASH|FLASH_LITE)|3_FLASH_PREVIEW) is deprecated'
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  
  settings:
    revive:
      rules:
        - name: var-naming
          disabled: true
