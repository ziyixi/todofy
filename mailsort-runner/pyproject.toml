[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todofy-mailsort-runner"
version = "0.1.0"
description = "Hourly Mailsort classification through one isolated Codex turn"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ziyixi-proto",
  "httpx==0.28.1",
  "openai-codex==0.163.0",
  "openai-codex-cli-bin==0.163.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.uv]
required-version = "==0.12.10"

[tool.uv.sources]
ziyixi-proto = { path = "../proto/python" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailsort_runner = ["prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".artifacts/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
