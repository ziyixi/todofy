# Migration validation only. Existing CI keeps checking apps until their complete Bazel checks replace it.
# This workflow has no production credentials, publication or deployment steps.
name: Bazel migration validation

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  plan:
    name: Plan Bazel checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed validation tools
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-tools"
          curl -fsSL https://github.com/bazelbuild/bazel/releases/download/9.3.1/bazel-9.3.1-linux-x86_64 -o "$RUNNER_TEMP/bazel-tools/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $RUNNER_TEMP/bazel-tools/bazel" | sha256sum --check --status
          curl -fsSL https://github.com/bazel-contrib/target-determinator/releases/download/v0.34.0/target-determinator.linux.amd64 -o "$RUNNER_TEMP/bazel-tools/target-determinator"
          echo "115e1c63d39e2cd0d0b011c9fadc80f059f021176a4ae0de2232cdd83b1f8011  $RUNNER_TEMP/bazel-tools/target-determinator" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/bazel-tools/bazel" "$RUNNER_TEMP/bazel-tools/target-determinator"
          echo "$RUNNER_TEMP/bazel-tools" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/personal-cloud-bazel
          key: bazel-9.3.1-${{ runner.os }}-plan-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock', 'proto/tools/api-linter/go.*') }}-${{ github.sha }}
          restore-keys: |
            bazel-9.3.1-${{ runner.os }}-plan-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock', 'proto/tools/api-linter/go.*') }}-
      - name: Test the planner and runner
        run: python3 -m unittest discover -s tools/bazel/ci
      - name: Plan compatible target groups
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/bazel/ci/plan.py --output bazel-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-plan-${{ github.sha }}
          path: bazel-plan.json
          retention-days: 1

  checks:
    name: Bazel (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed Bazel
        run: |
          mkdir -p "$RUNNER_TEMP/bazel-tools"
          curl -fsSL https://github.com/bazelbuild/bazel/releases/download/9.3.1/bazel-9.3.1-linux-x86_64 -o "$RUNNER_TEMP/bazel-tools/bazel"
          echo "7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  $RUNNER_TEMP/bazel-tools/bazel" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/bazel-tools/bazel"
          echo "$RUNNER_TEMP/bazel-tools" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/personal-cloud-bazel
          key: bazel-9.3.1-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock', 'proto/tools/api-linter/go.*') }}-${{ github.sha }}
          restore-keys: |
            bazel-9.3.1-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock', 'proto/tools/api-linter/go.*') }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bazel-plan-${{ github.sha }}
      - name: Run the selected compatible group
        env:
          BAZEL_GROUP: ${{ matrix.group }}
        run: python3 tools/bazel/ci/run.py --plan bazel-plan.json --group "$BAZEL_GROUP"

  gate:
    name: Bazel migration gate
    needs: [plan, checks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_WORK: ${{ needs.plan.outputs.has_work }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$HAS_WORK" = true ]; then test "$CHECKS_RESULT" = success; fi
