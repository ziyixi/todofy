# The same verified release recipe is used by CI and by controlled drift repair.
name: Worker release

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      source_sha:
        type: string
        default: ''
      repair:
        type: boolean
        default: false
      check_only:
        type: boolean
        default: false
      expected_main_sha:
        type: string
        default: ''

permissions:
  contents: read
  deployments: write

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  release:
    name: ${{ inputs.app }} production release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.app == 'website-relay' && 10 || 15 }}
    environment:
      name: production
      url: ${{ steps.todofy.outputs.url || steps.mail_hero.outputs.url || steps.dashboard.outputs.url || steps.links.outputs.url || steps.watch.outputs.url || steps.mailsort.outputs.url || steps.recall.outputs.url || steps.brief.outputs.url || steps.fleet.outputs.url || steps.personal_mcp.outputs.url }}
    concurrency:
      group: ${{ inputs.app }}-production
      cancel-in-progress: false
    env:
      DASHBOARD_CANARY_ENABLED: ${{ vars.DASHBOARD_CANARY_ENABLED }}
      MAIL_HERO_FORCE_SEND_PAUSED: ${{ vars.MAIL_HERO_FORCE_SEND_PAUSED }}
      MAIL_HERO_MAINTENANCE_MODE: ${{ vars.MAIL_HERO_MAINTENANCE_MODE }}
      MAIL_HERO_NATIVE_BACKUP_ENABLED: ${{ vars.MAIL_HERO_NATIVE_BACKUP_ENABLED }}
      TODOFY_FORCE_PAUSE_TODOIST: ${{ vars.TODOFY_FORCE_PAUSE_TODOIST }}
      TODOFY_GTD_REVIEW_ENABLED: ${{ vars.TODOFY_GTD_REVIEW_ENABLED }}
      TODOFY_MAINTENANCE_MODE: ${{ vars.TODOFY_MAINTENANCE_MODE }}
      TODOFY_PROCESSING_PAUSED: ${{ vars.TODOFY_PROCESSING_PAUSED }}
      TODOFY_REMINDER_ENABLED: ${{ vars.TODOFY_REMINDER_ENABLED }}
      MAILSORT_MODE: ${{ (inputs.app == 'mailsort' || inputs.app == 'brief') && vars.MAILSORT_MODE || '' }}
      BRIEF_MODE: ${{ inputs.app == 'brief' && vars.BRIEF_MODE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the checked source under the release lock
        id: source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          RELEASE_REPAIR: ${{ inputs.repair }}
        run: |
          args=()
          if [ "$RELEASE_REPAIR" = true ]; then args+=(--repair); fi
          if [ -n "$RELEASE_EXPECTED_MAIN" ]; then args+=(--expected-main-sha "$RELEASE_EXPECTED_MAIN"); fi
          python3 tools/cloud-release/control.py prepare --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" "${args[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: .release-source
          persist-credentials: false
      - name: Compare actual configuration and preserve owner pauses
        id: preflight
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
          RELEASE_REPAIR: ${{ inputs.repair }}
          RELEASE_CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          args=()
          if [ "$RELEASE_REPAIR" = true ]; then args+=(--repair); fi
          if [ "$RELEASE_CHECK_ONLY" = true ]; then args+=(--check-only); fi
          python3 tools/cloud-release/control.py preflight --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source "${args[@]}"
      - name: Release todofy
        id: todofy
        if: inputs.app == 'todofy' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-todofy
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          todofy-access-owner: ${{ secrets.TODOFY_ACCESS_OWNER }}
          todofy-access-owner-aliases: ${{ secrets.TODOFY_ACCESS_OWNER_ALIASES }}
          todofy-core-worker-secrets: ${{ secrets.TODOFY_CORE_WORKER_SECRETS }}
          todofy-todoist-default-project-id: ${{ secrets.TODOFY_TODOIST_DEFAULT_PROJECT_ID }}
          todofy-todoist-ops-project-id: ${{ secrets.TODOFY_TODOIST_OPS_PROJECT_ID }}
          todofy-todoist-review-project-id: ${{ secrets.TODOFY_TODOIST_REVIEW_PROJECT_ID }}
          todofy-worker-secrets: ${{ secrets.TODOFY_WORKER_SECRETS }}
      - name: Release mail-hero
        id: mail_hero
        if: inputs.app == 'mail-hero' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-mail-hero
        with:
          required: ${{ steps.preflight.outputs.required }}
          mail-hero-access-owner: ${{ secrets.MAIL_HERO_ACCESS_OWNER }}
          mail-hero-access-owner-aliases: ${{ secrets.MAIL_HERO_ACCESS_OWNER_ALIASES }}
          mail-hero-cf-api-token: ${{ secrets.MAIL_HERO_CF_API_TOKEN }}
          mail-hero-receive-address: ${{ secrets.MAIL_HERO_RECEIVE_ADDRESS }}
          mail-hero-worker-secrets: ${{ secrets.MAIL_HERO_WORKER_SECRETS }}
      - name: Release dashboard
        id: dashboard
        if: inputs.app == 'dashboard' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-dashboard
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          dashboard-cf-analytics-token: ${{ secrets.DASHBOARD_CF_ANALYTICS_TOKEN }}
          dashboard-csrf-signing-key: ${{ secrets.DASHBOARD_CSRF_SIGNING_KEY }}
          dashboard-worker-secrets: ${{ secrets.DASHBOARD_WORKER_SECRETS }}
      - name: Release links
        id: links
        if: inputs.app == 'links' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-links
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          links-csrf-signing-key: ${{ secrets.LINKS_CSRF_SIGNING_KEY }}
          links-worker-secrets: ${{ secrets.LINKS_WORKER_SECRETS }}
      - name: Release tasks
        id: tasks
        if: inputs.app == 'tasks' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-tasks
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          tasks-worker-secrets: ${{ secrets.TASKS_WORKER_SECRETS }}
      - name: Release watch
        id: watch
        if: inputs.app == 'watch' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-watch
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          watch-csrf-signing-key: ${{ secrets.WATCH_CSRF_SIGNING_KEY }}
          watch-worker-secrets: ${{ secrets.WATCH_WORKER_SECRETS }}
      - name: Release mailsort
        id: mailsort
        if: inputs.app == 'mailsort' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-mailsort
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          mailsort-csrf-signing-key: ${{ secrets.MAILSORT_CSRF_SIGNING_KEY }}
          mailsort-worker-secrets: ${{ secrets.MAILSORT_WORKER_SECRETS }}
      - name: Release recall
        id: recall
        if: inputs.app == 'recall' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-recall
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          recall-csrf-signing-key: ${{ secrets.RECALL_CSRF_SIGNING_KEY }}
          recall-worker-secrets: ${{ secrets.RECALL_WORKER_SECRETS }}
      - name: Release brief
        id: brief
        if: inputs.app == 'brief' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-brief
        with:
          required: ${{ steps.preflight.outputs.required }}
          brief-csrf-signing-key: ${{ secrets.BRIEF_CSRF_SIGNING_KEY }}
          brief-feedback-signing-key: ${{ secrets.BRIEF_FEEDBACK_SIGNING_KEY }}
          brief-mail-from: ${{ secrets.BRIEF_MAIL_FROM }}
          brief-mail-to: ${{ secrets.BRIEF_MAIL_TO }}
          brief-worker-secrets: ${{ secrets.BRIEF_WORKER_SECRETS }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          dashboard-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          dashboard-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
      - name: Release fleet
        id: fleet
        if: inputs.app == 'fleet' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-fleet
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          fleet-access-owner: ${{ secrets.FLEET_ACCESS_OWNER }}
          fleet-access-owner-aliases: ${{ secrets.FLEET_ACCESS_OWNER_ALIASES }}
          fleet-report-hmac-key: ${{ secrets.FLEET_REPORT_HMAC_KEY }}
          fleet-worker-secrets: ${{ secrets.FLEET_WORKER_SECRETS }}
      - name: Release personal-mcp
        id: personal_mcp
        if: inputs.app == 'personal-mcp' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-personal-mcp
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          personal-mcp-access-owner: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          personal-mcp-access-owner-aliases: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          personal-mcp-worker-secrets: ${{ secrets.PERSONAL_MCP_WORKER_SECRETS }}
      - name: Release website-relay
        id: website_relay
        if: inputs.app == 'website-relay' && steps.preflight.outputs.required == 'true'
        uses: ./.github/actions/release-website-relay
        with:
          required: ${{ steps.preflight.outputs.required }}
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          website-relay-worker-secrets: ${{ secrets.WEBSITE_RELAY_WORKER_SECRETS }}
      - name: Verify provider identities and record successful deployment
        if: steps.preflight.outputs.required == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
        run: python3 tools/cloud-release/control.py record --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source
