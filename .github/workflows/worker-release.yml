      # The owner's addresses and the CSRF key are environment secrets (masked in this public log) and reach the Worker
      # as secrets through --secrets-file; wrangler prints plain vars. The watch app's owner is the dashboard's owner
      # (one person, the same Access identities), so the addresses come from the dashboard's secrets, as for
