        run: |
          bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" watch ../wrangler.toml
      # Cloudflare Access ("watch", the whole host) must answer every unauthenticated request with a 302 to its login
      # page for this host: the inbox /, the owner API and the add-from-phone page /new, exactly as the dashboard's
      # probe checks (same script; test_ci_changes.py runs it). /health is behind Access too (no bypass application),
      # so no anonymous request reaches the Worker. Whether WatchState's alarm is armed cannot be seen from here: the
      # first owner API call and the dashboard's status() arm it (watch/README.md "Deploy", the post-deploy check).
      - name: Check that Access answers unauthenticated requests
        if: steps.preflight.outputs.required == 'true'
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/v1/watches /new
      - name: Remove the secrets file
        if: always() && steps.preflight.outputs.required == 'true'
        run: rm -f "$RUNNER_TEMP/watch-secrets.json"

      - name: Verify provider identities and record successful deployment
        if: steps.preflight.outputs.required == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
        run: python3 tools/cloud-release/control.py record --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source

  # Fleet (Worker "fleet"): the gate verified this exact SHA; no VPS credentials or application data reach this job.
  fleet-deploy:
    name: fleet production release
    if: github.ref == 'refs/heads/main' && inputs.app == 'fleet'
    runs-on: ubuntu-24.04
