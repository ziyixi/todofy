      # email); only the version id and the result are. (FlowDay's and the links app's check without their D1 part.)
      - name: Check that production runs this commit
        if: steps.preflight.outputs.required == 'true'
        working-directory: .release-source/fleet/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" fleet ../wrangler.toml
      # The whole owner host stays behind Access; the sole receipt path uses independent HMAC authentication.
      - name: Check that Access answers unauthenticated requests
        if: steps.preflight.outputs.required == 'true'
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/v1/fleetStatus
      - name: Remove the secrets file
        if: always() && steps.preflight.outputs.required == 'true'
        run: rm -f "$RUNNER_TEMP/fleet-secrets.json"

      - name: Verify provider identities and record successful deployment
        if: steps.preflight.outputs.required == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
        run: python3 tools/cloud-release/control.py record --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source

  website-relay-deploy:
    name: website-relay production release
    if: github.ref == 'refs/heads/main' && inputs.app == 'website-relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: website-relay-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .release-source/website
    env:
      DASHBOARD_CANARY_ENABLED: ${{ vars.DASHBOARD_CANARY_ENABLED }}
      MAIL_HERO_FORCE_SEND_PAUSED: ${{ vars.MAIL_HERO_FORCE_SEND_PAUSED }}
      MAIL_HERO_MAINTENANCE_MODE: ${{ vars.MAIL_HERO_MAINTENANCE_MODE }}
      MAIL_HERO_NATIVE_BACKUP_ENABLED: ${{ vars.MAIL_HERO_NATIVE_BACKUP_ENABLED }}
      TODOFY_FORCE_PAUSE_TODOIST: ${{ vars.TODOFY_FORCE_PAUSE_TODOIST }}
      TODOFY_GTD_REVIEW_ENABLED: ${{ vars.TODOFY_GTD_REVIEW_ENABLED }}
      TODOFY_MAINTENANCE_MODE: ${{ vars.TODOFY_MAINTENANCE_MODE }}
      TODOFY_PROCESSING_PAUSED: ${{ vars.TODOFY_PROCESSING_PAUSED }}
      TODOFY_REMINDER_ENABLED: ${{ vars.TODOFY_REMINDER_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the checked source under the release lock
        id: source
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
          RELEASE_REPAIR: ${{ inputs.repair }}
        run: |
          args=()
          if [ "$RELEASE_REPAIR" = true ]; then args+=(--repair); fi
          if [ -n "$RELEASE_EXPECTED_MAIN" ]; then args+=(--expected-main-sha "$RELEASE_EXPECTED_MAIN"); fi
          python3 tools/cloud-release/control.py prepare --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" "${args[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: .release-source
          persist-credentials: false
      - name: Compare actual configuration and preserve owner pauses
        id: preflight
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
          RELEASE_REPAIR: ${{ inputs.repair }}
          RELEASE_CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          args=()
          if [ "$RELEASE_REPAIR" = true ]; then args+=(--repair); fi
          if [ "$RELEASE_CHECK_ONLY" = true ]; then args+=(--check-only); fi
          python3 tools/cloud-release/control.py preflight --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source "${args[@]}"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.preflight.outputs.required == 'true'
        with:
          node-version-file: .release-source/website/.nvmrc
      - name: Install the shared proto toolchain
        if: steps.preflight.outputs.required == 'true'
        run: npm ci --prefix ../proto --no-audit --no-fund
      - name: Install the pinned pnpm and locked dependencies
        if: steps.preflight.outputs.required == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Write the Worker secrets file
        if: steps.preflight.outputs.required == 'true'
        env:
          WEBSITE_RELAY_WORKER_SECRETS: ${{ secrets.WEBSITE_RELAY_WORKER_SECRETS }}
        run: node relay/deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/website-relay-secrets.json"
      - name: Validate the bundle before deploying
        if: steps.preflight.outputs.required == 'true'
        run: node relay/deploy/deploy-vars.mjs exec -- pnpm exec wrangler deploy --dry-run --config relay/wrangler.toml --secrets-file "$RUNNER_TEMP/website-relay-secrets.json"
      - name: Deploy the relay Worker
        if: steps.preflight.outputs.required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node relay/deploy/deploy-vars.mjs exec -- pnpm exec wrangler deploy --config relay/wrangler.toml --secrets-file "$RUNNER_TEMP/website-relay-secrets.json"
      - name: Retire the old Notion button and detector secrets
        if: steps.preflight.outputs.required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 relay/deploy/retire-secrets.py
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/website-relay-secrets.json"
      - name: Verify provider identities and record successful deployment
        if: steps.preflight.outputs.required == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source_sha }}
        run: python3 tools/cloud-release/control.py record --app "$RELEASE_APP" --source-sha "$RELEASE_SOURCE" --source-root .release-source
