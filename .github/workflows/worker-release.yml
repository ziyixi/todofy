  watch-deploy:
    name: watch production release
    if: github.ref == 'refs/heads/main' && inputs.app == 'watch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: watch-production
