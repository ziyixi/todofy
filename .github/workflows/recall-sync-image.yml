# recall's reference archive consumer image (recall/sync/README.md), published only by explicit manual dispatch on
# main; a dispatch on another branch builds and tests it without publishing. The owner's NAS pulls it by the digest
# this run prints. No production credential or real data is involved: the tests use the contract's synthetic fixtures
# and a loopback fake of recall's routes.
name: recall sync image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recall-sync-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ziyixi/recall-sync

defaults:
  run:
    working-directory: recall

jobs:
  checks:
    name: Archive consumer tests against the contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: false
      # The contract's consumer tests, the HTTP rules, crashes between every two steps, and the consumer's rules against
      # the generated schema (jsonschema, pinned in sync/requirements-test.txt; the consumer itself needs none of it).
      - name: Test the consumer
        env:
          RECALL_SYNC_REQUIRE_JSONSCHEMA: '1'
        run: uv run --no-project --python 3.12 --with-requirements sync/requirements-test.txt python -I -m unittest discover -s sync -p 'test_*.py' -v

  build-branch:
    name: Build branch image without publishing
    needs: checks
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the verified consumer
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag recall-sync:ci \
            --file sync/Dockerfile sync
      # The image's own Python runs the consumer's tests (standard library only: the schema comparison skips), with no
      # network (the fake feed is on loopback), a read-only root and no capabilities, as uid 10001.
      - name: Check the packaged runtime without network access
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' recall-sync:ci)" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' recall-sync:ci)" = 10001:10001
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges recall-sync:ci --help
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo/recall \
            --entrypoint python3 recall-sync:ci -I -B -m unittest discover -s sync -p 'test_*.py'

  publish:
    name: Publish the verified consumer to GHCR
    needs: checks
    if: github.repository == 'ziyixi/todofy' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the verified consumer
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" --tag "${IMAGE}:latest" \
            --file sync/Dockerfile sync
      - name: Check the packaged runtime without network access
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' "${IMAGE}:sha-${GITHUB_SHA}")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}:sha-${GITHUB_SHA}")" = 10001:10001
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "${IMAGE}:sha-${GITHUB_SHA}" --help
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo/recall \
            --entrypoint python3 "${IMAGE}:sha-${GITHUB_SHA}" -I -B -m unittest discover -s sync -p 'test_*.py'
      - name: Log in with this job's temporary GitHub token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and record the immutable deployment reference
        id: publish
        run: |
          set -euo pipefail
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")
          digest="${reference##*@}"
          if [[ "$reference" != "${IMAGE}@sha256:"* || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Published image is missing its immutable digest' >&2
            exit 1
          fi
          echo "image=${reference}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo '## recall archive consumer'
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "NAS image: \`${reference}\`"
            echo 'Pin this digest in the NAS container (recall/sync/README.md); latest is not a deployment pin.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary registry login
        if: always()
        run: docker logout ghcr.io
