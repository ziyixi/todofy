# The apply of infra/ (IaC P4, infra/README.md "Apply"). One of the two CI paths that write these Cloudflare objects
# and the remote state; the other is the routine repair of personal-cloud-reconcile.yml.
# (Private operations' infra-apply writes only the private application's own infrastructure.)
# A separate workflow, not a job in personal-cloud-reconcile.yml, because:
# - its trigger differs: a manual dispatch only, while the reconcile runs after main CI, daily and on dispatch. In one
#   workflow one wrong `if:` would turn a drift check into an apply;
# - a dispatch needs inputs (the expected actions, the destructive confirmation) that the drift check must not have.
# Manual only, for now: an apply should be watched, and the reconcile after the merged commit's CI has already shown
# its address table and printed the expect line for it. The "expect" input is what the reviewer expected from that
# table (counts and the plan fingerprint, which binds the dispatch to that exact list of addresses and actions), never
# a copy of a line that differs from it. Switching to `push` is a later, separate decision (README.md).
# infra_state.py refuses `apply` anywhere but in this workflow (its name), dispatched on main.
# It shares the concurrency group infra-production with the reconcile's infra job, so a plan never reads a
# half-written state.
# The public log shows only the backup's key, the redacted summaries (addresses and action counts) and fixed messages.
name: Infra apply

on:
  workflow_dispatch:
    inputs:
      expect:
        description: The counts and fingerprint you expected and checked against the address table in the reconcile's Infrastructure summary (for example import=5,outputs=3@<12 hex>; none for no change). Never a copy of a line that differs from what you expected
        required: true
        type: string
      confirm_destructive:
        description: Leave empty. Only the literal delete-replace-forget lets a plan delete, replace or forget a resource
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The S3 backend keeps no lock file (versions.tf): this group, shared with the reconcile's infra job, is the lock.
# Never cancel an apply half way.
concurrency:
  group: infra-production
  cancel-in-progress: false

jobs:
  apply:
    name: Infra apply
    # The production environment admits main only; a dispatch from another branch is skipped here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          # The wrapper would copy tofu's output into step outputs; plans must never be captured.
          tofu_wrapper: false
          github_token: ${{ github.token }}
      # In order, and nothing is written before the gates pass: copy the encrypted state object to
      # backups/production/terraform.tfstate.<UTC time>-run<id> in the same private bucket and read it back; plan; refuse
      # unless every gate passes (no delete/replace/forget unless confirmed, only ALLOWED_TYPES, no write to a FROZEN
      # object, exactly the expected actions and plan fingerprint, outputs equal to every wrangler.toml); apply exactly
      # the saved plan; plan
      # again, which must be "No changes". Exit 0 done; 1 refused or failed; 3 a destructive plan without confirmation.
      # The inputs reach the script through the environment only, never through the run line.
      - name: Back up the state, plan, gate and apply the saved plan (redacted summary only)
        env:
          # The existing deploy token for now (owner decision 2026-10-01); CF_INFRA_TOKEN replaces it later
          # (infra/README.md "Replacing the token"). The R2 S3 credentials are derived from it and masked.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          INFRA_STATE_PASSPHRASE: ${{ secrets.INFRA_STATE_PASSPHRASE }}
          INFRA_TFVARS: ${{ secrets.INFRA_TFVARS }}
          INFRA_APPLY_EXPECT: ${{ inputs.expect }}
          INFRA_CONFIRM_DESTRUCTIVE: ${{ inputs.confirm_destructive }}
          VPS_BOOTSTRAP_CERT: ${{ vars.VPS_BOOTSTRAP_CERT }}
        run: python3 infra/scripts/infra_state.py apply --environment production
      - name: Preserve only the encrypted one-time bootstrap handoff
        if: vars.VPS_BOOTSTRAP_CERT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-bootstrap.cms
          retention-days: 1
          if-no-files-found: error
      - name: Preserve only the encrypted inference Access handoff
        if: vars.VPS_BOOTSTRAP_CERT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-gateway-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-gateway-bootstrap.cms
          retention-days: 1
          if-no-files-found: error
