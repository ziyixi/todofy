name: Todofy CI and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todofy-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    name: Todofy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check worker tests
          uv run ruff format --check worker tests
      - name: Unit tests
        run: uv run pytest tests/unit tests/fakes
      - name: Check, test and build the UI
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Runtime tests (workerd with real D1, Durable Object, alarms, cron and assets)
        run: uv run pytest tests/runtime

  # deploy: added in S9. It needs `checks`, runs only for main push or
  # workflow_dispatch in the `production` environment, generates the Wrangler
  # config from GitHub variables, applies D1 migrations and deploys.
