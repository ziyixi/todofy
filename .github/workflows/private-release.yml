name: Private release

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      operation:
        type: string
        default: release
      expect:
        type: string
        default: ''
      manifests:
        type: string
        default: private/k3s/manifests
    secrets:
      private_ssh_key:
        required: true
      CF_API_TOKEN:
        required: true
      INFRA_STATE_PASSPHRASE:
        required: true
      INFRA_TFVARS:
        required: true
      PLATFORM_ACCESS_CLIENT_ID:
        required: true
      PLATFORM_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  checks: read
  packages: write
  deployments: write
  id-token: write

concurrency:
  group: private-production
  cancel-in-progress: false

jobs:
  release:
    name: Release pinned private sources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A slow private rollout plus its later observation and checks; a cancelled job leaves its receipt in progress.
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-checkout
        with:
          revision: ${{ inputs.revision }}
          path: private
          ssh-key: ${{ secrets.private_ssh_key }}
          history: commit
      - uses: ./.github/actions/setup-bazel
        if: ${{ inputs.operation != 'k3s-check' && inputs.operation != 'k3s-plan' && inputs.operation != 'k3s-apply' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ inputs.operation != 'k3s-check' && inputs.operation != 'k3s-plan' && inputs.operation != 'k3s-apply' }}
        with:
          node-version-file: .node-version
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: ${{ inputs.operation != 'k3s-check' && inputs.operation != 'k3s-plan' && inputs.operation != 'k3s-apply' }}
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          github_token: ${{ github.token }}
      - name: Run the pinned private release entry point
        env:
          PRIVATE_REVISION: ${{ inputs.revision }}
          PRIVATE_RELEASE_OPERATION: ${{ inputs.operation }}
          PRIVATE_INFRA_EXPECT: ${{ inputs.expect }}
          PRIVATE_K3S_MANIFESTS: ${{ inputs.manifests }}
          K3S_CLUSTER_CA: ${{ vars.K3S_CLUSTER_CA }}
          PLATFORM_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
          PLATFORM_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          INFRA_STATE_PASSPHRASE: ${{ secrets.INFRA_STATE_PASSPHRASE }}
          INFRA_TFVARS: ${{ secrets.INFRA_TFVARS }}
        # On the command line, an operation the pinned entry point does not know is refused before any action.
        # Every operation's output names private resources, so it stays in a runner file; the public log shows fixed
        # codes, the exit status and only the plan results an operator acts on, accepted in their fixed shapes.
        run: |
          log="$RUNNER_TEMP/private-operation.log"
          case "$PRIVATE_RELEASE_OPERATION" in
            release|publish|finish-worker) outcome=PRIVATE_PUBLICATION ;;
            *) outcome=PRIVATE_OPERATION ;;
          esac
          status=0
          python3 private/ci/release.py --operation "$PRIVATE_RELEASE_OPERATION" > "$log" 2>&1 || status=$?
          case "$PRIVATE_RELEASE_OPERATION" in
            infra-plan|infra-apply)
              # infra-apply's reviewed input; it is also shown when an apply refuses a changed plan.
              plan=$(sed -n -E 's/^Private infrastructure plan: (create=[0-9]{1,6},update=[0-9]{1,6}@[0-9a-f]{16})$/\1/p' "$log" | tail -n 1)
              if [ -n "$plan" ]; then echo "::notice::PRIVATE_INFRA_PLAN=$plan"; fi
              ;;
            k3s-plan)
              changed=$(sed -n -E 's/^\{"event":"k3s_operation","operation":"plan",.*"changed":(true|false)\}$/\1/p' "$log" | tail -n 1)
              case "$status:$changed" in
                0:true) echo "::notice::PRIVATE_K3S_PLAN_CHANGED" ;;
                0:false) echo "::notice::PRIVATE_K3S_PLAN_UNCHANGED" ;;
              esac
              ;;
          esac
          # Only reviewed generic terminal codes may leave the private output boundary.
          cause=$(tail -n 1 "$log")
          case "$cause" in
            private_release_failed_bazel_build|private_release_failed_bazel_cquery|private_release_failed_bazel_run|private_release_failed_docker_login|private_release_failed_command|private_worker_bundle_over_budget|private_worker_configuration_mismatch|private_image_visibility_required|private_package_bootstrap_required)
              diagnostic="$cause" ;;
            release_dependency_http_[0-9][0-9][0-9]) diagnostic="$cause" ;;
            *) diagnostic='' ;;
          esac
          rm -f "$log"
          if [ "$status" = 0 ]; then
            echo "::notice::${outcome}_COMPLETE"
          else
            if [ -n "$diagnostic" ]; then echo "::error::PRIVATE_CAUSE=$diagnostic"; fi
            echo "::error::${outcome}_FAILED"
            exit "$status"
          fi
