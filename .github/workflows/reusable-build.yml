name: Reusable Build

on:
  workflow_call:
    outputs:
      todofy_image:
        description: Main application image pinned to its published GHCR digest
        value: ${{ jobs.build.outputs.todofy_image }}
      todofy_digest:
        description: Published main application SHA-256 image digest
        value: ${{ jobs.build.outputs.todofy_digest }}

jobs:
  build:
    name: Build and Push Docker Images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      todofy_image: ${{ steps.publish.outputs.todofy_image }}
      todofy_digest: ${{ steps.publish.outputs.todofy_digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Log in to GitHub Packages (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker images with revision tags
      env:
        IMAGE_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        image_owner="${IMAGE_OWNER,,}"
        for service in todofy todofy-llm todofy-todo todofy-database; do
          dockerfile="Dockerfile"
          if [[ "$service" != "todofy" ]]; then
            dockerfile="${service#todofy-}/Dockerfile"
          fi
          image="ghcr.io/${image_owner}/${service}"
          docker build \
            --build-arg "GIT_COMMIT=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}:sha-${GITHUB_SHA}" \
            -t "${image}:latest" \
            -f "$dockerfile" .
        done

    - name: Publish Docker images and record immutable references
      id: publish
      env:
        IMAGE_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        image_owner="${IMAGE_OWNER,,}"
        echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
        echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '| Service | Immutable image |' >> "$GITHUB_STEP_SUMMARY"
        echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
        for service in todofy todofy-llm todofy-todo todofy-database; do
          image="ghcr.io/${image_owner}/${service}"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:latest"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:sha-${GITHUB_SHA}")
          digest="${reference##*@}"
          if [[ "$reference" != "${image}@sha256:"* || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Missing immutable image digest for ${service}" >&2
            exit 1
          fi
          echo "| ${service} | \`${reference}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$service" == "todofy" ]]; then
            echo "todofy_image=${reference}" >> "$GITHUB_OUTPUT"
            echo "todofy_digest=${digest}" >> "$GITHUB_OUTPUT"
          fi
        done
