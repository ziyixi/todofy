# The one-time copy of Todofy's GTD days and reviews, Mail categories and task routes into Tasks (tasks/docs/backup.md
# "One-time Todofy import"), run right after the release in which Tasks took them over. It is deleted, with those
# Todofy tables, once the import is verified.
# A manual dispatch on main, in the production environment, with the Cloudflare token the releases use. It reads both
# D1 databases with the read-only SELECTs of tasks/tools/prepare-todofy-import.ts into a private directory on the
# runner and prints counts only: never a task, a label, a project, a mail or an ID. With apply=true it then prints
# Tasks' Time Travel bookmark, applies the generated SQL to Tasks' D1 and counts again, failing unless nothing is left
# pending. Applying again changes nothing.
name: Tasks Todofy import

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Leave false to print the counts only. True also imports into Tasks' D1, then counts again
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# The Tasks release's group: the import never runs while Tasks' migrations or Worker deploy.
concurrency:
  group: tasks-production
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  import:
    name: Tasks Todofy import
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            tasks/worker/package-lock.json
            proto/package-lock.json
      - name: Install the locked wrangler
        working-directory: tasks/worker
        run: npm ci --no-audit --no-fund
      - name: Count, and with apply import and count again (counts only)
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TODOFY_IMPORT_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          # The answers name projects and labels: a private directory outside the checkout, never printed.
          dir="$RUNNER_TEMP/todofy-import"
          mkdir -m 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          wrangler=tasks/worker/node_modules/.bin/wrangler
          tool=tasks/tools/prepare-todofy-import.ts
          # Each export of the tool against Todofy's or Tasks' D1, its answer into a file; then the counts.
          count() {
            node "$tool" --exports > "$dir/exports.tsv"
            while IFS=$'\t' read -r app name sql; do
              "$wrangler" d1 execute DB --remote --config "$app/wrangler.toml" --json --command "$sql" > "$dir/$name.json"
            done < "$dir/exports.tsv"
            node "$tool" --dir "$dir" "$@"
          }
          if [ "$TODOFY_IMPORT_APPLY" != true ]; then
            count
            exit 0
          fi
          count --output "$dir/import.sql"
          # The bookmark `wrangler d1 time-travel restore` takes to undo the import.
          "$wrangler" d1 time-travel info DB --config tasks/wrangler.toml
          # wrangler's answer could quote a statement, so it stays in the private directory.
          if ! "$wrangler" d1 execute DB --remote --config tasks/wrangler.toml --yes --file "$dir/import.sql" > "$dir/apply.log" 2>&1; then
            echo TODOFY_IMPORT_APPLY_FAILED >&2
            exit 1
          fi
          count --expect-none
