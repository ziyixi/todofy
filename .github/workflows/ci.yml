  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            mail-hero/cloudflare/package-lock.json
            todofy/gateway/package-lock.json
            dashboard/worker/package-lock.json
            lab/worker/package-lock.json
            watch/worker/package-lock.json
            proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
      # ops-v1's JSON Schema is generated from proto/ops/v1/ops.proto: a hand edit, or an IDL change without
      # `npm run schema`, fails here (the Python steps below give every fixture the reference validator's verdict on it).
      - name: The contracts' JSON Schemas are generated from the IDL
        working-directory: proto
        run: |
          npm ci --no-audit --no-fund
          npm run check:schema
      # Producer: Mail Hero's parser and payload builder (the generated mail.received.v1 message, written by the wire
      # codec) must still emit every golden fixture byte for byte; the generated schema's "not blank" differs from the
      # hand-written one in ECMAScript only where the IDL says (contract-schema-dialect).
      # ops-v1: every answer Mail Hero's Ops code derives (status, guard, canary) keeps its golden bytes, passes the
      # contract's rules (the wire codec) and the legacy schema older dashboards check. Host only, no workerd.
      - name: Mail Hero builds the golden mail.received.v1 fixtures and checks ops-v1
        working-directory: mail-hero/cloudflare
        run: |
          npm ci
          node --test test/contract-fixtures.test.mjs test/contract-schema-dialect.test.mjs test/ops-golden.test.mjs test/native-ops.test.mjs
      # Consumer: Todofy validates every fixture (current and legacy) against the schema and parses it with the generated
      # codec; the generated mail.received.v1 schema gives the frozen hand-written one's verdict, and the parser the frozen
      # parser's, on every fixture and ~9,000 mutations (test_mail_received_*_legacy);
      # ops-v1 fixtures get the reference JSON Schema validator's verdict on the generated schema (the Python wire
      # codec agrees with it), and every value core/ops.py derives (status, guard, canary result, report, digest
      # items) keeps its golden bytes, the contract's rules and the legacy schema older dashboards check. task-intent-v1:
      # the generated types and the Python wire JSON codec agree with the schema on every fixture, the core
      # (strict read plus value rules) gives the schema's verdict, and every result it builds passes it. The newsletter
      # reports (todofy.report.v1): every report keeps its golden bytes and the generated schemas give the frozen
      # hand-written ones' verdict.
      - name: Todofy accepts every fixture and checks ops-v1
        working-directory: todofy
        run: |
          uv sync --locked
          uv run pytest tests/unit/test_mail_hero_compat.py tests/unit/test_contract.py tests/unit/test_openapi_vocab.py \
            tests/unit/test_mail_received_schema_legacy.py tests/unit/test_mail_received_parser_legacy.py \
            tests/unit/test_ops_contract.py tests/unit/test_ops_core.py tests/unit/test_ops_golden.py \
            tests/unit/test_task_intent_contract.py tests/unit/test_report_wire.py tests/unit/test_report_schemas.py \
            tests/unit/test_report_schema_legacy.py
      # The gateway's Ops entrypoint (what the dashboard binds) forwards to todofy-core and returns values the
      # wire codec reads strictly (the generated services type it).
      - name: Todofy's Ops entrypoint returns ops-v1 values
        working-directory: todofy/gateway
        run: |
          npm ci --no-audit --no-fund
          npx --no-install vitest run test/ops.test.ts
      # Caller: the dashboard calls only the methods of each app's generated ops-v1 services, handles every
      # declared error code plus timeouts and invalid output, accepts the valid fixtures and refuses the
      # invalid ones, keeps the bytes it read and sent before the move onto proto/ (ops-golden), and every value
      # it sends (SetGuardInput, StartCanaryInput, OpsReport) passes the contract's rules. Host only (vitest in
      # Node); Dashboard checks runs the workerd flows.
      - name: The dashboard calls ops-v1 as declared
        working-directory: dashboard/worker
        run: |
          npm ci --no-audit --no-fund
          npx --no-install vitest run test/ops-client.test.ts test/ops-golden.test.ts test/guard.test.ts test/canary.test.ts test/digest.test.ts
      # task-intent-v1, the proposer: every fixture gets validate.mjs's verdict (Todofy's step above gives the same
      # fixtures the Python jsonschema verdict), the generated types and the TypeScript codec agree with the schema
      # on every fixture, the ts constants match it, every intent Lab builds passes it (and keeps the bytes Lab froze
      # before the generated types), and Lab maps every result fixture. ops-v1: Lab's status and guard answers keep
      # their golden bytes and pass the legacy schema. Host only; Lab checks runs the workerd flows.
      - name: Lab proposes task-intent-v1 and answers ops-v1 as declared
        working-directory: lab/worker
        run: |
          npm ci --no-audit --no-fund
          npx --no-install vitest run test/task-intent-contract.test.ts test/intent.test.ts test/ops-golden.test.ts
      # task-intent-v1, the watch app's notification sink (W3): its daily digest and an urgent change keep the bytes of
      # the contract's watch fixtures (which Todofy's step above accepts and pins), every intent it can build passes
      # validate.mjs with only the owner's names, trigger types, counts and links to the app, and every result Todofy
      # may give maps to recorded, refused or a retry. ops-v1: its status and guard answers keep their golden bytes and
      # the contract's watch fixtures, pass the generated schema, and carry counts and codes only. Host only; Watch
      # checks runs the sink with a stub Todofy and the Ops entrypoint over a service binding in workerd.
      - name: The watch app proposes task-intent-v1 and answers ops-v1 as declared
        working-directory: watch/worker
        run: |
          npm ci --no-audit --no-fund
          npx --no-install vitest run test/todofy.test.ts test/ops-golden.test.ts

  # The personal website (website/, docs in website/docs): a Next.js static export on the assets-only Worker
  # ziyixi-website (Custom Domains www and the apex), plus the Notion relay Worker ziyixi-notion-publish
  # (website/relay). No Notion secret: the builds use the committed synthetic fixture (and the empty
  # source), Playwright runs against the export under `wrangler dev` with the production wrangler.toml,
  # _headers and _redirects.
  website-checks:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.website_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: website/.nvmrc
      - name: Install the pinned pnpm and locked dependencies
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Format, lint, typecheck and unit tests (release, relay and detector included)
        run: |
          pnpm content:prepare:empty
          pnpm check
      # The browser download is cached by the locked Playwright version; the system libraries it needs are
      # installed on every run (install-deps), so a cache hit only skips the download.
      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the pinned Playwright browser
        run: |
          if [ "$CACHE_HIT" = true ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      # Each source builds the export and runs the browser suite against it (pnpm start = wrangler dev on
      # out/). The fixture also runs the release's route contract (every route, asset hash, redirect, 404).
      - name: Build and test the static export (empty and fixture content)
        run: |
          for mode in empty fixture; do
            echo "::group::$mode"
            pnpm "content:prepare:$mode"
            pnpm content:validate --source="$mode"
            CODE_SHA="$GITHUB_SHA" pnpm build:site
            CONTENT_MODE="$mode" pnpm test:e2e
            echo "::endgroup::"
          done
          pnpm start > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:4173/build-info.json && break
            sleep 1
          done
          ALLOW_FIXTURE_DEPLOYMENT_TESTS=true DEPLOYMENT_BASE_URL=http://127.0.0.1:4173 \
            EXPECTED_BUILD_INFO_PATH=out/build-info.json pnpm test:deployment
      # The two Workers' production configs, as the deploy jobs use them. No token is needed for --dry-run.
      - name: Dry-run the two Workers
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.toml
          pnpm exec wrangler deploy --dry-run --config relay/wrangler.toml --outdir "$RUNNER_TEMP/relay-bundle"
      # The website never imports another app, a package or a contract.
      - name: No imports from other apps
        run: |
          if grep -rnE "(from|import)[[:space:]]*\(?[[:space:]]*['\"][^'\"]*(mail-hero|todofy|dashboard|contracts|packages)/" \
            src scripts relay/src tests; then exit 1; fi

  # infra/: the OpenTofu configuration (infra/README.md). No Cloudflare token, no state and no plan here: the
  # locked provider download, format and validation, the guards that keep infra/ free of code-running data
  # sources, provisioners, personal values and state, and the plan-summary and state-driver tests (fake tofu,
  # no network). The checks of infra/ against the apps' wrangler.toml files run in Changes
  # (.github/scripts/test_infra_config.py). The drift plan against the encrypted remote state is
  # .github/workflows/infra.yml and the apply is the manually dispatched infra-apply.yml; both hold the token, this
  # job never does.
  infra-checks:
    name: Infra checks
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          # The wrapper would copy tofu's output into step outputs; plans must never be captured.
          tofu_wrapper: false
          github_token: ${{ github.token }}
      # File names only for the email check, so a committed address is not repeated in the log. The greps are
      # a quick first line; infra_guard.py reads the HCL structure (bare labels, nested blocks, every config
      # file kind) and is the authority. Quoted or bare labels, any file except the docs.
      - name: Guards (data sources, provisioners, providers, email addresses, file kinds, structure)
        run: |
          failed=0
          if grep -rnE --exclude='*.md' --exclude-dir=.terraform '^[[:space:]]*data[[:space:]]+"?(external|http)"?[[:space:]]' .; then
            echo "::error::external/http data sources can run code or send data out"; failed=1
          fi
          if grep -rnE --exclude='*.md' --exclude-dir=.terraform '(^|[[:space:]{])provisioner[[:space:]]+"?[A-Za-z_-]+"?[[:space:]]*\{' .; then
            echo "::error::provisioners are not allowed in infra/"; failed=1
          fi
          if [ "$(grep -c '^provider ' .terraform.lock.hcl)" != 1 ] || ! grep -q '^provider "registry.opentofu.org/cloudflare/cloudflare"' .terraform.lock.hcl; then
            echo "::error::the lock file must hold exactly the Cloudflare provider"; failed=1
          fi
          if grep -rlIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}' .; then
            echo "::error::email addresses come from sensitive variables, never from files in infra/"; failed=1
          fi
          # An allowlist of committed file kinds: a state, plan, values or log file fails whatever its name.
          if git ls-files -- . | grep -vE '^([A-Za-z0-9_-]+\.tf|\.terraform\.lock\.hcl|\.gitignore|README\.md|local\.tfvars\.example|(scripts|tests)/[A-Za-z0-9_]+\.py)$'; then
            echo "::error::only *.tf, the lock file, docs, the example values and the scripts are committed in infra/"; failed=1
          fi
          python3 ../.github/scripts/infra_guard.py . || failed=1
          exit "$failed"
      - name: Format
        run: tofu fmt -check -recursive -diff
      - name: Validate (downloads the locked provider only; no backend, no credentials)
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
      - name: Plan-summary, local-values and state-driver tests
        run: |
          python3 -m unittest discover -s ../tools/infra-plan-summary
          python3 -m unittest discover -s tests

  # The protobuf IDL of the cross-app contracts (proto/README.md). No secret; buf fetches the googleapis module
  # pinned in proto/buf.lock from buf.build. The apps that use the generated code (ci_changes.py PROTO_USERS)
  # are checked by their own jobs, whose installs generate it (an npm postinstall, uv's build of ziyixi-proto).
  proto-checks:
    name: Proto checks
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The breaking-change base (the Changes job's diff base) must be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: proto/package-lock.json
      # Python 3.14 (todofy-core's) for the Python codec's tests.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: proto
      # Go for Google's api-linter, the Go toolchain proto/tools/api-linter/go.mod names (its go.sum pins every
      # module checksum; scripts/api-lint.sh builds the linter from it).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: proto/tools/api-linter/go.mod
          cache-dependency-path: proto/tools/api-linter/go.sum
      - name: Install the pinned toolchain (buf, protoc-gen-es, the protobuf-es runtime)
        run: npm ci --no-audit --no-fund
      - name: Format and lint (STANDARD and COMMENTS)
        run: npm run lint
      - name: Google's api-linter (AIP rules) on every package but the runtimes' test fixtures
        run: npm run api-lint
      # Against the commit the Changes job diffed from: the last successful main run on main, the merge base
      # with origin/main on a branch. Empty (Changes found no usable base and runs everything, or a dispatch):
      # breaking.sh compares with HEAD~1 and says so in the log.
      - name: No breaking change (buf FILE rules and the wire profile rules) against the diff base
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: sh scripts/breaking.sh "$BASE"
      - name: The lint and breaking rules still bite
        run: sh scripts/rules-selftest.sh
      - name: Generation is deterministic
        run: node tools/ensure.mjs --check-deterministic
      - name: The contracts' JSON Schemas are generated from the IDL (tools/gen_schema.py)
        run: npm run check:schema
      - name: One protobuf-es runtime at the generator's version, every user wired the same way
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p test_proto.py
      - name: Typecheck and test both codecs (the shared edge cases in TypeScript and Python)
        run: |
          npm run typecheck
          npx --no-install vitest run
          npm run test:python

  gate:
    name: CI gate
    needs: [changes, shared-packages, todofy-static, todofy-runtime, todofy-checks, mail-hero-checks, dashboard-checks, website-checks, lab-checks, flowday-checks, links-checks, watch-checks, contracts, infra-checks, proto-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped as unchanged
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.shared-packages.result }}
          TODOFY_STATIC: ${{ needs.todofy-static.result }}
          TODOFY_RUNTIME: ${{ needs.todofy-runtime.result }}
          TODOFY: ${{ needs.todofy-checks.result }}
          MAIL_HERO: ${{ needs.mail-hero-checks.result }}
          DASHBOARD: ${{ needs.dashboard-checks.result }}
          WEBSITE: ${{ needs.website-checks.result }}
          LAB: ${{ needs.lab-checks.result }}
          FLOWDAY: ${{ needs.flowday-checks.result }}
          LINKS: ${{ needs.links-checks.result }}
          WATCH: ${{ needs.watch-checks.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          INFRA: ${{ needs.infra-checks.result }}
          PROTO: ${{ needs.proto-checks.result }}
          CHECKS_REUSED: ${{ needs.changes.outputs.checks_reused }}
          REUSED_RUN_URL: ${{ needs.changes.outputs.reused_run_url }}
          REUSED_JOBS: ${{ needs.changes.outputs.reused_jobs }}
        run: |
          # A push to main that reused a branch run of the same commit: its checks are skipped here because that
          # run passed them (ci_changes.py find_reusable checked each job's conclusion).
          if [ "$CHECKS_REUSED" = true ]; then
            echo "Checks reused from $REUSED_RUN_URL (same commit, branch push, CI gate passed): $REUSED_JOBS"
            echo "::notice::Checks reused from $REUSED_RUN_URL"
          fi
          failed=0
          for pair in "Changes=$CHANGES" "Shared packages=$PACKAGES" "Todofy static checks=$TODOFY_STATIC" \
            "Todofy runtime=$TODOFY_RUNTIME" "Todofy checks=$TODOFY" "Mail Hero checks=$MAIL_HERO" \
            "Dashboard checks=$DASHBOARD" "Website checks=$WEBSITE" "Lab checks=$LAB" "FlowDay checks=$FLOWDAY" "Links checks=$LINKS" "Watch checks=$WATCH" \
            "Contracts=$CONTRACTS" "Infra checks=$INFRA" "Proto checks=$PROTO"; do
            echo "$pair"
            case "${pair#*=}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          # "changes" must itself succeed: without it every other job is skipped.
          [ "$CHANGES" = success ] || failed=1
          exit "$failed"

  todofy-deploy:
    name: Todofy deploy
    # Every Todofy job, named here even though "Todofy checks" already requires the other two.
    needs: [changes, todofy-static, todofy-runtime, todofy-checks, gate]
    # Keep the status function and the results explicit. "gate" needs Mail Hero checks (and Dashboard checks),
    # which are skipped when only Todofy changed; a bare condition gets an implicit success() that looks at the whole needs
    # chain, sees that skipped job and skips this deploy too (actions/runner#491, #2205).
    # .github/scripts/test_ci_changes.py checks this shape. A check job may be skipped only when this push to main
    # reuses a green branch run of the same commit (checks_reused); the gate must still pass.
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.todofy-static.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-static.result == 'skipped'))
      && (needs.todofy-runtime.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-runtime.result == 'skipped'))
      && (needs.todofy-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.todofy_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: todofy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: todofy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: todofy/.nvmrc
          cache: npm
          cache-dependency-path: |
            todofy/package-lock.json
            todofy/gateway/package-lock.json
            todofy/web/package-lock.json
            proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
      # Every static production value (account, D1, hosts, Access, limits) is committed in wrangler.toml
      # (todofy-core) and gateway/wrangler.toml; the environment URL and the probes read the hosts there.
      - name: Read the hosts from the committed gateway config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("gateway/wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["TODOFY_PUBLIC_HOST"])
          print("hooks_host=" + variables["TODOFY_HOOKS_HOSTS"].split(",")[0])
          EOF
      - name: Build the verified revision
        run: |
          npm ci --no-audit --no-fund
          uv sync --locked
          npm ci --prefix gateway --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # deploy/deploy_vars.py adds what is never committed and refuses a missing or invalid value (a deploy
      # without a var deletes it). The switches (production variables) and BUILD_SHA are --var on both
      # Workers. The personal values are environment secrets (masked in this public log) and reach the
      # Workers as Worker secrets through --secrets-file, in the same upload as the code (wrangler and the
      # Cloudflare dashboard show plain vars): the Todoist projects on the core, the owner's email addresses
      # on the gateway. Only this step reads the personal secrets.
      - name: Write the Worker secrets files
        env:
          TODOFY_ACCESS_OWNER: ${{ secrets.TODOFY_ACCESS_OWNER }}
          TODOFY_ACCESS_OWNER_ALIASES: ${{ secrets.TODOFY_ACCESS_OWNER_ALIASES }}
          TODOFY_TODOIST_DEFAULT_PROJECT_ID: ${{ secrets.TODOFY_TODOIST_DEFAULT_PROJECT_ID }}
          TODOFY_TODOIST_OPS_PROJECT_ID: ${{ secrets.TODOFY_TODOIST_OPS_PROJECT_ID }}
          TODOFY_TODOIST_REVIEW_PROJECT_ID: ${{ secrets.TODOFY_TODOIST_REVIEW_PROJECT_ID }}
        run: |
          uv run python deploy/deploy_vars.py secrets core "$RUNNER_TEMP/todofy-core-secrets.json"
          uv run python deploy/deploy_vars.py secrets gateway "$RUNNER_TEMP/todofy-gateway-secrets.json"
      - name: Validate both bundles before changing D1
        env:
          TODOFY_REMINDER_ENABLED: ${{ vars.TODOFY_REMINDER_ENABLED }}
          TODOFY_MAINTENANCE_MODE: ${{ vars.TODOFY_MAINTENANCE_MODE }}
          TODOFY_PROCESSING_PAUSED: ${{ vars.TODOFY_PROCESSING_PAUSED }}
          TODOFY_FORCE_PAUSE_TODOIST: ${{ vars.TODOFY_FORCE_PAUSE_TODOIST }}
          TODOFY_GTD_REVIEW_ENABLED: ${{ vars.TODOFY_GTD_REVIEW_ENABLED }}
        run: |
          uv run python deploy/deploy_vars.py exec core -- uv run pywrangler deploy --dry-run --config wrangler.toml \
            --secrets-file "$RUNNER_TEMP/todofy-core-secrets.json"
          uv run python deploy/deploy_vars.py exec gateway -- npx --no-install wrangler deploy --dry-run \
            --config gateway/wrangler.toml --secrets-file "$RUNNER_TEMP/todofy-gateway-secrets.json"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config todofy/wrangler.toml --config todofy/gateway/wrangler.toml
      # todofy-core first: the Durable Object class and every route a new gateway calls must exist before
      # the gateway that binds and calls them goes live.
      - name: Apply D1 migrations, then deploy todofy-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TODOFY_REMINDER_ENABLED: ${{ vars.TODOFY_REMINDER_ENABLED }}
          TODOFY_MAINTENANCE_MODE: ${{ vars.TODOFY_MAINTENANCE_MODE }}
          TODOFY_PROCESSING_PAUSED: ${{ vars.TODOFY_PROCESSING_PAUSED }}
          TODOFY_FORCE_PAUSE_TODOIST: ${{ vars.TODOFY_FORCE_PAUSE_TODOIST }}
          TODOFY_GTD_REVIEW_ENABLED: ${{ vars.TODOFY_GTD_REVIEW_ENABLED }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.toml
          uv run python deploy/deploy_vars.py exec core -- uv run pywrangler deploy --config wrangler.toml \
            --secrets-file "$RUNNER_TEMP/todofy-core-secrets.json"
      - name: Deploy the gateway todofy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TODOFY_MAINTENANCE_MODE: ${{ vars.TODOFY_MAINTENANCE_MODE }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          uv run python deploy/deploy_vars.py exec gateway -- npx --no-install wrangler deploy \
            --config gateway/wrangler.toml --secrets-file "$RUNNER_TEMP/todofy-gateway-secrets.json"
      # A first deploy waits for the Custom Domain certificate and DNS, hence 10 tries x 15 s. /health is
      # answered by the gateway alone, so this proves the gateway build; the next step proves the core.
      - name: Wait until the hooks host serves this commit
        env:
          HOOKS_HOST: ${{ steps.config.outputs.hooks_host }}
        run: |
          host=$HOOKS_HOST
          for attempt in $(seq 1 10); do
            if build=$(curl -fsS --max-time 10 "https://$host/health" | jq -er .build) && [ "$build" = "$GITHUB_SHA" ]; then
              echo "The hooks host serves $GITHUB_SHA (attempt $attempt)."
              exit 0
            fi
            sleep 15
          done
          echo "The hooks host never reported build $GITHUB_SHA." >&2
          exit 1
      # /health never reaches todofy-core. A wrong newsletter credential does: the gateway forwards it to
      # the object's newsletter_auth_failure(), which reads and writes D1 and answers 401 (or 429 once
      # this hour's 20 failures are spent). A broken core, binding or D1 gives 503. The correct credential
      # never reads the counter, so this probe cannot lock the newsletter out.
      - name: Check that the gateway reaches todofy-core
        env:
          HOOKS_HOST: ${{ steps.config.outputs.hooks_host }}
        run: |
          host=$HOOKS_HOST
          for attempt in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -u ci-probe:wrong "https://$host/api/summary")
            if [ "$code" = 401 ] || [ "$code" = 429 ]; then
              echo "todofy-core answered $code (attempt $attempt)."
              exit 0
            fi
            sleep 10
          done
          echo "The gateway did not reach todofy-core (last status $code)." >&2
          exit 1
      - name: Remove the secrets files
        if: always()
        run: rm -f "$RUNNER_TEMP/todofy-core-secrets.json" "$RUNNER_TEMP/todofy-gateway-secrets.json"

  mail-hero-deploy:
    name: Mail Hero deploy
    needs: [changes, mail-hero-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.mail-hero-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.mail-hero-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.mail_hero_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: mail-hero-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mail-hero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            mail-hero/cloudflare/package-lock.json
            mail-hero/web/package-lock.json
            proto/package-lock.json
      # Every static production value (account, D1, buckets, host, Access, limits) is committed in
      # mail-hero/wrangler.toml; the environment URL reads the host there.
      - name: Read the host from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              print("url=https://" + tomllib.load(file)["vars"]["PUBLIC_HOST"])
          EOF
      - name: Build the verified revision
        run: |
          npm ci --prefix cloudflare
          npm ci --prefix web
          npm run build --prefix web
      # deploy/deploy-vars.mjs adds what is never committed and refuses a missing or invalid value (a deploy
      # without a var deletes it). The receive address and the owner's addresses are environment secrets (masked
      # in this public log) and reach the Worker as Worker secrets through --secrets-file, in the same upload as
      # the code (wrangler and the Cloudflare dashboard show plain vars); the pause and maintenance switches
      # (production variables) and BUILD_SHA are --var. Only this step reads the personal secrets.
      - name: Write the Worker secrets file
        working-directory: mail-hero/cloudflare
        env:
          MAIL_HERO_RECEIVE_ADDRESS: ${{ secrets.MAIL_HERO_RECEIVE_ADDRESS }}
          MAIL_HERO_ACCESS_OWNER: ${{ secrets.MAIL_HERO_ACCESS_OWNER }}
          MAIL_HERO_ACCESS_OWNER_ALIASES: ${{ secrets.MAIL_HERO_ACCESS_OWNER_ALIASES }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mail-hero-secrets.json"
      - name: Validate the native deployment bundle before changing D1
        working-directory: mail-hero/cloudflare
        env:
          MAIL_HERO_FORCE_SEND_PAUSED: ${{ vars.MAIL_HERO_FORCE_SEND_PAUSED }}
          MAIL_HERO_MAINTENANCE_MODE: ${{ vars.MAIL_HERO_MAINTENANCE_MODE }}
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/mail-hero-secrets.json" --outdir "$RUNNER_TEMP/mail-hero-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/mail-hero-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAIL_HERO_CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config mail-hero/wrangler.toml
      # Mail Hero's own token: this environment also holds Todofy's CF_API_TOKEN.
      - name: Apply migrations, then deploy the native Worker
        working-directory: mail-hero/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAIL_HERO_CF_API_TOKEN }}
          MAIL_HERO_FORCE_SEND_PAUSED: ${{ vars.MAIL_HERO_FORCE_SEND_PAUSED }}
          MAIL_HERO_MAINTENANCE_MODE: ${{ vars.MAIL_HERO_MAINTENANCE_MODE }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/mail-hero-secrets.json"
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/mail-hero-secrets.json"

  dashboard-deploy:
    name: Dashboard deploy
    # After the app deploys: the service bindings MAIL_HERO, TODOFY, LAB and WATCH name their "Ops" entrypoints, which
    # must be live first. An app deploy that did not run (nothing of that app changed) is fine; one that
    # failed or was cancelled stops this job.
    needs: [changes, dashboard-checks, gate, todofy-deploy, mail-hero-deploy, lab-deploy, watch-deploy]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.dashboard-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.dashboard-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && (needs.todofy-deploy.result == 'success' || needs.todofy-deploy.result == 'skipped')
      && (needs.mail-hero-deploy.result == 'success' || needs.mail-hero-deploy.result == 'skipped')
      && (needs.lab-deploy.result == 'success' || needs.lab-deploy.result == 'skipped')
      && (needs.watch-deploy.result == 'success' || needs.watch-deploy.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.dashboard_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: dashboard-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            dashboard/worker/package-lock.json
            dashboard/web/package-lock.json
            proto/package-lock.json
      # Every static production value (account, host, Access, canary hour) is committed in
      # dashboard/wrangler.toml; the environment URL and the Access probe read it there.
      - name: Read the host and the Access issuer from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["PUBLIC_HOST"])
          print("host=" + variables["PUBLIC_HOST"])
          print("access_issuer=" + variables["ACCESS_ISSUER"])
          EOF
      - name: Build the verified revision
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # The owner's addresses, the CSRF key and the analytics token are environment secrets (masked in this
      # public log) and reach the Worker as secrets through --secrets-file; wrangler prints plain vars.
      # CF_API_TOKEN is passed only so deploy-vars.mjs can warn when it is reused as the analytics token
      # (it never writes it); the owner allowed that reuse until a read-only token is saved.
      - name: Write the Worker secrets file
        working-directory: dashboard/worker
        env:
          DASHBOARD_ACCESS_OWNER: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          DASHBOARD_ACCESS_OWNER_ALIASES: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          DASHBOARD_CSRF_SIGNING_KEY: ${{ secrets.DASHBOARD_CSRF_SIGNING_KEY }}
          DASHBOARD_CF_ANALYTICS_TOKEN: ${{ secrets.DASHBOARD_CF_ANALYTICS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/home-secrets.json"
      # deploy-vars.mjs adds BUILD_SHA and the canary switch (production variable DASHBOARD_CANARY_ENABLED,
      # unset means true) as --var and refuses an invalid value (a deploy without a var deletes it).
      - name: Validate the bundle before deploying
        working-directory: dashboard/worker
        env:
          DASHBOARD_CANARY_ENABLED: ${{ vars.DASHBOARD_CANARY_ENABLED }}
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/home-secrets.json" --outdir "$RUNNER_TEMP/home-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/home-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config dashboard/wrangler.toml
      # No D1 and no migration step: the HomeState class migration (v1, new_sqlite_classes) is in the config.
      - name: Deploy the Worker home
        working-directory: dashboard/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DASHBOARD_CANARY_ENABLED: ${{ vars.DASHBOARD_CANARY_ENABLED }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/home-secrets.json"
      # Cloudflare Access ("Home") must answer every unauthenticated request with a 302 to its login page
      # for this host, <issuer>/cdn-cgi/access/login/<host> (then end, "?" or "/"); the app itself must
      # never answer one. Any other 302, even one to the team domain's root (a zone Redirect Rule to the
      # App Launcher runs before Access and the Worker), fails. A first deploy waits for the Custom
      # Domain's DNS and certificate, so only "no connection" and 5xx are retried (10 x 15 s). Any other
      # answer, a 2xx or 4xx from the app or a redirect elsewhere, fails at once. Nothing is followed or
      # printed except the status code. This proves Access guards the host, not that the Worker runs:
      # /health (BUILD_SHA) needs an owner login (docs/verification.md).
      - name: Check that Access answers unauthenticated requests
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          for path in / /api/v1/homeView; do
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{redirect_url}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              location=${answer#* }
              case "$code" in
                302)
                  login="$issuer/cdn-cgi/access/login/$host"
                  case "$location" in
                    "$login"|"$login?"*|"$login/"*)
                      echo "Access answered $path with 302 to its login page for this host (attempt $attempt)."
                      continue 2
                      ;;
                  esac
                  echo "$path: 302 to somewhere other than the Access login page for this host." >&2
                  exit 1
                  ;;
                ''|000|5??) sleep 15 ;;
                *)
                  echo "$path was answered with $code without Access." >&2
                  exit 1
                  ;;
              esac
            done
            echo "$path never reached Access (last status ${code:-none})." >&2
            exit 1
          done
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/home-secrets.json"

  # Lab (Worker "lab"): after Todofy's deploy (the TODOFY binding names Todofy's Ops entrypoint) and before the
  # dashboard's (it binds LAB). Migrations first (additive), then the Worker through deploy-vars.mjs, then the
  # same Access probe as the dashboard's. The deploy token is Todofy's CF_API_TOKEN (D1, Workers, Workers AI).
  lab-deploy:
    name: Lab deploy
    needs: [changes, lab-checks, gate, todofy-deploy]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.lab-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.lab-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && (needs.todofy-deploy.result == 'success' || needs.todofy-deploy.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.lab_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: lab-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            lab/worker/package-lock.json
            lab/web/package-lock.json
            proto/package-lock.json
      # Every static production value (account, D1, host, Access, neuron ceiling, fetch hour) is committed in
      # lab/wrangler.toml; the environment URL and the Access probe read it there.
      - name: Read the host and the Access issuer from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["PUBLIC_HOST"])
          print("host=" + variables["PUBLIC_HOST"])
          print("access_issuer=" + variables["ACCESS_ISSUER"])
          EOF
      - name: Build the verified revision
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # The owner's addresses and the CSRF key are environment secrets (masked in this public log) and reach the
      # Worker as secrets through --secrets-file; wrangler prints plain vars. Lab's owner is the dashboard's owner
      # (one person, the same Access identities), so the addresses come from the dashboard's existing secrets and
      # cannot drift apart; the CSRF key is Lab's own (a separate key per app). lab/README.md "Deploy secrets".
      - name: Write the Worker secrets file
        working-directory: lab/worker
        env:
          LAB_ACCESS_OWNER: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          LAB_ACCESS_OWNER_ALIASES: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          LAB_CSRF_SIGNING_KEY: ${{ secrets.LAB_CSRF_SIGNING_KEY }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/lab-secrets.json"
      # deploy-vars.mjs adds BUILD_SHA as --var and refuses the all-zeros D1 id or Access AUD; the bundle that ships
      # is held to Lab's budget and the Workers Free limit (deploy/bundle-size.mjs).
      - name: Validate the bundle before changing D1
        working-directory: lab/worker
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/lab-secrets.json" --outdir "$RUNNER_TEMP/lab-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/lab-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config lab/wrangler.toml
      - name: Apply D1 migrations, then deploy the Worker lab
        working-directory: lab/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/lab-secrets.json"
      # Access answers every request before the Worker runs (the probe below), so production is read through the API
      # with the deploy token, as FlowDay deploy does (GETs and one D1 read of the migrations table): the Worker serves
      # exactly one version at 100%, that version's BUILD_SHA is this commit (so this commit's routes, lab.ui.v1 among
      # them, are what answers), and no D1 migration is pending. wrangler's JSON answers are parsed, never printed (they
      # name the token's account email); only the version id and the results are.
      - name: Check that production runs this commit
        working-directory: lab/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          deployment=$(npx --no-install wrangler deployments status --json --config ../wrangler.toml) || {
            echo "Could not read the deployment of the Worker lab." >&2
            exit 1
          }
          version=$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' \
            <<<"$deployment" 2>/dev/null) || {
            echo "The deployment does not serve exactly one version at 100%." >&2
            exit 1
          }
          details=$(npx --no-install wrangler versions view "$version" --json --config ../wrangler.toml) || {
            echo "Could not read the deployed version." >&2
            exit 1
          }
          build=$(jq -er '[.resources.bindings[] | select(.name == "BUILD_SHA" and .type == "plain_text") | .text]
            | select(length == 1) | .[0]' <<<"$details" 2>/dev/null) || build=''
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "The deployed version $version was not built from $GITHUB_SHA." >&2
            exit 1
          fi
          echo "The Worker lab serves version $version at 100%, built from $GITHUB_SHA."
          pending=$(npx --no-install wrangler d1 migrations list DB --remote --config ../wrangler.toml) || {
            echo "Could not list the D1 migrations." >&2
            exit 1
          }
          if ! grep -q 'No migrations to apply' <<<"$pending"; then
            echo "D1 migrations are still pending." >&2
            exit 1
          fi
          echo "No D1 migration is pending."
      # Cloudflare Access ("Lab") must answer every unauthenticated request with a 302 to its login page for this
      # host, exactly as the dashboard's probe checks (same script; test_ci_changes.py runs it).
      - name: Check that Access answers unauthenticated requests
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          for path in / /api/v1/today; do
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{redirect_url}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              location=${answer#* }
              case "$code" in
                302)
                  login="$issuer/cdn-cgi/access/login/$host"
                  case "$location" in
                    "$login"|"$login?"*|"$login/"*)
                      echo "Access answered $path with 302 to its login page for this host (attempt $attempt)."
                      continue 2
                      ;;
                  esac
                  echo "$path: 302 to somewhere other than the Access login page for this host." >&2
                  exit 1
                  ;;
                ''|000|5??) sleep 15 ;;
                *)
                  echo "$path was answered with $code without Access." >&2
                  exit 1
                  ;;
              esac
            done
            echo "$path never reached Access (last status ${code:-none})." >&2
            exit 1
          done
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/lab-secrets.json"

  # FlowDay (Worker "flowday", flowday/docs/design.md section 11). Migrations first (additive), then the Worker through
  # deploy-vars.mjs, then a read of production through the API (version and migrations), then the production host
  # flowday.ziyixi.science (since the F4 cutover; the staging host flowday-next.ziyixi.science before): Access answers
  # everything anonymous except the exact PWA files, which the Access app "flowday-bypass" lets through to the Worker.
  # The deploy token is Todofy's CF_API_TOKEN (D1 and Workers), as for Lab.
  flowday-deploy:
    name: FlowDay deploy
    needs: [changes, flowday-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.flowday-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.flowday-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.flowday_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: flowday-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: flowday
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            flowday/worker/package-lock.json
            flowday/web/package-lock.json
      # Every static production value (account, D1, host, Access) is committed in flowday/wrangler.toml; the
      # environment URL and the host probes read it there.
      - name: Read the host and the Access issuer from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["PUBLIC_HOST"])
          print("host=" + variables["PUBLIC_HOST"])
          print("access_issuer=" + variables["ACCESS_ISSUER"])
          EOF
      # The export is checked again (no test code, PWA files present): this build is the one that ships.
      - name: Build the verified revision
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          npm run check:export --prefix web
      # The owner's addresses and the two keys are environment secrets (masked in this public log) and reach the
      # Worker as secrets through --secrets-file; wrangler prints plain vars. FlowDay's owner is the dashboard's owner
      # (one person, the same Access identities), so the addresses come from the dashboard's secrets, as for Lab; the
      # CSRF key and the credential key (it seals the Todoist key in D1) are FlowDay's own. flowday/README.md "Deploy".
      - name: Write the Worker secrets file
        working-directory: flowday/worker
        env:
          FLOWDAY_ACCESS_OWNER: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          FLOWDAY_ACCESS_OWNER_ALIASES: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          FLOWDAY_CSRF_SIGNING_KEY: ${{ secrets.FLOWDAY_CSRF_SIGNING_KEY }}
          FLOWDAY_CREDENTIAL_KEY: ${{ secrets.FLOWDAY_CREDENTIAL_KEY }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/flowday-secrets.json"
      # deploy-vars.mjs adds BUILD_SHA as --var and refuses a real deploy with the all-zeros D1 id or Access AUD.
      - name: Validate the bundle before changing D1
        working-directory: flowday/worker
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/flowday-secrets.json" --outdir "$RUNNER_TEMP/flowday-bundle"
          node scripts/bundle-size.mjs "$RUNNER_TEMP/flowday-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      # The F4 cutover commit (flowday/docs/design.md section 11) allowed the removal of flowday-next.ziyixi.science
      # and the takeover of the tunnel CNAME of flowday.ziyixi.science; both allowances are cleared again, so the
      # guard now stops any change to the Worker's one Custom Domain.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config flowday/wrangler.toml
      - name: Apply D1 migrations, then deploy the Worker flowday
        working-directory: flowday/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/flowday-secrets.json"
      # /health (BUILD_SHA) needs an owner login on the host, so production is read through the API with the deploy
      # token (GETs and one D1 read of the migrations table): the Worker serves exactly one version at 100%, that
      # version's BUILD_SHA is this commit, and no D1 migration is pending. wrangler's JSON answers are parsed, never
      # printed (they name the token's account email); only the version id and the results are.
      - name: Check that production runs this commit
        working-directory: flowday/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          deployment=$(npx --no-install wrangler deployments status --json --config ../wrangler.toml) || {
            echo "Could not read the deployment of the Worker flowday." >&2
            exit 1
          }
          version=$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' \
            <<<"$deployment" 2>/dev/null) || {
            echo "The deployment does not serve exactly one version at 100%." >&2
            exit 1
          }
          details=$(npx --no-install wrangler versions view "$version" --json --config ../wrangler.toml) || {
            echo "Could not read the deployed version." >&2
            exit 1
          }
          build=$(jq -er '[.resources.bindings[] | select(.name == "BUILD_SHA" and .type == "plain_text") | .text]
            | select(length == 1) | .[0]' <<<"$details" 2>/dev/null) || build=''
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "The deployed version $version was not built from $GITHUB_SHA." >&2
            exit 1
          fi
          echo "The Worker flowday serves version $version at 100%, built from $GITHUB_SHA."
          pending=$(npx --no-install wrangler d1 migrations list DB --remote --config ../wrangler.toml) || {
            echo "Could not list the D1 migrations." >&2
            exit 1
          }
          if ! grep -q 'No migrations to apply' <<<"$pending"; then
            echo "D1 migrations are still pending." >&2
            exit 1
          fi
          echo "No D1 migration is pending."
      # Cloudflare Access ("flowday", which covers the host) must answer every unauthenticated request
      # with a 302 to its login page for this host, exactly as the dashboard's probe checks (same script;
      # test_ci_changes.py runs it).
      - name: Check that Access answers unauthenticated requests
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          for path in / /api/tasks; do
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{redirect_url}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              location=${answer#* }
              case "$code" in
                302)
                  login="$issuer/cdn-cgi/access/login/$host"
                  case "$location" in
                    "$login"|"$login?"*|"$login/"*)
                      echo "Access answered $path with 302 to its login page for this host (attempt $attempt)."
                      continue 2
                      ;;
                  esac
                  echo "$path: 302 to somewhere other than the Access login page for this host." >&2
                  exit 1
                  ;;
                ''|000|5??) sleep 15 ;;
                *)
                  echo "$path was answered with $code without Access." >&2
                  exit 1
                  ;;
              esac
            done
            echo "$path never reached Access (last status ${code:-none})." >&2
            exit 1
          done
      # The PWA files the Worker serves without a JWT (worker/src/assets.ts PWA_PUBLIC_PATHS) reach it anonymously
      # only through the Access app "flowday-bypass" (its destination <host>/pwa/*, as on the container's host until
      # F6): each answers 200 with its own media type, and a file under /pwa/ that is not on the list (the service
      # worker's asset sw.js) gets the Worker's own 401, never a 200. A 302 means the bypass does not cover this
      # host. Only "no connection" and 5xx are retried (10 x 15 s); nothing is followed or printed except the
      # status and the media type.
      - name: Check that only the PWA files bypass Access
        env:
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          host=$PUBLIC_HOST
          test -n "$host"
          for check in \
            '/pwa/manifest.webmanifest 200 application/manifest+json' \
            '/pwa/icon-192x192.png 200 image/png' \
            '/pwa/apple-touch-icon.png 200 image/png' \
            '/pwa/sw 200 application/javascript' \
            '/pwa/sw.js 401 application/json'; do
            read -r path want type <<<"$check"
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{content_type}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              media=${answer#* }
              media=${media%%;*}
              case "$code" in
                ''|000|5??)
                  sleep 15
                  continue
                  ;;
              esac
              if [ "$code" = "$want" ] && [ "$media" = "$type" ]; then
                echo "$path: $code $type from the Worker without an Access login (attempt $attempt)."
                continue 2
              fi
              if [ "$code" = 302 ]; then
                echo "$path: 302 instead of $want: the Access app flowday-bypass does not cover this host's /pwa/*." >&2
              else
                echo "$path was answered with $code ${media:-(no media type)}, not $want $type." >&2
              fi
              exit 1
            done
            echo "$path never reached the Worker (last status ${code:-none})." >&2
            exit 1
          done
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/flowday-secrets.json"

  # The links app (links/docs/design.md section 11, L2): the Worker "links" on its one Custom Domain s.ziyixi.science.
  # Only /_ and /_/* sit behind the path-scoped Access application "links"; every other path (the short links) reaches
  # the Worker anonymously, which the last two checks hold to exactly that split.
  links-deploy:
    name: Links deploy
    needs: [changes, links-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.links-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.links-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.links_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: links-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            links/worker/package-lock.json
            links/web/package-lock.json
            proto/package-lock.json
      # Every static production value (account, D1, host, Access) is committed in links/wrangler.toml; the environment
      # URL and the host probes read it there.
      - name: Read the host and the Access issuer from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["PUBLIC_HOST"])
          print("host=" + variables["PUBLIC_HOST"])
          print("access_issuer=" + variables["ACCESS_ISSUER"])
          EOF
      # The launcher's build (web/dist) is the one that ships; its JavaScript budget is checked by the build.
      - name: Build the verified revision
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # The owner's addresses and the CSRF key are environment secrets (masked in this public log) and reach the Worker
      # as secrets through --secrets-file; wrangler prints plain vars. The links app's owner is the dashboard's owner
      # (one person, the same Access identities), so the addresses come from the dashboard's secrets, as for Lab and
      # FlowDay; the CSRF key is the links app's own. links/README.md "Deploy".
      - name: Write the Worker secrets file
        working-directory: links/worker
        env:
          LINKS_ACCESS_OWNER: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          LINKS_ACCESS_OWNER_ALIASES: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          LINKS_CSRF_SIGNING_KEY: ${{ secrets.LINKS_CSRF_SIGNING_KEY }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/links-secrets.json"
      # deploy-vars.mjs adds BUILD_SHA as --var and refuses the all-zeros D1 id or Access AUD; the bundle that ships is
      # held to the app's budget and the Workers Free limit (deploy/bundle-size.mjs).
      - name: Validate the bundle before changing D1
        working-directory: links/worker
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/links-secrets.json" --outdir "$RUNNER_TEMP/links-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/links-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      # s.ziyixi.science had no DNS record before L2, so its first deploy attaches the Custom Domain without either.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config links/wrangler.toml
      - name: Apply D1 migrations, then deploy the Worker links
        working-directory: links/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/links-secrets.json"
      # Nothing anonymous on the host shows BUILD_SHA (the owner's half is behind Access), so production is read through
      # the API with the deploy token (GETs and one D1 read of the migrations table): the Worker serves exactly one
      # version at 100%, that version's BUILD_SHA is this commit, and no D1 migration is pending. wrangler's JSON answers
      # are parsed, never printed (they name the token's account email); only the version id and the results are.
      - name: Check that production runs this commit
        working-directory: links/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          deployment=$(npx --no-install wrangler deployments status --json --config ../wrangler.toml) || {
            echo "Could not read the deployment of the Worker links." >&2
            exit 1
          }
          version=$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' \
            <<<"$deployment" 2>/dev/null) || {
            echo "The deployment does not serve exactly one version at 100%." >&2
            exit 1
          }
          details=$(npx --no-install wrangler versions view "$version" --json --config ../wrangler.toml) || {
            echo "Could not read the deployed version." >&2
            exit 1
          }
          build=$(jq -er '[.resources.bindings[] | select(.name == "BUILD_SHA" and .type == "plain_text") | .text]
            | select(length == 1) | .[0]' <<<"$details" 2>/dev/null) || build=''
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "The deployed version $version was not built from $GITHUB_SHA." >&2
            exit 1
          fi
          echo "The Worker links serves version $version at 100%, built from $GITHUB_SHA."
          pending=$(npx --no-install wrangler d1 migrations list DB --remote --config ../wrangler.toml) || {
            echo "Could not list the D1 migrations." >&2
            exit 1
          }
          if ! grep -q 'No migrations to apply' <<<"$pending"; then
            echo "D1 migrations are still pending." >&2
            exit 1
          fi
          echo "No D1 migration is pending."
      # Cloudflare Access ("links", path-scoped) must answer every unauthenticated request for the owner's half with a
      # 302 to its login page for this host: its exact destination /_, the launcher /_/ and the owner API, exactly as
      # the dashboard's probe checks (same script; test_ci_changes.py runs it).
      - name: Check that Access answers unauthenticated requests
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          for path in /_ /_/ /_/api/v1/links; do
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{redirect_url}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              location=${answer#* }
              case "$code" in
                302)
                  login="$issuer/cdn-cgi/access/login/$host"
                  case "$location" in
                    "$login"|"$login?"*|"$login/"*)
                      echo "Access answered $path with 302 to its login page for this host (attempt $attempt)."
                      continue 2
                      ;;
                  esac
                  echo "$path: 302 to somewhere other than the Access login page for this host." >&2
                  exit 1
                  ;;
                ''|000|5??) sleep 15 ;;
                *)
                  echo "$path was answered with $code without Access." >&2
                  exit 1
                  ;;
              esac
            done
            echo "$path never reached Access (last status ${code:-none})." >&2
            exit 1
          done
      # The rest of the host is outside Access and the Worker answers it itself, anonymously (docs/design.md §2, §4):
      # /robots.txt with its own text (200, text/plain, "Disallow: /" for every agent), and a key no link uses with the
      # 302 to /_/k/<key> on this host that a private, deleted or expired key gets too (the enumeration rule), both with
      # Cache-Control no-store and X-Robots-Tag noindex. A 302 to the Access login page means that the Access
      # application covers more than /_/*. Only "no connection" and 5xx are retried (10 x 15 s); nothing is followed,
      # and only the path, the status and the media type are printed.
      - name: Check that the Worker answers short links without Access
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          body="$RUNNER_TEMP/links-probe-body"
          for check in '/robots.txt 200' '/some-unknown-key 302'; do
            read -r path want <<<"$check"
            for attempt in $(seq 1 10); do
              rm -f "$body"
              answer=$(curl -sS -o "$body" --max-time 15 --proto '=https' \
                -w '%{http_code}|%{content_type}|%{redirect_url}|%header{cache-control}|%header{x-robots-tag}' \
                "https://$host$path" 2>/dev/null) || true
              IFS='|' read -r code media location cache robots <<<"$answer"
              media=${media%%;*}
              case "$code" in
                ''|000|5??)
                  sleep 15
                  continue
                  ;;
              esac
              if [ "$code" = 302 ] && [[ "$location" == "$issuer/cdn-cgi/access/login/"* ]]; then
                echo "$path: Access answered instead of the Worker: the Access app links covers more than /_/*." >&2
                exit 1
              fi
              if [ "$code" != "$want" ]; then
                echo "$path was answered with $code ${media:-(no media type)}, not $want." >&2
                exit 1
              fi
              if [[ "$cache" != *no-store* ]] || [[ "$robots" != *noindex* ]]; then
                echo "$path: $code without Cache-Control no-store and X-Robots-Tag noindex." >&2
                exit 1
              fi
              if [ "$want" = 200 ]; then
                if [ "$media" != text/plain ] || ! printf 'User-agent: *\nDisallow: /\n' | cmp -s - "$body"; then
                  echo "$path: 200 ${media:-(no media type)} is not the Worker's robots.txt." >&2
                  exit 1
                fi
              elif [ "$location" != "https://$host/_/k${path}" ]; then
                echo "$path: 302 to somewhere other than this host's /_/k${path}." >&2
                exit 1
              fi
              echo "$path: $code ${media:-(no body)} from the Worker without an Access login (attempt $attempt)."
              continue 2
            done
            echo "$path never reached the Worker (last status ${code:-none})." >&2
            exit 1
          done
          rm -f "$body"
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/links-secrets.json"

  # The watch app (watch/, docs in watch/docs/design.md): the Worker "watch" on the Custom Domain watch.ziyixi.science,
  # the whole host behind the Access application "watch" (infra/). After Todofy's deploy: its TODOFY binding names
  # Todofy's Ops entrypoint, which must accept task-intent-v1's SOURCE_WATCH before the first digest. No D1, no R2:
  # everything lives in the SQLite Durable Object WatchState, which arms its own alarm on the first owner API call or
  # the dashboard's next status() (never on this job's anonymous probes, which Access answers).
  watch-deploy:
    name: Watch deploy
    needs: [changes, watch-checks, gate, todofy-deploy]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.watch-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.watch-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && (needs.todofy-deploy.result == 'success' || needs.todofy-deploy.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.watch_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.config.outputs.url }}
    concurrency:
      group: watch-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            watch/worker/package-lock.json
            watch/web/package-lock.json
            proto/package-lock.json
      # Every static production value (account, host, Access) is committed in watch/wrangler.toml; the environment URL
      # and the Access probe read it there.
      - name: Read the host and the Access issuer from the committed config
        id: config
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("wrangler.toml", "rb") as file:
              variables = tomllib.load(file)["vars"]
          print("url=https://" + variables["PUBLIC_HOST"])
          print("host=" + variables["PUBLIC_HOST"])
          print("access_issuer=" + variables["ACCESS_ISSUER"])
          EOF
      # The UI's build (web/dist) is the one that ships; its JavaScript budget is checked by the build.
      - name: Build the verified revision
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # The owner's addresses and the CSRF key are environment secrets (masked in this public log) and reach the Worker
      # as secrets through --secrets-file; wrangler prints plain vars. The watch app's owner is the dashboard's owner
      # (one person, the same Access identities), so the addresses come from the dashboard's secrets, as for Lab,
      # FlowDay and the links app; the CSRF key is the watch app's own. watch/README.md "Deploy".
      - name: Write the Worker secrets file
        working-directory: watch/worker
        env:
          WATCH_ACCESS_OWNER: ${{ secrets.DASHBOARD_ACCESS_OWNER }}
          WATCH_ACCESS_OWNER_ALIASES: ${{ secrets.DASHBOARD_ACCESS_OWNER_ALIASES }}
          WATCH_CSRF_SIGNING_KEY: ${{ secrets.WATCH_CSRF_SIGNING_KEY }}
        run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/watch-secrets.json"
      # deploy-vars.mjs adds BUILD_SHA as --var and refuses the all-zeros Access AUD; the bundle that ships is held to
      # the app's budget and the Workers Free limit (deploy/bundle-size.mjs).
      - name: Validate the bundle before changing production
        working-directory: watch/worker
        run: |
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/watch-secrets.json" --outdir "$RUNNER_TEMP/watch-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/watch-bundle"
      # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
      # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
      # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
      # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
      # watch.ziyixi.science had no DNS record before W2, so its first deploy attaches the Custom Domain without either.
      - name: Check the hostnames against production
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUARD_ALLOW_REMOVE: ''
          CF_GUARD_ALLOW_CONFLICT: ''
        run: node tools/cf-guard/cf-guard.mjs --config watch/wrangler.toml
      - name: Deploy the Worker watch
        working-directory: watch/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/watch-secrets.json"
      # Nothing anonymous on the host shows BUILD_SHA (all of it is behind Access), so production is read through the
      # API with the deploy token (GETs only): the Worker serves exactly one version at 100% and that version's
      # BUILD_SHA is this commit. wrangler's JSON answers are parsed, never printed (they name the token's account
      # email); only the version id and the result are. (FlowDay's and the links app's check without their D1 part.)
      - name: Check that production runs this commit
        working-directory: watch/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          deployment=$(npx --no-install wrangler deployments status --json --config ../wrangler.toml) || {
            echo "Could not read the deployment of the Worker watch." >&2
            exit 1
          }
          version=$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' \
            <<<"$deployment" 2>/dev/null) || {
            echo "The deployment does not serve exactly one version at 100%." >&2
            exit 1
          }
          details=$(npx --no-install wrangler versions view "$version" --json --config ../wrangler.toml) || {
            echo "Could not read the deployed version." >&2
            exit 1
          }
          build=$(jq -er '[.resources.bindings[] | select(.name == "BUILD_SHA" and .type == "plain_text") | .text]
            | select(length == 1) | .[0]' <<<"$details" 2>/dev/null) || build=''
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "The deployed version $version was not built from $GITHUB_SHA." >&2
            exit 1
          fi
          echo "The Worker watch serves version $version at 100%, built from $GITHUB_SHA."
      # Cloudflare Access ("watch", the whole host) must answer every unauthenticated request with a 302 to its login
      # page for this host: the inbox /, the owner API and the add-from-phone page /new, exactly as the dashboard's
      # probe checks (same script; test_ci_changes.py runs it). /health is behind Access too (no bypass application),
      # so no anonymous request reaches the Worker. Whether WatchState's alarm is armed cannot be seen from here: the
      # first owner API call and the dashboard's status() arm it (watch/README.md "Deploy", the post-deploy check).
      - name: Check that Access answers unauthenticated requests
        env:
          ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
          PUBLIC_HOST: ${{ steps.config.outputs.host }}
        run: |
          issuer=$ACCESS_ISSUER
          host=$PUBLIC_HOST
          test -n "$issuer" && test -n "$host"
          for path in / /api/v1/watches /new; do
            for attempt in $(seq 1 10); do
              answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{redirect_url}' \
                "https://$host$path" 2>/dev/null) || true
              code=${answer%% *}
              location=${answer#* }
              case "$code" in
                302)
                  login="$issuer/cdn-cgi/access/login/$host"
                  case "$location" in
                    "$login"|"$login?"*|"$login/"*)
                      echo "Access answered $path with 302 to its login page for this host (attempt $attempt)."
                      continue 2
                      ;;
                  esac
                  echo "$path: 302 to somewhere other than the Access login page for this host." >&2
                  exit 1
                  ;;
                ''|000|5??) sleep 15 ;;
                *)
                  echo "$path was answered with $code without Access." >&2
                  exit 1
                  ;;
              esac
            done
            echo "$path never reached Access (last status ${code:-none})." >&2
            exit 1
          done
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/watch-secrets.json"

  # The site release: dispatches website-release.yml (docs in website/docs/release.md), the same workflow the
  # Notion buttons and the relay's detector dispatch, and returns at once. The release's job holds the one
  # concurrency group "website-production" and the production environment; this CI run neither waits for a
  # queued release nor ties other apps' deploys to it, and the relay sees the release like any other run.
  # The release builds the newest main commit whose push run passed the CI gate (this one, once it is green).
  # A push releases only when the website's code identity or the Notion content changed.
  website-deploy:
    name: Website deploy
    needs: [changes, website-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.website-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.website-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.website_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # workflow_dispatch of website-release.yml (a dispatch by GITHUB_TOKEN does start a run).
      actions: write
    steps:
      - name: Dispatch the website release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run website-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=release -f confirmation=release:www.ziyixi.science \
            -f force_build=false -f allow_empty=false -f trigger=push
          echo "::notice::Dispatched Website release (push); see Actions → Website release."

  # The Notion relay Worker ziyixi-notion-publish (website/relay): buttons and the change detector's cron.
  # Its secrets are Worker secrets (website/relay/README.md) and survive this deploy.
  website-relay-deploy:
    name: Website relay deploy
    needs: [changes, website-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.website-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.website-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.website_relay_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: website-relay-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: website/.nvmrc
      - name: Install the pinned pnpm and locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate the bundle before deploying
        run: pnpm exec wrangler deploy --dry-run --config relay/wrangler.toml
      - name: Deploy the Worker ziyixi-notion-publish (keeps its secrets, applies the cron)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm exec wrangler deploy --config relay/wrangler.toml
      - name: Check the buttons' endpoint answers
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 https://ziyixi-notion-publish.cloudflare-579.workers.dev/health | grep -q '"ok"'; then
              exit 0
            fi
            sleep 6
          done
          echo "The relay's /health did not answer." >&2
          exit 1
