  recall-extension-release:
    name: Recall extension release
    needs: [changes, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.recall_extension_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recall-extensions-${{ github.sha }}
          path: ${{ runner.temp }}/recall-extension
          github-token: ${{ github.token }}
          run-id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}
      - name: Publish the extension's version unless its tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_DIR: ${{ runner.temp }}/recall-extension
          BUILD_DIR: ${{ runner.temp }}/recall-extension/extension
          ORION_DIR: ${{ runner.temp }}/recall-extension/orion
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REUSED_RUN_URL: ${{ needs.changes.outputs.artifact_run_url }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' "$BUILD_DIR/manifest.json")
          version_name=$(jq -r '.version_name' "$BUILD_DIR/manifest.json")
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ || "$version_name" != "${GITHUB_SHA:0:7}" ]]; then
            echo "::error::The artifact is not this commit's extension build"
            exit 1
          fi
          if [[ "$(jq -r '.version' "$ORION_DIR/manifest.json")" != "$version" || "$(jq -r '.version_name' "$ORION_DIR/manifest.json")" != "$version_name" ]]; then
            echo "::error::The Orion artifact is not the same tested build"
            exit 1
          fi
          tag="recall-extension-v$version"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            echo "::notice::$tag exists: nothing to publish"
            exit 0
          fi
          zip="$RUNNER_TEMP/recall-extension-v$version.zip"
          cp "$ARCHIVE_DIR/recall-extension-${GITHUB_SHA:0:7}.zip" "$zip"
          orion_zip="$RUNNER_TEMP/recall-orion-v$version.zip"
          cp "$ARCHIVE_DIR/recall-orion-${GITHUB_SHA:0:7}.zip" "$orion_zip"
          {
            echo "recall Chrome and Orion extensions $version, built from commit $GITHUB_SHA."
            echo
            echo "CI run: $RUN_URL"
            if [ -n "$REUSED_RUN_URL" ]; then
              echo "Checked and built in: $REUSED_RUN_URL"
            fi
            echo
            echo 'Chrome install: `npm run install-extension -- <this zip>` in recall/extension (recall/extension/README.md).'
            echo 'iPhone: download recall-orion-v<version>.zip into Files, then Orion > Extensions > + > Install from file. See recall/docs/mobile.md.'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$zip" "$orion_zip" --target "$GITHUB_SHA" --title "recall extension $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"

