# One workflow for the apps (Todofy, Mail Hero, the home dashboard, the website, Lab, FlowDay, the links app and the
# watch app).
# "changes" decides what changed since a cumulative base (.github/scripts/ci_changes.py), each app's checks run
# from its own directory, "Shared packages" checks packages/* (compiled into the apps), "Contracts" runs both
# sides of mail.received.v1, ops-v1 and task-intent-v1 plus the dashboard's ops-v1 caller tests, "Proto checks"
# gates the protobuf IDL in proto/, and "CI gate" is the single status check to require.
# Deploys run only on main, only for the app that changed (itself, a shared package it compiles in, a contract
# file it bundles, or was dispatched), after the gate passes; Lab and the watch app deploy after Todofy (their TODOFY
# bindings) and the dashboard after every app whose Ops entrypoint it binds. A push to main whose commit already passed every
# needed check in a branch push run reuses that run: the checks are skipped, the gate and the deploys still run
# (ci_changes.py find_reusable). Every deploy that applies routes runs tools/cf-guard first.
# See README.md "CI".
name: CI and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      app:
        description: App to check and (on main) deploy
        type: choice
        # both = Todofy and Mail Hero (as before the dashboard existed); all = every app.
        options: [both, all, todofy, mail-hero, dashboard, website, lab, flowday, links, watch]
        default: both

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read this workflow's own past runs: the last successful main run is the change-detection base.
      actions: read
    outputs:
      todofy_check: ${{ steps.decide.outputs.todofy_check }}
      mail_hero_check: ${{ steps.decide.outputs.mail_hero_check }}
      dashboard_check: ${{ steps.decide.outputs.dashboard_check }}
      website_check: ${{ steps.decide.outputs.website_check }}
      lab_check: ${{ steps.decide.outputs.lab_check }}
      flowday_check: ${{ steps.decide.outputs.flowday_check }}
      links_check: ${{ steps.decide.outputs.links_check }}
      watch_check: ${{ steps.decide.outputs.watch_check }}
      contracts: ${{ steps.decide.outputs.contracts }}
      packages: ${{ steps.decide.outputs.packages }}
      infra: ${{ steps.decide.outputs.infra }}
      proto: ${{ steps.decide.outputs.proto }}
      todofy_deploy: ${{ steps.decide.outputs.todofy_deploy }}
      mail_hero_deploy: ${{ steps.decide.outputs.mail_hero_deploy }}
      dashboard_deploy: ${{ steps.decide.outputs.dashboard_deploy }}
      website_deploy: ${{ steps.decide.outputs.website_deploy }}
      website_relay_deploy: ${{ steps.decide.outputs.website_relay_deploy }}
      lab_deploy: ${{ steps.decide.outputs.lab_deploy }}
      flowday_deploy: ${{ steps.decide.outputs.flowday_deploy }}
      links_deploy: ${{ steps.decide.outputs.links_deploy }}
      watch_deploy: ${{ steps.decide.outputs.watch_deploy }}
      # A push to main that reuses a green branch run of the same commit (all check outputs above are false).
      checks_reused: ${{ steps.decide.outputs.checks_reused }}
      reused_run_url: ${{ steps.decide.outputs.reused_run_url }}
      reused_jobs: ${{ steps.decide.outputs.reused_jobs }}
      # The commit the diff started from (empty when everything runs): Proto checks compares the IDL with it.
      base: ${{ steps.decide.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history of every branch: the base (last successful main run, or the merge base
          # with origin/main) must be in the clone.
          fetch-depth: 0
      - name: Test the change detection and the Wrangler configs
        run: python3 -m unittest discover -s .github/scripts
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
      # The deploy hostname guard every deploy job runs (dependency-free; synthetic API, no token).
      - name: Test the deploy hostname guard
        run: node --test tools/cf-guard/test/*.test.mjs
      # The shared test and build tools the apps' checks import by relative path (dependency-free, synthetic data):
      # the bundle-size budgets and the CPU meter of the workerd CPU tests, whose workerd side runs in the Lab, FlowDay,
      # Mail Hero and dashboard suites.
      - name: Test the shared bundle-size and CPU test tools
        run: node --test tools/bundle-size/test/*.test.mjs tools/workerd-cpu/test/*.test.mts
      # Only for a push to main. A run that failed or was cancelled (also while pending in the
      # concurrency group) is not "success", so its changes stay in this run's diff. Any error here
      # leaves the base empty, and an empty base runs everything.
      - name: Find the last successful push run on main
        id: last
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Walk this commit's first-parent history (git decides the order, never the API's run listing,
        # which twice returned a months-old Go-era run first) and take the newest commit whose push run
        # of this workflow (by its numeric id: the Go-era CI shared the path) on main concluded success.
        run: |
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id') || workflow_id=''
          sha=''
          if [ -n "$workflow_id" ]; then
            for commit in $(git rev-list --first-parent --max-count=50 "$GITHUB_SHA~1" 2>/dev/null); do
              ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$commit&branch=main&event=push&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length') || ok=0
              if [ "${ok:-0}" -gt 0 ]; then sha=$commit; break; fi
            done
          fi
          echo "Last successful main run: ${sha:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # On a push to main it also looks for a green branch push run of this exact commit to reuse (reads this
      # workflow's runs and their jobs with the read-only token; prints only run URLs and job names).
      - name: Decide which apps to check and deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
          DISPATCH_APP: ${{ inputs.app }}
          LAST_SUCCESS: ${{ steps.last.outputs.sha }}
        run: python3 .github/scripts/ci_changes.py

  # Each shared package's own typecheck and tests, from its own directory with its own lockfile. The apps'
  # checks compile the same source through their file: dependency, so they run too (ci_changes.py).
  shared-packages:
    name: Shared packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      - name: Typecheck and test every package
        run: |
          found=0
          for manifest in packages/*/package.json; do
            dir=${manifest%/package.json}
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run typecheck && npm test)
            echo "::endgroup::"
            found=1
          done
          test "$found" = 1

  # Todofy runs as three jobs: the static checks, the workerd runtime suite split into shards that run at
  # the same time, and "Todofy checks", which passes only when both passed and the shards together ran
  # every collected runtime test exactly once (todofy/docs/ci-cd.md). Every change that checks Todofy runs
  # all of them; "Todofy deploy" needs "Todofy checks".
  todofy-static:
    name: Todofy static checks
    needs: changes
    if: needs.changes.outputs.todofy_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: todofy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: todofy/.nvmrc
          cache: npm
          cache-dependency-path: |
            todofy/package-lock.json
            todofy/gateway/package-lock.json
            todofy/web/package-lock.json
            proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check worker tests tools deploy
          uv run ruff format --check worker tests tools deploy
      - name: Host tests (core, fakes, migration tools, production configs and deploy values)
        run: uv run pytest tests/unit tests/fakes tools deploy
      # The gateway Worker "todofy" (TypeScript); the root wrangler bundles it for the tests and the deploy.
      - name: Check and test the gateway
        working-directory: todofy/gateway
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
      # Builds uiassets/dist, which the dry-run serves.
      - name: Check, test and build the UI
        working-directory: todofy/web
        run: |
          npm ci --no-audit --no-fund
          npm run check:api
          npm run typecheck
          npm test
          npm run build
          # The UI is Todofy's own code; nothing may be copied from Mail Hero.
          if grep -rnE 'mail_hero|mail-hero' src; then exit 1; fi
      # The committed production configs (wrangler.toml, gateway/wrangler.toml), run exactly as the deploy
      # runs them, with placeholder values for what the deploy adds (deploy/deploy_vars.py). No token is
      # needed for --dry-run.
      - name: Dry-run the committed production configs
        env:
          TODOFY_ACCESS_OWNER: owner@example.com
          TODOFY_ACCESS_OWNER_ALIASES: ''
          TODOFY_TODOIST_DEFAULT_PROJECT_ID: placeholder
          TODOFY_REMINDER_ENABLED: 'false'
          TODOFY_MAINTENANCE_MODE: 'false'
          TODOFY_PROCESSING_PAUSED: 'false'
          TODOFY_FORCE_PAUSE_TODOIST: 'false'
          TODOFY_GTD_REVIEW_ENABLED: 'false'
          # The optional projects: one unset (uploaded as unset) and one set, so both paths are written.
          TODOFY_TODOIST_OPS_PROJECT_ID: ''
          TODOFY_TODOIST_REVIEW_PROJECT_ID: placeholder
        run: |
          uv run python deploy/deploy_vars.py secrets core "$RUNNER_TEMP/todofy-core-secrets.json"
          uv run python deploy/deploy_vars.py secrets gateway "$RUNNER_TEMP/todofy-gateway-secrets.json"
          uv run python deploy/deploy_vars.py exec core -- uv run pywrangler deploy --dry-run --config wrangler.toml \
            --secrets-file "$RUNNER_TEMP/todofy-core-secrets.json" --outdir "$RUNNER_TEMP/todofy-core-bundle"
          # The workers SDK and the generated task-intent-v1, report (todofy.report.v1), ops-v1 and mail.received.v1 packages
          # (ziyixi_proto, proto/README.md) are vendored next to the core config; a bundle without them cannot start.
          # Only the packages a Python Worker imports are generated, and the runtimes' fixtures stay out of the wheel
          # (proto/tools/gen_py.py).
          test -d "$RUNNER_TEMP/todofy-core-bundle/python_modules/workers"
          test -f "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/todofy/taskintent/v1/task_intent_pb.py"
          test -f "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/ops/v1/ops_pb.py"
          test -f "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/todofy/report/v1/report_pb.py"
          test -f "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/mailhero/webhook/v1/mail_received_pb.py"
          test ! -e "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/prototest"
          test ! -e "$RUNNER_TEMP/todofy-core-bundle/python_modules/ziyixi_proto/lab"
          uv run python deploy/deploy_vars.py exec gateway -- npx --no-install wrangler deploy --dry-run \
            --config gateway/wrangler.toml --secrets-file "$RUNNER_TEMP/todofy-gateway-secrets.json" \
            --outdir "$RUNNER_TEMP/todofy-gateway-bundle"
      - name: Remove the placeholder secrets files
        if: always()
        run: rm -f "$RUNNER_TEMP/todofy-core-secrets.json" "$RUNNER_TEMP/todofy-gateway-secrets.json"

  # The workerd runtime suite (tests/runtime), split into shards of whole test files that run at the same
  # time. The plan (.github/scripts/pytest_shards.py) balances recorded seconds per file over every
  # pytest-xdist process of every shard and places each collected file in exactly one shard; inside a
  # shard, xdist gives each process whole files, heaviest first, and a file's tests run in file order
  # (the rootdir conftest.py refuses any per-test distribution). No test is selected, deselected or
  # retried here; "Todofy checks" proves that the shards together ran every collected test once. Changing
  # the shard list also needs the same count in "Todofy checks" (--shards), which
  # .github/scripts/test_ci_changes.py checks.
  todofy-runtime:
    name: Todofy runtime (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.todofy_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports; any failed shard still fails this job, "Todofy checks" and the gate.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: todofy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: todofy/.nvmrc
          cache: npm
          cache-dependency-path: |
            todofy/package-lock.json
            todofy/gateway/package-lock.json
            todofy/web/package-lock.json
            proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
          # pylock.toml pins the Workers SDK that `pywrangler sync` installs through uv.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            pylock.toml
      # The tests serve the real UI build (without it the harness would serve a placeholder page), and
      # the gateway's own dependencies are bundled into every test server.
      - name: Install locked dependencies and build the UI the tests serve
        run: |
          npm ci --no-audit --no-fund
          uv sync --locked
          npm ci --prefix gateway --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # The Pyodide bundle workerd downloads (~14 MB) into the harness's disk cache. Exact key, no
      # restore-keys: a hit is a directory saved by a passing shard of the same workerd (package-lock), the
      # same launcher (harness.py) and the same test configs, so test_routing's cached-bundle check means
      # what it means on a cold cache. On a miss, the next step downloads it through that launcher and
      # fails if the launcher did not cache it. Only the runtime shards use this cache; no deploy does.
      - name: Restore the Pyodide bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: todofy/.wrangler/pyodide-cache
          key: todofy-pyodide-${{ runner.os }}-${{ hashFiles('todofy/package-lock.json', 'todofy/tests/runtime/harness.py', 'todofy/wrangler.test.toml', 'todofy/gateway/wrangler.test*.toml') }}
      # Once, before the pytest-xdist processes start: `pywrangler sync` (the vendored python_modules/
      # every server shares) and one server start and stop through the harness, so the Pyodide bundle is
      # in the disk cache (up to 3 tries; a slow download is not a test failure). It runs no test.
      - name: Prepare the test servers
        run: uv run python -m tests.runtime.warm_up
      - name: Plan this shard
        run: |
          uv run pytest tests/runtime --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/collected.txt"
          python3 ../.github/scripts/pytest_shards.py --collected "$RUNNER_TEMP/collected.txt" \
            --durations ../.github/scripts/todofy-runtime-durations.json --workers 4 \
            --serial ../.github/scripts/todofy-runtime-serial.txt --serial-out "$RUNNER_TEMP/serial-files.txt" \
            --index "${{ strategy.job-index }}" --total "${{ strategy.job-total }}" > "$RUNNER_TEMP/shard-files.txt"
          cat "$RUNNER_TEMP/shard-files.txt"
          echo "Alone, afterwards:"
          cat "$RUNNER_TEMP/serial-files.txt"
      # Each server runs the gateway and todofy-core in one process (docs/gateway-contract.md §7). Four
      # pytest processes on the runner's 4 vCPUs, each with its own ports (tests/runtime/harness.py). Then
      # this shard's files of todofy-runtime-serial.txt (timing assertions with no margin for a busy CPU)
      # in one plain pytest process, with no other test server running. Both runs always run; either
      # failing fails the step.
      - name: Runtime tests (workerd with the gateway, real D1, Durable Object, alarms, cron and assets)
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          status=0
          uv run pytest -n 4 --dist loadfile --no-loadscope-reorder -o junit_family=xunit2 \
            --junitxml="$RUNNER_TEMP/junit/runtime-${{ strategy.job-index }}.xml" \
            --basetemp="$RUNNER_TEMP/pytest" $(cat "$RUNNER_TEMP/shard-files.txt") || status=$?
          # Guarded: pytest without paths would run every testpath.
          if [ -s "$RUNNER_TEMP/serial-files.txt" ]; then
            uv run pytest -o junit_family=xunit2 \
              --junitxml="$RUNNER_TEMP/junit/runtime-${{ strategy.job-index }}-serial.xml" \
              --basetemp="$RUNNER_TEMP/pytest-serial" $(cat "$RUNNER_TEMP/serial-files.txt") || status=$?
          fi
          exit "$status"
      - name: Keep this shard's results for Todofy checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todofy-runtime-junit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 7
      # Every test server's workerd log (synthetic data only), for a failed shard.
      - name: Keep the test servers' logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todofy-runtime-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/pytest/**/dev.log
            ${{ runner.temp }}/pytest-serial/**/dev.log
          if-no-files-found: ignore
          retention-days: 7

  # The one Todofy result "Todofy deploy" needs: both jobs above passed, and every runtime test pytest
  # collects on this commit ran exactly once across the shards, passed, and none was skipped
  # (todofy-runtime-expected-skips.txt lists allowed skips; it is empty). The collection must be clean
  # (no collection error or module-level skip, every test file under tests/runtime collected), and the
  # files of todofy-runtime-serial.txt must have run alone.
  todofy-checks:
    name: Todofy checks
    needs: [changes, todofy-static, todofy-runtime]
    # !cancelled(), not always(): a cancelled run must not produce a passing "Todofy checks". It runs when
    # a needed job failed, so that the failure is reported here too.
    if: ${{ !cancelled() && needs.changes.outputs.todofy_check == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: todofy
    steps:
      - name: Require the static checks and every runtime shard
        working-directory: .
        env:
          STATIC: ${{ needs.todofy-static.result }}
          RUNTIME: ${{ needs.todofy-runtime.result }}
        run: |
          echo "Todofy static checks=$STATIC"
          echo "Todofy runtime=$RUNTIME"
          [ "$STATIC" = success ] && [ "$RUNTIME" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv sync builds the dependency ziyixi-proto, whose build runs proto/tools/ensure.mjs with Node.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: todofy/.nvmrc
          cache: npm
          cache-dependency-path: proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: todofy-runtime-junit-*
          path: ${{ runner.temp }}/junit
          merge-multiple: true
      - name: Every collected runtime test ran exactly once and passed
        run: |
          uv run pytest tests/runtime --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/collected.txt"
          python3 ../.github/scripts/pytest_completeness.py --collected "$RUNNER_TEMP/collected.txt" \
            --junit-dir "$RUNNER_TEMP/junit" --shards 3 --test-root tests/runtime \
            --serial ../.github/scripts/todofy-runtime-serial.txt \
            --expected-skips ../.github/scripts/todofy-runtime-expected-skips.txt

  mail-hero-checks:
    name: Mail Hero checks
    needs: changes
    if: needs.changes.outputs.mail_hero_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mail-hero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            mail-hero/cloudflare/package-lock.json
            mail-hero/web/package-lock.json
            proto/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix cloudflare
          npm ci --prefix web
      - name: Validate deployment configuration
        run: |
          node --test deploy/test/*.test.mjs
          python3 -m unittest discover -s deploy/backup -p 'test_*.py'
      # Includes test/contract-fixtures.test.mjs: the golden mail.received.v1 payloads in contracts/.
      - name: Check and test the Worker, including workerd bindings
        working-directory: mail-hero/cloudflare
        run: |
          npm run typecheck
          npm test
      # Alone and serially: the other workerd suites of `npm test` would share the CPU the meter calibrates. The Ops
      # calls and building a mail.received.v1 event (the generated message and the wire codec).
      - name: Hold the Ops entrypoint's and the event builder's CPU to their bounds (workerd)
        working-directory: mail-hero/cloudflare
        run: npm run test:cpu
      - name: Check, test and build the UI
        working-directory: mail-hero/web
        run: |
          npm run typecheck
          npm test
          npm run build
      # The committed production config (mail-hero/wrangler.toml), run exactly as the deploy runs it, with
      # placeholder values for what the deploy adds (deploy/deploy-vars.mjs). No token is needed for --dry-run. The
      # bundle it writes is held to Mail Hero's budget and the Workers Free limit (deploy/bundle-size.mjs).
      - name: Dry-run the committed production config
        working-directory: mail-hero/cloudflare
        env:
          MAIL_HERO_RECEIVE_ADDRESS: inbox@mail-hero.example.com
          MAIL_HERO_ACCESS_OWNER: owner@example.com
          MAIL_HERO_ACCESS_OWNER_ALIASES: ''
          MAIL_HERO_FORCE_SEND_PAUSED: 'true'
          MAIL_HERO_MAINTENANCE_MODE: 'false'
        run: |
          node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mail-hero-secrets.json"
          node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
            --secrets-file "$RUNNER_TEMP/mail-hero-secrets.json" --outdir "$RUNNER_TEMP/mail-hero-bundle"
          node ../deploy/bundle-size.mjs "$RUNNER_TEMP/mail-hero-bundle"

  # The home dashboard (Worker "home", docs in dashboard/docs). Everything runs from dashboard/ with synthetic data;
  # the runtime suite runs the real HomeState in workerd next to stub "mail-hero"/"todofy" Workers that serve
  # the contracts/ops-v1 fixtures over real Ops RPC, a fake GraphQL endpoint and a test Access JWKS.
  dashboard-checks:
    name: Dashboard checks
    needs: changes
    if: needs.changes.outputs.dashboard_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            dashboard/worker/package-lock.json
            dashboard/web/package-lock.json
            proto/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
      # The config test reads wrangler.toml with the pinned wrangler (worker/node_modules), hence after npm ci.
      - name: Test the production config and deploy values
        run: node --test deploy/test/*.test.mjs
      - name: Lint, typecheck and test the Worker
        working-directory: dashboard/worker
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Runtime tests (workerd with the real HomeState, stub Ops apps, fake GraphQL and Access)
        working-directory: dashboard/worker
        run: npm run test:runtime
      # Builds web/dist, which the dry-run below serves as static assets.
      - name: Lint, typecheck, test and build the UI
        working-directory: dashboard/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      # The dashboard reaches the apps only through their Ops entrypoints; it never imports their code.
      - name: No imports from mail-hero/ or todofy/
        run: |
          if grep -rnE "(from|import)[[:space:]]*\(?[[:space:]]*['\"][^'\"]*(mail-hero|todofy)/" worker/src web/src; then exit 1; fi
      # The committed production config (dashboard/wrangler.toml), run exactly as the deploy runs it, with
      # placeholder values for what the deploy adds (deploy/deploy-vars.mjs). No token is needed for --dry-run. The
      # bundle it writes is held to the dashboard's budget and the Workers Free limit (deploy/bundle-size.mjs).
      - name: Dry-run the committed production config
