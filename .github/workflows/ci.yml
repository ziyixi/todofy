# Bazel selects affected checks and declared release inputs. Actions publishes the checked artifacts.
name: CI and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      app:
        description: Application to publish after its checks
        type: choice
        options: [both, all, todofy, mail-hero, dashboard, website, links, watch, newsletter, fleet, platform, codex-gateway, mailsort, recall, tasks, personal-mcp, model-router, newsletter-console]
        default: both
      resume_vps_release:
        description: Resume the investigated held VPS release without rebuilding its images
        type: boolean
        default: false
      resume_source_sha:
        description: Original held release's full source SHA
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_checks: ${{ steps.plan.outputs.has_work }}
      has_artifacts: ${{ steps.releases.outputs.has_artifacts }}
      artifact_matrix: ${{ steps.releases.outputs.artifact_matrix }}
      artifact_run_id: ${{ steps.releases.outputs.artifact_run_id }}
      artifact_run_url: ${{ steps.releases.outputs.artifact_run_url }}
      artifacts_reused: ${{ steps.releases.outputs.artifacts_reused }}
      base: ${{ steps.baseline.outputs.base }}
      private_sha: ${{ steps.private.outputs.sha }}
      # Per-application outputs keep the production dependency ordering explicit below.
      codex_gateway_deploy: ${{ steps.releases.outputs.codex_gateway_deploy }}
      dashboard_deploy: ${{ steps.releases.outputs.dashboard_deploy }}
      fleet_deploy: ${{ steps.releases.outputs.fleet_deploy }}
      links_deploy: ${{ steps.releases.outputs.links_deploy }}
      mail_hero_deploy: ${{ steps.releases.outputs.mail_hero_deploy }}
      mailsort_deploy: ${{ steps.releases.outputs.mailsort_deploy }}
      model_router_deploy: ${{ steps.releases.outputs.model_router_deploy }}
      newsletter_console_deploy: ${{ steps.releases.outputs.newsletter_console_deploy }}
      newsletter_deploy: ${{ steps.releases.outputs.newsletter_deploy }}
      personal_mcp_deploy: ${{ steps.releases.outputs.personal_mcp_deploy }}
      platform_deploy: ${{ steps.releases.outputs.platform_deploy }}
      platform_publish: ${{ steps.releases.outputs.platform_publish }}
      recall_deploy: ${{ steps.releases.outputs.recall_deploy }}
      recall_extension_publish: ${{ steps.releases.outputs.recall_extension_publish }}
      tasks_deploy: ${{ steps.releases.outputs.tasks_deploy }}
      todofy_deploy: ${{ steps.releases.outputs.todofy_deploy }}
      watch_deploy: ${{ steps.releases.outputs.watch_deploy }}
      website_deploy: ${{ steps.releases.outputs.website_deploy }}
      website_relay_deploy: ${{ steps.releases.outputs.website_relay_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned private revision
        id: private
        run: |
          revision=$(git ls-tree HEAD private | awk '$1 == "160000" {print $3}')
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bazel
      - name: Install fixed Target Determinator
        run: |
          curl -fsSL https://github.com/bazel-contrib/target-determinator/releases/download/v0.34.0/target-determinator.linux.amd64 -o "$RUNNER_TEMP/bazel-tools/target-determinator"
          echo "115e1c63d39e2cd0d0b011c9fadc80f059f021176a4ae0de2232cdd83b1f8011  $RUNNER_TEMP/bazel-tools/target-determinator" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/bazel-tools/target-determinator"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/personal-cloud-bazel
          key: bazel-9.3.1-${{ runner.os }}-plan-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-9.3.1-${{ runner.os }}-plan-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-
      - name: Select the cumulative comparison base
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/bazel/ci/releases.py baseline
      - name: Select affected checks and release targets
        id: plan
        env:
          BASE: ${{ steps.baseline.outputs.base }}
          RELEASE_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
          RESUME: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          # Target Determinator's baseline checkout must not initialize private sources.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: submodule.private.update
          GIT_CONFIG_VALUE_0: none
        run: |
          args=()
          if [ -n "$RELEASE_APP" ]; then args+=(--app "$RELEASE_APP"); fi
          if [ "$RESUME" = true ]; then args+=(--resume-vps-release); fi
          python3 tools/bazel/ci/plan.py --base "$BASE" --output bazel-plan.json \
            --release-input-query 'attr(tags, "release:", //...)' "${args[@]}"
      - name: Select independent publications and checked artifact reuse
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
          RESUME: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          RESUME_SHA: ${{ inputs.resume_source_sha }}
        run: |
          args=()
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python3 tools/bazel/ci/releases.py select --plan bazel-plan.json --app "$RELEASE_APP" \
            --resume-sha "$RESUME_SHA" "${args[@]}"
      - name: Compare proto compatibility against the actual Git base
        if: steps.baseline.outputs.proto_breaking == 'true'
        env:
          BASE: ${{ steps.baseline.outputs.base }}
        run: bazel run //proto:breaking -- "$BASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-plan-${{ github.sha }}
          path: bazel-plan.json
          retention-days: 7

  checks:
    name: Bazel (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.has_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/personal-cloud-bazel
          key: bazel-9.3.1-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-9.3.1-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-plan-${{ github.sha }}
      - name: Prepare the isolated browser environment
        if: matrix.group == 'browser'
        run: bazel run //tools/bazel/browser:install_dependencies
      - name: Run selected leaf checks
        env:
          BAZEL_GROUP: ${{ matrix.group }}
        run: python3 tools/bazel/ci/run.py --plan bazel-plan.json --group "$BAZEL_GROUP"

  artifacts:
    name: Build artifact (${{ matrix.kind }}, ${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.has_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.artifact_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/personal-cloud-bazel
          key: bazel-9.3.1-${{ runner.os }}-artifact-${{ matrix.app }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-9.3.1-${{ runner.os }}-artifact-${{ matrix.app }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'pnpm-lock.yaml', 'uv.lock') }}-
      - name: Build the declared Worker archive
        if: matrix.kind == 'worker'
        env:
          RELEASE_APP: ${{ matrix.app }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 tools/cloud-release/artifact.py build --app "$RELEASE_APP" --sha "$GITHUB_SHA" \
            --target "$RELEASE_TARGET" --directory "$RUNNER_TEMP/worker-artifact"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.kind == 'worker'
        with:
          name: worker-${{ matrix.app }}-${{ github.sha }}
          path: ${{ runner.temp }}/worker-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Check and save Newsletter's image
        if: matrix.kind == 'image' && matrix.app == 'newsletter'
        uses: ./.github/actions/check-newsletter-image
      - name: Check and save Platform's image
        if: matrix.kind == 'image' && matrix.app == 'platform'
        uses: ./.github/actions/check-platform
        with:
          build-image: 'true'
      - name: Check and save Codex Gateway's image
        if: matrix.kind == 'image' && matrix.app == 'codex-gateway'
        uses: ./.github/actions/check-codex-gateway
        with:
          build-image: 'true'
      - name: Build Recall's independent extension archive
        if: matrix.kind == 'extension'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          options=(--stamp "--embed_label=$GITHUB_SHA" "--repository_cache=$HOME/.cache/personal-cloud-bazel/repository" "--disk_cache=$HOME/.cache/personal-cloud-bazel/actions")
          bazel build "$RELEASE_TARGET" "${options[@]}"
          archive=$(bazel cquery "$RELEASE_TARGET" "${options[@]}" --output=files)
          mkdir "$RUNNER_TEMP/recall-extensions"
          tar -xzf "$archive" -C "$RUNNER_TEMP/recall-extensions"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.kind == 'extension'
        with:
          name: recall-extensions-${{ github.sha }}
          path: ${{ runner.temp }}/recall-extensions/extension
          if-no-files-found: error
          retention-days: 7

  private:
    name: Private Bazel
    needs: changes
    if: github.repository == 'ziyixi/todofy' && needs.changes.outputs.private_sha != ''
    uses: ./.github/workflows/private-check.yml
    with:
      revision: ${{ needs.changes.outputs.private_sha }}
    secrets:
      private_ssh_key: ${{ secrets.TODOFY_PRIVATE_SSH_KEY }}
    permissions:
      contents: read

  gate:
    name: CI gate
    needs: [changes, checks, artifacts, private]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected checks and compiled artifacts
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
          HAS_CHECKS: ${{ needs.changes.outputs.has_checks }}
          HAS_ARTIFACTS: ${{ needs.changes.outputs.has_artifacts }}
          PRIVATE: ${{ needs.private.result }}
          HAS_PRIVATE: ${{ github.repository == 'ziyixi/todofy' && needs.changes.outputs.private_sha != '' }}
        run: |
          test "$CHANGES" = success
          if [ "$HAS_CHECKS" = true ]; then test "$CHECKS" = success; fi
          if [ "$HAS_ARTIFACTS" = true ]; then test "$ARTIFACTS" = success; fi
          if [ "$HAS_PRIVATE" = true ]; then test "$PRIVATE" = success; fi

  private-release:
    name: Private publication
    needs: [changes, private, gate]
    if: >-
      ${{ !cancelled()
      && github.repository == 'ziyixi/todofy'
      && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success'
      && needs.private.result == 'success'
      && github.event_name == 'push'
      && vars.PRIVATE_RELEASE_ENABLED == 'true' }}
    uses: ./.github/workflows/private-release.yml
    with:
      revision: ${{ needs.changes.outputs.private_sha }}
      operation: auto
      fingerprint: ${{ needs.private.outputs.fingerprint }}
    secrets:
      private_ssh_key: ${{ secrets.TODOFY_PRIVATE_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      INFRA_STATE_PASSPHRASE: ${{ secrets.INFRA_STATE_PASSPHRASE }}
      INFRA_TFVARS: ${{ secrets.INFRA_TFVARS }}
      PLATFORM_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
      PLATFORM_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
    permissions:
      contents: read
      checks: read
      packages: write
      deployments: write
      id-token: write

  newsletter-deploy:
    name: Newsletter image publish
    outputs:
      image: ${{ steps.publish.outputs.image }}
    needs: [changes, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
      && needs.changes.outputs.newsletter_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production
    concurrency:
      group: newsletter-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run publish-newsletter steps
        id: publish
        uses: ./.github/actions/publish-newsletter
        with:
          artifact-run-id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}

  platform-image:
    name: Platform image
    needs: [changes, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
      && needs.changes.outputs.platform_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production
    concurrency:
      group: platform-image-production
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run publish-platform steps
        id: publish
        uses: ./.github/actions/publish-platform
        with:
          artifact-run-id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}

  codex-gateway-image:
    name: Codex gateway image
    needs: [changes, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
      && needs.changes.outputs.codex_gateway_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production
    concurrency:
      group: codex-gateway-image-production
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run publish-codex-gateway steps
        id: publish
        uses: ./.github/actions/publish-codex-gateway
        with:
          artifact-run-id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}

  vps-bootstrap-bundle:
    name: VPS bootstrap bundle
    needs: [changes, newsletter-deploy, platform-image, codex-gateway-image, gate]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success'
      && needs.changes.result == 'success'
      && github.ref == 'refs/heads/main'
      && needs.newsletter-deploy.result == 'success' && needs.platform-image.result == 'success'
      && (needs.codex-gateway-image.result == 'success' || needs.changes.outputs.codex_gateway_deploy != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run package-vps steps
        uses: ./.github/actions/package-vps
        with:
          newsletter-image: ${{ needs.newsletter-deploy.outputs.image }}
          platform-image: ${{ needs.platform-image.outputs.image }}
          codex-gateway-image: ${{ needs.codex-gateway-image.outputs.image }}

  vps-deploy:
    name: VPS deploy
    needs: [changes, newsletter-deploy, platform-image, vps-bootstrap-bundle, fleet-deploy, gate, model-router-deploy]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && ((github.event_name == 'workflow_dispatch' && inputs.resume_vps_release
          && needs.newsletter-deploy.result == 'skipped' && needs.platform-image.result == 'skipped'
          && needs.vps-bootstrap-bundle.result == 'skipped')
        || (!(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
          && needs.newsletter-deploy.result == 'success' && needs.platform-image.result == 'success'
          && needs.vps-bootstrap-bundle.result == 'success'))
      && (needs.fleet-deploy.result == 'success' || needs.fleet-deploy.result == 'skipped')
      && (needs.model-router-deploy.result == 'success' || needs.changes.outputs.model_router_deploy != 'true')
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.platform_deploy == 'true'
      && vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deploy-vps steps
        uses: ./.github/actions/deploy-vps
        with:
          platform-access-client-id: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
          platform-access-client-secret: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
          platform-deploy-token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          newsletter-image: ${{ needs.newsletter-deploy.outputs.image }}
          platform-image: ${{ needs.platform-image.outputs.image }}
          codex-gateway-image: ''
          resume-release: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          gateway-only: 'false'
          source-sha: ${{ inputs.resume_vps_release && inputs.resume_source_sha || github.sha }}

  codex-gateway-deploy:
    name: Codex gateway deploy
    needs: [changes, codex-gateway-image, fleet-deploy, gate]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
      && ((github.event_name == 'workflow_dispatch' && inputs.resume_vps_release
          && needs.codex-gateway-image.result == 'skipped')
        || (!(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
          && needs.codex-gateway-image.result == 'success'))
      && (needs.fleet-deploy.result == 'success' || needs.fleet-deploy.result == 'skipped')
      && needs.gate.result == 'success' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.codex_gateway_deploy == 'true'
      && vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the independent inference service
        uses: ./.github/actions/deploy-vps
        with:
          platform-access-client-id: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
          platform-access-client-secret: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
          platform-deploy-token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          newsletter-image: ''
          platform-image: ''
          codex-gateway-image: ${{ needs.codex-gateway-image.outputs.image }}
          resume-release: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          gateway-only: 'true'
          source-sha: ${{ inputs.resume_vps_release && inputs.resume_source_sha || github.sha }}

  todofy-deploy:
    name: Todofy deploy
    needs: [changes, gate, model-router-deploy]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.model-router-deploy.result == 'success' || needs.changes.outputs.model_router_deploy != 'true')
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.todofy_deploy == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: todofy
      source_sha: ${{ github.sha }}
      artifact_run_id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}
    secrets: inherit

  mail-hero-deploy:
    name: Mail Hero deploy
    needs: [changes, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.mail_hero_deploy == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: mail-hero
      source_sha: ${{ github.sha }}
      artifact_run_id: ${{ needs.changes.outputs.artifact_run_id || github.run_id }}
    secrets: inherit

  dashboard-deploy:
    name: Dashboard deploy
    needs: [changes, gate, todofy-deploy, mail-hero-deploy, links-deploy, watch-deploy, fleet-deploy, mailsort-deploy, recall-deploy, tasks-deploy, website-relay-deploy, personal-mcp-deploy, model-router-deploy]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.model-router-deploy.result == 'success' || needs.changes.outputs.model_router_deploy != 'true')
      && needs.gate.result == 'success'
