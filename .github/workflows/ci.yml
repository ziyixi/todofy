# One workflow for the apps (Todofy, Mail Hero, the home dashboard, the website, FlowDay, the links app, the watch app,
# Fleet, Newsletter, Platform, mailsort, recall and the brief).
# "changes" decides what changed since a cumulative base (.github/scripts/ci_changes.py), each app's checks run
# from its own directory, "Shared packages" checks packages/* (compiled into the apps), "Contracts" runs both
# sides of mail.received.v1, ops-v1 and task-intent-v1 plus the dashboard's ops-v1 caller tests, "Proto checks"
# gates the protobuf IDL in proto/, and "CI gate" is the single status check to require.
# Deploys run only on main, only for the app that changed (itself, a shared package it compiles in, a contract
# file it bundles, or was dispatched), after the gate passes; the watch app deploys after Todofy (its TODOFY
# binding) and the dashboard after every app whose Ops entrypoint it binds. A push to main whose commit already passed every
# needed check in a branch push run reuses that run: the checks are skipped, the gate and the deploys still run
# (ci_changes.py find_reusable). Every deploy that applies routes runs tools/cf-guard first. recall's Chrome extension
# is never deployed: each new version is kept as a GitHub Release (Recall extension release).
# See docs/ci-cd.md.
name: CI and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      app:
        description: App to check and (on main) deploy
        type: choice
        # both = Todofy and Mail Hero (as before the dashboard existed); all = every app.
        options: [both, all, todofy, mail-hero, dashboard, website, flowday, links, watch, newsletter, fleet, platform, mailsort, recall, brief]
        default: both
      resume_vps_release:
        description: Explicitly resume a held VPS release after investigating its safe error
        type: boolean
        default: false
      resume_source_sha:
        description: Original held release's full source SHA (required only for resume)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read this workflow's own past runs: the last successful main run is the change-detection base.
      actions: read
    outputs:
      todofy_check: ${{ steps.decide.outputs.todofy_check }}
      mail_hero_check: ${{ steps.decide.outputs.mail_hero_check }}
      dashboard_check: ${{ steps.decide.outputs.dashboard_check }}
      website_check: ${{ steps.decide.outputs.website_check }}
      flowday_check: ${{ steps.decide.outputs.flowday_check }}
      links_check: ${{ steps.decide.outputs.links_check }}
      watch_check: ${{ steps.decide.outputs.watch_check }}
      newsletter_check: ${{ steps.decide.outputs.newsletter_check }}
      fleet_check: ${{ steps.decide.outputs.fleet_check }}
      platform_check: ${{ steps.decide.outputs.platform_check }}
      mailsort_check: ${{ steps.decide.outputs.mailsort_check }}
      recall_check: ${{ steps.decide.outputs.recall_check }}
      brief_check: ${{ steps.decide.outputs.brief_check }}
      contracts: ${{ steps.decide.outputs.contracts }}
      packages: ${{ steps.decide.outputs.packages }}
      infra: ${{ steps.decide.outputs.infra }}
      proto: ${{ steps.decide.outputs.proto }}
      todofy_deploy: ${{ steps.decide.outputs.todofy_deploy }}
      mail_hero_deploy: ${{ steps.decide.outputs.mail_hero_deploy }}
      dashboard_deploy: ${{ steps.decide.outputs.dashboard_deploy }}
      website_deploy: ${{ steps.decide.outputs.website_deploy }}
      website_relay_deploy: ${{ steps.decide.outputs.website_relay_deploy }}
      flowday_deploy: ${{ steps.decide.outputs.flowday_deploy }}
      links_deploy: ${{ steps.decide.outputs.links_deploy }}
      watch_deploy: ${{ steps.decide.outputs.watch_deploy }}
      newsletter_deploy: ${{ steps.decide.outputs.newsletter_deploy }}
      fleet_deploy: ${{ steps.decide.outputs.fleet_deploy }}
      platform_publish: ${{ steps.decide.outputs.platform_publish }}
      platform_deploy: ${{ steps.decide.outputs.platform_deploy }}
      mailsort_deploy: ${{ steps.decide.outputs.mailsort_deploy }}
      recall_deploy: ${{ steps.decide.outputs.recall_deploy }}
      recall_extension_publish: ${{ steps.decide.outputs.recall_extension_publish }}
      brief_deploy: ${{ steps.decide.outputs.brief_deploy }}
      # A push to main that reuses a green branch run of the same commit (all check outputs above are false).
      checks_reused: ${{ steps.decide.outputs.checks_reused }}
      reused_run_url: ${{ steps.decide.outputs.reused_run_url }}
      reused_jobs: ${{ steps.decide.outputs.reused_jobs }}
      reused_run_id: ${{ steps.decide.outputs.reused_run_id }}
      # The commit the diff started from (empty when everything runs): Proto checks compares the IDL with it.
      base: ${{ steps.decide.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history of every branch: the base (last successful main run, or the merge base
          # with origin/main) must be in the clone.
          fetch-depth: 0
      - name: Test the change detection, public configuration and Wrangler configs
        run: |
          python3 -m unittest discover -s .github/scripts
          python3 -m unittest discover -s tools/cloud-config/tests
          python3 -m unittest discover -s tools/cloud-release/tests
          python3 -m unittest discover -s tools/cloud-bootstrap/tests
          python3 tools/cloud-config/generate.py --check
          python3 -m unittest discover -s tools/service-catalog/tests
          python3 tools/service-catalog/catalog.py --check
          python3 tools/service-catalog/inventory.py --check
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
      # The deploy hostname guard every deploy job runs (dependency-free; synthetic API, no token).
      - name: Test the deploy hostname guard
        run: node --test tools/cf-guard/test/*.test.mjs tools/cloud-config/tests/worker-secrets.test.mjs
      # The shared test and build tools the apps' checks import by relative path (dependency-free, synthetic data):
      # the bundle-size budgets and the CPU meter of the workerd CPU tests, whose workerd side runs in the FlowDay,
      # links, watch, Mail Hero and dashboard suites.
      - name: Test the shared bundle-size and CPU test tools
        run: node --test tools/bundle-size/test/*.test.mjs tools/workerd-cpu/test/*.test.mts
      # On a push to main it reads this workflow's runs with the read-only token: the newest first-parent commit
      # whose push run on main succeeded is the diff base (ci_changes.py last_successful_main; any error runs
      # everything), and a green branch push run of this exact commit may be reused. It prints only commits, run
      # URLs and job names.
      - name: Decide which apps to check and deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
          DISPATCH_APP: ${{ inputs.app }}
          DISPATCH_RESUME: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
        run: python3 .github/scripts/ci_changes.py

  # Each shared package's own typecheck and tests, from its own directory with its own lockfile. The apps'
  # checks compile the same source through their file: dependency, so they run too (ci_changes.py).
  shared-packages:
    name: Shared packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shared-packages steps
        uses: ./.github/actions/check-shared-packages

  todofy-static:
    name: Todofy static checks
    needs: changes
    if: needs.changes.outputs.todofy_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: todofy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run todofy-static steps
        uses: ./.github/actions/check-todofy-static

  todofy-runtime:
    name: Todofy runtime (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.todofy_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports; any failed shard still fails this job, "Todofy checks" and the gate.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: todofy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run todofy-runtime steps
        uses: ./.github/actions/check-todofy-runtime
        with:
          shard-index: ${{ strategy.job-index }}
          shard-total: ${{ strategy.job-total }}

  todofy-checks:
    name: Todofy checks
    needs: [changes, todofy-static, todofy-runtime]
    # !cancelled(), not always(): a cancelled run must not produce a passing "Todofy checks". It runs when
    # a needed job failed, so that the failure is reported here too.
    if: ${{ !cancelled() && needs.changes.outputs.todofy_check == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: todofy
    steps:
      - name: Require the static checks and every runtime shard
        working-directory: .
        env:
          STATIC: ${{ needs.todofy-static.result }}
          RUNTIME: ${{ needs.todofy-runtime.result }}
        run: |
          echo "Todofy static checks=$STATIC"
          echo "Todofy runtime=$RUNTIME"
          [ "$STATIC" = success ] && [ "$RUNTIME" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv sync builds the dependency ziyixi-proto, whose build runs proto/tools/ensure.mjs with Node.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: todofy/.nvmrc
          cache: npm
          cache-dependency-path: proto/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
          working-directory: todofy
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: todofy-runtime-junit-*
          path: ${{ runner.temp }}/junit
          merge-multiple: true
      - name: Every collected runtime test ran exactly once and passed
        run: |
          uv run pytest tests/runtime --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/collected.txt"
          python3 ../.github/scripts/pytest_completeness.py --collected "$RUNNER_TEMP/collected.txt" \
            --junit-dir "$RUNNER_TEMP/junit" --shards 3 --test-root tests/runtime \
            --serial ../.github/scripts/todofy-runtime-serial.txt \
            --expected-skips ../.github/scripts/todofy-runtime-expected-skips.txt

  mail-hero-checks:
    name: Mail Hero checks
    needs: changes
    if: needs.changes.outputs.mail_hero_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mail-hero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run mail-hero-checks steps
        uses: ./.github/actions/check-mail-hero

  dashboard-checks:
    name: Dashboard checks
    needs: changes
    if: needs.changes.outputs.dashboard_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dashboard-checks steps
        uses: ./.github/actions/check-dashboard

  flowday-checks:
    name: FlowDay checks
    needs: changes
    if: needs.changes.outputs.flowday_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowday
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run flowday-checks steps
        uses: ./.github/actions/check-flowday

  links-checks:
    name: Links checks
    needs: changes
    if: needs.changes.outputs.links_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run links-checks steps
        uses: ./.github/actions/check-links

  watch-checks:
    name: Watch checks
    needs: changes
    if: needs.changes.outputs.watch_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run watch-checks steps
        uses: ./.github/actions/check-watch

  mailsort-checks:
    name: Mailsort checks
    needs: changes
    if: needs.changes.outputs.mailsort_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mailsort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run mailsort-checks steps
        uses: ./.github/actions/check-mailsort

  recall-checks:
    name: Recall checks
    needs: changes
    if: needs.changes.outputs.recall_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run recall-checks steps
        uses: ./.github/actions/check-recall

  brief-checks:
    name: Brief checks
    needs: changes
    if: needs.changes.outputs.brief_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: brief
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run brief-checks steps
        uses: ./.github/actions/check-brief

  fleet-checks:
    name: Fleet checks
    needs: changes
    if: needs.changes.outputs.fleet_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run fleet-checks steps
        uses: ./.github/actions/check-fleet

  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run contracts steps
        uses: ./.github/actions/check-contracts

  website-checks:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.website_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run website-checks steps
        uses: ./.github/actions/check-website

  infra-checks:
    name: Infra checks
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run infra-checks steps
        uses: ./.github/actions/check-infra

  proto-checks:
    name: Proto checks
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The breaking-change base (the Changes job's diff base) must be in the clone.
          fetch-depth: 0
      - name: Run proto-checks steps
        uses: ./.github/actions/check-proto
        with:
          base-sha: ${{ needs.changes.outputs.base }}

  newsletter-checks:
    name: Newsletter checks
    needs: changes
    if: needs.changes.outputs.newsletter_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: newsletter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run newsletter-checks steps
        uses: ./.github/actions/check-newsletter

  newsletter-image:
    name: Newsletter image checks
    needs: [changes, newsletter-checks]
    if: needs.changes.outputs.newsletter_check == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: newsletter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run newsletter-image steps
        uses: ./.github/actions/check-newsletter-image

  platform-checks:
    name: Platform checks
    needs: changes
    if: needs.changes.outputs.platform_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run platform-checks steps
        uses: ./.github/actions/check-platform
        with:
          build-image: ${{ !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release) }}

  gate:
    name: CI gate
    needs: [changes, shared-packages, todofy-static, todofy-runtime, todofy-checks, mail-hero-checks, dashboard-checks, website-checks, flowday-checks, links-checks, watch-checks, fleet-checks, mailsort-checks, recall-checks, brief-checks, newsletter-checks, newsletter-image, platform-checks, contracts, infra-checks, proto-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped as unchanged
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.shared-packages.result }}
          TODOFY_STATIC: ${{ needs.todofy-static.result }}
          TODOFY_RUNTIME: ${{ needs.todofy-runtime.result }}
          TODOFY: ${{ needs.todofy-checks.result }}
          MAIL_HERO: ${{ needs.mail-hero-checks.result }}
          DASHBOARD: ${{ needs.dashboard-checks.result }}
          WEBSITE: ${{ needs.website-checks.result }}
          FLOWDAY: ${{ needs.flowday-checks.result }}
          LINKS: ${{ needs.links-checks.result }}
          WATCH: ${{ needs.watch-checks.result }}
          FLEET: ${{ needs.fleet-checks.result }}
          MAILSORT: ${{ needs.mailsort-checks.result }}
          RECALL: ${{ needs.recall-checks.result }}
          BRIEF: ${{ needs.brief-checks.result }}
          NEWSLETTER: ${{ needs.newsletter-checks.result }}
          NEWSLETTER_IMAGE: ${{ needs.newsletter-image.result }}
          PLATFORM: ${{ needs.platform-checks.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          INFRA: ${{ needs.infra-checks.result }}
          PROTO: ${{ needs.proto-checks.result }}
          CHECKS_REUSED: ${{ needs.changes.outputs.checks_reused }}
          REUSED_RUN_URL: ${{ needs.changes.outputs.reused_run_url }}
          REUSED_JOBS: ${{ needs.changes.outputs.reused_jobs }}
          REUSED_RUN_ID: ${{ needs.changes.outputs.reused_run_id }}
        run: |
          # A push to main that reused a branch run of the same commit: its checks are skipped here because that
          # run passed them (ci_changes.py find_reusable checked each job's conclusion).
          if [ "$CHECKS_REUSED" = true ]; then
            echo "Checks reused from $REUSED_RUN_URL (same commit, branch push, CI gate passed): $REUSED_JOBS"
            echo "::notice::Checks reused from $REUSED_RUN_URL"
          fi
          failed=0
          for pair in "Changes=$CHANGES" "Shared packages=$PACKAGES" "Todofy static checks=$TODOFY_STATIC" \
            "Todofy runtime=$TODOFY_RUNTIME" "Todofy checks=$TODOFY" "Mail Hero checks=$MAIL_HERO" \
            "Dashboard checks=$DASHBOARD" "Website checks=$WEBSITE" "FlowDay checks=$FLOWDAY" "Links checks=$LINKS" "Watch checks=$WATCH" "Fleet checks=$FLEET" "Mailsort checks=$MAILSORT" \
            "Recall checks=$RECALL" "Brief checks=$BRIEF" \
            "Newsletter checks=$NEWSLETTER" "Newsletter image checks=$NEWSLETTER_IMAGE" "Platform checks=$PLATFORM" \
            "Contracts=$CONTRACTS" "Infra checks=$INFRA" "Proto checks=$PROTO"; do
            echo "$pair"
            case "${pair#*=}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          # "changes" must itself succeed: without it every other job is skipped.
          [ "$CHANGES" = success ] || failed=1
          exit "$failed"

  # Publish the same checked artifact; VPS deploy receives only its pullable registry digest.
  newsletter-deploy:
    name: Newsletter image publish
    outputs:
      image: ${{ steps.publish.outputs.image }}
    needs: [changes, newsletter-checks, newsletter-image, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.newsletter-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.newsletter-checks.result == 'skipped'))
      && (needs.newsletter-image.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.newsletter-image.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
      && needs.changes.outputs.newsletter_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production
    concurrency:
      group: newsletter-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run publish-newsletter steps
        id: publish
        uses: ./.github/actions/publish-newsletter
        with:
          artifact-run-id: ${{ needs.changes.outputs.reused_run_id || github.run_id }}

  platform-image:
    name: Platform image
    needs: [changes, platform-checks, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.platform-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.platform-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
      && needs.changes.outputs.platform_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    environment: production
    concurrency:
      group: platform-image-production
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run publish-platform steps
        id: publish
        uses: ./.github/actions/publish-platform
        with:
          artifact-run-id: ${{ needs.changes.outputs.reused_run_id || github.run_id }}

  vps-bootstrap-bundle:
    name: VPS bootstrap bundle
    needs: [changes, newsletter-deploy, platform-image, gate]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success'
      && needs.changes.result == 'success'
      && github.ref == 'refs/heads/main'
      && needs.newsletter-deploy.result == 'success' && needs.platform-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run package-vps steps
        uses: ./.github/actions/package-vps
        with:
          newsletter-image: ${{ needs.newsletter-deploy.outputs.image }}
          platform-image: ${{ needs.platform-image.outputs.image }}

  vps-deploy:
    name: VPS deploy
    needs: [changes, platform-checks, newsletter-deploy, platform-image, vps-bootstrap-bundle, fleet-deploy, gate]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.platform-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.platform-checks.result == 'skipped'))
      && ((github.event_name == 'workflow_dispatch' && inputs.resume_vps_release
          && needs.newsletter-deploy.result == 'skipped' && needs.platform-image.result == 'skipped'
          && needs.vps-bootstrap-bundle.result == 'skipped')
        || (!(github.event_name == 'workflow_dispatch' && inputs.resume_vps_release)
          && needs.newsletter-deploy.result == 'success' && needs.platform-image.result == 'success'
          && needs.vps-bootstrap-bundle.result == 'success'))
      && (needs.fleet-deploy.result == 'success' || needs.fleet-deploy.result == 'skipped')
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.platform_deploy == 'true'
      && vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deploy-vps steps
        uses: ./.github/actions/deploy-vps
        with:
          platform-access-client-id: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
          platform-access-client-secret: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
          platform-deploy-token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          newsletter-image: ${{ needs.newsletter-deploy.outputs.image }}
          platform-image: ${{ needs.platform-image.outputs.image }}
          resume-release: ${{ inputs.resume_vps_release && 'true' || 'false' }}
          source-sha: ${{ inputs.resume_vps_release && inputs.resume_source_sha || github.sha }}

  todofy-deploy:
    name: Todofy deploy
    # Every Todofy job, named here even though "Todofy checks" already requires the other two.
    needs: [changes, todofy-static, todofy-runtime, todofy-checks, gate]
    # Keep the status function and the results explicit. "gate" needs Mail Hero checks (and Dashboard checks),
    # which are skipped when only Todofy changed; a bare condition gets an implicit success() that looks at the whole needs
    # chain, sees that skipped job and skips this deploy too (actions/runner#491, #2205).
    # .github/scripts/test_ci_changes.py checks this shape. A check job may be skipped only when this push to main
    # reuses a green branch run of the same commit (checks_reused); the gate must still pass.
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.todofy-static.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-static.result == 'skipped'))
      && (needs.todofy-runtime.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-runtime.result == 'skipped'))
      && (needs.todofy-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.todofy-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.todofy_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: todofy
      source_sha: ${{ github.sha }}
    secrets: inherit

  mail-hero-deploy:
    name: Mail Hero deploy
    needs: [changes, mail-hero-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.mail-hero-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.mail-hero-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.mail_hero_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: mail-hero
      source_sha: ${{ github.sha }}
    secrets: inherit

  dashboard-deploy:
    name: Dashboard deploy
    # After the app deploys: the service bindings MAIL_HERO, TODOFY, WATCH, FLEET, MAILSORT, RECALL and BRIEF name their "Ops"
    # entrypoints, which must be live first. An app deploy that did not run (nothing of that app changed) is fine; one that
    # failed or was cancelled stops this job.
    needs: [changes, dashboard-checks, gate, todofy-deploy, mail-hero-deploy, watch-deploy, fleet-deploy, mailsort-deploy, recall-deploy, brief-deploy, website-relay-deploy]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.dashboard-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.dashboard-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && (needs.todofy-deploy.result == 'success' || needs.todofy-deploy.result == 'skipped')
      && (needs.mail-hero-deploy.result == 'success' || needs.mail-hero-deploy.result == 'skipped')
      && (needs.watch-deploy.result == 'success' || needs.watch-deploy.result == 'skipped')
      && (needs.fleet-deploy.result == 'success' || needs.fleet-deploy.result == 'skipped')
      && (needs.mailsort-deploy.result == 'success' || needs.mailsort-deploy.result == 'skipped')
      && (needs.recall-deploy.result == 'success' || needs.recall-deploy.result == 'skipped')
      && (needs.brief-deploy.result == 'success' || needs.brief-deploy.result == 'skipped')
      && (needs.website-relay-deploy.result == 'success' || needs.website-relay-deploy.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.dashboard_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: dashboard
      source_sha: ${{ github.sha }}
    secrets: inherit

  flowday-deploy:
    name: FlowDay deploy
    needs: [changes, flowday-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.flowday-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.flowday-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.flowday_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: flowday
      source_sha: ${{ github.sha }}
    secrets: inherit

  links-deploy:
    name: Links deploy
    needs: [changes, links-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.links-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.links-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.links_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: links
      source_sha: ${{ github.sha }}
    secrets: inherit

  watch-deploy:
    name: Watch deploy
    needs: [changes, watch-checks, gate, todofy-deploy]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.watch-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.watch-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && (needs.todofy-deploy.result == 'success' || needs.todofy-deploy.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.watch_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: watch
      source_sha: ${{ github.sha }}
    secrets: inherit

  mailsort-deploy:
    name: Mailsort deploy
    needs: [changes, mailsort-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.mailsort-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.mailsort-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.mailsort_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: mailsort
      source_sha: ${{ github.sha }}
    secrets: inherit

  # recall: deployed since "Infra apply" created its Access applications and its bucket and the go-live commit added the
  # AUD (recall/docs/design.md section 11). Home binds its Ops entrypoint (RECALL), so Home's deploy waits for this job.
  recall-deploy:
    name: Recall deploy
    needs: [changes, recall-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.recall-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.recall-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.recall_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: recall
      source_sha: ${{ github.sha }}
    secrets: inherit

  # recall's Chrome extension, kept for good: each new version becomes the GitHub Release recall-extension-v<version>
  # with its zip (owner request 2026-10-11, recall/extension/README.md). On main, after the gate, when recall/extension/
  # or recall/shared/ changed (recall_extension_publish), it publishes the build "Recall checks" tested: its artifact,
  # from the reused branch run when the checks were reused. A version whose tag exists is skipped, so a rerun publishes
  # nothing twice. The build holds nothing personal (recall's host is public; the token is pasted into the installed
  # extension) and the job reads no secret: GITHUB_TOKEN and the runner's gh. No job needs this one, so neither the gate
  # nor a deploy waits for it; a failure fails the run, so the next push to main retries it (cumulative diff). It lives
  # here, not in a workflow_run file, because only this run knows whether the extension changed and which run built it.
  recall-extension-release:
    name: Recall extension release
    needs: [changes, recall-checks, gate]
    # Explicit status function and results, as for the deploys (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.recall-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.recall-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.recall_extension_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The tag and the release; actions: read for the artifact of a reused branch run.
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recall-extension-${{ github.sha }}
          path: ${{ runner.temp }}/recall-extension
          github-token: ${{ github.token }}
          run-id: ${{ needs.changes.outputs.reused_run_id || github.run_id }}
      - name: Publish the extension's version unless its tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_DIR: ${{ runner.temp }}/recall-extension
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REUSED_RUN_URL: ${{ needs.changes.outputs.reused_run_url }}
        run: |
          set -euo pipefail
          # The version is the build's UTC time (recall/extension/scripts/manifest.mjs), its name the short commit.
          version=$(jq -r '.version' "$BUILD_DIR/manifest.json")
          version_name=$(jq -r '.version_name' "$BUILD_DIR/manifest.json")
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ || "$version_name" != "${GITHUB_SHA:0:7}" ]]; then
            echo "::error::The artifact is not this commit's extension build"
            exit 1
          fi
          tag="recall-extension-v$version"
          # The API lists every tag that starts with the name; only the exact one counts.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            echo "::notice::$tag exists: nothing to publish"
            exit 0
          fi
          zip="$RUNNER_TEMP/recall-extension-v$version.zip"
          (cd "$BUILD_DIR" && zip -X -D -q -r "$zip" .)
          {
            echo "recall's Chrome extension $version, built from commit $GITHUB_SHA."
            echo
            echo "CI run: $RUN_URL"
            if [ -n "$REUSED_RUN_URL" ]; then
              echo "Checked and built in: $REUSED_RUN_URL"
            fi
            echo
            echo 'Install: `npm run install-extension -- <this zip>` in recall/extension (recall/extension/README.md).'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$zip" --target "$GITHUB_SHA" --title "recall extension $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"

  # The brief, with its archive UI as static assets (brief/docs/design.md section 18). Home does not bind the brief
  # yet, so Home's deploy does not wait for this job.
  brief-deploy:
    name: Brief deploy
    needs: [changes, brief-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.brief-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.brief-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.brief_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: brief
      source_sha: ${{ github.sha }}
    secrets: inherit

  fleet-deploy:
    name: Fleet deploy
    needs: [changes, fleet-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.fleet-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.fleet-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.fleet_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: fleet
      source_sha: ${{ github.sha }}
    secrets: inherit

  # The site release: dispatches website-release.yml (docs in website/docs/release.md), the same workflow the
  # daily Cron and Home's sync button dispatch, and returns at once. The release's job holds the one
  # concurrency group "website-production" and the production environment; this CI run neither waits for a
  # queued release nor ties other apps' deploys to it, and the relay sees the release like any other run.
  # The release builds the newest main commit whose push run passed the CI gate (this one, once it is green).
  # A push releases only when the website's code identity or the Notion content changed.
  website-deploy:
    name: Website deploy
    needs: [changes, website-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.website-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.website-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.website_deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # workflow_dispatch of website-release.yml (a dispatch by GITHUB_TOKEN does start a run).
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dispatch-website steps
        uses: ./.github/actions/dispatch-website

  website-relay-deploy:
    name: Website relay deploy
    needs: [changes, website-checks, gate]
    # Explicit status function and results, as for Todofy deploy (implicit success() and skipped ancestors).
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (needs.website-checks.result == 'success' || (needs.changes.outputs.checks_reused == 'true' && needs.website-checks.result == 'skipped'))
      && needs.gate.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.website_relay_deploy == 'true' }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: website-relay
      source_sha: ${{ github.sha }}
    secrets: inherit
