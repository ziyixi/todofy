# Inspection is the default and routine repair is opt-in. Any other infrastructure change is applied only by
# "Infra apply", with the expect line this run prints.
name: Personal cloud reconcile

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_run:
    workflows: [CI and deploy]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Check drift, repair supported drift, resume one held VPS repair, or complete one Worker receipt
        type: choice
        options: [check, repair, resume, record]
        default: check
      record_app:
        description: Worker whose existing receipt needs verification, only for record
        type: choice
        options: [todofy, mail-hero, dashboard, links, watch, fleet, mailsort, recall, storage, tasks, personal-mcp, model-router, newsletter-console, website-relay]
        default: tasks
      record_deployment_id:
        description: Existing GitHub deployment ID, required only for record
        type: string
        default: ''
      resume_release:
        description: Existing releases/UUID, required only for resume
        type: string
        default: ''

permissions:
  contents: read

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  context:
    name: Select current main and requested operation
    if: >-
      ${{ (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.name == 'CI and deploy'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      operation: ${{ steps.context.outputs.operation }}
    steps:
      - name: Require the triggering revision to still be current main
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          AUTO_REPAIR: ${{ vars.PERSONAL_CLOUD_AUTO_REPAIR }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$EXPECTED_SOURCE" != "$main_sha" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; this event is skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          operation=check
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            operation="$REQUESTED_OPERATION"
          elif [ "$AUTO_REPAIR" = true ]; then
            operation=repair
          fi
          case "$operation" in check|repair|resume|record) ;; *) exit 1 ;; esac
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "source_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  infra:
    name: Infrastructure comparison and routine repair
    needs: context
    if: needs.context.outputs.enabled == 'true' && needs.context.outputs.operation != 'resume' && needs.context.outputs.operation != 'record'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: infra-production
      cancel-in-progress: false
    outputs:
      state: ${{ steps.reconcile.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
          github_token: ${{ github.token }}
      - name: Recheck main under the infrastructure lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.context.outputs.source_sha }}
        run: test "$EXPECTED_SOURCE" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
      - name: Classify drift without silently approving sensitive changes
        id: reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          INFRA_STATE_PASSPHRASE: ${{ secrets.INFRA_STATE_PASSPHRASE }}
          INFRA_TFVARS: ${{ secrets.INFRA_TFVARS }}
          INFRA_RECONCILE_SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          RECONCILE_OPERATION: ${{ needs.context.outputs.operation }}
        run: |
          args=()
          if [ "$RECONCILE_OPERATION" = check ]; then args+=(--check-only); fi
          status=0
          python3 infra/scripts/infra_state.py reconcile --environment production \
            --github-output "$GITHUB_OUTPUT" "${args[@]}" || status=$?
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then exit "$status"; fi
      # The comparison's summary above ends with the "Infra apply" expect line for a plan it does not repair.
      - name: Show the comparison result
        env:
          PLAN_STATE: ${{ steps.reconcile.outputs.state }}
          PLAN_SOURCE: ${{ needs.context.outputs.source_sha }}
        run: |
          printf 'Infrastructure: %s\n\nSource: `%s`\n' "$PLAN_STATE" "$PLAN_SOURCE" >> "$GITHUB_STEP_SUMMARY"

  workers:
    name: Compare or repair ${{ matrix.app }}
    needs: context
    if: needs.context.outputs.enabled == 'true' && needs.context.outputs.operation != 'resume' && needs.context.outputs.operation != 'record'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: [todofy, mail-hero, dashboard, links, watch, fleet, mailsort, recall, storage, tasks, personal-mcp, model-router, newsletter-console, website-relay]
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: ${{ matrix.app }}
      repair: true
      check_only: ${{ needs.context.outputs.operation == 'check' }}
      expected_main_sha: ${{ needs.context.outputs.source_sha }}
    secrets: inherit

  record-worker:
    name: Verify and complete one Worker receipt
    needs: context
    if: needs.context.outputs.enabled == 'true' && needs.context.outputs.operation == 'record' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/worker-release.yml
    with:
      app: ${{ inputs.record_app }}
      record_only: true
      deployment_id: ${{ inputs.record_deployment_id }}
      expected_main_sha: ${{ needs.context.outputs.source_sha }}
    secrets: inherit

  vps:
    name: Compare, repair or explicitly resume the VPS runtime
    needs: context
    if: needs.context.outputs.enabled == 'true' && vars.VPS_DEPLOY_ENABLED == 'true' && needs.context.outputs.operation != 'record'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Recheck main under the VPS lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.context.outputs.source_sha }}
        run: test "$EXPECTED_SOURCE" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
      - name: Call the daemon and verify actual running identities
        env:
          PLATFORM_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_ACCESS_CLIENT_ID }}
          PLATFORM_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_ACCESS_CLIENT_SECRET }}
          PLATFORM_DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          RECONCILE_OPERATION: ${{ needs.context.outputs.operation }}
          RESUME_RELEASE: ${{ inputs.resume_release }}
        run: |
          request_id=$(PYTHONPATH=tools/vps-release python3 -c 'import os; from release_identity import reconcile_id; print(reconcile_id(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]))')
          operation="$RECONCILE_OPERATION"
          args=()
          if [ "$operation" = check ]; then operation=plan; fi
          if [ "$operation" = resume ]; then args+=(--release-name "$RESUME_RELEASE"); fi
          bazel run //tools/vps-release:reconcile_cli -- \
            --operation "$operation" --request-id "$request_id" \
            --evidence-file "$RUNNER_TEMP/vps-release-evidence.json" "${args[@]}"
      - name: Record only a physically verified changed or resumed VPS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/vps-release-evidence.json" ]; then
            python3 tools/cloud-release/vps_record.py --evidence-file "$RUNNER_TEMP/vps-release-evidence.json"
          fi

  inventory:
    name: Verify complete account resource registration
    needs: context
    if: needs.context.outputs.enabled == 'true' && needs.context.outputs.operation != 'record'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false
      - name: Generate registration from the selected private source
        id: private_catalog
        uses: ./.github/actions/private-catalog
        with:
          source-root: .
          private-ssh-key: ${{ secrets.TODOFY_PRIVATE_SSH_KEY }}
          output-file: ${{ runner.temp }}/private-catalog.json
      - name: Compare actual Worker, D1, DO and R2 identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/service-catalog/inventory.py --private-catalog-file "$RUNNER_TEMP/private-catalog.json"
      # Scheduled runs only; a private publication verifies the same identities before its post-merge run.
      - name: Compare the live private sources with the pinned gitlink
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.private_catalog.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/private_revision.py --source-root . --catalog-file "$RUNNER_TEMP/private-catalog.json"
      - name: Remove the generated private registration
        if: always()
        run: rm -f "$RUNNER_TEMP/private-catalog.json"

  infra-result:
    name: Require resolved infrastructure drift
    needs: [context, infra]
    if: >-
      ${{ always() && needs.context.outputs.enabled == 'true'
      && needs.context.outputs.operation != 'resume' && needs.context.outputs.operation != 'record' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the comparison or repair resolved the plan
        env:
          INFRA_STATE: ${{ needs.infra.outputs.state }}
        run: |
          case "$INFRA_STATE" in
            in_sync|repaired)
              echo 'Infrastructure reconciliation verified.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            repairable)
              echo '有可自动修复的差异。请以 repair 重新运行本对账，或按本次 Infrastructure 摘要中的 expect 运行 Infra apply。' >> "$GITHUB_STEP_SUMMARY"
              echo '::error::Infrastructure reconciliation has an unresolved plan.'
              exit 1
              ;;
            needs_manual)
              echo '有待人工处理的计划。请审阅本次 Infrastructure 摘要的地址表，按其中 "Infra apply" 一行处理（通常是在 main 上用该 expect 运行 Infra apply），再以 check 重新运行本对账。' >> "$GITHUB_STEP_SUMMARY"
              echo '::error::Infrastructure reconciliation has an unresolved plan.'
              exit 1
              ;;
            *)
              echo '基础设施核对未获得有效结果。请检查本次 Infrastructure job，修正后重新运行。' >> "$GITHUB_STEP_SUMMARY"
              echo '::error::Infrastructure reconciliation has no verified result.'
              exit 1
              ;;
          esac
