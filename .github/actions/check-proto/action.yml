name: check-proto
description: "check-proto; called by the repository workflow."
inputs:
  base-sha:
    description: "Commit used for the proto breaking-change comparison"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: proto/package-lock.json
    # Python 3.14 (todofy-core's) for the Python codec's tests.
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        working-directory: proto
    # Go for Google's api-linter, the Go toolchain proto/tools/api-linter/go.mod names (its go.sum pins every
    # module checksum; scripts/api-lint.sh builds the linter from it).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: proto/tools/api-linter/go.mod
        cache-dependency-path: proto/tools/api-linter/go.sum
    - name: Install the pinned toolchain (buf, protoc-gen-es, the protobuf-es runtime)
      working-directory: proto
      shell: bash -e {0}
      run: npm ci --no-audit --no-fund
    - name: Format and lint (STANDARD and COMMENTS)
      working-directory: proto
      shell: bash -e {0}
      run: npm run lint
    - name: Google's api-linter (AIP rules) on every package but the runtimes' test fixtures
      working-directory: proto
      shell: bash -e {0}
      run: npm run api-lint
    # Against the commit the Changes job diffed from: the last successful main run on main, the merge base
    # with origin/main on a branch. Empty (Changes found no usable base and runs everything, or a dispatch):
    # breaking.sh compares with HEAD~1 and says so in the log.
    - name: No breaking change (buf FILE rules and the wire profile rules) against the diff base
      env:
        BASE: ${{ inputs.base-sha }}
      working-directory: proto
      shell: bash -e {0}
      run: sh scripts/breaking.sh "$BASE"
    - name: The lint and breaking rules still bite
      working-directory: proto
      shell: bash -e {0}
      run: sh scripts/rules-selftest.sh
    - name: Generation is deterministic
      working-directory: proto
      shell: bash -e {0}
      run: node tools/ensure.mjs --check-deterministic
    - name: The contracts' JSON Schemas are generated from the IDL (tools/gen_schema.py)
      working-directory: proto
      shell: bash -e {0}
      run: npm run check:schema
    - name: Typecheck and test both codecs (the shared edge cases in TypeScript and Python)
      working-directory: proto
      shell: bash -e {0}
      run: |
        npm run typecheck
        npx --no-install vitest run
        npm run test:python

# Newsletter is a separate VPS engine and GHCR image. No production credentials or real model calls here.
