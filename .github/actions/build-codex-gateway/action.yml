name: build-codex-gateway
description: Build the inference service's stamped image, check its source identity and save it; Bazel's container test probes it.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel
    - name: Build the stamped image, check its installed identity and save it
      working-directory: .
      shell: bash -e {0}
      run: |
        python3 tools/container-release/build.py --service codex-gateway --sha "$GITHUB_SHA"
        tested_image=$(docker image inspect --format '{{.Id}}' "codex-gateway-ci:$GITHUB_SHA")
        docker run --rm --network none --env EXPECTED_SHA="$GITHUB_SHA" --entrypoint python "$tested_image" \
          -c 'import importlib.resources, json, os; assert json.loads(importlib.resources.files("codex_gateway").joinpath("build-info.json").read_text())["source_sha"] == os.environ["EXPECTED_SHA"]'
        python3 tools/container-release/image.py save --image "$tested_image" --sha "$GITHUB_SHA" \
          --directory "$RUNNER_TEMP/codex-gateway-image"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-gateway-image-${{ github.sha }}
        path: ${{ runner.temp }}/codex-gateway-image/
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
