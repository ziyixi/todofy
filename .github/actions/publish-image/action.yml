name: publish-image
description: "Publish exactly the image of one VPS service that the CI gate tested; called by the repository workflow."
inputs:
  service:
    description: "newsletter, platform or codex-gateway (tools/container-release/image.py --service)"
    required: true
  artifact-run-id:
    description: "artifact run id"
    required: false
    default: ''
outputs:
  image:
    description: "image"
    value: ${{ steps.publish.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.service }}-image-${{ github.sha }}
        path: ${{ runner.temp }}/${{ inputs.service }}-image
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact-run-id }}
    - name: Log in for image publication
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: .
      shell: bash -e {0}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Verify and publish the tested image
      id: publish
      env:
        IMAGE_SERVICE: ${{ inputs.service }}
      working-directory: .
      shell: bash -e {0}
      run: python3 tools/container-release/image.py publish --service "$IMAGE_SERVICE" --sha "$GITHUB_SHA" --directory "$RUNNER_TEMP/$IMAGE_SERVICE-image" --github-output
    - name: Log out
      if: always()
      working-directory: .
      shell: bash -e {0}
      run: docker logout ghcr.io
