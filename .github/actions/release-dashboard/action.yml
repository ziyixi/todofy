name: release-dashboard
description: "release-dashboard; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  dashboard-cf-analytics-token:
    description: "dashboard cf analytics token"
    required: false
    default: ''
  dashboard-worker-secrets:
    description: "dashboard worker secrets"
    required: false
    default: ''
  private-catalog:
    description: "Optional private service registration"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: dashboard
        filters: 'home-dashboard-worker... home-dashboard-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/dashboard/worker
      env:
        DASHBOARD_WORKER_SECRETS: ${{ inputs.dashboard-worker-secrets }}
        DASHBOARD_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        DASHBOARD_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        DASHBOARD_CF_ANALYTICS_TOKEN: ${{ inputs.dashboard-cf-analytics-token }}
        CF_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/home-secrets.json"
    # Home's own parsePrivateCatalog, bundled into the checked archive: a value the Worker would refuse fails here,
    # before the deploy (deploy/private-catalog.mjs).
    - name: Validate and attach private service registration
      if: inputs.required == 'true'
      working-directory: .release-source/dashboard/worker
      env:
        PRIVATE_CATALOG: ${{ inputs.private-catalog }}
      shell: bash -e {0}
      run: node ../.compiled/tools/private-catalog.mjs "$RUNNER_TEMP/home-secrets.json"
    # No D1 and no migration step: the HomeState class migration (v1, new_sqlite_classes) is in the config.
    # The Access probe proves Access guards the host, not that the Worker runs: /health (BUILD_SHA) needs an
    # owner login (docs/verification.md).
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: dashboard
        worker: home
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'false'
        access-paths: / /api/v1/homeView
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/dashboard
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/home-secrets.json"
