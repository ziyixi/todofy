name: release-watch
description: "release-watch; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  watch-worker-secrets:
    description: "watch worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: watch
        filters: 'watch-worker... watch-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/watch/worker
      env:
        WATCH_WORKER_SECRETS: ${{ inputs.watch-worker-secrets }}
        WATCH_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        WATCH_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/watch-secrets.json"
    # /health is behind Access too (no bypass application); whether WatchState's alarm is armed cannot be seen
    # from here: the first owner API call and the dashboard's status() arm it (watch/README.md "Deploy").
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: watch
        worker: watch
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v1/watches /new
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/watch
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/watch-secrets.json"
