name: release-fleet
description: "release-fleet; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  fleet-access-owner:
    description: "fleet access owner"
    required: false
    default: ''
  fleet-access-owner-aliases:
    description: "fleet access owner aliases"
    required: false
    default: ''
  fleet-report-hmac-key:
    description: "fleet report hmac key"
    required: false
    default: ''
  fleet-worker-secrets:
    description: "fleet worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: fleet
        filters: 'fleet-worker... fleet-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/fleet/worker
      env:
        FLEET_WORKER_SECRETS: ${{ inputs.fleet-worker-secrets }}
        FLEET_ACCESS_OWNER: ${{ inputs.fleet-access-owner }}
        FLEET_ACCESS_OWNER_ALIASES: ${{ inputs.fleet-access-owner-aliases }}
        FLEET_REPORT_HMAC_KEY: ${{ inputs.fleet-report-hmac-key }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/fleet-secrets.json"
    # The whole owner host stays behind Access; the sole receipt path uses independent HMAC authentication.
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: fleet
        worker: fleet
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v1/fleetStatus
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/fleet
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/fleet-secrets.json"
