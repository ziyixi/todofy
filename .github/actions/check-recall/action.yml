name: check-recall
description: "check-recall; called by the repository workflow."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          recall/worker/package-lock.json
          recall/extension/package-lock.json
          recall/web/package-lock.json
          proto/package-lock.json
    - name: Install locked dependencies
      working-directory: recall
      shell: bash -e {0}
      run: |
        npm ci --prefix worker --no-audit --no-fund
        npm ci --prefix extension --no-audit --no-fund
        npm ci --prefix web --no-audit --no-fund
    # The config test reads wrangler.toml with the pinned wrangler (worker/node_modules), hence after npm ci; the
    # secrets test pins how that wrangler keeps a machine token digest put as a Worker secret on a deploy.
    - name: Test the production config and the deploy values
      working-directory: recall
      shell: bash -e {0}
      run: node --test deploy/test/*.test.mjs
    # The shared URL normalization, scrubber (with long hostile inputs), denylist and segmenter, query building,
    # snippets, the feed's and the archive's lines against the contract's fixtures, and the Dropbox client.
    - name: Lint, typecheck and test the Worker
      working-directory: recall/worker
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
    # A real SQLite RecallState and a local R2 bucket behind Miniflare: uploads to the feed and the blob route, the
    # server's own scrub and denylist, refusals, the write budget, deletion and the alarm's purge, the machine tokens
    # made in 设置, the archive pushed to a fake Dropbox (OAuth with PKCE, refresh, uploads, 429), search and the
    # timeline at their read bounds, the owner API, ops-v1 over a service binding, and the CPU of the fetch handler and
    # of RecallState against bounds scaled by the machine's measured speed (tools/workerd-cpu).
    - name: Runtime tests (workerd with a real Durable Object and R2)
      working-directory: recall/worker
      shell: bash -e {0}
      run: npm run test:runtime
    # The UI's views against a fake of the owner API on the shared transcoder (jsdom), the layout rules a phone depends
    # on, no request but to its own origin, and the build held to its JavaScript budget (web/scripts/js-budget.mjs).
    # The dry run below serves this build (static assets do not count against the Worker bundle).
    - name: Lint, typecheck, test and build the UI
      working-directory: recall/web
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
    # The real wrangler dev (wrangler.test.toml, local Durable Object and R2) on loopback: the owner API makes the
    # machine tokens, the extension's own code uploads a browsing session, the owner API answers the calls the UI
    # makes, and the archive reaches a loopback fake of Dropbox (connected through its OAuth flow), checked against
    # contracts/recall-archive-v1 with the generated codec; a deleted page adds its tombstone and deletes nothing.
    # Needs the UI's build (the dev server serves web/dist).
