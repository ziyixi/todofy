name: check-website
description: "check-website; called by the repository workflow."
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: 'ziyixi-personal-website...'
    - name: Format, lint, typecheck and unit tests (release and daily sync included)
      working-directory: website
      shell: bash -e {0}
      run: |
        pnpm content:prepare:empty
        pnpm check
    # The browser download is cached by the locked Playwright version; the system libraries it needs are
    # installed on every run (install-deps), so a cache hit only skips the download.
    - name: Read the locked Playwright version
      id: playwright
      working-directory: website
      shell: bash -e {0}
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Restore the Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install the pinned Playwright browser
      working-directory: website
      shell: bash -e {0}
      run: |
        if [ "$CACHE_HIT" = true ]; then
          pnpm exec playwright install-deps chromium
        else
          pnpm exec playwright install --with-deps chromium
        fi
      env:
        CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
    # Each source builds the export and runs the browser suite against it (pnpm start = wrangler dev on
    # out/). The fixture also runs the release's route contract (every route, asset hash, redirect, 404).
    - name: Build and test the static export (empty and fixture content)
      working-directory: website
      shell: bash -e {0}
      run: |
        for mode in empty fixture; do
          echo "::group::$mode"
          pnpm "content:prepare:$mode"
          pnpm content:validate --source="$mode"
          CODE_SHA="$GITHUB_SHA" pnpm build:site
          CONTENT_MODE="$mode" pnpm test:e2e
          echo "::endgroup::"
        done
        pnpm start > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
        server=$!
        trap 'kill "$server" 2>/dev/null || true' EXIT
        for attempt in $(seq 1 60); do
          curl -fs -o /dev/null http://127.0.0.1:4173/build-info.json && break
          sleep 1
        done
        ALLOW_FIXTURE_DEPLOYMENT_TESTS=true DEPLOYMENT_BASE_URL=http://127.0.0.1:4173 \
          EXPECTED_BUILD_INFO_PATH=out/build-info.json pnpm test:deployment
    # The two Workers' production configs, as the deploy jobs use them. No token is needed for --dry-run.
    - name: Dry-run the two Workers
      working-directory: website
      shell: bash -e {0}
      run: |
        pnpm exec wrangler deploy --dry-run --config wrangler.toml
        pnpm exec wrangler deploy --dry-run --config relay/wrangler.toml --outdir "$RUNNER_TEMP/relay-bundle"
