name: check-contracts
description: "check-contracts; called by the repository workflow."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          mail-hero/cloudflare/package-lock.json
          todofy/gateway/package-lock.json
          dashboard/worker/package-lock.json
          watch/worker/package-lock.json
          fleet/worker/package-lock.json
          mailsort/worker/package-lock.json
          recall/worker/package-lock.json
          proto/package-lock.json
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        working-directory: todofy
        enable-cache: true
    # ops-v1's JSON Schema is generated from proto/ops/v1/ops.proto: a hand edit, or an IDL change without
    # `npm run schema`, fails here (the Python steps below give every fixture the reference validator's verdict on it).
    - name: The contracts' JSON Schemas are generated from the IDL
      working-directory: proto
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npm run check:schema
    # Producer: Mail Hero's parser and payload builder (the generated mail.received.v1 message, written by the wire
    # codec) must still emit every golden fixture byte for byte; the generated schema's "not blank" differs from the
    # hand-written one in ECMAScript only where the IDL says (contract-schema-dialect).
    # ops-v1: every answer Mail Hero's Ops code derives (status, guard, canary) keeps its golden bytes, passes the
    # contract's rules (the wire codec) and the legacy schema older dashboards check. Host only, no workerd.
    - name: Mail Hero builds the golden mail.received.v1 fixtures and checks ops-v1
      working-directory: mail-hero/cloudflare
      shell: bash -e {0}
      run: |
        npm ci
        node --test test/contract-fixtures.test.mjs test/contract-schema-dialect.test.mjs test/ops-golden.test.mjs test/native-ops.test.mjs
    # Consumer: Todofy validates every fixture (current and legacy) against the schema and parses it with the generated
    # codec; the generated mail.received.v1 schema gives the frozen hand-written one's verdict, and the parser the frozen
    # parser's, on every fixture and ~9,000 mutations (test_mail_received_*_legacy);
    # ops-v1 fixtures get the reference JSON Schema validator's verdict on the generated schema (the Python wire
    # codec agrees with it), and every value core/ops.py derives (status, guard, canary result) keeps its golden bytes,
    # the contract's rules and the legacy schema older dashboards check. The newsletter reports (todofy.report.v1):
    # every report keeps its golden bytes and the generated schemas give the frozen hand-written ones' verdict.
    - name: Todofy accepts every fixture and checks ops-v1
      working-directory: todofy
      shell: bash -e {0}
      run: |
        uv sync --locked
        uv run pytest tests/unit/test_mail_hero_compat.py tests/unit/test_contract.py tests/unit/test_machine_api.py \
          tests/unit/test_mail_received_schema_legacy.py tests/unit/test_mail_received_parser_legacy.py \
          tests/unit/test_ops_contract.py tests/unit/test_ops_core.py tests/unit/test_ops_golden.py \
          tests/unit/test_report_wire.py tests/unit/test_report_schemas.py tests/unit/test_report_schema_legacy.py
    # The gateway's Ops entrypoint (what the dashboard binds) forwards to todofy-core and returns values the
    # wire codec reads strictly (the generated services type it).
    - name: Todofy's Ops entrypoint returns ops-v1 values
      working-directory: todofy/gateway
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npx --no-install vitest run test/ops.test.ts
    # Caller: the dashboard calls only the methods of each app's generated ops-v1 services, handles every
    # declared error code plus timeouts and invalid output, accepts the valid fixtures and refuses the
    # invalid ones, keeps the bytes it read and sent before the move onto proto/ (ops-golden), and every value
    # it sends (SetGuardInput, StartCanaryInput, OpsReport) passes the contract's rules. Host only (vitest in
    # Node); Dashboard checks runs the workerd flows.
    - name: The dashboard calls ops-v1 as declared
      working-directory: dashboard/worker
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npx --no-install vitest run test/ops-client.test.ts test/ops-golden.test.ts test/guard.test.ts test/canary.test.ts test/digest.test.ts
    # ops-v1: the watch app's status and guard answers keep their golden bytes and the contract's watch fixtures, pass
    # the generated schema, and carry counts and codes only. Host only; Watch checks runs the Ops entrypoint over a
    # service binding in workerd (and its notification sink, Tasks' TaskInbox, against a stub).
    - name: The watch app answers ops-v1 as declared
      working-directory: watch/worker
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npx --no-install vitest run test/ops-golden.test.ts

    # ops-v1: mailsort's status and guard answers keep their golden bytes and the contract's mailsort fixtures, pass the
    # generated schema, and carry counts and codes only. Host only; Mailsort checks runs the entrypoint in workerd.
    - name: Mailsort answers ops-v1 as declared
      working-directory: mailsort/worker
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npx --no-install vitest run test/ops-golden.test.ts

    # ops-v1: recall's status answers keep their golden bytes and the contract's recall fixtures, pass the generated
    # schema, and carry counts and codes only. Host only; Recall checks runs the entrypoint in workerd.
    - name: Recall answers ops-v1 as declared
      working-directory: recall/worker
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npx --no-install vitest run test/ops-golden.test.ts

    # Both ends of the signed content-free report validate the synthetic telemetry contract.
    # Home's caller step above also checks Fleet and Newsletter ops-v1 values; runtime tests live in Fleet checks.
    - name: Fleet accepts the telemetry contract
      working-directory: fleet/worker
      shell: bash -e {0}
      run: |
        npm ci --no-audit --no-fund
        npm test -- --run test/report.test.ts
