name: release-website-relay
description: "release-website-relay; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  website-relay-worker-secrets:
    description: "website relay worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      if: inputs.required == 'true'
      uses: ./.github/actions/setup-workspace
      with:
        root: .release-source
        filters: 'ziyixi-personal-website...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      env:
        WEBSITE_RELAY_WORKER_SECRETS: ${{ inputs.website-relay-worker-secrets }}
      working-directory: .release-source/website
      shell: bash -e {0}
      run: node relay/deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/website-relay-secrets.json"
    - name: Validate the bundle before deploying
      if: inputs.required == 'true'
      working-directory: .release-source/website
      shell: bash -e {0}
      run: node relay/deploy/deploy-vars.mjs exec -- pnpm exec wrangler deploy "$PWD/.compiled/worker/index.js" --no-bundle --dry-run --config relay/wrangler.toml --secrets-file "$RUNNER_TEMP/website-relay-secrets.json"
    - name: Deploy the relay Worker
      if: inputs.required == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      working-directory: .release-source/website
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        node relay/deploy/deploy-vars.mjs exec -- pnpm exec wrangler deploy "$PWD/.compiled/worker/index.js" --no-bundle --config relay/wrangler.toml --secrets-file "$RUNNER_TEMP/website-relay-secrets.json"
    - name: Retire the old Notion button and detector secrets
      if: inputs.required == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      working-directory: .release-source/website
      shell: bash -e {0}
      run: python3 relay/deploy/retire-secrets.py
    - name: Remove the secrets file
      if: always()
      working-directory: .release-source/website
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/website-relay-secrets.json"
