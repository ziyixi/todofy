name: check-mailsort
description: "check-mailsort; called by the repository workflow."
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: 'mailsort-worker... mailsort-web...'
    # The config test reads wrangler.toml with the pinned wrangler (worker/node_modules), hence after the workspace install; the
    # secrets test pins how that wrangler keeps the owner's Gmail grant and Claude key on a deploy.
    - name: Test the production config, the deploy values and the token script
      working-directory: mailsort
      shell: bash -e {0}
      run: node --test deploy/test/*.test.mjs
    # The closed Gmail operation table, masks, strict Claude JSON and usage, and historical schema/golden reads.
    - name: Lint, typecheck and test the Worker
      working-directory: mailsort/worker
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
    # A real SQLite MailsortState with fake Gmail and Claude behind Miniflare's outbound service (no network):
    # fixed P1-P4 in shadow/live, hourly batches, actual monthly usage, provider cap, label setup, undo,
    # resync, auth stop, write-cap waits, historical replay, the
    # owner API, ops-v1 over a service binding, and the CPU of the fetch handler and of MailsortState (its alarm path
    # at its bounds) against bounds scaled by the machine's measured speed (tools/workerd-cpu).
    - name: Runtime tests (workerd with a real Durable Object)
      working-directory: mailsort/worker
      shell: bash -e {0}
      run: npm run test:runtime
    - name: Lint, typecheck, test and build the UI
      working-directory: mailsort/web
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
    # The real wrangler dev (wrangler.test.toml, local bindings) against the fakes on loopback: the owner's
    # whole loop through the HTTP API, every Google request checked against the table.
