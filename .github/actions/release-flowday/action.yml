name: release-flowday
description: "release-flowday; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  flowday-csrf-signing-key:
    description: "flowday csrf signing key"
    required: false
    default: ''
  flowday-worker-secrets:
    description: "flowday worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: inputs.required == 'true'
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          .release-source/flowday/worker/package-lock.json
          .release-source/flowday/web/package-lock.json
          .release-source/proto/package-lock.json
    # Every static production value (account, D1, host, Access) is committed in flowday/wrangler.toml; the
    # environment URL and the host probes read it there.
    - name: Read the host and the Access issuer from the committed config
      if: inputs.required == 'true'
      id: config
      working-directory: .release-source/flowday
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("url=https://" + variables["PUBLIC_HOST"])
        print("host=" + variables["PUBLIC_HOST"])
        print("access_issuer=" + variables["ACCESS_ISSUER"])
        EOF
    # The export is checked again (no test code, PWA files present): this build is the one that ships.
    - name: Build the verified revision
      if: inputs.required == 'true'
      working-directory: .release-source/flowday
      shell: bash -e {0}
      run: |
        npm ci --prefix worker --no-audit --no-fund
        npm ci --prefix web --no-audit --no-fund
        npm run build --prefix web
        npm run check:export --prefix web
    # The owner's addresses and the two keys are environment secrets (masked in this public log) and reach the
    # Worker as secrets through --secrets-file; wrangler prints plain vars. FlowDay's owner is the dashboard's owner
    # (one person, the same Access identities), so the addresses come from the dashboard's secrets; the
    # CSRF key is FlowDay's own. flowday/README.md "Deploy".
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/flowday/worker
      env:
        FLOWDAY_WORKER_SECRETS: ${{ inputs.flowday-worker-secrets }}
        FLOWDAY_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        FLOWDAY_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        FLOWDAY_CSRF_SIGNING_KEY: ${{ inputs.flowday-csrf-signing-key }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/flowday-secrets.json"
    # deploy-vars.mjs adds BUILD_SHA as --var and refuses a real deploy with the all-zeros D1 id or Access AUD.
    - name: Validate the bundle before changing D1
      if: inputs.required == 'true'
      working-directory: .release-source/flowday/worker
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/flowday-secrets.json" --outdir "$RUNNER_TEMP/flowday-bundle"
        node scripts/bundle-size.mjs "$RUNNER_TEMP/flowday-bundle"
    # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
    # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
    # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
    # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
    # The F4 cutover commit (flowday/docs/design.md section 11) allowed the removal of flowday-next.ziyixi.science
    # and the takeover of the tunnel CNAME of flowday.ziyixi.science; both allowances are cleared again, so the
    # guard now stops any change to the Worker's one Custom Domain.
    - name: Check the hostnames against production
      if: inputs.required == 'true'
      working-directory: .release-source
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CF_GUARD_ALLOW_REMOVE: ''
        CF_GUARD_ALLOW_CONFLICT: ''
      shell: bash -e {0}
      run: node tools/cf-guard/cf-guard.mjs --config flowday/wrangler.toml
    - name: Apply D1 migrations, then deploy the Worker flowday
      if: inputs.required == 'true'
      working-directory: .release-source/flowday/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/flowday-secrets.json"
    # /health (BUILD_SHA) needs an owner login on the host, so production is read through the API with the deploy
    # token (GETs and one D1 read of the migrations table): the Worker serves exactly one version at 100%, that
    # version's BUILD_SHA is this commit, and no D1 migration is pending. wrangler's JSON answers are parsed, never
    # printed (they name the token's account email); only the version id and the results are.
    - name: Check that production runs this commit
      if: inputs.required == 'true'
      working-directory: .release-source/flowday/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" flowday ../wrangler.toml DB
    # Cloudflare Access ("flowday", which covers the host) must answer every unauthenticated request
    # with a 302 to its login page for this host, exactly as the dashboard's probe checks (same script;
    # test_ci_changes.py runs it).
    - name: Check that Access answers unauthenticated requests
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/flowday
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/v1/tasks
    # The PWA files the Worker serves without a JWT (worker/src/assets.ts PWA_PUBLIC_PATHS) reach it anonymously
    # only through the Access app "flowday-bypass" (its destination <host>/pwa/*, as on the container's host until
    # F6): each answers 200 with its own media type, and a file under /pwa/ that is not on the list (the service
    # worker's asset sw.js) gets the Worker's own 401, never a 200. A 302 means the bypass does not cover this
    # host. Only "no connection" and 5xx are retried (10 x 15 s); nothing is followed or printed except the
    # status and the media type.
    - name: Check that only the PWA files bypass Access
      if: inputs.required == 'true'
      env:
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/flowday
      shell: bash -e {0}
      run: |
        host=$PUBLIC_HOST
        test -n "$host"
        for check in \
          '/pwa/manifest.webmanifest 200 application/manifest+json' \
          '/pwa/icon-192x192.png 200 image/png' \
          '/pwa/apple-touch-icon.png 200 image/png' \
          '/pwa/sw 200 application/javascript' \
          '/pwa/sw.js 401 application/json'; do
          read -r path want type <<<"$check"
          for attempt in $(seq 1 10); do
            answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -w '%{http_code} %{content_type}' \
              "https://$host$path" 2>/dev/null) || true
            code=${answer%% *}
            media=${answer#* }
            media=${media%%;*}
            case "$code" in
              ''|000|5??)
                sleep 15
                continue
                ;;
            esac
            if [ "$code" = "$want" ] && [ "$media" = "$type" ]; then
              echo "$path: $code $type from the Worker without an Access login (attempt $attempt)."
              continue 2
            fi
            if [ "$code" = 302 ]; then
              echo "$path: 302 instead of $want: the Access app flowday-bypass does not cover this host's /pwa/*." >&2
            else
              echo "$path was answered with $code ${media:-(no media type)}, not $want $type." >&2
            fi
            exit 1
          done
          echo "$path never reached the Worker (last status ${code:-none})." >&2
          exit 1
        done
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/flowday
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/flowday-secrets.json"
