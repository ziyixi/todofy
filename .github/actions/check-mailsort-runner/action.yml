name: check-mailsort-runner
description: Test the hourly runner and preserve its exact OCI image.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        working-directory: mailsort-runner
        enable-cache: true
    - name: Check locked runner and synthetic machine API
      working-directory: .
      shell: bash -e {0}
      run: |
        npm ci --prefix proto --no-audit --no-fund
        node proto/tools/ensure.mjs
        uv sync --project mailsort-runner --locked
        uv run --project mailsort-runner --locked ruff check mailsort-runner
        uv run --project mailsort-runner --locked ruff format --check mailsort-runner
        uv run --project mailsort-runner --locked pytest mailsort-runner/tests
    - name: Build and verify the image without credentials or network
      working-directory: .
      shell: bash -e {0}
      run: |
        uv run --project mailsort-runner --locked python mailsort-runner/scripts/build.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/mailsort-runner-build"
        docker build --platform linux/amd64 --build-arg BUILD_SHA="$GITHUB_SHA" \
          --build-arg SOURCE_REPOSITORY="https://github.com/$GITHUB_REPOSITORY" \
          --tag "mailsort-runner-ci:$GITHUB_SHA" "$RUNNER_TEMP/mailsort-runner-build"
        tested_image=$(docker image inspect --format '{{.Id}}' "mailsort-runner-ci:$GITHUB_SHA")
        python3 mailsort-runner/scripts/smoke_image.py --image "$tested_image"
        python3 tools/container-release/image.py save --image "$tested_image" --sha "$GITHUB_SHA" --directory "$RUNNER_TEMP/mailsort-runner-image"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mailsort-runner-image-${{ github.sha }}
        path: ${{ runner.temp }}/mailsort-runner-image/
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
