name: setup-bazel
description: Install the repository's fixed Bazel binary for Linux checks and builds.
runs:
  using: composite
  steps:
    - name: Install fixed Bazel
      working-directory: .
      shell: bash -e {0}
      run: |
        set -uo pipefail
        test "$(cat .bazelversion)" = 9.3.1
        mkdir -p "$RUNNER_TEMP/bazel-tools"
        binary="$RUNNER_TEMP/bazel-tools/bazel"
        partial="$binary.partial"
        trap 'rm -f "$partial"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 https://releases.bazel.build/9.3.1/release/bazel-9.3.1-linux-x86_64 -o "$partial"
        printf '7f775b54bbec487efaf0f49ccda1d2ed02cd34f582edfdd6aeeec76e39ef585c  %s\n' "$partial" | sha256sum --check --status
        chmod +x "$partial"
        mv -f "$partial" "$binary"
        printf '%s\n' "$RUNNER_TEMP/bazel-tools" >> "$GITHUB_PATH"
