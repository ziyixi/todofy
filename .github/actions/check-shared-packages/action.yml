name: check-shared-packages
description: "check-shared-packages; called by the repository workflow."
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: '@ziyixi/edge-auth... @ziyixi/planning-ui... @ziyixi/task-dates...'
    - name: Typecheck and test every package
      working-directory: .
      shell: bash -e {0}
      run: |
        found=0
        for manifest in packages/*/package.json; do
          dir=${manifest%/package.json}
          echo "::group::$dir"
          (cd "$dir" && npm run typecheck && npm test)
          echo "::endgroup::"
          found=1
        done
        test "$found" = 1
