name: release-recall
description: "release-recall; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  recall-worker-secrets:
    description: "recall worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: recall
        filters: 'recall-worker... recall-web... recall-extension...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/recall/worker
      env:
        RECALL_WORKER_SECRETS: ${{ inputs.recall-worker-secrets }}
        RECALL_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        RECALL_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/recall-secrets.json"
    # Access ("recall") guards the whole host: a path under /api/machine/v1/ that is none of the three machine
    # routes must get its login page too (the Bypass is exact). The extension is never deployed.
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: recall
        worker: recall
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v1/serviceStatus /settings /api/machine/v1/other
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    # The three machine routes reach the Worker without an Access login, through the Bypass application "recall
    # machine routes" (recall/docs/design.md section 2.1), and the Worker refuses a request without a token itself:
    # 401 UNAUTHORIZED once the owner made the route's token in 设置, 503 NOT_CONFIGURED before, each a
    # google.rpc.Status in JSON. A 302 to the Access login page means the Bypass does not cover that route. Only "no
    # connection" and a 5xx that is not the Worker's own answer are retried (10 x 15 s); nothing is followed, and only
    # the path, the status and the reason are printed.
    - name: Check that only the machine routes bypass Access
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/recall
      shell: bash -e {0}
      run: |
        issuer=$ACCESS_ISSUER
        host=$PUBLIC_HOST
        test -n "$issuer" && test -n "$host"
        body="$RUNNER_TEMP/recall-probe-body"
        for check in 'POST /api/machine/v1/batches' 'GET /api/machine/v1/changes' \
          'GET /api/machine/v1/blobs/2026/10/00000000-0000-4000-8000-000000000000.txt.gz'; do
          read -r method path <<<"$check"
          for attempt in $(seq 1 10); do
            rm -f "$body"
            answer=$(curl -sS -o "$body" --max-time 15 --proto '=https' -X "$method" \
              -w '%{http_code}|%{content_type}|%{redirect_url}' "https://$host$path" 2>/dev/null) || true
            IFS='|' read -r code media location <<<"$answer"
            media=${media%%;*}
            reason=$(grep -oE '"reason": ?"(UNAUTHORIZED|NOT_CONFIGURED)"' "$body" 2>/dev/null | grep -oE '[A-Z_]+' || true)
            if [ "$code" = 302 ] && [[ "$location" == "$issuer/cdn-cgi/access/login/"* ]]; then
              echo "$method $path: Access answered instead of the Worker: the Bypass does not cover this route." >&2
              exit 1
            fi
            if { [ "$code" = 401 ] && [ "$reason" = UNAUTHORIZED ]; } || { [ "$code" = 503 ] && [ "$reason" = NOT_CONFIGURED ]; }; then
              if [ "$media" = application/json ]; then
                echo "$method $path: $code $reason from the Worker without an Access login (attempt $attempt)."
                continue 2
              fi
            fi
            case "$code" in
              ''|000|5??)
                sleep 15
                continue
                ;;
            esac
            echo "$method $path was answered with $code ${media:-(no media type)}, not the Worker's 401 or 503." >&2
            exit 1
          done
          echo "$method $path never reached the Worker (last status ${code:-none})." >&2
          exit 1
        done
        rm -f "$body"
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/recall
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/recall-secrets.json"
