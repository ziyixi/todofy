name: release-newsletter-console
description: "release-newsletter-console; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  dashboard-worker-secrets:
    description: "dashboard worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: newsletter-console
        filters: 'newsletter-console-worker... newsletter-console-web...'
    - name: Read Newsletter's host from the committed config
      if: inputs.required == 'true'
      id: newsletter
      working-directory: .release-source/newsletter-console
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import tomllib
        from urllib.parse import urlsplit
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("newsletter_host=" + urlsplit(variables["NEWSLETTER_ORIGIN"]).hostname)
        PY
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/newsletter-console/worker
      env:
        NEWSLETTER_CONSOLE_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        NEWSLETTER_CONSOLE_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        DASHBOARD_WORKER_SECRETS: ${{ inputs.dashboard-worker-secrets }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/newsletter-console-secrets.json"
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: newsletter-console
        worker: newsletter-console
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v1/overview
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    # The whole console host stays behind Access, and so does Newsletter's read path on the runtime host: one
    # application, whose login page is answered for each host.
    - name: Check that Access answers unauthenticated requests on Newsletter's read path
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        NEWSLETTER_HOST: ${{ steps.newsletter.outputs.newsletter_host }}
      working-directory: .release-source/newsletter-console
      shell: bash -e {0}
      run: |
        PUBLIC_HOST="$NEWSLETTER_HOST" bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" /api/newsletter/v1/overview
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/newsletter-console
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/newsletter-console-secrets.json"
