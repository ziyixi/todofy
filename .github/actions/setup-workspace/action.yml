name: setup-workspace
description: Install selected Node workspaces from the root frozen lockfile.
inputs:
  root:
    description: Repository source directory
    required: true
  filters:
    description: Space-separated pnpm workspace selectors
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ${{ inputs.root }}/package.json
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: ${{ inputs.root }}/package.json
    - name: Locate the pnpm content store
      id: store
      working-directory: ${{ inputs.root }}
      shell: bash -e {0}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.root), format('{0}/package.json', inputs.root)) }}-${{ inputs.filters }}
    - name: Install the locked workspace selection
      env:
        WORKSPACE_FILTERS: ${{ inputs.filters }}
      working-directory: ${{ inputs.root }}
      shell: bash -e {0}
      run: |
        args=(--filter @ziyixi/personal-cloud)
        read -r -a selectors <<< "$WORKSPACE_FILTERS"
        for selector in "${selectors[@]}"; do args+=(--filter "$selector"); done
        pnpm "${args[@]}" install --frozen-lockfile --ignore-scripts
