name: check-personal-mcp
description: "Check the private MCP gate with synthetic events and a real SQLite Durable Object."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          personal-mcp/worker/package-lock.json
          proto/package-lock.json
    - name: Install locked dependencies
      working-directory: personal-mcp/worker
      shell: bash -e {0}
      run: npm ci --no-audit --no-fund
    - name: Check deploy values
      working-directory: personal-mcp
      shell: bash -e {0}
      run: node --test deploy/test/*.test.mjs
    - name: Lint, typecheck and test the Worker
      working-directory: personal-mcp/worker
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run test:runtime
    - name: Dry-run the committed config
      working-directory: personal-mcp/worker
      env:
        PERSONAL_MCP_ACCESS_OWNER: owner@example.com
        PERSONAL_MCP_ACCESS_OWNER_ALIASES: ''
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/personal-mcp-secrets.json"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/personal-mcp-secrets.json" --outdir "$RUNNER_TEMP/personal-mcp-bundle"
    - name: Remove the placeholder secrets file
      if: always()
      working-directory: personal-mcp
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/personal-mcp-secrets.json"
