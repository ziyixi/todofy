name: check-dashboard
description: "check-dashboard; called by the repository workflow."
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: 'home-dashboard-worker... home-dashboard-web...'
    # The config test reads wrangler.toml with the pinned wrangler (worker/node_modules), hence after the workspace install.
    - name: Test the production config and deploy values
      working-directory: dashboard
      shell: bash -e {0}
      run: node --test deploy/test/*.test.mjs
    - name: Lint, typecheck and test the Worker
      working-directory: dashboard/worker
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
    - name: Runtime tests (workerd with the real HomeState, stub Ops apps, fake GraphQL and Access)
      working-directory: dashboard/worker
      shell: bash -e {0}
      run: npm run test:runtime
    # Builds web/dist, which the dry-run below serves as static assets.
    - name: Lint, typecheck, test and build the UI
      working-directory: dashboard/web
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
    # The committed production config (dashboard/wrangler.toml), run exactly as the deploy runs it, with
    # placeholder values for what the deploy adds (deploy/deploy-vars.mjs). No token is needed for --dry-run. The
    # bundle it writes is held to the dashboard's budget and the Workers Free limit (deploy/bundle-size.mjs).
    - name: Dry-run the committed production config
      working-directory: dashboard/worker
      env:
        DASHBOARD_CANARY_ENABLED: 'true'
        DASHBOARD_ACCESS_OWNER: owner@example.com
        DASHBOARD_ACCESS_OWNER_ALIASES: ''
        DASHBOARD_CF_ANALYTICS_TOKEN: placeholder-analytics-token-0000000000
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/home-secrets.json"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/home-secrets.json" --outdir "$RUNNER_TEMP/home-bundle"
        node ../deploy/bundle-size.mjs "$RUNNER_TEMP/home-bundle"
    - name: Remove the placeholder secrets file
      if: always()
      working-directory: dashboard
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/home-secrets.json"
