name: publish-newsletter
description: "publish-newsletter; called by the repository workflow."
inputs:
  artifact-run-id:
    description: "artifact run id"
    required: false
    default: ''
outputs:
  image:
    description: "image"
    value: ${{ steps.publish.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: newsletter-image-${{ github.sha }}
        path: ${{ runner.temp }}/newsletter-image
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact-run-id }}
    - name: Log in for image publication
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: .
      shell: bash -e {0}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Verify and publish the tested image
      id: publish
      working-directory: .
      shell: bash -e {0}
      run: python3 tools/container-release/image.py publish --sha "$GITHUB_SHA" --directory "$RUNNER_TEMP/newsletter-image" --github-output
    - name: Log out
      if: always()
      working-directory: .
      shell: bash -e {0}
      run: docker logout ghcr.io
