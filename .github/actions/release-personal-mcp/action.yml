name: release-personal-mcp
description: "release-personal-mcp; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  personal-mcp-access-owner:
    description: "owner identity"
    required: false
    default: ''
  personal-mcp-access-owner-aliases:
    description: "owner aliases"
    required: false
    default: ''
  personal-mcp-worker-secrets:
    description: "Worker secret map"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      if: inputs.required == 'true' && hashFiles('.release-source/pnpm-lock.yaml') != ''
      uses: ./.github/actions/setup-workspace
      with:
        root: .release-source
        filters: 'personal-mcp-worker...'
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: inputs.required == 'true' && hashFiles('.release-source/pnpm-lock.yaml') == ''
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          .release-source/personal-mcp/worker/package-lock.json
          .release-source/proto/package-lock.json
    # Read public deployment identity from the committed config.
    - name: Read the host and the Access issuer from the committed config
      if: inputs.required == 'true'
      id: config
      working-directory: .release-source/personal-mcp
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("url=https://" + variables["PUBLIC_HOST"])
        print("host=" + variables["PUBLIC_HOST"])
        print("access_issuer=" + variables["ACCESS_ISSUER"])
        EOF
    - name: Install the verified revision
      if: inputs.required == 'true' && hashFiles('.release-source/pnpm-lock.yaml') == ''
      working-directory: .release-source/personal-mcp/worker
      shell: bash -e {0}
      run: npm ci --no-audit --no-fund
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/personal-mcp/worker
      env:
        PERSONAL_MCP_WORKER_SECRETS: ${{ inputs.personal-mcp-worker-secrets }}
        PERSONAL_MCP_ACCESS_OWNER: ${{ inputs.personal-mcp-access-owner }}
        PERSONAL_MCP_ACCESS_OWNER_ALIASES: ${{ inputs.personal-mcp-access-owner-aliases }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/personal-mcp-secrets.json"
    # The wrapper adds BUILD_SHA and refuses a missing or placeholder production Access AUD.
    - name: Validate the bundle before changing production
      if: inputs.required == 'true'
      working-directory: .release-source/personal-mcp/worker
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/personal-mcp-secrets.json" --outdir "$RUNNER_TEMP/personal-mcp-bundle"
    # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
    # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
    # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
    # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
    - name: Check the hostnames against production
      if: inputs.required == 'true'
      working-directory: .release-source
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CF_GUARD_ALLOW_REMOVE: ''
        CF_GUARD_ALLOW_CONFLICT: ''
      shell: bash -e {0}
      run: node tools/cf-guard/cf-guard.mjs --config personal-mcp/wrangler.toml
    - name: Deploy the Worker personal-mcp
      if: inputs.required == 'true'
      working-directory: .release-source/personal-mcp/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/personal-mcp-secrets.json"
    # Nothing anonymous on the host shows BUILD_SHA (all of it is behind Access), so production is read through the
    # API with the deploy token (GETs only): the Worker serves exactly one version at 100% and that version's
    # BUILD_SHA is this commit. wrangler's JSON answers are parsed, never printed (they name the token's account
    # email); only the version id and the result are. (The links app's check without its D1 part.)
    - name: Check that production runs this commit
      if: inputs.required == 'true'
      working-directory: .release-source/personal-mcp/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" personal-mcp ../wrangler.toml
    - name: Check the managed OAuth challenge
      if: inputs.required == 'true'
      working-directory: .release-source/personal-mcp
      env:
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      shell: bash -e {0}
      run: node deploy/check-access.mjs
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/personal-mcp
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/personal-mcp-secrets.json"
