name: check-newsletter
description: "check-newsletter; called by the repository workflow."
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        working-directory: newsletter
        enable-cache: true
    - name: Install deterministic CJK test fonts
      working-directory: newsletter
      shell: bash -e {0}
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
    - name: Check the locked engine
      working-directory: newsletter
      shell: bash -e {0}
      run: |
        make setup
        make check
        make smoke-codex
        make smoke
        make build
        uv run --locked --extra codex python scripts/smoke_wheel.py
