name: build-newsletter
description: Build Newsletter's stamped image, check its source identity and save it; Bazel's container test probes it.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel
    - name: Build the stamped image and save it
      working-directory: .
      shell: bash -e {0}
      run: |
        python3 tools/container-release/build.py --service newsletter --sha "$GITHUB_SHA"
        tested_image=$(docker image inspect --format '{{.Id}}' "newsletter-ci:$GITHUB_SHA")
        python3 tools/container-release/image.py save --image "$tested_image" --sha "$GITHUB_SHA" \
          --directory "$RUNNER_TEMP/newsletter-image"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: newsletter-image-${{ github.sha }}
        path: ${{ runner.temp }}/newsletter-image/
        if-no-files-found: error
        retention-days: 1
        compression-level: 6
