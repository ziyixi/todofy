name: deploy-vps
description: "deploy-vps; called by the repository workflow."
inputs:
  platform-access-client-id:
    description: "platform access client id"
    required: false
    default: ''
  platform-access-client-secret:
    description: "platform access client secret"
    required: false
    default: ''
  platform-deploy-token:
    description: "platform deploy token"
    required: false
    default: ''
  newsletter-image:
    description: "newsletter image"
    required: false
    default: ''
  platform-image:
    description: "platform image"
    required: false
    default: ''
  resume-release:
    description: "resume release"
    required: false
    default: ''
  source-sha:
    description: "source sha"
    required: false
    default: ''
  mailsort-runner-image:
    description: "mailsort runner image"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        working-directory: platform
        enable-cache: true
    - name: Install the locked release client
      working-directory: .
      shell: bash -e {0}
      run: |
        npm ci --prefix proto --no-audit --no-fund
        node proto/tools/ensure.mjs
        uv sync --project platform --locked
    - name: Request deployment and verify the physical running versions
      env:
        PLATFORM_ACCESS_CLIENT_ID: ${{ inputs.platform-access-client-id }}
        PLATFORM_ACCESS_CLIENT_SECRET: ${{ inputs.platform-access-client-secret }}
        PLATFORM_DEPLOY_TOKEN: ${{ inputs.platform-deploy-token }}
        NEWSLETTER_IMAGE: ${{ inputs.newsletter-image }}
        PLATFORM_IMAGE: ${{ inputs.platform-image }}
        MAILSORT_RUNNER_IMAGE: ${{ inputs.mailsort-runner-image }}
        RESUME_RELEASE: ${{ inputs.resume-release }}
        RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
      working-directory: .
      shell: bash -e {0}
      run: |
        args=()
        if [ "$RESUME_RELEASE" = true ]; then
          args+=(--resume)
        else
          args+=(--newsletter-image "$NEWSLETTER_IMAGE" --platform-image "$PLATFORM_IMAGE" --mailsort-runner-image "$MAILSORT_RUNNER_IMAGE")
        fi
        uv run --project platform --locked python tools/vps-release/deploy.py \
          --source-sha "$RELEASE_SOURCE_SHA" --evidence-file "$RUNNER_TEMP/vps-release-evidence.json" "${args[@]}"
    - name: Record the physically verified VPS release
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: .
      shell: bash -e {0}
      run: python3 tools/cloud-release/vps_record.py --evidence-file "$RUNNER_TEMP/vps-release-evidence.json"
