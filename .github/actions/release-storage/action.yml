name: release-storage
description: "Publish the checked Storage Worker and verify its Access boundary."
inputs:
  cf-api-token:
    description: "Cloudflare deployment token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "Shared owner identity"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "Shared owner aliases"
    required: false
    default: ''
  dashboard-worker-secrets:
    description: "Existing Home identity map"
    required: false
    default: ''
  required:
    description: "Whether the checked release is required"
    required: false
    default: ''
outputs:
  url:
    description: "Owner console URL"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: storage
        filters: 'storage-worker...'
    - name: Write the owner identity secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/storage/worker
      env:
        STORAGE_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        STORAGE_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        DASHBOARD_WORKER_SECRETS: ${{ inputs.dashboard-worker-secrets }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/storage-secrets.json"
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: storage
        worker: storage
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'false'
        production: 'true'
        access-paths: / /api/v1/settings /api/dropbox/callback /api/storage/v1/other
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Verify only the three machine routes bypass Access
      if: inputs.required == 'true'
      working-directory: .release-source/storage
      env:
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      shell: bash -e {0}
      run: |
        for path in /api/storage/v1/stat /api/storage/v1/list /api/storage/v1/content; do
          answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' -X POST \
            -w '%{http_code}|%{content_type}|%{redirect_url}' "https://$PUBLIC_HOST$path")
          IFS='|' read -r code media location <<<"$answer"
          media=${media%%;*}
          if [ "$code" != 401 ] || [ "$media" != application/json ] || [ -n "$location" ]; then
            echo "STORAGE_MACHINE_BOUNDARY_FAILED" >&2
            exit 1
          fi
          echo "Storage machine route: 401 without owner login."
        done
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/storage
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/storage-secrets.json"
