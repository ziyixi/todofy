name: release-model-router
description: Publish the checked Model Router with its private console and backward-compatible D1 schema.
inputs:
  cf-api-token:
    description: Cloudflare deployment token
    required: false
    default: ''
  model-router-worker-secrets:
    description: Declared owner identity and CSRF secret map
    required: false
    default: ''
  required:
    description: Release preflight result
    required: false
    default: ''
outputs:
  url:
    description: Private console URL
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: model-router
        filters: 'model-router-worker... model-router-web...'
    - name: Write the declared owner secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/model-router/worker
      env:
        MODEL_ROUTER_WORKER_SECRETS: ${{ inputs.model-router-worker-secrets }}
      shell: bash -e {0}
      run: node ../tools/deploy-vars.mjs secrets "$RUNNER_TEMP/model-router-secrets.json"
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: model-router
        worker: model-router
        worker-directory: worker
        tools-directory: tools
        bundle-size: 'true'
        d1: 'true'
        assets: 'true'
        production: 'true'
        access-paths: / /api/model/v1/requests /api/model/v1/usage
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/model-router
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/model-router-secrets.json"
