name: release-mail-hero
description: "release-mail-hero; called by the repository workflow."
inputs:
  mail-hero-access-owner:
    description: "mail hero access owner"
    required: false
    default: ''
  mail-hero-access-owner-aliases:
    description: "mail hero access owner aliases"
    required: false
    default: ''
  mail-hero-cf-api-token:
    description: "mail hero cf api token"
    required: false
    default: ''
  mail-hero-receive-address:
    description: "mail hero receive address"
    required: false
    default: ''
  mail-hero-worker-secrets:
    description: "mail hero worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: mail-hero
        filters: 'mail-hero-native... mail-hero-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/mail-hero/cloudflare
      env:
        MAIL_HERO_WORKER_SECRETS: ${{ inputs.mail-hero-worker-secrets }}
        MAIL_HERO_RECEIVE_ADDRESS: ${{ inputs.mail-hero-receive-address }}
        MAIL_HERO_ACCESS_OWNER: ${{ inputs.mail-hero-access-owner }}
        MAIL_HERO_ACCESS_OWNER_ALIASES: ${{ inputs.mail-hero-access-owner-aliases }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mail-hero-secrets.json"
    # Mail Hero's own token: this environment also holds Todofy's CF_API_TOKEN.
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: mail-hero
        worker: mail-hero
        worker-directory: cloudflare
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'true'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v2/messages
        cf-api-token: ${{ inputs.mail-hero-cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/mail-hero
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/mail-hero-secrets.json"
