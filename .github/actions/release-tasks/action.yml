name: release-tasks
description: "release-tasks; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  tasks-worker-secrets:
    description: "tasks worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: tasks
        filters: 'tasks-worker... @ziyixi/tasks-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/tasks/worker
      env:
        TASKS_WORKER_SECRETS: ${{ inputs.tasks-worker-secrets }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/tasks-secrets.json"
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: tasks
        worker: tasks
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'true'
        assets: 'true'
        production: 'true'
        access-paths: / /api/tasks/v1/catalog
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/tasks
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/tasks-secrets.json"
