name: release-tasks
description: "release-tasks; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  tasks-worker-secrets:
    description: "tasks worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: inputs.required == 'true'
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          .release-source/tasks/worker/package-lock.json
          .release-source/tasks/web/package-lock.json
          .release-source/proto/package-lock.json
          .release-source/packages/planning-ui/package-lock.json
          .release-source/packages/task-dates/package-lock.json
    - name: Read the host and the Access issuer from the committed config
      if: inputs.required == 'true'
      id: config
      working-directory: .release-source/tasks
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("url=https://" + variables["PUBLIC_HOST"])
        print("host=" + variables["PUBLIC_HOST"])
        print("access_issuer=" + variables["ACCESS_ISSUER"])
        EOF
    - name: Build the verified revision
      if: inputs.required == 'true'
      working-directory: .release-source/tasks
      shell: bash -e {0}
      run: |
        npm ci --prefix ../packages/planning-ui --no-audit --no-fund
        npm ci --prefix ../packages/task-dates --no-audit --no-fund
        npm ci --prefix worker --no-audit --no-fund
        npm ci --prefix web --no-audit --no-fund
        npm run build --prefix web
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/tasks/worker
      env:
        TASKS_WORKER_SECRETS: ${{ inputs.tasks-worker-secrets }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/tasks-secrets.json"
    - name: Validate the bundle before changing D1
      if: inputs.required == 'true'
      working-directory: .release-source/tasks/worker
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/tasks-secrets.json" --outdir "$RUNNER_TEMP/tasks-bundle"
        node ../deploy/bundle-size.mjs "$RUNNER_TEMP/tasks-bundle"
    - name: Check the hostnames against production
      if: inputs.required == 'true'
      working-directory: .release-source
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CF_GUARD_ALLOW_REMOVE: ''
        CF_GUARD_ALLOW_CONFLICT: ''
      shell: bash -e {0}
      run: node tools/cf-guard/cf-guard.mjs --config tasks/wrangler.toml
    - name: Apply D1 migrations, then deploy the Worker tasks
      if: inputs.required == 'true'
      working-directory: .release-source/tasks/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        npx --no-install wrangler d1 migrations apply DB --remote --config ../wrangler.toml
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/tasks-secrets.json"
    - name: Check that production runs this commit
      if: inputs.required == 'true'
      working-directory: .release-source/tasks/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" tasks ../wrangler.toml DB
    - name: Check that Access answers unauthenticated requests
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/tasks
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/tasks/v1/catalog
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/tasks
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/tasks-secrets.json"
