name: check-todoist-plus
description: Preserve shared Plan, Focus and Mail regressions in the retired extension test host.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          todoist-plus/package-lock.json
          proto/package-lock.json
          packages/planning-ui/package-lock.json
    - name: Install dependencies
      working-directory: todoist-plus
      shell: bash -e {0}
      run: |
        npm ci --prefix ../packages/planning-ui --no-audit --no-fund
        npm ci --no-audit --no-fund
    - name: Verify shared planning and build the disposable test host
      working-directory: todoist-plus
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
    - name: Install the isolated browser test runtime
      working-directory: todoist-plus
      shell: bash -e {0}
      run: npx --no-install playwright install --with-deps chromium
    - name: Test the packaged extension in an isolated profile
      working-directory: todoist-plus
      shell: bash -e {0}
      run: npm run test:browser
