name: check-todoist-plus
description: Typecheck, test and build the isolated Todoist browser extension.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          todoist-plus/package-lock.json
          proto/package-lock.json
    - name: Install dependencies
      working-directory: todoist-plus
      shell: bash -e {0}
      run: npm ci --no-audit --no-fund
    - name: Verify and build Todoist Plus
      working-directory: todoist-plus
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
    - name: Install the isolated browser test runtime
      working-directory: todoist-plus
      shell: bash -e {0}
      run: npx --no-install playwright install --with-deps chromium
    - name: Test the packaged extension in an isolated profile
      working-directory: todoist-plus
      shell: bash -e {0}
      run: npm run test:browser
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: todoist-plus-${{ github.sha }}
        path: todoist-plus/.output/chrome-mv3/
        if-no-files-found: error
        retention-days: 30
