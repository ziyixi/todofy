name: check-mail-hero
description: "check-mail-hero; called by the repository workflow."
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: 'mail-hero-native... mail-hero-web...'
    - name: Validate deployment configuration
      working-directory: mail-hero
      shell: bash -e {0}
      run: |
        node --test deploy/test/*.test.mjs
        gpg --version
        python3 -m unittest discover -s deploy/backup -p 'test_*.py'
    # Includes test/contract-fixtures.test.mjs: the golden mail.received.v1 payloads in contracts/.
    - name: Check and test the Worker, including workerd bindings
      working-directory: mail-hero/cloudflare
      shell: bash -e {0}
      run: |
        npm run typecheck
        npm test
    # Alone and serially: the other workerd suites of `npm test` would share the CPU the meter calibrates. The Ops
    # calls, building a mail.received.v1 event (the generated message and the wire codec) and the owner API's
    # heaviest mailhero.ui.v2 requests (the transcoder, and the reads the coordinator answers).
    - name: Hold the Ops entrypoint's, the event builder's and the owner API's CPU to their bounds (workerd)
      working-directory: mail-hero/cloudflare
      shell: bash -e {0}
      run: npm run test:cpu
    - name: Check, test and build the UI
      working-directory: mail-hero/web
      shell: bash -e {0}
      run: |
        npm run typecheck
        npm test
        npm run build
    # The committed production config (mail-hero/wrangler.toml), run exactly as the deploy runs it, with
    # placeholder values for what the deploy adds (deploy/deploy-vars.mjs). No token is needed for --dry-run. The
    # bundle it writes is held to Mail Hero's budget and the Workers Free limit (deploy/bundle-size.mjs).
    - name: Dry-run the committed production config
      working-directory: mail-hero/cloudflare
      env:
        MAIL_HERO_RECEIVE_ADDRESS: inbox@mail-hero.example.com
        MAIL_HERO_ACCESS_OWNER: owner@example.com
        MAIL_HERO_ACCESS_OWNER_ALIASES: ''
        MAIL_HERO_FORCE_SEND_PAUSED: 'true'
        MAIL_HERO_MAINTENANCE_MODE: 'false'
        MAIL_HERO_NATIVE_BACKUP_ENABLED: 'true'
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mail-hero-secrets.json"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/mail-hero-secrets.json" --outdir "$RUNNER_TEMP/mail-hero-bundle"
        node ../deploy/bundle-size.mjs "$RUNNER_TEMP/mail-hero-bundle"
