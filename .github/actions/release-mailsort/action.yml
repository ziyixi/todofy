name: release-mailsort
description: "release-mailsort; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  mailsort-worker-secrets:
    description: "mailsort worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Prepare the release workspace
      id: config
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-prepare
      with:
        app: mailsort
        filters: 'mailsort-worker... mailsort-web...'
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort/worker
      env:
        MAILSORT_WORKER_SECRETS: ${{ inputs.mailsort-worker-secrets }}
        MAILSORT_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        MAILSORT_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mailsort-secrets.json"
    # MODE comes from MAILSORT_MODE in the release job's environment. /health is behind Access too; whether
    # MailsortState's alarm is armed cannot be seen from here: the first owner API call and the dashboard's
    # status() arm it (mailsort/README.md "Deploy", the post-deploy check).
    - name: Deploy and verify the Worker
      if: inputs.required == 'true'
      uses: ./.github/actions/worker-deploy
      with:
        app: mailsort
        worker: mailsort
        worker-directory: worker
        tools-directory: deploy
        bundle-size: 'true'
        d1: 'false'
        assets: 'true'
        production: 'true'
        access-paths: / /api/v1/labels /settings
        cf-api-token: ${{ inputs.cf-api-token }}
        host: ${{ steps.config.outputs.host }}
        access-issuer: ${{ steps.config.outputs.access_issuer }}
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/mailsort
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/mailsort-secrets.json"
