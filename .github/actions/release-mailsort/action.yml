name: release-mailsort
description: "release-mailsort; called by the repository workflow."
inputs:
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  mailsort-csrf-signing-key:
    description: "mailsort csrf signing key"
    required: false
    default: ''
  mailsort-worker-secrets:
    description: "mailsort worker secrets"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: inputs.required == 'true'
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          .release-source/mailsort/worker/package-lock.json
          .release-source/mailsort/web/package-lock.json
          .release-source/proto/package-lock.json
    # Every static production value (account, host, Access) is committed in mailsort/wrangler.toml; the environment URL
    # and the Access probe read it there.
    - name: Read the host and the Access issuer from the committed config
      if: inputs.required == 'true'
      id: config
      working-directory: .release-source/mailsort
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("url=https://" + variables["PUBLIC_HOST"])
        print("host=" + variables["PUBLIC_HOST"])
        print("access_issuer=" + variables["ACCESS_ISSUER"])
        EOF
    # The UI's build (web/dist) is the one that ships; its JavaScript budget is checked by the build.
    - name: Build the verified revision
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort
      shell: bash -e {0}
      run: |
        npm ci --prefix worker --no-audit --no-fund
        npm ci --prefix web --no-audit --no-fund
        npm run build --prefix web
    # The owner's addresses and the CSRF key are environment secrets (masked in this public log) and reach the Worker
    # as secrets through --secrets-file; wrangler prints plain vars. Mailsort's owner is the dashboard's owner (one
    # person, the same Access identities), so the addresses come from the dashboard's secrets; the CSRF key is
    # mailsort's own. The Gmail grant never comes from here. mailsort/README.md "Deploy".
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort/worker
      env:
        MAILSORT_WORKER_SECRETS: ${{ inputs.mailsort-worker-secrets }}
        MAILSORT_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        MAILSORT_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        MAILSORT_CSRF_SIGNING_KEY: ${{ inputs.mailsort-csrf-signing-key }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/mailsort-secrets.json"
    # deploy-vars.mjs adds MODE and BUILD_SHA as --var and refuses a config without the Access AUD; the bundle that
    # ships is held to the app's budget and the Workers Free limit (deploy/bundle-size.mjs). MAILSORT_MODE is inherited
    # from the release workflow's production job environment.
    - name: Validate the bundle before changing production
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort/worker
      env:
        MAILSORT_MODE: ${{ env.MAILSORT_MODE }}
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/mailsort-secrets.json" --outdir "$RUNNER_TEMP/mailsort-bundle"
        node ../deploy/bundle-size.mjs "$RUNNER_TEMP/mailsort-bundle"
    # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
    # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
    # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
    # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
    # sort.ziyixi.science has no DNS record before the first deploy, which attaches the Custom Domain.
    - name: Check the hostnames against production
      if: inputs.required == 'true'
      working-directory: .release-source
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CF_GUARD_ALLOW_REMOVE: ''
        CF_GUARD_ALLOW_CONFLICT: ''
      shell: bash -e {0}
      run: node tools/cf-guard/cf-guard.mjs --config mailsort/wrangler.toml
    - name: Deploy the Worker mailsort
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        MAILSORT_MODE: ${{ env.MAILSORT_MODE }}
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/mailsort-secrets.json"
    # Nothing anonymous on the host shows BUILD_SHA (all of it is behind Access), so production is read through the
    # API with the deploy token (GETs only): the Worker serves exactly one version at 100% and that version's
    # BUILD_SHA is this commit. wrangler's JSON answers are parsed, never printed (they name the token's account
    # email); only the version id and the result are. (FlowDay's and the links app's check without their D1 part.)
    - name: Check that production runs this commit
      if: inputs.required == 'true'
      working-directory: .release-source/mailsort/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" mailsort ../wrangler.toml
    # Cloudflare Access ("mailsort", the whole host) must answer every unauthenticated request with a 302 to its login
    # page for this host: the review queue /, the owner API and the settings page, exactly as the dashboard's probe
    # checks (same script). /health is behind Access too, so no anonymous request reaches the Worker. Whether
    # MailsortState's alarm is armed cannot be seen from here: the first owner API call and the dashboard's status()
    # arm it (mailsort/README.md "Deploy", the post-deploy check).
    - name: Check that Access answers unauthenticated requests
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/mailsort
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/v1/labels /settings
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/mailsort
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/mailsort-secrets.json"
