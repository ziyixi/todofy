name: package-vps
description: "package-vps; called by the repository workflow."
inputs:
  newsletter-image:
    description: "newsletter image"
    required: false
    default: ''
  platform-image:
    description: "platform image"
    required: false
    default: ''
  codex-gateway-image:
    description: "independent codex gateway image"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel
    # The gateway image is empty unless this run built it; the original renderer omits it then.
    - name: Package this commit and its verified image digests
      env:
        NEWSLETTER_IMAGE: ${{ inputs.newsletter-image }}
        PLATFORM_IMAGE: ${{ inputs.platform-image }}
        CODEX_GATEWAY_IMAGE: ${{ inputs.codex-gateway-image }}
      working-directory: .
      shell: bash -e {0}
      run: |
        set -uo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        options=(
          "--embed_label=$GITHUB_SHA"
          "--define=TODOFY_NEWSLETTER_IMAGE=$NEWSLETTER_IMAGE"
          "--define=TODOFY_PLATFORM_IMAGE=$PLATFORM_IMAGE"
          "--define=TODOFY_CODEX_GATEWAY_IMAGE=$CODEX_GATEWAY_IMAGE"
          "--repository_cache=$HOME/.cache/personal-cloud-bazel/repository"
          "--disk_cache=$HOME/.cache/personal-cloud-bazel/actions"
        )
        bazel build //platform:bootstrap_bundle "${options[@]}"
        bundle=$(bazel cquery //platform:bootstrap_bundle "${options[@]}" --output=files)
        test -d "$bundle"
        cp -a "$bundle" "$RUNNER_TEMP/vps-bootstrap-bundle"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vps-bootstrap-${{ github.sha }}
        path: ${{ runner.temp }}/vps-bootstrap-bundle
        if-no-files-found: error
        retention-days: 30
