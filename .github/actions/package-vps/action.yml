name: package-vps
description: "package-vps; called by the repository workflow."
inputs:
  newsletter-image:
    description: "newsletter image"
    required: false
    default: ''
  platform-image:
    description: "platform image"
    required: false
    default: ''
  codex-gateway-image:
    description: "independent codex gateway image"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: ''
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.10'
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          .python-version
          **/pyproject.toml
        cache-suffix: todofy-personal-cloud
        working-directory: .
    - name: Install the locked bundle renderer
      working-directory: .
      shell: bash -e {0}
      run: |
        node proto/tools/ensure.mjs
        uv sync --package todofy-personal-cloud --locked
    - name: Package this commit and three verified image digests
      env:
        NEWSLETTER_IMAGE: ${{ inputs.newsletter-image }}
        PLATFORM_IMAGE: ${{ inputs.platform-image }}
        CODEX_GATEWAY_IMAGE: ${{ inputs.codex-gateway-image }}
      working-directory: .
      shell: bash -e {0}
      run: |
        uv run --package todofy-personal-cloud --locked python tools/vps-bootstrap/prepare.py --sha "$GITHUB_SHA" \
          --newsletter-image "$NEWSLETTER_IMAGE" --platform-image "$PLATFORM_IMAGE" \
          --codex-gateway-image "$CODEX_GATEWAY_IMAGE" \
          --output "$RUNNER_TEMP/vps-bootstrap-bundle"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vps-bootstrap-${{ github.sha }}
        path: ${{ runner.temp }}/vps-bootstrap-bundle
        if-no-files-found: error
        retention-days: 30
