name: check-tasks
description: Verify the native Tasks API, real D1 persistence and desktop UI.
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      uses: ./.github/actions/setup-workspace
      with:
        root: .
        filters: 'tasks-worker... @ziyixi/tasks-web...'
    - name: Verify API and persistence
      working-directory: tasks/worker
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run test:runtime
    - name: Verify desktop UI
      working-directory: tasks/web
      shell: bash -e {0}
      run: |
        npm run lint
        npm run typecheck
        npm test
        npm run build
        npx --no-install playwright install --with-deps chromium
        npm run test:browser
    - name: Verify migration export behavior
      working-directory: .
      shell: bash -e {0}
      run: |
        node --test tasks/tools/test/*.test.mjs
        node --test tasks/deploy/test/*.test.mjs
