name: release-brief
description: "release-brief; called by the repository workflow."
inputs:
  brief-feedback-signing-key:
    description: "brief feedback signing key"
    required: false
    default: ''
  brief-mail-from:
    description: "brief mail from"
    required: false
    default: ''
  brief-mail-to:
    description: "brief mail to"
    required: false
    default: ''
  brief-worker-secrets:
    description: "brief worker secrets"
    required: false
    default: ''
  cf-api-token:
    description: "cf api token"
    required: false
    default: ''
  dashboard-access-owner:
    description: "dashboard access owner"
    required: false
    default: ''
  dashboard-access-owner-aliases:
    description: "dashboard access owner aliases"
    required: false
    default: ''
  required:
    description: "required"
    required: false
    default: ''
outputs:
  url:
    description: "url"
    value: ${{ steps.config.outputs.url }}
runs:
  using: composite
  steps:
    - name: Install the selected Node workspaces
      if: inputs.required == 'true' && hashFiles('.release-source/pnpm-lock.yaml') != ''
      uses: ./.github/actions/setup-workspace
      with:
        root: .release-source
        filters: 'brief-worker... brief-web...'
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: inputs.required == 'true' && hashFiles('.release-source/pnpm-lock.yaml') == ''
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          .release-source/brief/worker/package-lock.json
          .release-source/brief/web/package-lock.json
          .release-source/proto/package-lock.json
    # Every static production value (account, host, Access) is committed in brief/wrangler.toml; the environment URL
    # and the probes read it there.
    - name: Read the host and the Access issuer from the committed config
      if: inputs.required == 'true'
      id: config
      working-directory: .release-source/brief
      shell: bash -e {0}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        with open("wrangler.toml", "rb") as file:
            variables = tomllib.load(file)["vars"]
        print("url=https://" + variables["PUBLIC_HOST"])
        print("host=" + variables["PUBLIC_HOST"])
        print("access_issuer=" + variables["ACCESS_ISSUER"])
        EOF
    # The UI's build (web/dist) is the one that ships; its JavaScript budget is checked by the build.
    - name: Build the verified revision
      if: inputs.required == 'true'
      working-directory: .release-source/brief
      shell: bash -e {0}
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/.release-source/pnpm-lock.yaml" ]; then
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
        fi
        npm run build --prefix web
    # The owner's addresses, the two signing keys and the mail addresses are environment secrets (masked in this
    # public log) and reach the Worker as secrets through --secrets-file; wrangler prints plain vars. The brief's
    # owner is the dashboard's owner (one person, the same Access identities), so the addresses come from the
    # dashboard's secrets; the rest are the brief's own. The Claude and Resend keys never come from here.
    # brief/README.md "Deploy".
    - name: Write the Worker secrets file
      if: inputs.required == 'true'
      working-directory: .release-source/brief/worker
      env:
        BRIEF_WORKER_SECRETS: ${{ inputs.brief-worker-secrets }}
        BRIEF_ACCESS_OWNER: ${{ inputs.dashboard-access-owner }}
        BRIEF_ACCESS_OWNER_ALIASES: ${{ inputs.dashboard-access-owner-aliases }}
        BRIEF_FEEDBACK_SIGNING_KEY: ${{ inputs.brief-feedback-signing-key }}
        BRIEF_MAIL_FROM: ${{ inputs.brief-mail-from }}
        BRIEF_MAIL_TO: ${{ inputs.brief-mail-to }}
      shell: bash -e {0}
      run: node ../deploy/deploy-vars.mjs secrets "$RUNNER_TEMP/brief-secrets.json"
    # deploy-vars.mjs adds MODE and BUILD_SHA as --var and refuses a config without the Access AUD; the bundle that
    # ships is held to the app's budget and the Workers Free limit (deploy/bundle-size.mjs).
    - name: Validate the bundle before changing production
      if: inputs.required == 'true'
      working-directory: .release-source/brief/worker
      shell: bash -e {0}
      run: |
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --dry-run --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/brief-secrets.json" --outdir "$RUNNER_TEMP/brief-bundle"
        node ../deploy/bundle-size.mjs "$RUNNER_TEMP/brief-bundle"
    # tools/cf-guard (read-only GETs; prints listed hostnames, counts, PASS/FAIL): wrangler applies a config's Custom
    # Domains (or zone routes) as the Worker's complete set, so stop before any production change when a live
    # hostname would be detached or another Worker's hostname or DNS record taken over. For an intentional
    # change, set the exact hostnames here (space-separated) in the same commit that changes wrangler.toml.
    # brief.ziyixi.science has no DNS record before the first deploy, which attaches the Custom Domain.
    - name: Check the hostnames against production
      if: inputs.required == 'true'
      working-directory: .release-source
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CF_GUARD_ALLOW_REMOVE: ''
        CF_GUARD_ALLOW_CONFLICT: ''
      shell: bash -e {0}
      run: node tools/cf-guard/cf-guard.mjs --config brief/wrangler.toml
    # The first deploy creates BriefState's namespace (migration v1); its id is committed afterwards
    # (brief/docs/design.md section 18).
    - name: Deploy the Worker brief
      if: inputs.required == 'true'
      working-directory: .release-source/brief/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        node ../deploy/deploy-vars.mjs exec -- npx --no-install wrangler deploy --config ../wrangler.toml \
          --secrets-file "$RUNNER_TEMP/brief-secrets.json"
    # Nothing anonymous on the host shows BUILD_SHA (the archive and /health are behind Access, /feedback needs a
    # signed token), so production is read through the API with the deploy token (GETs only), as mailsort's is.
    - name: Check that production runs this commit
      if: inputs.required == 'true'
      working-directory: .release-source/brief/worker
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/production.sh" brief ../wrangler.toml
    # Cloudflare Access ("brief", the whole host) must answer every unauthenticated request with a 302 to its login
    # page for this host: the archive /, the owner API (a read and the CSRF route) and the settings page, as the
    # dashboard's probe checks (same script).
    - name: Check that Access answers unauthenticated requests
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/brief
      shell: bash -e {0}
      run: |
        bash "$GITHUB_WORKSPACE/.release-source/tools/deploy-probes/access.sh" / /api/v1/serviceStatus /api/csrf /settings
    # Exactly /feedback reaches the Worker without an Access login, through the Bypass application "brief-feedback"
    # (brief/docs/design.md section 10), and the Worker answers a link without a valid token itself with a 404 (no
    # object call). A 302 to the Access login page means the Bypass does not cover the path. Only "no connection" and
    # a 5xx are retried (10 x 15 s); nothing is followed, and only the status is printed.
    - name: Check that only the feedback path bypasses Access
      if: inputs.required == 'true'
      env:
        ACCESS_ISSUER: ${{ steps.config.outputs.access_issuer }}
        PUBLIC_HOST: ${{ steps.config.outputs.host }}
      working-directory: .release-source/brief
      shell: bash -e {0}
      run: |
        issuer=$ACCESS_ISSUER
        host=$PUBLIC_HOST
        test -n "$issuer" && test -n "$host"
        for attempt in $(seq 1 10); do
          answer=$(curl -sS -o /dev/null --max-time 15 --proto '=https' \
            -w '%{http_code}|%{redirect_url}' "https://$host/feedback?t=probe" 2>/dev/null) || true
          IFS='|' read -r code location <<<"$answer"
          if [ "$code" = 302 ] && [[ "$location" == "$issuer/cdn-cgi/access/login/"* ]]; then
            echo "/feedback: Access answered instead of the Worker: the Bypass does not cover it." >&2
            exit 1
          fi
          if [ "$code" = 404 ]; then
            echo "/feedback: 404 from the Worker for an invalid token, without an Access login (attempt $attempt)."
            exit 0
          fi
          case "$code" in
            ''|000|5??)
              sleep 15
              continue
              ;;
          esac
          echo "/feedback was answered with $code, not the Worker's 404." >&2
          exit 1
        done
        echo "/feedback never reached the Worker (last status ${code:-none})." >&2
        exit 1
    - name: Remove the secrets file
      if: always() && inputs.required == 'true'
      working-directory: .release-source/brief
      shell: bash -e {0}
      run: rm -f "$RUNNER_TEMP/brief-secrets.json"
