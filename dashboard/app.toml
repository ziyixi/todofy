# Public metadata and relative host labels. Generated Wrangler configs own production bindings.
version = 1
id = "dashboard"
target = "cloudflare"

[[workers]]
config = "dashboard/wrangler.toml"
personal_secrets = ["ACCESS_OWNER", "ACCESS_OWNER_ALIASES", "CSRF_SIGNING_KEY", "CF_ANALYTICS_TOKEN"]
manual_secrets = []
optional_secrets = ["ACCESS_OWNER_ALIASES"]
hosts = ["home"]
entry = "home"
role = "本面板"
position = 4

[[entries]]
# No Home tile for Home itself; its Cloudflare row and tick_stale signal remain visible.
id = "home"
name = "个人控制台"
description = "本页面：巡检、用量、金丝雀与摘要"
group = "hidden"
icon = "gauge"
accent = "slate"
access = true
app_only_signals = []
order = 1
worker = "home"
position = 10
[entries.status]
type = "self"

[[access]]
key = "home"
kind = "owner"
worker = "home"
name = "Home"
paths = [""]
session = "24h"
